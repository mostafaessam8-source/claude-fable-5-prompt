name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The LibreOffice cross-checks skip themselves when `soffice` is absent; everything else runs.
      - run: npm test
      - run: npm run build
        env:
          # Repository variable (Settings > Secrets and variables > Actions > Variables).
          VITE_CLAUDE_PROXY_URL: ${{ vars.CLAUDE_PROXY_URL }}
      # The NSR cost dashboard lives on its own branch and is published next to this app at /sar-cost-dashboard/
      # (one GitHub Pages site per repository). That branch re-runs this workflow when the dashboard changes.
      - name: Add the NSR cost dashboard
        run: |
          git fetch --depth=1 origin claude/cost-control-data-site-64obxe
          git archive FETCH_HEAD sar-cost-dashboard | tar -x -C dist
          test -f dist/sar-cost-dashboard/index.html
      # PTE-79 Express: the personal PTE Academic study site (static, no build) is published at /pte-academy/
      - name: Add the PTE Academy site
        run: cp -r pte-academy dist/pte-academy
      # Zulfi Railway Station: interactive management presentation (static, no build) is published at /zulfi-presentation/
      - name: Add the Zulfi presentation
        run: cp -r zulfi-presentation dist/zulfi-presentation
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
