name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The LibreOffice cross-checks skip themselves when `soffice` is absent; everything else runs.
      - run: npm test
      - run: npm run build
        env:
          # Repository variable (Settings > Secrets and variables > Actions > Variables).
          VITE_CLAUDE_PROXY_URL: ${{ vars.CLAUDE_PROXY_URL }}
      # The NSR cost dashboard lives on its own branch and is published next to this app at /sar-cost-dashboard/
      # (one GitHub Pages site per repository). That branch re-runs this workflow when the dashboard changes.
      - name: Add the NSR cost dashboard
        run: |
          git fetch --depth=1 origin claude/cost-control-data-site-64obxe
          git archive FETCH_HEAD sar-cost-dashboard | tar -x -C dist
          test -f dist/sar-cost-dashboard/index.html
      # PTE-79 Express: the personal PTE Academic study site (static, no build) is published at /pte-academy/
      - name: Add the PTE Academy site
        run: cp -r pte-academy dist/pte-academy
      # Zulfi Railway Station: interactive management presentation (static, no build) is published at /zulfi-presentation/
      - name: Add the Zulfi presentation
        run: |
          python3 zulfi-presentation/build_offline.py
          cp -r zulfi-presentation dist/zulfi-presentation
          # cache-busting: every script/stylesheet URL carries the commit, and the page shows the build stamp
          V="${GITHUB_SHA::7}"; T="$(date -u +'%Y-%m-%d %H:%M UTC')"
          for f in dist/zulfi-presentation/management.html dist/zulfi-presentation/presentation.html dist/zulfi-presentation/director.html dist/zulfi-presentation/finance.html; do
            sed -i -E "s#(src|href)=\"((js|css)/[^\"?]+|data\.js)\"#\1=\"\2?v=$V\"#g; s#__BUILD__#$V · $T#" "$f"
          done
      # P6 Web: Primavera P6 schedule viewer / editor (static, no build) is published at /p6-web/
      - name: Add the P6 Web app
        run: |
          node p6-web/tests/engine.test.js
          cp -r p6-web dist/p6-web
          rm -rf dist/p6-web/tests dist/p6-web/package.json
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(src|href)=\"((js|css)/[^\"?]+)\"#\1=\"\2?v=$V\"#g" dist/p6-web/index.html
      # Design Gantt: upload the Design Submission Tracker .xlsx, get it back with a live Gantt chart sheet (static, no build) at /design-gantt/
      - name: Add the Design Gantt site
        run: |
          node design-gantt/tests/gantt.test.js
          cp -r design-gantt dist/design-gantt
          rm -rf dist/design-gantt/tests dist/design-gantt/package.json dist/design-gantt/README.md
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(src|href)=\"((js|css)/[^\"?]+)\"#\1=\"\2?v=$V\"#g" dist/design-gantt/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
