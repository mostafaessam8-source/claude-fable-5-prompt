<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UFWL Project – Site Suspension Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#00778B; --dark:#3D3935; --ink:#2b2f33; --muted:#5d6670; --line:#dde4e8; --bg:#eef2f4;
  --ok:#2E9E6B; --warn:#C8503F;
  --ff-en:'Inter','Segoe UI',Calibri,Arial,sans-serif;
  --ff-ar:'Tajawal','Cairo','Segoe UI',Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1d2024;font-family:'Inter','Segoe UI',Arial,sans-serif;color:var(--ink)}
button,select,input{font:inherit}

/* ============ APP SHELL ============ */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#top{background:var(--dark);color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;box-shadow:0 2px 8px #0005;z-index:5}
.grp{display:flex;align-items:center;gap:4px;padding-inline-end:12px;border-inline-end:1px solid #ffffff2a}
.grp:last-child{border:0}
.grp label.t{font-size:11px;opacity:.7;margin-inline-end:2px;text-transform:uppercase;letter-spacing:.04em}
.tb{background:#ffffff14;color:#fff;border:1px solid #ffffff22;border-radius:6px;min-width:32px;height:32px;padding:0 9px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.tb:hover{background:#ffffff2e}.tb:active{background:#ffffff40}
.tb.pri{background:var(--accent);border-color:var(--accent);font-weight:600}
.tb.on{background:#fff;color:var(--dark)}
#top select,#top input[type=number]{height:32px;border-radius:6px;border:1px solid #ffffff33;background:#2a2724;color:#fff;padding:0 6px}
#top input[type=number]{width:58px}
#top input[type=color]{width:34px;height:32px;padding:2px;border:1px solid #ffffff33;border-radius:6px;background:#2a2724;cursor:pointer}
.sw{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;font-weight:600}
.sw input{display:none}
.sw i{width:38px;height:20px;border-radius:20px;background:#6b6661;position:relative;transition:.2s}
.sw i:after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i:after{inset-inline-start:20px}
body:not(.edit) .fmt{opacity:.35;pointer-events:none}

#viewport{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2a2f35,#14171a)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;box-shadow:0 10px 50px #000a;background:#fff}

#bottom{background:var(--dark);color:#fff;padding:7px 12px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;position:relative;z-index:5}
#bottom .pg{display:flex;align-items:center;gap:6px;font-size:14px;min-width:96px;justify-content:center}
#bottom .pg input{width:50px;text-align:center;height:30px;border-radius:6px;border:1px solid #ffffff33;background:#2a2724;color:#fff}
#prog{position:absolute;top:0;left:0;height:3px;background:var(--accent);width:0;transition:width .3s}
.sep{width:1px;height:22px;background:#ffffff33;margin:0 4px}

/* fullscreen */
body.fs #top{display:none}
body.fs #bottom{position:fixed;bottom:0;left:0;right:0;opacity:0;transition:.3s;background:#000b}
body.fs.showbar #bottom{opacity:1}
body.fs.hidecursor #viewport{cursor:none}

/* grid overview */
#grid{position:fixed;inset:0;background:#101316f2;z-index:50;display:none;overflow:auto;padding:30px}
#grid.open{display:block}
#grid .gh{color:#fff;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
#grid .gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:22px}
.th{cursor:pointer;border-radius:8px;overflow:hidden;position:relative;border:3px solid transparent;background:#fff;height:calc(var(--w)*.5625)}
.th:hover,.th.cur{border-color:var(--accent)}
.th .in{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;pointer-events:none}
.th .n{position:absolute;left:6px;bottom:6px;background:#000a;color:#fff;font-size:12px;padding:2px 7px;border-radius:10px;z-index:2}

/* ============ SLIDES ============ */
#deck{position:absolute;inset:0;font-family:var(--ff-user,var(--ff-en));--accent2:color-mix(in srgb,var(--accent) 12%,#fff)}
#deck[dir=rtl]{font-family:var(--ff-user,var(--ff-ar))}
.slide{position:absolute;inset:0;width:1920px;height:1080px;background:#f6f9fa;display:none;overflow:hidden;font-size:24px}
.slide.active{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.slide [data-b]{outline:none;min-width:12px}
body.edit [data-b]{cursor:text;border-radius:6px}
body.edit [data-b]:hover{box-shadow:0 0 0 2px #00778b66}
body.edit [data-b]:focus{box-shadow:0 0 0 3px var(--accent);background:#ffffff40}
.slide ul{margin:0;padding-inline-start:1.1em}.slide li{margin:.35em 0}

.hd{position:absolute;top:0;inset-inline:0;height:150px;padding:0 90px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:6px solid var(--accent)}
.hd:after{content:"";position:absolute;bottom:-6px;inset-inline-start:0;width:360px;height:6px;background:var(--dark)}
.hd .hl{display:flex;flex-direction:column;gap:6px;min-width:0}
.hd .tag{display:inline-block;align-self:flex-start;color:#fff;background:var(--c,var(--accent));font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 16px;border-radius:30px}
#deck[dir=rtl] .hd .tag{letter-spacing:0}
.hd h1{margin:0;font-size:52px;line-height:1.1;font-weight:800;color:var(--dark)}
.hd .logo,.logo{height:84px;width:auto}
.ft{position:absolute;bottom:0;inset-inline:0;height:56px;padding:0 90px;display:flex;align-items:center;justify-content:space-between;font-size:18px;color:var(--muted);background:#fff;border-top:1px solid var(--line)}
.ft .pn{direction:ltr;unicode-bidi:isolate;background:var(--accent);color:#fff;font-weight:700;border-radius:20px;padding:2px 16px;font-size:18px}
.bd{position:absolute;top:150px;bottom:56px;inset-inline:0;padding:34px 90px 30px;display:flex;flex-direction:column}

/* title slide */
.s-title{background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 55%,#06242b) 100%);color:#fff}
.s-title .stripes{position:absolute;top:0;bottom:0;inset-inline-end:0;width:820px}
#deck[dir=rtl] .stripes{transform:scaleX(-1)}
.s-title .tlogo{position:absolute;top:70px;inset-inline-start:100px;background:#fff;padding:18px 28px;border-radius:14px;box-shadow:0 8px 30px #0003}
.s-title .tlogo img{height:110px;display:block}
.s-title .tx{position:absolute;inset-inline-start:100px;top:330px;width:1150px}
.s-title .kick{font-size:34px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;opacity:.85;margin-bottom:18px}
#deck[dir=rtl] .kick{letter-spacing:0}
.s-title h1{margin:0;font-size:150px;line-height:1;font-weight:800}
.s-title h2{margin:26px 0 0;font-size:56px;font-weight:500;line-height:1.25}
.s-title .rule{width:200px;height:8px;background:#fff;border-radius:4px;margin:44px 0 36px}
.asof{display:flex;align-items:center;gap:18px;font-size:32px}
.dpill{position:relative;display:inline-flex;background:#ffffff26;border:2px solid #ffffff66;padding:6px 26px;border-radius:40px;font-weight:700}
.dinp{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;pointer-events:none}
body.edit .dinp{pointer-events:auto}
body.edit .dpill:hover,body.edit .dbadge:hover{outline:3px dashed #fff9;outline-offset:3px}

/* info slide */
.cards{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:30px}
.card{background:#fff;border-radius:18px;box-shadow:0 6px 22px #1b2a3314;padding:26px 36px 20px;border-top:8px solid var(--c);display:flex;flex-direction:column;gap:10px;overflow:hidden}
.card .ch{display:flex;align-items:center;gap:18px}
.card .ic{width:62px;height:62px;border-radius:16px;background:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.card .ic svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0;font-size:38px;font-weight:800;color:var(--dark)}
.card .cb{font-size:31px;line-height:1.45;color:#3b4148}

/* summary */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.kpi{background:#fff;border-radius:18px;padding:26px 28px;box-shadow:0 6px 22px #1b2a3314;border-bottom:8px solid var(--c)}
.kpi .v{font-size:110px;font-weight:800;line-height:1;color:var(--c);display:flex;align-items:baseline;gap:10px}
.kpi .v small{font-size:30px;font-weight:600;color:var(--muted)}
.kpi .l{font-size:25px;color:var(--muted);margin-top:12px;line-height:1.3;font-weight:500}
.sec{font-size:32px;font-weight:800;color:var(--dark);margin:34px 0 14px;display:flex;align-items:center;gap:14px}
.sec:before{content:"";width:8px;height:34px;background:var(--accent);border-radius:4px}
.pbar{display:flex;height:120px;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px #0002}
.pbar div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:34px;min-width:90px}
.plab{display:flex;margin-top:12px}
.plab div{font-size:22px;font-weight:600;color:var(--dark);padding-inline-end:12px;line-height:1.25}
.plab div small{display:block;font-weight:500;color:var(--muted);font-size:19px}
.status{margin-top:auto;display:flex;align-items:center;gap:26px;background:var(--dark);color:#fff;border-radius:18px;padding:22px 34px}
.status .dot{width:30px;height:30px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 10px #2e9e6b44;flex:none}
.status .sh{font-size:20px;opacity:.7;text-transform:uppercase;letter-spacing:.1em}
#deck[dir=rtl] .sh{letter-spacing:0}
.status .sb{font-size:34px;font-weight:700}

/* overview */
.chart{display:flex;margin-top:4px}
.lcol{width:300px;flex:none}
.lcol .ll{height:108px;display:flex;flex-direction:column;justify-content:center;padding-inline-end:20px;border-inline-start:8px solid var(--c);padding-inline-start:16px}
.lcol .ll b{font-size:23px;line-height:1.2;color:var(--dark)}
.lcol .ll span{font-size:17px;color:var(--c);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.plot{position:relative;width:1500px;flex:none}
.lane{height:108px;position:relative;border-bottom:1px solid var(--line)}
.lane:nth-child(odd){background:#ffffff}.lane:nth-child(even){background:#f0f5f6}
.lane .bar{position:absolute;top:48px;height:12px;border-radius:6px;background:var(--c);opacity:.28}
.mk{z-index:2;position:absolute;width:38px;height:38px;margin-inline-start:-19px;border-radius:50%;background:var(--c);color:#fff;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 8px #0004}
.gl2{position:absolute;top:0;bottom:50px;width:1px;background:#c6d1d6;inset-inline-start:var(--x)}
.axis{height:50px;position:relative}
.axis span{position:absolute;inset-inline-start:var(--x);margin-inline-start:-60px;width:120px;text-align:center;top:8px;font-size:17px;color:var(--muted);font-weight:600}
.vline{position:absolute;top:-6px;bottom:50px;width:0;border-inline-start:3px dashed var(--c);inset-inline-start:var(--x);z-index:1}
.vline.r b{inset-inline-start:auto;inset-inline-end:6px}
.vline b{position:absolute;top:-24px;inset-inline-start:6px;background:var(--c);color:#fff;font-size:15px;font-weight:700;padding:1px 9px;border-radius:12px;white-space:nowrap}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:22px}
.legend .lg h4{margin:0 0 6px;font-size:21px;color:var(--c);font-weight:800;border-bottom:3px solid var(--c);padding-bottom:4px}
.legend .lg p{margin:4px 0;font-size:20px;line-height:1.25;display:flex;gap:8px;color:#333}
.legend .lg p i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.legend .lg p em{font-style:normal;color:var(--muted);white-space:nowrap}

/* milestone slides */
.sub{font-size:27px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}
.sub .dl{font-weight:700;color:var(--c);white-space:nowrap}
.list{flex:1;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);grid-auto-flow:column;gap:26px 64px;min-height:0}
.ms{position:relative;display:flex;gap:24px;min-height:0}
.ms:not(.lc):after{content:"";position:absolute;inset-inline-start:59px;top:124px;bottom:-26px;width:5px;background:var(--c);opacity:.3;border-radius:3px}
.mcol{flex:none;width:124px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1}
.mcol .chip{background:#fff;border:2px solid var(--accent2);text-align:center;padding:1px 10px;font-size:17px}
.mcol .chip.fin{border-color:var(--ok)}
.dbadge{position:relative;flex:none;width:124px;height:124px;border-radius:20px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 16px #0003;line-height:1}
.dbadge .dd{font-size:58px;font-weight:800}
.dbadge .dm{font-size:23px;font-weight:700;text-transform:uppercase;margin-top:4px}
.dbadge .dy{font-size:17px;opacity:.8;margin-top:4px}
.mb{flex:1;background:#fff;border-radius:18px;box-shadow:0 5px 18px #1b2a3314;padding:14px 26px 12px;border-inline-start:8px solid var(--c);display:flex;flex-direction:column;min-width:0;position:relative;overflow:hidden}
.mb .no{position:absolute;top:12px;inset-inline-end:16px;font-size:18px;font-weight:800;color:var(--c);opacity:.55}
.mb .mt{font-size:30px;font-weight:800;color:var(--dark);line-height:1.2;padding-inline-end:46px}
.mb .md{font-size:23px;line-height:1.38;color:#454c54;margin-top:6px;flex:1}
.chips{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:18px;font-weight:700;background:var(--accent2);color:var(--dark);border-radius:20px;padding:2px 14px}
.chip.g{background:#eceff1;color:var(--muted)}
.chip.fin{background:var(--ok);color:#fff}
.list.one{grid-template-rows:repeat(var(--rows),minmax(0,250px));align-content:start}.list.one .mt{font-size:34px}.list.one .md{font-size:27px;line-height:1.4}
.mb .ctl{position:absolute;top:6px;inset-inline-end:44px;display:none;gap:5px;z-index:3;background:#fffffff0;padding:3px;border-radius:8px;box-shadow:0 2px 8px #0003;opacity:0;transition:.15s}
body.edit .mb .ctl{display:flex}
body.edit .ms:hover .ctl{opacity:1}
.ctl button,.ctl select{border:1px solid #ccd;background:#fff;border-radius:6px;font-size:14px;height:26px;cursor:pointer;padding:0 6px}
.ctl button:hover{background:#ffe3e0;border-color:var(--warn)}
.addbtn{display:none;margin-inline-start:14px;background:var(--accent);color:#fff;border:0;border-radius:30px;font-size:19px;padding:3px 18px;cursor:pointer;font-weight:700;vertical-align:middle}
body.edit .addbtn{display:inline-block}
.pcol{display:none;margin-inline-start:14px;width:34px;height:34px;border:2px solid #ccd;border-radius:8px;padding:0;background:none;cursor:pointer;vertical-align:middle}
body.edit .pcol{display:inline-block}
.empty{margin:auto;font-size:34px;color:var(--muted)}

/* next / end */
.cols3{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.end{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#06242b));color:#fff;display:none}
.end.active{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:30px}
.end h1{font-size:170px;margin:0;font-weight:800}
.end p{font-size:44px;margin:0;opacity:.9}
.end .tlogo{background:#fff;padding:18px 30px;border-radius:14px;margin-top:40px}
.end .tlogo img{height:100px;display:block}

/* ============ PRINT ============ */
@page{size:1920px 1080px;margin:0}
@media print{
  html,body{background:#fff!important;height:auto!important;overflow:visible!important}
  #top,#bottom,#grid{display:none!important}
  #app,#viewport{display:block!important;height:auto!important;overflow:visible!important;background:none!important}
  #stage{position:static!important;transform:none!important;box-shadow:none!important;width:1920px!important;height:auto!important}
  #deck{position:static!important}
  .slide{display:block!important;position:relative!important;animation:none!important;break-after:page;page-break-after:always;break-inside:avoid}
  .slide.end{display:flex!important;align-items:center;justify-content:center;flex-direction:column;gap:30px}
  .slide:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ctl,.addbtn,.pcol,.dinp{display:none!important}
  [data-b]{box-shadow:none!important}
}
.th .slide{display:block!important;position:absolute!important;animation:none!important}
.th .slide.end{display:flex!important;align-items:center;justify-content:center;flex-direction:column;gap:30px}
.th .ctl,.th .addbtn,.th .pcol{display:none!important}
.thumbhost{position:absolute;left:-99999px;top:0}
@media(max-width:700px){#top{gap:6px}.grp{padding-inline-end:6px}}
</style>
</head>
<body class="edit">
<div id="app">
  <div id="top">
    <div class="grp">
      <label class="sw" title="Edit mode / وضع التعديل"><input type="checkbox" id="editSw" checked><i></i><span>Edit</span></label>
    </div>
    <div class="grp fmt" id="fmt">
      <label class="t">Font</label>
      <select id="fFont" title="Font / نوع الخط">
        <option value="Inter">Inter</option><option value="Tajawal">Tajawal</option><option value="Cairo">Cairo</option>
        <option value="Poppins">Poppins</option><option value="Segoe UI">Segoe UI</option><option value="Calibri">Calibri</option>
        <option value="Arial">Arial</option><option value="Tahoma">Tahoma</option><option value="Georgia">Georgia</option>
        <option value="Times New Roman">Times New Roman</option><option value="Courier New">Courier New</option>
      </select>
      <button class="tb" data-act="sz-" title="Smaller / تصغير">A−</button>
      <input type="number" id="fSize" min="8" max="400" value="24" title="Size px / حجم الخط">
      <button class="tb" data-act="sz+" title="Larger / تكبير">A+</button>
      <button class="tb" data-cmd="bold" title="Bold / عريض"><b>B</b></button>
      <button class="tb" data-cmd="italic" title="Italic / مائل"><i>I</i></button>
      <button class="tb" data-cmd="underline" title="Underline / تسطير"><u>U</u></button>
      <label class="t">Color</label><input type="color" id="fColor" value="#2b2f33" title="Text color / لون الخط">
      <label class="t">Mark</label><input type="color" id="fHi" value="#ffe066" title="Highlight / تمييز">
      <button class="tb" data-cmd="justifyLeft" title="Left">⯇</button>
      <button class="tb" data-cmd="justifyCenter" title="Center">≡</button>
      <button class="tb" data-cmd="justifyRight" title="Right">⯈</button>
      <button class="tb" data-cmd="insertUnorderedList" title="Bullets / نقاط">•≡</button>
      <button class="tb" data-cmd="removeFormat" title="Clear format / مسح التنسيق">Tx</button>
      <button class="tb" data-cmd="undo" title="Undo / تراجع">↶</button>
      <button class="tb" data-cmd="redo" title="Redo / إعادة">↷</button>
    </div>
    <div class="grp">
      <label class="t">Theme</label><input type="color" id="accent" value="#00778B" title="Theme color / لون القالب">
      <label class="t">Deck font</label>
      <select id="deckFont" title="Deck font / خط العرض كله"><option value="">Default</option>
        <option>Inter</option><option>Tajawal</option><option>Cairo</option><option>Poppins</option><option>Segoe UI</option><option>Calibri</option><option>Arial</option><option>Tahoma</option><option>Georgia</option>
      </select>
    </div>
    <div class="grp">
      <button class="tb" id="addMs" title="Add milestone to the current phase / إضافة ميل ستون">＋ Milestone</button>
      <button class="tb pri" id="lang" title="Language / اللغة">عربي</button>
      <button class="tb" id="save" title="Save as HTML file / حفظ نسخة HTML">⭳ Save HTML</button>
      <button class="tb" id="reset" title="Reset to original / استرجاع الأصل">Reset</button>
    </div>
  </div>

  <div id="viewport"><div id="stage"><div id="deck"></div></div></div>

  <div id="bottom">

/* ---------------- STATE ---------------- */
const KEY="ufwl-timeline-v1";
let S=defaults(), cur=0, editMode=true, L="en";
function loadState(){
  let cands=[];
  try{const e=document.getElementById("saved-state").textContent.trim(); if(e) cands.push(JSON.parse(e));}catch(_){}
  try{const l=localStorage.getItem(KEY); if(l) cands.push(JSON.parse(l));}catch(_){}
  cands=cands.filter(c=>c&&c.v===1).sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(cands[0]){const c=cands[0],d=defaults();
    S=Object.assign(d,c); S.t=Object.assign(d.t,c.t||{});}
  L=S.lang||"en";
}
let saveTimer;
function save(){S.ts=Date.now();clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}} ,250);}

/* ---------------- HELPERS ---------------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const dn=s=>{const[y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)/864e5};
const parts=s=>s.split("-").map(Number);
const fmt=s=>{const[y,m,d]=parts(s);return `${d} ${MON[L][m-1]} ${y}`};
const fmtS=s=>{const[,m,d]=parts(s);return `${d} ${SHORT[L][m-1]}`};
const iso=n=>new Date(n*864e5).toISOString().slice(0,10);
const ui=k=>UI[k][L];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const B=(path,tag="div",cls="",inner)=>`<${tag} class="${cls}" data-b="${path}">${inner??getB(path)}</${tag}>`;
function getB(p){const a=p.split("|");
  if(a[0]==="t")return S.t[a[1]][L];
  const o=(a[0]==="m"?S.ms:S.ph).find(x=>x.id===a[1]);return o?o[a[2]][L]:"";}
function setB(p,v){const a=p.split("|");
  if(a[0]==="t")S.t[a[1]][L]=v;
  else{const o=(a[0]==="m"?S.ms:S.ph).find(x=>x.id===a[1]);if(o)o[a[2]][L]=v;}}
const baseDay=()=>{const p1=S.ph[1]&&S.ms.find(m=>m.ph===S.ph[1].id);return dn((p1||S.ms[0]||{date:S.asof}).date)};
const dayWord=n=>L==="en"?(n===1?"day":"days"):(n===1?"يوم":(n>=3&&n<=10?"أيام":"يومًا"));
const phColor=id=>(S.ph.find(p=>p.id===id)||{color:"#00778B"}).color;
const ICON={
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/>',
 warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>'};
const ic=k=>`<div class="ic"><svg viewBox="0 0 24 24">${ICON[k]}</svg></div>`;
const hdr=(tag,title,color)=>`<div class="hd" ${color?`style="--c:${color}"`:""}><div class="hl">${tag}${title}</div><img class="logo" src="${LOGO}" alt="SAR"></div>`;
const ftr=()=>`<div class="ft">${B("t|foot","span")}<span class="pn"></span></div>`;
const chunk=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r.length?r:[[]]};

/* ---------------- SLIDE BUILDERS ---------------- */
function sTitle(){return `<section class="slide s-title" data-kind="title">
 <svg class="stripes" viewBox="0 0 820 1080" preserveAspectRatio="none"><polygon points="820,0 820,1080 250,1080 640,0" fill="#fff" opacity=".1"/><polygon points="820,0 820,1080 480,1080 800,0" fill="#fff" opacity=".12"/><polygon points="360,1080 440,1080 800,0 720,0" fill="#fff" opacity=".18"/></svg>
 <div class="tlogo"><img src="${LOGO}" alt="SAR"></div>
 <div class="tx">${B("t|title.kicker","div","kick")}${B("t|title.main","h1")}${B("t|title.sub","h2")}<div class="rule"></div>
  <div class="asof">${B("t|title.asof","span")}<span class="dpill"><span>${fmt(S.asof)}</span><input class="dinp" type="date" data-k="asof" value="${S.asof}"></span></div></div>
</section>`}

function sInfo(){
 const c=(n,icn,col)=>`<div class="card" style="--c:${col}"><div class="ch">${ic(icn)}${B(`t|info.c${n}.h`,"h3")}</div>${B(`t|info.c${n}.b`,"div","cb")}</div>`;
 return `<section class="slide" data-kind="info">${hdr(B("t|info.tag","span","tag"),B("t|info.title","h1"))}
 <div class="bd"><div class="cards">${c(1,"info","#00778B")}${c(2,"shield","#2E9E6B")}${c(3,"warn","#C8503F")}${c(4,"clock","#3D3935")}</div></div>${ftr()}</section>`}

function phaseSpans(){
  return S.ph.map((p,i)=>{const it=S.ms.filter(m=>m.ph===p.id);if(!it.length)return null;
    const start=dn(it[0].date);
    const nxt=S.ph.slice(i+1).map(q=>S.ms.find(m=>m.ph===q.id)).find(Boolean);
    const end=nxt?dn(nxt.date):dn(S.ms[S.ms.length-1].date);
    return {p,days:Math.max(0,end-start)};}).filter(Boolean);
}
function sSummary(){
 const ms=S.ms,tot=ms.length?dn(ms[ms.length-1].date)-dn(ms[0].date):0,sus=ms.length?dn(ms[ms.length-1].date)-baseDay():0;
 const k=(n,v,col,extra)=>`<div class="kpi" style="--c:${col}"><div class="v">${v}<small>${extra||""}</small></div>${B("t|sum.k"+n,"div","l")}</div>`;
 const sp=phaseSpans(),sum=sp.reduce((a,x)=>a+x.days,0)||1;
 return `<section class="slide" data-kind="summary">${hdr(B("t|sum.tag","span","tag"),B("t|sum.title","h1"))}
 <div class="bd"><div class="kpis">${k(1,tot,"#00778B",ui("days"))}${k(2,sus,"#C8503F",ui("days"))}${k(3,ms.length,"#3D3935")}
   <div class="kpi" style="--c:#2E9E6B"><div class="v">${B("t|sum.k4v","span")}</div>${B("t|sum.k4","div","l")}</div></div>
  ${B("t|sum.phases","div","sec")}
  <div class="pbar">${sp.map(x=>`<div style="flex:${Math.max(x.days,sum*.2)};background:${x.p.color}">${x.days}</div>`).join("")}</div>
  <div class="plab">${sp.map(x=>`<div style="flex:${Math.max(x.days,sum*.2)}">${x.p.name[L]}<small>${x.days} ${dayWord(x.days)}</small></div>`).join("")}</div>
  <div class="status"><div class="dot"></div><div>${B("t|sum.st.h","div","sh")}${B("t|sum.st.b","div","sb")}</div></div></div>${ftr()}</section>`}

function sOverview(){
 const ms=S.ms; if(!ms.length)return `<section class="slide" data-kind="ov">${hdr(B("t|ov.tag","span","tag"),B("t|ov.title","h1"))}<div class="bd"><div class="empty">${ui("none")}</div></div>${ftr()}</section>`;
 const d0=dn(ms[0].date),d1=dn(ms[ms.length-1].date),pad=2,span=d1-d0+2*pad,W=1500;
 const pos=d=>(d-d0+pad)/span*100;
 let ticks="",grid="";
 for(let t=d0;t<=d1+0.1;t+=7){const x=pos(t).toFixed(2)+"%";grid+=`<i class="gl2" style="--x:${x}"></i>`;ticks+=`<span style="--x:${x}">${fmtS(iso(t))}</span>`;}
 if((d1-d0)%7>2){const x=pos(d1).toFixed(2)+"%";grid+=`<i class="gl2" style="--x:${x}"></i>`;ticks+=`<span style="--x:${x}">${fmtS(iso(d1))}</span>`;}
 const idx=new Map(ms.map((m,i)=>[m.id,i+1]));
 const lanes=S.ph.map(p=>{const it=ms.filter(m=>m.ph===p.id);
   const last=[-999,-999,-999];
   const mk=it.map(m=>{const x=pos(dn(m.date))/100*W;let s=last.findIndex(l=>x-l>=44);if(s<0)s=1;last[s]=x;
     return `<div class="mk" title="${esc(m.title[L])}" style="inset-inline-start:${pos(dn(m.date)).toFixed(2)}%;top:${8+s*32}px">${idx.get(m.id)}</div>`}).join("");
   const bar=it.length?`<div class="bar" style="inset-inline-start:${pos(dn(it[0].date)).toFixed(2)}%;width:${Math.max(.6,pos(dn(it[it.length-1].date))-pos(dn(it[0].date))).toFixed(2)}%"></div>`:"";
   return {p,html:`<div class="lane" style="--c:${p.color}">${bar}${mk}</div>`}});
 const bd=baseDay(),vl=(d,col,txt,c2)=>`<div class="vline ${c2||''}" style="--x:${pos(d).toFixed(2)}%;--c:${col}"><b>${txt}</b></div>`;
 const legend=S.ph.map(p=>`<div class="lg" style="--c:${p.color}"><h4>${p.name[L]}</h4>${ms.filter(m=>m.ph===p.id).map(m=>`<p><i>${idx.get(m.id)}</i><span>${esc(m.title[L].replace(/<[^>]*>/g,""))} <em>· ${fmtS(m.date)}</em></span></p>`).join("")}</div>`).join("");
 return `<section class="slide" data-kind="ov">${hdr(B("t|ov.tag","span","tag"),B("t|ov.title","h1"))}
 <div class="bd" style="padding-top:26px"><div class="chart">
  <div class="lcol">${S.ph.map(p=>`<div class="ll" style="--c:${p.color}"><span>${p.tag[L]}</span><b>${p.name[L]}</b></div>`).join("")}</div>
  <div class="plot">${grid}${lanes.map(l=>l.html).join("")}${vl(bd,"#C8503F",ui("susp"))}${vl(d1,"#2E9E6B",ui("ready"),"r")}<div class="axis">${ticks}</div></div></div>
  <div class="legend">${legend}</div></div>${ftr()}</section>`}

function msCard(m,i,rows,pos,isLast){
 const ms=S.ms,gi=ms.indexOf(m),prev=gi>0?ms[gi-1]:null,col=phColor(m.ph);
 const d=dn(m.date),day=d-baseDay(),gap=prev?d-dn(prev.date):null,[y,mo,dd]=parts(m.date);
 const lc=(pos%rows===rows-1)||isLast;
 return `<div class="ms ${lc?"lc":""}" data-id="${m.id}" style="--c:${col}">
  <div class="mcol"><div class="dbadge"><span class="dd">${dd}</span><span class="dm">${SHORT[L][mo-1]}</span><span class="dy">${y}</span><input class="dinp" type="date" data-k="ms" data-id="${m.id}" value="${m.date}"></div>
   <span class="chip">${ui("day")} <bdi>${day>0?"+":""}${day}</bdi></span>${gap===null?"":`<span class="chip g">${gap===0?ui("same"):`<bdi>+${gap}</bdi> ${dayWord(gap)}`}</span>`}${gi===ms.length-1?`<span class="chip fin">✓ ${ui("final")}</span>`:""}</div>
  <div class="mb"><span class="no">#${gi+1}</span>
   <div class="ctl"><select data-k="ph" data-id="${m.id}">${S.ph.map(p=>`<option value="${p.id}" ${p.id===m.ph?"selected":""}>${esc(p.tag[L])}</option>`).join("")}</select><button data-k="del" data-id="${m.id}" title="Delete">✕</button></div>
   ${B(`m|${m.id}|title`,"div","mt")}${B(`m|${m.id}|desc`,"div","md")}
  </div></div>`}

function sPhase(p,items,part,parts_){
 const cols=items.length>4?2:1,rows=Math.max(1,Math.ceil(items.length/cols));
 const all=S.ms.filter(m=>m.ph===p.id);
 const dl=all.length?(all.length>1&&all[0].date!==all[all.length-1].date?`${fmtS(all[0].date)} → ${fmt(all[all.length-1].date)}`:fmt(all[0].date)):"";
 const cont=parts_>1?` <small style="font-size:.5em;opacity:.6">(${part+1}/${parts_})</small>`:"";
 return `<section class="slide" data-kind="phase" data-phase="${p.id}" style="--c:${p.color}">
  ${hdr(`<span class="tag" data-b="p|${p.id}|tag">${p.tag[L]}</span>`,`<h1 data-b="p|${p.id}|name">${p.name[L]}</h1>`,p.color)}
  <div class="bd"><div class="sub">${B(`p|${p.id}|sub`,"span")}<span class="dl">${dl} · ${all.length} ${ui("ms")}<input class="pcol" type="color" data-k="pcol" data-id="${p.id}" value="${p.color}" title="Phase color / لون المرحلة"><button class="addbtn" data-k="add" data-id="${p.id}">${ui("add")}</button></span></div>
   ${items.length?`<div class="list ${cols===1?"one":""}" style="--cols:${cols};--rows:${rows}">${items.map((m,i)=>msCard(m,i,rows,i,i===items.length-1)).join("")}</div>`:`<div class="empty">${ui("none")}</div>`}</div>${ftr()}</section>`}

function sNext(){
 const c=(n,col)=>`<div class="card" style="--c:${col}"><div class="ch">${B(`t|next.c${n}.h`,"h3")}</div>${B(`t|next.c${n}.b`,"div","cb")}</div>`;
 return `<section class="slide" data-kind="next">${hdr(B("t|next.tag","span","tag"),B("t|next.title","h1"))}<div class="bd"><div class="cols3">${c(1,"#00778B")}${c(2,"#2E9E6B")}${c(3,"#C8503F")}</div></div>${ftr()}</section>`}
function sEnd(){return `<section class="slide end" data-kind="end">${B("t|end.h","h1")}${B("t|end.p","p")}<div class="tlogo"><img src="${LOGO}" alt="SAR"></div></section>`}

/* ---------------- RENDER ---------------- */
function buildHTML(){
 const out=[sTitle(),sInfo(),sSummary(),sOverview()];
 S.ph.forEach(p=>{const it=S.ms.filter(m=>m.ph===p.id),ch=chunk(it,6);ch.forEach((c,i)=>out.push(sPhase(p,c,i,ch.length)))});
 out.push(sNext(),sEnd());return out.join("");}
const slides=()=>$$("#deck .slide");
function render(focusId){
 const deck=$("#deck");L=S.lang;
 deck.setAttribute("dir",L==="ar"?"rtl":"ltr");deck.setAttribute("lang",L);
 deck.innerHTML=buildHTML();
 const n=slides().length;
 slides().forEach((s,i)=>{const pn=$(".pn",s);if(pn)pn.textContent=(i+1)+" / "+n;});
 if(focusId){const i=slides().findIndex(s=>s.querySelector(`.ms[data-id="${focusId}"]`));if(i>=0)cur=i;}
 cur=Math.min(cur,n-1);
 applyEdit();show(cur,true);
 $("#lang").textContent=L==="en"?"عربي":"English";
 $("#pgTot").textContent=n;$("#pgIn").max=n;
}
function applyEdit(){
 document.body.classList.toggle("edit",editMode);$("#editSw").checked=editMode;
 $$("#deck [data-b]").forEach(e=>{e.contentEditable=editMode?"true":"false";e.spellcheck=false;});
}
function show(i,noSave){
 const s=slides();cur=Math.max(0,Math.min(s.length-1,i));
 s.forEach((e,k)=>e.classList.toggle("active",k===cur));
 $("#pgIn").value=cur+1;$("#prog").style.width=((cur+1)/s.length*100)+"%";
}
function fit(){
 const v=$("#viewport"),r=v.getBoundingClientRect(),pad=document.body.classList.contains("fs")?0:14;
 const k=Math.min((r.width-pad*2)/1920,(r.height-pad*2)/1080);
 const st=$("#stage");st.style.transform=`scale(${k})`;
 st.style.left=((r.width-1920*k)/2)+"px";st.style.top=((r.height-1080*k)/2)+"px";
}
addEventListener("resize",fit);

/* ---------------- TEXT EDITING ---------------- */
let lastEl=null,lastRange=null;
document.addEventListener("selectionchange",()=>{
 const sel=getSelection();if(!sel.rangeCount)return;
 const n=sel.anchorNode,el=n&&(n.nodeType===1?n:n.parentElement)?.closest?.("[data-b]");
 if(el&&el.closest("#deck")){lastEl=el;lastRange=sel.getRangeAt(0).cloneRange();syncTools(n.nodeType===1?n:n.parentElement);}
});
function syncTools(node){
 try{const cs=getComputedStyle(node);$("#fSize").value=Math.round(parseFloat(cs.fontSize));
  const f=cs.fontFamily.split(",")[0].replace(/["']/g,"").trim();const o=[...$("#fFont").options].find(o=>o.value.toLowerCase()===f.toLowerCase());if(o)$("#fFont").value=o.value;}catch(_){}
}
function restore(){
 if(!lastEl||!lastEl.isConnected)return false;
 lastEl.focus({preventScroll:true});
 const sel=getSelection();sel.removeAllRanges();
 if(lastRange&&lastEl.contains(lastRange.commonAncestorContainer))sel.addRange(lastRange);
 else{const r=document.createRange();r.selectNodeContents(lastEl);sel.addRange(r);}
 return true;
}
function withSel(fn){
 if(!restore())return;
 const sel=getSelection();
 if(sel.isCollapsed){const r=document.createRange();r.selectNodeContents(lastEl);sel.removeAllRanges();sel.addRange(r);}
 document.execCommand("styleWithCSS",false,true);
 fn();
 lastEl.dispatchEvent(new Event("input",{bubbles:true}));
 if(getSelection().rangeCount)lastRange=getSelection().getRangeAt(0).cloneRange();
}
function applySize(px){
 px=Math.max(8,Math.min(400,Math.round(px)));
 withSel(()=>{
  document.execCommand("fontSize",false,"7");
  $$('font[size="7"],span[style*="xxx-large"]',lastEl).forEach(n=>{
   let sp=n;
   if(n.tagName==="FONT"){sp=document.createElement("span");while(n.firstChild)sp.appendChild(n.firstChild);n.replaceWith(sp);}
   sp.style.fontSize=px+"px";
   $$('[style*="font-size"]',sp).forEach(c=>c.style.fontSize="");
  });
 });
 $("#fSize").value=px;
}
$("#fmt").addEventListener("mousedown",e=>{if(!e.target.closest("select,input"))e.preventDefault();});
$("#fmt").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.cmd){withSel(()=>document.execCommand(b.dataset.cmd));}
 else if(b.dataset.act){const v=+$("#fSize").value||24;applySize(v+(b.dataset.act==="sz+"?2:-2));}
});
$("#fFont").onchange=e=>withSel(()=>document.execCommand("fontName",false,e.target.value));
$("#fSize").onchange=e=>applySize(+e.target.value);
$("#fColor").oninput=e=>withSel(()=>document.execCommand("foreColor",false,e.target.value));
$("#fHi").oninput=e=>withSel(()=>document.execCommand("hiliteColor",false,e.target.value));

const deckEl=$("#deck");
deckEl.addEventListener("input",e=>{
 const el=e.target.closest("[data-b]");if(!el)return;
 const p=el.dataset.b;setB(p,el.innerHTML);
 $$(`#deck [data-b="${p}"]`).forEach(o=>{if(o!==el)o.innerHTML=el.innerHTML;});
 save();
});
deckEl.addEventListener("paste",e=>{
 const el=e.target.closest("[data-b]");if(!el)return;
 e.preventDefault();document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text/plain"));
});
deckEl.addEventListener("keydown",e=>{if(e.target.closest("[data-b]"))e.stopPropagation();});

/* ---------------- DATES / MILESTONES ---------------- */
deckEl.addEventListener("click",e=>{
 const i=e.target.closest(".dinp");if(i&&editMode){try{i.showPicker()}catch(_){}return;}
 const b=e.target.closest("button[data-k]");
 if(b){
  if(b.dataset.k==="del"){if(confirm(ui("confirmDel"))){S.ms=S.ms.filter(m=>m.id!==b.dataset.id);save();render();}}
  if(b.dataset.k==="add")addMs(b.dataset.id);
  return;}
 if(!editMode&&!e.target.closest("input,select")){const r=$("#stage").getBoundingClientRect();(e.clientX-r.left<r.width/3)?show(cur-1):show(cur+1);}
});
deckEl.addEventListener("change",e=>{
 const t=e.target,k=t.dataset.k;if(!k)return;
 if(k==="asof"&&t.value){S.asof=t.value;save();render();}
 else if(k==="ms"&&t.value){const m=S.ms.find(x=>x.id===t.dataset.id);m.date=t.value;sortMs();save();render(m.id);}
 else if(k==="ph"){const m=S.ms.find(x=>x.id===t.dataset.id);m.ph=t.value;save();render(m.id);}
 else if(k==="pcol"){S.ph.find(p=>p.id===t.dataset.id).color=t.value;save();render();}
});
deckEl.addEventListener("input",e=>{ // live phase colour
 const t=e.target;if(t.dataset&&t.dataset.k==="pcol"){const s=t.closest(".slide");s.style.setProperty("--c",t.value);}
});
function sortMs(){S.ms=S.ms.map((m,i)=>[m,i]).sort((a,b)=>dn(a[0].date)-dn(b[0].date)||a[1]-b[1]).map(x=>x[0]);}
function addMs(phId){
 phId=phId||(slides()[cur].dataset.phase)||S.ph[S.ph.length-1].id;
 const it=S.ms.filter(m=>m.ph===phId),lastD=it.length?dn(it[it.length-1].date):(S.ms.length?dn(S.ms[S.ms.length-1].date):dn(S.asof));
 const id="m"+Date.now().toString(36);
 S.ms.push({id,date:iso(lastD+(it.length?1:0)),ph:phId,title:{en:UI.newT.en,ar:UI.newT.ar},desc:{en:UI.newD.en,ar:UI.newD.ar}});
 sortMs();save();render(id);
}
$("#addMs").onclick=()=>addMs();

/* ---------------- NAV / MODES ---------------- */
$("#first").onclick=()=>show(0);$("#last").onclick=()=>show(1e9);
$("#prev").onclick=()=>show(cur-1);$("#next").onclick=()=>show(cur+1);
$("#pgIn").onchange=e=>show((+e.target.value||1)-1);
$("#editSw").onchange=e=>{editMode=e.target.checked;applyEdit();};
$("#lang").onclick=()=>{S.lang=S.lang==="en"?"ar":"en";save();render();};
$("#accent").oninput=e=>{S.accent=e.target.value;document.documentElement.style.setProperty("--accent",S.accent);save();};
$("#deckFont").onchange=e=>{S.font=e.target.value;applyFont();save();};
function applyFont(){const d=document.documentElement.style;S.font?d.setProperty("--ff-user",`'${S.font}','Segoe UI',Tahoma,Arial,sans-serif`):d.removeProperty("--ff-user");$("#deckFont").value=S.font;}
$("#print").onclick=()=>window.print();
$("#reset").onclick=()=>{if(confirm("Reset everything to the original content?\nاسترجاع المحتوى الأصلي بالكامل؟")){try{localStorage.removeItem(KEY)}catch(_){}S=defaults();initUI();cur=0;render();}};

let wasEdit=true;
function goFS(){
 const el=document.documentElement;
 if(!document.fullscreenElement){wasEdit=editMode;(el.requestFullscreen||el.webkitRequestFullscreen).call(el);}
 else (document.exitFullscreen||document.webkitExitFullscreen).call(document);
}
$("#fsBtn").onclick=goFS;
function onFS(){
 const on=!!(document.fullscreenElement||document.webkitFullscreenElement);
 document.body.classList.toggle("fs",on);
 if(on){editMode=false;}else{editMode=wasEdit;}
 applyEdit();setTimeout(fit,50);
}
document.addEventListener("fullscreenchange",onFS);document.addEventListener("webkitfullscreenchange",onFS);
let barT;
document.addEventListener("mousemove",()=>{
 if(!document.body.classList.contains("fs"))return;
 document.body.classList.add("showbar");document.body.classList.remove("hidecursor");
 clearTimeout(barT);barT=setTimeout(()=>{document.body.classList.remove("showbar");document.body.classList.add("hidecursor");},2200);
});
document.addEventListener("keydown",e=>{
 if(e.target.closest&&e.target.closest("input,select,textarea,[contenteditable=true]"))return;
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key;
 if(["ArrowRight","ArrowDown","PageDown"," ","Enter"].includes(k)){e.preventDefault();show(cur+1);}
 else if(["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(k)){e.preventDefault();show(cur-1);}
 else if(k==="Home")show(0);else if(k==="End")show(1e9);
 else if(k==="f"||k==="F")goFS();
 else if(k==="g"||k==="G")openGrid();
 else if(k==="Escape")closeGrid();
});

/* grid overview */
function openGrid(){
 const gl=$("#gl");gl.innerHTML="";const w=Math.min(420,Math.floor((innerWidth-90)/2));gl.style.gridTemplateColumns=`repeat(auto-fill,${w}px)`;
 slides().forEach((s,i)=>{
  const t=document.createElement("div");t.className="th"+(i===cur?" cur":"");t.style.setProperty("--w",w+"px");t.style.width=w+"px";
  const c=s.cloneNode(true);c.classList.remove("active");c.querySelectorAll("[contenteditable]").forEach(x=>x.removeAttribute("contenteditable"));
  const inn=document.createElement("div");inn.className="in";inn.style.transform=`scale(${w/1920})`;inn.setAttribute("dir",L==="ar"?"rtl":"ltr");inn.style.fontFamily="inherit";
  inn.appendChild(c);t.appendChild(inn);
  const n=document.createElement("span");n.className="n";n.textContent=i+1;t.appendChild(n);
  t.onclick=()=>{closeGrid();show(i);};gl.appendChild(t);
 });
 $("#grid").classList.add("open");
}
function closeGrid(){$("#grid").classList.remove("open");}
$("#gridBtn").onclick=openGrid;$("#gridClose").onclick=closeGrid;

/* save as HTML */
$("#save").onclick=()=>{
 S.ts=Date.now();
 const clone=document.documentElement.cloneNode(true);
 clone.querySelector("#saved-state").textContent=JSON.stringify(S).replace(/<\/script/gi,"<\\/script");
 clone.querySelector("#deck").innerHTML="";
 const b=clone.querySelector("body");b.className="edit";
 const st=clone.querySelector("#stage");st.removeAttribute("style");
 clone.querySelector("#grid").className="";clone.querySelector("#gl").innerHTML="";
 clone.removeAttribute("style");
 const html="<!doctype html>\n"+clone.outerHTML;
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
 a.download="UFWL_Suspension_Timeline.html";document.body.appendChild(a);a.click();a.remove();
};

/* init */
function initUI(){
 document.documentElement.style.setProperty("--accent",S.accent);$("#accent").value=S.accent;applyFont();
}
loadState();initUI();render();fit();
addEventListener("beforeprint",()=>{slides().forEach(s=>s.classList.remove("active"));});
addEventListener("afterprint",()=>show(cur));
</script>
</body>
</html>
