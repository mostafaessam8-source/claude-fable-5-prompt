<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UFWL – Gantt Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#00778B;--dark:#3D3935;--muted:#66707a;--line:#dfe6ea;--c0:#7A8791;--c1:#C8503F;--c2:#00778B;--c3:#2E9E6B}
*{box-sizing:border-box}
body{margin:0;background:#eef2f4;font-family:'Inter','Segoe UI',Arial,sans-serif;color:#222}
body[dir=rtl]{font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif}
.bar{position:sticky;top:0;z-index:20;background:var(--dark);padding:8px 16px;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.bar span{color:#fff9;font-size:13px;margin-inline-end:auto}
.bar button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 18px;font:700 15px inherit;font-family:inherit;cursor:pointer}
.bar button.g{background:#ffffff22}
.page{max-width:1700px;margin:18px auto;background:#fff;box-shadow:0 4px 24px #0002;padding:26px 32px 22px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:5px solid var(--accent);padding-bottom:14px;margin-bottom:14px}
h1{margin:0;font-size:30px;color:var(--dark)}h1+p{margin:4px 0 0;color:var(--muted);font-size:16px}
header img{height:62px}
.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:14px;margin:0 0 12px;align-items:center}
.legend i{display:inline-block;width:26px;height:12px;border-radius:3px;vertical-align:middle;margin-inline-end:6px}
.legend b{display:inline-block;width:12px;height:12px;transform:rotate(45deg);background:var(--dark);margin-inline-end:8px}
.gantt{position:relative;border:1px solid var(--line);--lw:620px}
.row{display:flex;border-bottom:1px solid var(--line)}
.info{flex:none;width:var(--lw);display:flex;gap:10px;padding:7px 10px;align-items:flex-start;border-inline-end:2px solid #c3ced4;background:#fff;position:relative;z-index:2}
.n{flex:none;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.dt{flex:none;width:104px;font-weight:700;font-size:14px;color:var(--dark);position:relative;line-height:1.3;padding-top:3px}
.dt input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.dt:hover{background:#e8f3f5;border-radius:4px}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:15px;line-height:1.25;color:#1d2226}
.tx small{display:block;font-size:12.5px;line-height:1.35;color:var(--muted);margin-top:2px}
[contenteditable]:focus{outline:2px solid var(--accent);border-radius:3px}
.ch{flex:1;position:relative;min-height:44px}
.head .info{background:var(--dark);color:#fff;font-weight:700;font-size:14px;padding:10px;align-items:center}
.head .ch{background:#f4f7f8}
.mrow{height:24px;position:relative;border-bottom:1px solid var(--line)}
.mrow span{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:#e3edf0;border-inline-end:2px solid #fff;color:var(--dark)}
.drow{height:26px;position:relative}
.drow span{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#555;font-weight:600}
.drow span.wk{background:#e9eef0;color:#999}
.ov{position:absolute;top:0;bottom:0;inset-inline-start:var(--lw);inset-inline-end:0;z-index:1;pointer-events:none}
.ov i{position:absolute;top:0;bottom:0;background:#0000000a;border-inline-start:1px solid #00000010}
.ov i.t{background:none}
.grp{background:var(--c);color:#fff}
.grp .info{background:var(--c);color:#fff;align-items:center;padding:6px 12px;font-weight:800;font-size:16px}
.grp .info span{margin-inline-start:auto;font-weight:600;font-size:13px;opacity:.95}
.grp .ch{background:color-mix(in srgb,var(--c) 14%,#fff)}
.span{position:absolute;top:13px;height:18px;background:var(--c);border-radius:9px;opacity:.9}
.act{position:absolute;top:50%;height:22px;margin-top:-11px;background:var(--c);border-radius:5px;opacity:.85;z-index:2;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.dia{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;background:var(--c);transform:rotate(45deg);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--c);z-index:3}
body[dir=rtl] .dia{margin:-11px -11px 0 0}
.dia.fin{background:#fff;border-color:var(--c)}
.lbl{position:absolute;top:50%;margin-top:-9px;font-size:12px;font-weight:700;color:var(--c);white-space:nowrap;z-index:3;background:#fffd;padding:0 4px;border-radius:3px}
.today{position:absolute;top:0;bottom:0;width:0;border-inline-start:2px dashed var(--c1);z-index:4}
.stats{display:flex;gap:14px;margin-top:14px}
.stats div{flex:1;background:#f4f7f8;border-inline-start:6px solid var(--accent);border-radius:6px;padding:8px 14px;font-size:14px;color:var(--muted)}
.stats b{display:block;font-size:26px;color:var(--dark)}
@media print{
 @page{size:A3 landscape;margin:8mm}
 body{background:#fff}.bar{display:none}.page{box-shadow:none;margin:0;padding:0;max-width:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .row{break-inside:avoid}
}
@media(max-width:1100px){.gantt{overflow-x:auto}.gantt>*{min-width:1300px}}
</style>
</head>

["2026-10-21","p3",T("Work Permit Ready for Signature","تصريح العمل جاهز للتوقيع"),T("The Work Permit is ready to be signed and issued.","أصبح تصريح العمل جاهزاً للتوقيع والإصدار.")]
].map((a,i)=>({id:i,date:a[0],ph:a[1],t:a[2],d:a[3]}));
const MON={en:["January","February","March","April","May","June","July","August","September","October","November","December"],
 ar:["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"]};
const S={en:{info:"Activity",days:"days",day:"Day",total:"Days: permit request → permit ready",susp:"Days: suspension → permit ready",cnt:"Milestones",
  lActivity:"Activity (duration until next step)",lMile:"Milestone date",lPhase:"Phase span",print:"Print / PDF",hint:"Click a date to change it · click text to edit",
  title:"UFWL Project – Gantt Chart",sub:"Project Activity Timeline – Site Suspension and Shoring Works",hd:"Activity / Milestone",ready:"Ready"},
 ar:{info:"النشاط",days:"يوم",day:"اليوم",total:"يوم: من طلب التصريح حتى جاهزيته",susp:"يوم: من الإيقاف حتى جاهزية التصريح",cnt:"عدد المراحل",
  lActivity:"النشاط (المدة حتى الخطوة التالية)",lMile:"تاريخ الميل ستون",lPhase:"مدة المرحلة",print:"طباعة / PDF",hint:"اضغط على التاريخ لتغييره · اضغط على النص لتعديله",
  title:"مشروع UFWL – مخطط جانت",sub:"الجدول الزمني لأنشطة المشروع – إيقاف الموقع وأعمال الدعم",hd:"النشاط / الميل ستون",ready:"جاهز"}};
let L="en";
const dn=s=>{const[y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)/864e5};
const dd=n=>new Date(n*864e5);
const fmt=s=>{const[y,m,d]=s.split("-").map(Number);return `${d} ${MON[L][m-1]} ${y}`};
function render(){
 M.sort((a,b)=>dn(a.date)-dn(b.date)||a.id-b.id);
 const e0=dn(M[0].date),d0=e0-4,d1=dn(M[M.length-1].date),N=d1-d0+1,w=100/N,s=S[L];
 const x=d=>((d-d0)*w).toFixed(3)+"%", xc=d=>((d-d0+.5)*w).toFixed(3)+"%";
 document.body.dir=L==="ar"?"rtl":"ltr";document.documentElement.lang=L;
 $("#lang").textContent=L==="en"?"عربي":"English";$("#print").textContent=s.print;$("#hint").textContent=s.hint;
 // month header
 let mon="",dayc="",ov="",last=-1,start=0;
 const months=[];
 for(let i=0;i<N;i++){const D=dd(d0+i),k=D.getUTCFullYear()*12+D.getUTCMonth();
  if(k!==last){months.push({k,m:D.getUTCMonth(),y:D.getUTCFullYear(),from:i,to:i});last=k;}else months[months.length-1].to=i;
  const wk=[5,6].includes(D.getUTCDay());
  dayc+=`<span class="${wk?"wk":""}" style="inset-inline-start:${(i*w).toFixed(3)}%;width:${w}%">${D.getUTCDate()}</span>`;
  if(wk)ov+=`<i style="inset-inline-start:${(i*w).toFixed(3)}%;width:${w}%"></i>`;}
 mon=months.map(m=>`<span style="inset-inline-start:${(m.from*w).toFixed(3)}%;width:${((m.to-m.from+1)*w).toFixed(3)}%">${MON[L][m.m]} ${m.y}</span>`).join("");
 const head=`<div class="row head"><div class="info">${s.hd}</div><div class="ch"><div class="mrow">${mon}</div><div class="drow">${dayc}</div></div></div>`;
 let rows="";
 Object.keys(PH).forEach(pid=>{
  const it=M.filter(m=>m.ph===pid);if(!it.length)return;const p=PH[pid];
  const a=dn(it[0].date),b=dn(it[it.length-1].date);
  rows+=`<div class="row grp" style="--c:${p.c}"><div class="info">${p.n[L]}<span>${fmt(it[0].date)} → ${fmt(it[it.length-1].date)}</span></div><div class="ch" style="min-height:40px"><div class="span" style="inset-inline-start:${x(a)};width:calc(${((b-a+1)*w).toFixed(3)}% )"></div></div></div>`;
  it.forEach(m=>{
   const gi=M.indexOf(m),cur=dn(m.date),nx=M[gi+1]?dn(M[gi+1].date):null,fin=gi===M.length-1;
   const dur=nx!==null?nx-cur:0;
   const bar=dur>0?`<div class="act" style="inset-inline-start:${xc(cur)};width:${(dur*w).toFixed(3)}%">${dur>=8?dur+" "+s.days:""}</div>`:"";
   const lbl=dur>0&&dur<8?`<span class="lbl" style="inset-inline-start:calc(${xc(nx)} + 8px)"><bdi>+${dur}</bdi> ${s.days}</span>`:"";
   rows+=`<div class="row" style="--c:${p.c}"><div class="info"><div class="n" style="background:${p.c}">${gi+1}</div>
    <div class="dt">${fmt(m.date)}<input type="date" value="${m.date}" data-i="${m.id}"></div>
    <div class="tx"><b contenteditable data-i="${m.id}" data-f="t">${m.t[L]}</b><small contenteditable data-i="${m.id}" data-f="d">${m.d[L]}</small></div></div>
    <div class="ch">${bar}<div class="dia ${fin?"fin":""}" style="inset-inline-start:${xc(cur)}"></div>${lbl}</div></div>`;
  });
 });
 const sus=M.find(m=>m.ph==="p1");
 const susD=sus?d1-dn(sus.date):0;
 $("#page").innerHTML=`<header><div><h1>${s.title}</h1><p>${s.sub}</p></div><img src="${LOGO}"></header>
 <div class="legend">${Object.values(PH).map(p=>`<span><i style="background:${p.c}"></i>${p.n[L]}</span>`).join("")}<span><b></b>${s.lMile}</span><span><i style="background:#888;opacity:.8"></i>${s.lActivity}</span></div>
 <div class="gantt" id="g">${head}${rows}<div class="ov">${ov}</div></div>
 <div class="stats"><div><b>${d1-e0}</b>${s.total}</div><div><b>${susD}</b>${s.susp}</div><div><b>${M.length}</b>${s.cnt}</div></div>`;
}
const $=q=>document.querySelector(q);
document.addEventListener("change",e=>{const i=e.target.dataset.i;if(e.target.type==="date"&&e.target.value){M.find(m=>m.id==i).date=e.target.value;render();}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.f)M.find(m=>m.id==t.dataset.i)[t.dataset.f][L]=t.innerHTML;});
$("#lang").onclick=()=>{L=L==="en"?"ar":"en";render();};
$("#print").onclick=()=>print();
render();
</script>
</body></html>
