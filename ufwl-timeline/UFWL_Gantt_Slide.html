<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UFWL – Gantt Slide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#00778B;--dark:#3D3935;--muted:#66707a;--line:#dfe6ea;--c0:#7A8791;--c1:#C8503F;--c2:#00778B;--c3:#2E9E6B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;touch-action:manipulation;background:#14171a;font-family:'Inter','Segoe UI',Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
/* toolbar */
#tb{background:var(--dark);color:#fff;padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:10}
.g{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.b{background:#ffffff1c;color:#fff;border:1px solid #ffffff26;border-radius:7px;min-width:38px;height:38px;padding:0 11px;font:600 14px inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.b:active{background:#ffffff44}.b.on{background:#fff;color:var(--dark)}.b.pri{background:var(--accent);border-color:var(--accent)}
#tb select,#tb input[type=number]{height:38px;border-radius:7px;border:1px solid #ffffff33;background:#2b2825;color:#fff;padding:0 6px;font:inherit;font-size:14px}
#tb input[type=number]{width:60px}
#tb input[type=color]{width:38px;height:38px;padding:2px;border:1px solid #ffffff33;border-radius:7px;background:#2b2825}
#fmt{display:none;width:100%;padding-top:6px;border-top:1px solid #ffffff2a}
body.edit #fmt{display:flex}
.sp{flex:1}
#vp{flex:1;position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#fff;box-shadow:0 8px 40px #000a}

/* fullscreen */
body.fs #tb{display:none}
body.fs #app{position:fixed;inset:0;z-index:100;background:#14171a}
#fsbar{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:200;gap:6px;opacity:0;transition:.3s;background:#000c;padding:5px;border-radius:12px}
body.fs #fsbar{display:flex}body.fs.show #fsbar,body.fs.pedit #fsbar{opacity:1}
#fsPE.on{background:#fff;color:var(--dark)}
/* dates dialog */
#dlg,#adlg,#sdlg{display:none;position:fixed;inset:0;background:#000a;z-index:300;align-items:center;justify-content:center;padding:12px}
#dlg.open,#adlg.open,#sdlg.open{display:flex}
#dbox,#abox,#sbox{background:#fff;border-radius:14px;width:min(720px,100%);max-height:94vh;display:flex;flex-direction:column;overflow:hidden;color:#222;font-family:inherit}
#dbox h3,#abox h3,#sbox h3{margin:0;padding:14px 18px;background:var(--dark);color:#fff;display:flex;justify-content:space-between;align-items:center;font-size:18px}
#dbox .tools{padding:10px 16px;background:#f2f6f7;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
#dbox .tools input{width:70px;height:36px;border:1px solid #bcc7cd;border-radius:6px;padding:0 6px;font:inherit}
#dbox .tools button{height:36px;border:0;border-radius:6px;background:var(--accent);color:#fff;padding:0 14px;font:700 14px inherit;font-family:inherit;cursor:pointer}
#dl{overflow:auto;padding:6px 16px 14px}
.dr{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #e6ecef}
.dr i{flex:none;width:26px;height:26px;border-radius:50%;color:#fff;font:800 13px/26px inherit;text-align:center;font-style:normal}
.dr span{flex:1;font-size:15px;font-weight:600;min-width:0}
.dr input{flex:none;height:40px;border:1px solid #bcc7cd;border-radius:8px;padding:0 8px;font:inherit;font-size:15px}
/* slide */
#deck{position:absolute;inset:0;direction:ltr;font-family:var(--ff,'Inter','Segoe UI',Arial,sans-serif);color:#222}
#deck[dir=rtl]{direction:rtl;font-family:var(--ff,'Tajawal','Cairo','Segoe UI',Tahoma,sans-serif)}
.hd{position:absolute;top:0;inset-inline:0;height:86px;padding:0 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:5px solid var(--accent)}
.hd:after{content:"";position:absolute;bottom:-5px;inset-inline-start:0;width:300px;height:5px;background:var(--dark)}
h1{margin:0;font-size:36px;line-height:1.1;color:var(--dark);font-weight:800}
.sub{font-size:18px;color:var(--muted);margin-top:3px}

.legend{position:absolute;top:96px;inset-inline:40px;height:34px;display:flex;gap:26px;align-items:center;font-size:16px;color:#333}

.legend b{display:inline-block;width:12px;height:12px;transform:rotate(45deg);background:var(--dark);margin-inline-end:8px;vertical-align:middle}
.gantt{position:absolute;top:134px;inset-inline:40px;border:1px solid var(--line);--lw:780px;user-select:none}
.row{display:flex;border-bottom:1px solid var(--line);height:var(--rh,39px)}
.info{flex:none;width:var(--lw);display:flex;gap:10px;padding:0 10px;align-items:center;border-inline-end:2px solid #c3ced4;background:#fff;position:relative;z-index:2}
.n{flex:none;min-width:46px;height:24px;padding:0 8px;border-radius:12px;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.gc{background:#fff3;border-radius:12px;padding:1px 9px;margin-inline-end:8px;font-size:14px}
.l3 .tx b{font-size:17px;font-weight:700}.l4 .tx b{font-size:16px;font-weight:600}.l3 .tx small,.l4 .tx small{font-size:12.5px}.cp.l3 .tx small{font-size:10px}
.cp .tx{line-height:1.05}.cp .tx small{font-size:10.5px;margin-top:1px}.cp .tx b{font-size:14.5px}.cp .dt{font-size:14px}.cp .n{height:20px;font-size:12px}.tn .tx small{display:none}.tn .tx b{font-size:13px}.tn .dt{font-size:12px}.tn .n{height:17px;font-size:11px;min-width:40px}
.dt{flex:none;width:92px;font-weight:800;font-size:16px;color:var(--dark);white-space:nowrap}
.tx{flex:1;min-width:0;line-height:1.15}
.tx b,.tx small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx b{font-size:18px;color:#1d2226}.tx small{font-size:13.5px;color:var(--muted);margin-top:2px}
.ch{flex:1;position:relative}
.head{height:auto}.head .info{background:var(--dark);color:#fff;font-weight:700;font-size:17px;padding:0 14px;height:auto}
.head .ch{background:#f4f7f8}
.mrow{height:24px;position:relative;border-bottom:1px solid var(--line)}
.mrow span{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;white-space:nowrap;background:#e3edf0;border-inline-end:2px solid #fff;color:var(--dark);overflow:hidden}
.wrow{height:19px;position:relative;border-bottom:1px solid #fff}
.wrow span{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#5a6a73;background:#eaf0f2}
.wrow span.wk{background:#dbe3e6;color:#8a959c}
.drow{height:24px;position:relative}
.drow span{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#444;font-weight:700}
.drow span.wk{background:#e9eef0;color:#999}
.ov{position:absolute;top:0;bottom:0;inset-inline-start:var(--lw);inset-inline-end:0;z-index:1;pointer-events:none}
.ov s{position:absolute;top:0;bottom:0;width:0;border-inline-start:1.5px solid #9db2bb;text-decoration:none}
.ov i{position:absolute;top:0;bottom:0;background:#0000000b;border-inline-start:1px solid #00000010}
.grp{height:34px}
.grp .info{background:var(--c);color:#fff;font-weight:800;font-size:17px}
.grp .info em{margin-inline-start:auto;font-style:normal;font-weight:600;font-size:14px;opacity:.95;white-space:nowrap}
.grp .ch{background:color-mix(in srgb,var(--c) 14%,#fff)}
.span{position:absolute;top:9px;height:16px;background:var(--c);border-radius:8px;opacity:.92}
.act{position:absolute;top:50%;height:calc(var(--rh,39px)*.5);margin-top:calc(var(--rh,39px)*-.25);background:var(--c);border-radius:5px;opacity:.85;z-index:2;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.dia{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;background:var(--c);transform:rotate(45deg);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--c);z-index:3}

.dia.fin{background:#fff}
.lbl bdi{margin-inline-end:3px}.lbl{position:absolute;top:50%;margin-top:-9px;font-size:13px;font-weight:800;color:var(--c);white-space:nowrap;z-index:3}
.ft{position:absolute;bottom:0;inset-inline:0;height:58px;padding:0 40px;display:flex;align-items:center;gap:18px;background:var(--dark);color:#fff;font-size:16px}
.ft div{display:flex;align-items:center;gap:9px}.ft b{font-size:28px;color:#fff}
.ft .s{width:1px;height:30px;background:#fff4}
.ft .pn{margin-inline-start:auto;opacity:.7}
.rdel{display:none;flex:none;width:26px;height:26px;border:1px solid #e0b4ad;background:#fff;color:#c0392b;border-radius:7px;cursor:pointer;font:700 14px/1 inherit;padding:0;z-index:60}
body.edit .rdel{display:inline-block}.rdel:hover{background:#c0392b;color:#fff}
.cp .rdel,.tn .rdel{width:22px;height:22px;font-size:12px}
#sbox{width:min(1100px,100%)}#sbox .tools{padding:10px 16px;background:#f2f6f7;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}#sbox .tools input{height:36px;border:1px solid #bcc7cd;border-radius:6px;padding:0 6px;font:inherit}#sbox .tools button,#sbox .af button{height:38px;border:0;border-radius:8px;background:var(--accent);color:#fff;padding:0 16px;font:700 14px inherit;font-family:inherit;cursor:pointer}#sbox .af{padding:10px 16px;background:#f2f6f7;display:flex;justify-content:flex-end}#sbox .af button.sec{background:#dfe7ea;color:#333}
#sl{overflow:auto;padding:6px 14px}.sr_{display:grid;grid-template-columns:40px 1.3fr 1.3fr 66px 66px 62px 56px 56px 44px 36px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #e6ecef}.sr_ input,.sr_ select{height:36px;border:1px solid #bcc7cd;border-radius:7px;padding:0 6px;font:inherit;font-size:14px;width:100%;min-width:0}.sr_.h{font-size:12px;font-weight:800;color:#556;border:0;position:sticky;top:0;background:#fff}.sr_ i{width:30px;height:30px;border-radius:50%;color:#fff;font:800 14px/30px inherit;text-align:center;font-style:normal}.sr_ input[type=color]{padding:1px;height:36px}.sr_ .del{height:34px;border:1px solid #e0b4ad;background:#fff;color:#b33;border-radius:7px;cursor:pointer}
@media(max-width:800px){.sr_{grid-template-columns:30px 1fr 1fr;}.sr_.h{display:none}}
/* add dialog */
#abox .ab{padding:14px 18px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
#abox .full{grid-column:1/-1}
#abox label{display:block;font-size:13px;font-weight:700;color:#4a555d;margin-bottom:4px}
#abox input,#abox select{width:100%;height:42px;border:1px solid #bcc7cd;border-radius:8px;padding:0 10px;font:inherit;font-size:15px;background:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:90px;height:44px;border:2px solid #cfd9de;background:#fff;border-radius:9px;font:700 13px inherit;font-family:inherit;cursor:pointer;color:#333;line-height:1.15}
.seg button.on{border-color:var(--accent);background:#e3f2f5;color:#00596a}
.trs{font-size:13px;color:#667;min-height:18px}
#abox .af{padding:12px 18px;background:#f2f6f7;display:flex;justify-content:flex-end;gap:8px;align-items:center}
#abox .af button{height:42px;border:0;border-radius:8px;background:var(--accent);color:#fff;padding:0 22px;font:700 15px inherit;font-family:inherit;cursor:pointer}
#abox .af button.sec{background:#dfe7ea;color:#333}
.dr .del{height:36px;width:36px;border:1px solid #e0b4ad;background:#fff;color:#b33;border-radius:8px;cursor:pointer;font-size:16px}
.dr.ph{background:#f2f6f7;font-weight:800}.dr .cd{font-size:12px;color:#667;font-weight:700;min-width:40px}
.dr input{width:140px}
@media(max-width:600px){#abox .ab{grid-template-columns:1fr}.dr{flex-wrap:wrap}.dr input{width:calc(50% - 24px)}}
/* ===== plan (remaining works) ===== */
.plan .pgantt{position:absolute;top:136px;inset-inline-start:40px;width:var(--gw);border:1px solid var(--line);background:#fff}
.prow{display:flex;border-bottom:1px solid var(--line);position:relative}
.pinfo{flex:none;width:800px;display:flex;align-items:center;border-inline-end:2px solid #c3ced4;background:inherit;position:relative;z-index:3}
.pinfo>.c1{width:52px;text-align:center;display:flex;justify-content:center}.pinfo>.c2{width:360px;padding:0 10px;font-size:17px;line-height:1.2}.pinfo>.c3{width:100px;text-align:center;font-size:16px;font-weight:700;color:#444}.pinfo>.c4{width:64px;text-align:center;font-size:20px;font-weight:800}.pinfo>.c5,.pinfo>.c6{width:110px;text-align:center;font-size:17px;font-weight:700;color:var(--dark)}
.pch{position:relative;flex:none}
.phead .pinfo{background:var(--dark);color:#fff;height:94px}.phead .pinfo>b{font-size:15px;font-weight:700;line-height:1.15;color:#fff!important}.phead .pinfo .c2{text-align:start}

.pstat{position:absolute;top:-2px;bottom:0;width:0;border-inline-start:3px dashed #C8503F;z-index:5}.pstat b{position:absolute;top:2px;inset-inline-start:6px;background:#C8503F;color:#fff;font-size:12px;font-weight:800;padding:1px 8px;border-radius:10px;white-space:nowrap}

.pgantt.cp .ptask .c2{font-size:14.5px;line-height:1.1}.pgantt.cp .subrow .c2{font-size:14px}.pgantt.cp .pbadge{width:28px;height:28px;font-size:14px}.pgantt.cp .pbadge.sub{width:auto;height:22px;font-size:12px}.pgantt.cp .c4{font-size:17px}.pgantt.cp .c5,.pgantt.cp .c6,.pgantt.cp .c3{font-size:15px}
