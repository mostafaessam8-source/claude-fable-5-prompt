<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}</style>
<title>Lagoon B21 Interior</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: full-bleed 3D canvas, glass control panels pinned to the edges, room chips along the bottom. */
:root{
  --panel:rgba(249,246,240,.88);
  --fg:#2b2622;
  --muted:#7b7067;
  --accent:#a8743c;
  --accent-fg:#fff;
  --line:rgba(70,50,30,.16);
  --chip:rgba(255,255,255,.7);
  --display:'Reem Kufi','Cairo',system-ui,sans-serif;
  --body:'Cairo',system-ui,sans-serif;
  --bg:#d9e6ee;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --panel:rgba(28,25,22,.84);--fg:#f2ece3;--muted:#aaa095;--accent:#dba868;--accent-fg:#1c1814;--line:rgba(255,240,220,.16);--chip:rgba(60,54,48,.72);--bg:#0b1220;color-scheme:dark}}
:root[data-theme="dark"]{
  --panel:rgba(28,25,22,.84);--fg:#f2ece3;--muted:#aaa095;--accent:#dba868;--accent-fg:#1c1814;--line:rgba(255,240,220,.16);--chip:rgba(60,54,48,.72);--bg:#0b1220;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:absolute;inset:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px}
#brand{position:absolute;top:max(12px,env(safe-area-inset-top,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));padding:10px 16px 12px;max-width:min(330px,calc(100% - 32px));pointer-events:none}
#brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#brand h1{margin:2px 0 2px;font:700 22px/1.25 var(--display);text-wrap:balance}
#brand p{margin:0;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
#modes{position:absolute;top:max(12px,env(safe-area-inset-top,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px));display:flex;gap:4px;padding:4px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 32px)}
button{font-family:var(--body);color:var(--fg)}
.seg{border:0;background:transparent;padding:7px 13px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg:focus-visible,.chip:focus-visible,#gear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#gear{position:absolute;top:calc(max(12px,env(safe-area-inset-top,0px)) + 52px);inset-inline-end:max(16px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:18px;display:grid;place-items:center}
#panel{position:absolute;top:calc(max(12px,env(safe-area-inset-top,0px)) + 100px);inset-inline-end:max(16px,env(safe-area-inset-right,0px));width:min(270px,calc(100% - 32px));padding:14px 16px;display:grid;gap:12px;font-size:13px}
#panel h2{margin:0;font:700 14px var(--display);letter-spacing:.02em}
#panel label{display:flex;align-items:center;justify-content:space-between;gap:10px}
#panel .row{display:grid;gap:6px}
#panel output{font-variant-numeric:tabular-nums;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.themes{display:flex;gap:4px;flex-wrap:wrap}
.themes .seg{border:1px solid var(--line);padding:5px 10px;font-size:12px}
#rooms{position:absolute;bottom:max(12px,env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;gap:6px;padding:0 max(16px,env(safe-area-inset-left,0px));overflow-x:auto;scrollbar-width:none;justify-content:safe center}
#rooms::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip small{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums;margin-inline-start:6px}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.chip.on small{color:inherit;opacity:.8}
#mini{position:absolute;bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 52px);inset-inline-start:max(16px,env(safe-area-inset-left,0px));width:190px;height:142px;border-radius:12px}
#hint{position:absolute;bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 52px);left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;font-size:12px;color:var(--muted);white-space:nowrap;pointer-events:none;transition:opacity .6s}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none}
#joy{position:absolute;bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 26px);left:max(24px,env(safe-area-inset-left,0px));width:136px;height:136px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);touch-action:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.2)}
#fsBtn{position:absolute;top:calc(max(12px,env(safe-area-inset-top,0px)) + 52px);inset-inline-end:calc(max(16px,env(safe-area-inset-right,0px)) + 48px + 92px);height:40px;padding:0 14px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:600}
#placesBtn{position:absolute;top:calc(max(12px,env(safe-area-inset-top,0px)) + 52px);inset-inline-end:calc(max(16px,env(safe-area-inset-right,0px)) + 48px);height:40px;padding:0 14px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;display:none}
#act{position:absolute;bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 26px);right:max(20px,env(safe-area-inset-right,0px));display:none;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:flex-end;width:210px;touch-action:none}
.ab{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:11px;font-weight:700;line-height:1.15;padding:0;touch-action:none;cursor:pointer}
.ab.big{width:88px;height:88px;font-size:14px;background:var(--accent);color:var(--accent-fg)}
.ab.on{background:var(--accent);color:var(--accent-fg)}
#uw{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at 50% 40%,rgba(30,160,185,.25),rgba(8,70,100,.6))}
@media (pointer:coarse){#mini{display:none}#joy{display:block}#act{display:flex}#hint{display:block}#placesBtn{display:block}#rooms{display:none;flex-wrap:wrap;justify-content:center;bottom:auto;top:calc(max(12px,env(safe-area-inset-top,0px)) + 100px);padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--panel);margin:0 12px;border-radius:14px;backdrop-filter:blur(14px)}#rooms.show{display:flex}#hint{bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 4px);font-size:11px}}
body:not(.walk) #joy,body:not(.walk) #act{display:none}
#loader{position:absolute;inset:0;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity .7s;z-index:20;font:700 20px var(--display)}
#loader span{display:block;font:400 13px var(--body);color:var(--muted);margin-top:6px}
#loader.done{opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
@media (max-width:640px){#mini{display:none}#brand h1{font-size:18px}#hint{white-space:normal;width:max-content;max-width:calc(100% - 32px);text-align:center}}
@media (prefers-reduced-motion:reduce){#loader,#hint,#fade{transition:none}}
</style>

</head>
<body>
<div id="app" dir="rtl">
  <canvas id="c" aria-label="جولة ثلاثية الأبعاد داخل الشقة"></canvas>
  <div id="cross"></div>
  <header id="brand" class="glass">
    <small>Mountain View · Lagoon Beach Park</small>
    <h1>الوحدة B21</h1>
    <p>I Villa – Beach Edition B · الدور الثاني · 165 م²</p>
  </header>
  <nav id="modes" class="glass" aria-label="وضع العرض">
    <button class="seg" data-mode="walk" aria-pressed="true">العب / تجول</button>
    <button class="seg" data-mode="dollhouse" aria-pressed="false">مجسم علوي</button>
    <button class="seg" data-mode="plan" aria-pressed="false">مسقط أفقي</button>
    <button class="seg" data-mode="compound" aria-pressed="false">الكمبوند</button>
  </nav>
  <button id="fsBtn" class="glass" aria-label="ملء الشاشة">ملء الشاشة</button>
  <button id="placesBtn" class="glass" aria-label="الأماكن">الأماكن</button>
  <button id="gear" class="glass" aria-label="الإعدادات" aria-expanded="true">⚙</button>
  <aside id="panel" class="glass">
    <h2>الإعدادات</h2>
    <div class="row"><label for="time">وقت اليوم <output id="timeOut">16:30</output></label>
      <input type="range" id="time" min="0" max="24" step="0.25" value="16.5"></div>
    <label for="lightsOn">إضاءة الغرف <input type="checkbox" id="lightsOn" checked></label>
    <label for="ceilOn">إظهار الأسقف <input type="checkbox" id="ceilOn" checked></label>
    <label for="labelsOn">أسماء الغرف <input type="checkbox" id="labelsOn" checked></label>
    <label for="hqOn">جودة عالية (ظلال وإضاءة واقعية) <input type="checkbox" id="hqOn"></label>
    <label for="tppOn">منظور الشخص الثالث (V) <input type="checkbox" id="tppOn"></label>
    <div class="row"><span>ستايل التصميم</span>
      <div class="themes" id="themes">
        <button class="seg" data-theme="warm" aria-pressed="true">دافئ مودرن</button>
        <button class="seg" data-theme="light" aria-pressed="false">سكاندي فاتح</button>
        <button class="seg" data-theme="dark" aria-pressed="false">داكن فاخر</button>
      </div></div>
  </aside>
  <canvas id="mini" class="glass" width="380" height="284"></canvas>
  <div id="hint" class="glass">انقر للتحكم بالماوس · W A S D حركة · Space قفز · Shift ركض · C انحناء / غطس · V منظور ثالث</div>
  <nav id="rooms" aria-label="الغرف"></nav>
  <div id="uw"></div>
  <div id="joy"><div id="knob"></div></div>
  <div id="act">
    <button id="bView" class="ab" aria-label="تبديل المنظور">منظور</button>
    <button id="bDown" class="ab" aria-label="انحناء أو غطس">انحناء / غطس</button>
    <button id="bRun" class="ab" aria-label="ركض">ركض</button>
    <button id="bJump" class="ab big" aria-label="قفز أو سباحة لأعلى">قفز</button>
  </div>
  <div id="fade"></div>
  <div id="loader"><div>جاري بناء الشقة…<span>Lagoon Beach Park · B21</span><span id="lerr"></span></div></div>
</div>

<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

    avatar.legL.rotation.x=air?.5:sw;avatar.legR.rotation.x=air?-.4:-sw;avatar.armL.rotation.x=air?-2.4:-sw*.8;avatar.armR.rotation.x=air?-2.4:sw*.8;
    if(P.swim){const st=Math.sin(tm*5)*.6;avatar.armL.rotation.x=st-1.2;avatar.armR.rotation.x=-st-1.2;avatar.legL.rotation.x=Math.sin(tm*9)*.4;avatar.legR.rotation.x=-Math.sin(tm*9)*.4}
    avatar.g.scale.y=1-P.crouch*.22}
}

/* ───────────────────────── places & modes ───────────────────────── */
const $=id=>document.getElementById(id);
const SPOTS={
  reception:[-3.9,6.5,-.2,3.6,'الصالون',0],dining:[-.7,2.0,-3.5,6.4,'السفرة',0],entrance:[-1.2,-.9,-1.6,5.5,'المدخل',0],corridor:[.4,.6,7.6,.6,'الممر',0],
  kitchen:[2.0,-1.25,5.5,-1.3,'المطبخ',0],gtoilet:[.8,-.3,.8,-2.5,'حمام الضيوف',0],bathroom:[6.6,-.4,7.4,-2.4,'الحمام',0],
  bed1:[3.4,1.9,.2,3.3,'الليفنج',0],bed2:[4.5,1.9,7.8,3.5,'غرفة 2',0],mbed:[11.3,3.3,7.8,2.2,'الماستر',0],dressing:[9.8,-.3,9.8,-2.5,'الدريسينج',0],mbath:[10.1,-2.8,9.7,-5.1,'حمام الماستر',0],
  terrace:[3.9,5.95,38,24,'التراس',0],
  outside:[-1.45,-14.5,3.8,5,'برا العمارة',GY],street:[3.8,31,3.8,-10,'الشارع',GY],beach:[26,24,40,40,'الشاطئ',GY],swim:[40,38,60,26,'اسبح في اللاجون',GY]};
{const rib=waters.filter(w=>w.t==='r')[4],s0=rib.s[10],s1=rib.s[40];let dx=3.8-s0[0],dz=8-s0[1];const L=Math.hypot(dx,dz);dx/=L;dz/=L;
  let bxp=s0[0],bzp=s0[1];for(let k=0;k<40&&inWater(bxp,bzp,1);k++){bxp+=dx*1.5;bzp+=dz*1.5}
  SPOTS.beach=[bxp,bzp,s1[0],s1[1],'الشاطئ',GY];SPOTS.swim=[s0[0],s0[1],s1[0],s1[1],'اسبح في اللاجون',GY]}
const yawTo=(px,pz,tx,tz)=>Math.atan2(-(tx-px),-(tz-pz));
const roomsNav=$('rooms');
for(const k in SPOTS){const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=SPOTS[k][4];
  if(R[k]){const s=document.createElement('small');s.textContent=R[k].a.toFixed(1);b.append(s)}b.onclick=()=>{goRoom(k);roomsNav.classList.remove('show')};roomsNav.append(b)}
const fadeEl=$('fade');
function goRoom(k){const s=SPOTS[k];if(!s)return;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.k===k));
  P.x=s[0];P.z=s[1];P.y=s[5];P.vy=0;P.grounded=true;P.swim=false;P.dive=0;P.yaw=yawTo(s[0],s[1],s[2],s[3]);P.pitch=k==='terrace'||s[5]<-1?.03:-.03;
  if(mode!=='walk')setMode('walk');fadeEl.style.opacity=.55;setTimeout(()=>fadeEl.style.opacity=0,130)}
function flyTo(pos,target,dur=1){tween={t:0,dur,p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:target}}
const VIEWS={dollhouse:[[3.8,26,20],[3.8,0,.5]],plan:[[3.8,34,1.4],[3.8,0,1.2]],compound:[[75,70,95],[2,-4,-8]]};
const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.08;controls.enabled=false;
function setFov(f){camera.fov=f;camera.updateProjectionMatrix()}
function setMode(m){const prev=mode;mode=m;
  document.querySelectorAll('#modes .seg').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));
  const walk=m==='walk';controls.enabled=false;controls.enableRotate=m!=='plan';
  if(m==='dollhouse'){controls.minDistance=6;controls.maxDistance=70;controls.maxPolarAngle=1.48}
  if(m==='plan'){controls.minDistance=8;controls.maxDistance=60;controls.maxPolarAngle=.2}
  if(m==='compound'){controls.minDistance=25;controls.maxDistance=900;controls.maxPolarAngle=1.5}
  $('cross').style.display=walk&&!tpp?'block':'none';
  document.body.classList.toggle('walk',walk);
  if(!walk){setUnder(false);avatar.g.visible=false;if(document.pointerLockElement)document.exitPointerLock?.();
    if(prev==='walk'){camera.getWorldDirection(fwdV);controls.target.copy(camera.position).addScaledVector(fwdV,4)}
    const v=VIEWS[m];flyTo(new THREE.Vector3(...v[0]),new THREE.Vector3(...v[1]),1.4);document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));setFov(55)}
  else{tween=null;setFov(80)}
  updateVis();followSun()}
function updateVis(){{const dh0=mode==='dollhouse'||mode==='plan';bldgs.forEach(b=>{if(b!==ours&&b.g)b.g.visible=!(dh0&&Math.hypot(b.cx-3.8,b.cz-1.1)<48)});if(window.__panels)window.__panels.visible=!dh0}
  camera.near=mode==='walk'?(P.y>-1.5?.05:.3):1;camera.updateProjectionMatrix();const dh=mode==='dollhouse'||mode==='plan';shellK=dh?.42:1;
  ceilG.visible=mode==='walk'&&S.ceil;labelsG.visible=dh&&S.labels;upper.visible=!dh;markerG.visible=mode==='compound';
  $('mini').style.visibility=mode==='compound'?'hidden':'visible'}
document.querySelectorAll('#modes .seg').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

/* ───────────────────────── input: keyboard, mouse, touch ───────────────────────── */
let btnDown=false,btnJump=false;
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=true;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
  if(e.code==='KeyV'&&mode==='walk')toggleTpp();if(e.code==='KeyF')toggleFs();});
addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
function toggleTpp(v=!tpp){tpp=v;$('tppOn').checked=tpp;$('bView').classList.toggle('on',tpp);$('cross').style.display=mode==='walk'&&!tpp?'block':'none'}
$('tppOn').onchange=e=>toggleTpp(e.target.checked);
let drag=null;
canvas.addEventListener('pointerdown',e=>{if(mode!=='walk')return;if(drag)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:0};try{canvas.setPointerCapture(e.pointerId)}catch{}});
canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id||document.pointerLockElement===canvas)return;const k=e.pointerType==='touch'?.0055:.0035;
  P.yaw-=(e.clientX-drag.x)*k;P.pitch=clamp(P.pitch-(e.clientY-drag.y)*k,-1.25,1.25);drag.moved+=Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY});
const dragEnd=e=>{if(drag&&e.pointerId===drag.id){drag=null}};canvas.addEventListener('pointerup',dragEnd);canvas.addEventListener('pointercancel',dragEnd);
canvas.addEventListener('click',()=>{if(mode==='walk'&&!isTouch&&document.pointerLockElement!==canvas){try{const r=canvas.requestPointerLock();r&&r.catch&&r.catch(()=>{})}catch{}}});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas&&mode==='walk'){P.yaw-=e.movementX*.0022;P.pitch=clamp(P.pitch-e.movementY*.0022,-1.25,1.25)}});
canvas.addEventListener('wheel',e=>{if(mode!=='walk')return;if(tpp)tpDist=clamp(tpDist+e.deltaY*.004,1.6,7);else setFov(clamp(camera.fov+e.deltaY*.03,45,95));e.preventDefault()},{passive:false});
/* joystick (left) + action buttons (right) */
const joyEl=$('joy'),knob=$('knob');let jid=null;
const jset=e=>{const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(e.clientX-cx)/(r.width/2),dy=(e.clientY-cy)/(r.height/2);const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}joy.x=dx;joy.y=dy;knob.style.transform=`translate(${dx*42}px,${dy*42}px)`};
joyEl.addEventListener('pointerdown',e=>{jid=e.pointerId;joyEl.setPointerCapture(jid);jset(e)});joyEl.addEventListener('pointermove',e=>{if(e.pointerId===jid)jset(e)});
const jend=e=>{if(e.pointerId===jid){jid=null;joy.x=joy.y=0;knob.style.transform=''}};joyEl.addEventListener('pointerup',jend);joyEl.addEventListener('pointercancel',jend);
const hold=(id,on,off)=>{const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add('on');on()});
  const up=()=>{el.classList.remove('on');off()};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)};
hold('bJump',()=>btnJump=true,()=>btnJump=false);hold('bDown',()=>btnDown=true,()=>btnDown=false);
$('bRun').addEventListener('click',()=>{runLatch=!runLatch;$('bRun').classList.toggle('on',runLatch)});
$('bView').addEventListener('click',()=>toggleTpp());
/* panel */
$('time').oninput=e=>{S.time=+e.target.value;applyTime()};$('lightsOn').onchange=e=>{S.lights=e.target.checked;applyTime()};
$('hqOn').checked=HQ.on;$('hqOn').onchange=e=>{HQ.on=e.target.checked;dayLights.forEach(o=>o.l.visible=HQ.on)};dayLights.forEach(o=>o.l.visible=HQ.on);
$('ceilOn').onchange=e=>{S.ceil=e.target.checked;updateVis()};$('labelsOn').onchange=e=>{S.labels=e.target.checked;updateVis()};
document.querySelectorAll('#themes .seg').forEach(b=>b.onclick=()=>applyTheme(b.dataset.theme));
$('gear').onclick=()=>{const p=$('panel');p.hidden=!p.hidden;$('gear').setAttribute('aria-expanded',!p.hidden)};
const fsEl=document.documentElement;
function toggleFs(){try{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const r=(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen).call(fsEl);r&&r.catch&&r.catch(()=>{})}}catch{}}
if(!(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen))$('fsBtn').hidden=true;
$('fsBtn').onclick=toggleFs;
const fsLabel=()=>{$('fsBtn').textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'خروج':'ملء الشاشة'};
document.addEventListener('fullscreenchange',fsLabel);document.addEventListener('webkitfullscreenchange',fsLabel);
$('placesBtn').onclick=()=>roomsNav.classList.toggle('show');
$('panel').hidden=true;$('gear').setAttribute('aria-expanded','false');
if(isTouch){$('hint').textContent='العصا لليسار للحركة · اسحب يمين الشاشة للنظر · الأزرار للقفز والركض والغطس'}

/* ───────────────────────── minimap (apartment / compound) ───────────────────────── */
const mini=$('mini'),mc=mini.getContext('2d'),MB={x0:-4.9,x1:12.5,z0:-5.4,z1:7.6};
function cone(px,pz,ang,len){mc.fillStyle='rgba(229,83,61,.3)';mc.beginPath();mc.moveTo(px,pz);mc.arc(px,pz,len,ang-.6,ang+.6);mc.closePath();mc.fill();mc.fillStyle='#e5533d';mc.beginPath();mc.arc(px,pz,7,0,7);mc.fill()}
function drawMini(){const w=mini.width,h=mini.height;mc.clearRect(0,0,w,h);
  const ang=Math.atan2(-Math.cos(P.yaw),-Math.sin(P.yaw));
  if(mode==='walk'&&P.y<-1.5){const s=w/230,X=x=>w/2+(x-P.x)*s,Z=z=>h/2+(z-P.z)*s;
    mc.fillStyle='rgba(95,150,80,.55)';mc.fillRect(0,0,w,h);
    mc.strokeStyle='rgba(90,94,98,.9)';mc.lineCap='round';roadPts.forEach(r=>{mc.lineWidth=Math.max(2,(r.w-5)*s);mc.beginPath();mc.moveTo(X(r.p.x),Z(r.p.z));mc.lineTo(X(r.p.x)+.1,Z(r.p.z));mc.stroke()});
    mc.fillStyle='rgba(53,196,208,.9)';waters.forEach(wt=>{if(wt.t==='r')wt.s.forEach(p=>{mc.beginPath();mc.arc(X(p[0]),Z(p[1]),p[2]*s,0,7);mc.fill()});
      else{mc.beginPath();mc.ellipse(X(wt.cx),Z(wt.cz),wt.rx*s,wt.rz*s,0,0,7);mc.fill()}});
    bldgs.forEach(b=>{mc.save();mc.translate(X(b.cx),Z(b.cz));mc.rotate(-b.rot);mc.fillStyle=b===ours?'#ff9a55':'rgba(236,226,206,.95)';mc.fillRect(-b.hw*s,-b.hd*s,b.hw*2*s,b.hd*2*s);mc.restore()});
    cone(w/2,h/2,ang,46);return}
  const s=Math.min((w-24)/(MB.x1-MB.x0),(h-24)/(MB.z1-MB.z0)),ox=(w-s*(MB.x1-MB.x0))/2,oz=(h-s*(MB.z1-MB.z0))/2,X=x=>ox+(x-MB.x0)*s,Z=z=>oz+(z-MB.z0)*s;
  for(const k in R){const r=R[k];mc.fillStyle=k==='terrace'?'rgba(120,150,110,.35)':'rgba(168,116,60,.22)';mc.strokeStyle='rgba(168,116,60,.95)';mc.lineWidth=2;
    mc.fillRect(X(r.x[0]),Z(r.z[0]),(r.x[1]-r.x[0])*s,(r.z[1]-r.z[0])*s);mc.strokeRect(X(r.x[0]),Z(r.z[0]),(r.x[1]-r.x[0])*s,(r.z[1]-r.z[0])*s)}
  mc.fillStyle='rgba(168,116,60,.5)';mc.fillRect(X(-2.45),Z(-3.4),(2.05)*s,(2.0)*s);
  if(mode==='walk')cone(X(P.x),Z(P.z),ang,44);else{mc.fillStyle='#e5533d';mc.beginPath();mc.arc(X(controls.target.x),Z(controls.target.z),6,0,7);mc.fill()}}

/* ───────────────────────── loop ───────────────────────── */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(HQ.composer){HQ.composer.setSize(w,h);HQ.gtao.setSize(w,h)}}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();let fn=0;
function frame(){const dt=Math.min(clock.getDelta(),.05),tm=clock.elapsedTime;
  shell.scale.y+=(shellK-shell.scale.y)*Math.min(1,dt*6);
  if(tween){tween.t+=dt;const k=Math.min(1,tween.t/tween.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);camera.lookAt(controls.target);
    if(k>=1){tween=null;if(mode!=='walk')controls.enabled=true}}
  else if(mode==='walk')updatePlayer(dt,tm);
  else controls.update();
  if(mode==='walk'&&tween)tween=null;
  if(fn%4===0)followSun();
  if(window.__swing)window.__swing.rotation.z=Math.sin(tm*1.1)*.07;const pulse=.55+.45*Math.sin(tm*3);if(window.__marker)window.__marker.material.opacity=.15+.3*pulse;
  if(HQ.on&&!under){if(!HQ.composer)buildComposer();HQ.composer.render(dt)}else renderer.render(scene,camera);
  waterM.bumpMap.offset.x+=dt*.004;waterM.bumpMap.offset.y+=dt*.003;
  if(++fn%3===0)drawMini();
  requestAnimationFrame(frame)}

buildLabels();applyTheme('warm');applyTime();updateVis();
document.fonts?.ready.then(()=>{labelsG.clear();buildLabels()}).catch(()=>{});
goRoom('reception');setMode('walk');frame();
requestAnimationFrame(()=>requestAnimationFrame(()=>{$('loader').classList.add('done');window.__ready=true}));
setTimeout(()=>{$('hint').style.opacity=0},16000);
window.__api={OPEN,furn,shell,THREE,colliders,hit,dbg:()=>({doorK,frontCol:frontCol&&[frontCol.z0,frontCol.z1,frontCol.on],leaf:!!frontLeaf}),scene,step:(n,dt=.05)=>{for(let i=0;i<n;i++)updatePlayer(dt,i*dt)},finishTween:()=>{if(tween)tween.t=tween.dur},setMode,goRoom,setTime:t=>{S.time=t;$('time').value=t;applyTime()},P,camera,controls,applyTheme,S,toggleTpp,keys};
