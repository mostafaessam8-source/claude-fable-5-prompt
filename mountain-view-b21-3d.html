<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}</style>
<title>Lagoon B21 Interior</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: full-bleed 3D canvas, glass control panels pinned to the edges, room chips along the bottom. */
:root{
  --panel:rgba(249,246,240,.88);
  --fg:#2b2622;
  --muted:#7b7067;
  --accent:#a8743c;
  --accent-fg:#fff;
  --line:rgba(70,50,30,.16);
  --chip:rgba(255,255,255,.7);
  --display:'Reem Kufi','Cairo',system-ui,sans-serif;
  --body:'Cairo',system-ui,sans-serif;
  --bg:#d9e6ee;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --panel:rgba(28,25,22,.84);--fg:#f2ece3;--muted:#aaa095;--accent:#dba868;--accent-fg:#1c1814;--line:rgba(255,240,220,.16);--chip:rgba(60,54,48,.72);--bg:#0b1220;color-scheme:dark}}
:root[data-theme="dark"]{
  --panel:rgba(28,25,22,.84);--fg:#f2ece3;--muted:#aaa095;--accent:#dba868;--accent-fg:#1c1814;--line:rgba(255,240,220,.16);--chip:rgba(60,54,48,.72);--bg:#0b1220;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:absolute;inset:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px}
#brand{position:absolute;top:max(12px,env(safe-area-inset-top,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));padding:10px 16px 12px;max-width:min(330px,calc(100% - 32px));pointer-events:none}
#brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#brand h1{margin:2px 0 2px;font:700 22px/1.25 var(--display);text-wrap:balance}
#brand p{margin:0;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
#modes{position:absolute;top:max(12px,env(safe-area-inset-top,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px));display:flex;gap:4px;padding:4px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 32px)}
button{font-family:var(--body);color:var(--fg)}
.seg{border:0;background:transparent;padding:7px 13px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg:focus-visible,.chip:focus-visible,#gear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#gear{position:absolute;top:calc(max(12px,env(safe-area-inset-top,0px)) + 52px);inset-inline-end:max(16px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:18px;display:grid;place-items:center}
#panel{position:absolute;top:calc(max(12px,env(safe-area-inset-top,0px)) + 100px);inset-inline-end:max(16px,env(safe-area-inset-right,0px));width:min(270px,calc(100% - 32px));padding:14px 16px;display:grid;gap:12px;font-size:13px}
#panel h2{margin:0;font:700 14px var(--display);letter-spacing:.02em}
#panel label{display:flex;align-items:center;justify-content:space-between;gap:10px}
#panel .row{display:grid;gap:6px}
#panel output{font-variant-numeric:tabular-nums;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.themes{display:flex;gap:4px;flex-wrap:wrap}
.themes .seg{border:1px solid var(--line);padding:5px 10px;font-size:12px}
#rooms{position:absolute;bottom:max(12px,env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;gap:6px;padding:0 max(16px,env(safe-area-inset-left,0px));overflow-x:auto;scrollbar-width:none;justify-content:safe center}
#rooms::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip small{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums;margin-inline-start:6px}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.chip.on small{color:inherit;opacity:.8}
#mini{position:absolute;bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 52px);inset-inline-start:max(16px,env(safe-area-inset-left,0px));width:190px;height:142px;border-radius:12px}
#hint{position:absolute;bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 52px);left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;font-size:12px;color:var(--muted);white-space:nowrap;pointer-events:none;transition:opacity .6s}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none}
#joy{position:absolute;bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 26px);left:max(24px,env(safe-area-inset-left,0px));width:136px;height:136px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);touch-action:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.2)}
#fsBtn{position:absolute;top:calc(max(12px,env(safe-area-inset-top,0px)) + 52px);inset-inline-end:calc(max(16px,env(safe-area-inset-right,0px)) + 48px + 92px);height:40px;padding:0 14px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:600}
#placesBtn{position:absolute;top:calc(max(12px,env(safe-area-inset-top,0px)) + 52px);inset-inline-end:calc(max(16px,env(safe-area-inset-right,0px)) + 48px);height:40px;padding:0 14px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;display:none}
#act{position:absolute;bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 26px);right:max(20px,env(safe-area-inset-right,0px));display:none;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:flex-end;width:210px;touch-action:none}
.ab{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:11px;font-weight:700;line-height:1.15;padding:0;touch-action:none;cursor:pointer}
.ab.big{width:88px;height:88px;font-size:14px;background:var(--accent);color:var(--accent-fg)}
.ab.on{background:var(--accent);color:var(--accent-fg)}
#uw{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at 50% 40%,rgba(30,160,185,.25),rgba(8,70,100,.6))}
@media (pointer:coarse){#mini{display:none}#joy{display:block}#act{display:flex}#hint{display:block}#placesBtn{display:block}#rooms{display:none;flex-wrap:wrap;justify-content:center;bottom:auto;top:calc(max(12px,env(safe-area-inset-top,0px)) + 100px);padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--panel);margin:0 12px;border-radius:14px;backdrop-filter:blur(14px)}#rooms.show{display:flex}#hint{bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 4px);font-size:11px}}
body:not(.walk) #joy,body:not(.walk) #act{display:none}
#loader{position:absolute;inset:0;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity .7s;z-index:20;font:700 20px var(--display)}
#loader span{display:block;font:400 13px var(--body);color:var(--muted);margin-top:6px}
#loader.done{opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
@media (max-width:640px){#mini{display:none}#brand h1{font-size:18px}#hint{white-space:normal;width:max-content;max-width:calc(100% - 32px);text-align:center}}
@media (prefers-reduced-motion:reduce){#loader,#hint,#fade{transition:none}}
</style>

</head>
<body>
<div id="app" dir="rtl">
  <canvas id="c" aria-label="جولة ثلاثية الأبعاد داخل الشقة"></canvas>
  <div id="cross"></div>
  <header id="brand" class="glass">
    <small>Mountain View · Lagoon Beach Park</small>
    <h1>الوحدة B21</h1>
    <p>I Villa – Beach Edition B · الدور الثاني · 165 م²</p>
  </header>
  <nav id="modes" class="glass" aria-label="وضع العرض">
    <button class="seg" data-mode="walk" aria-pressed="true">العب / تجول</button>
    <button class="seg" data-mode="dollhouse" aria-pressed="false">مجسم علوي</button>
    <button class="seg" data-mode="plan" aria-pressed="false">مسقط أفقي</button>
    <button class="seg" data-mode="compound" aria-pressed="false">الكمبوند</button>
  </nav>
  <button id="fsBtn" class="glass" aria-label="ملء الشاشة">ملء الشاشة</button>
  <button id="placesBtn" class="glass" aria-label="الأماكن">الأماكن</button>
  <button id="gear" class="glass" aria-label="الإعدادات" aria-expanded="true">⚙</button>
  <aside id="panel" class="glass">
    <h2>الإعدادات</h2>
    <div class="row"><label for="time">وقت اليوم <output id="timeOut">16:30</output></label>
      <input type="range" id="time" min="0" max="24" step="0.25" value="16.5"></div>
    <label for="lightsOn">إضاءة الغرف <input type="checkbox" id="lightsOn" checked></label>
    <label for="ceilOn">إظهار الأسقف <input type="checkbox" id="ceilOn" checked></label>
    <label for="labelsOn">أسماء الغرف <input type="checkbox" id="labelsOn" checked></label>
    <label for="hqOn">جودة عالية (ظلال وإضاءة واقعية) <input type="checkbox" id="hqOn"></label>
    <label for="tppOn">منظور الشخص الثالث (V) <input type="checkbox" id="tppOn"></label>
    <div class="row"><span>ستايل التصميم</span>
      <div class="themes" id="themes">
        <button class="seg" data-theme="warm" aria-pressed="true">دافئ مودرن</button>
        <button class="seg" data-theme="light" aria-pressed="false">سكاندي فاتح</button>
        <button class="seg" data-theme="dark" aria-pressed="false">داكن فاخر</button>
      </div></div>
  </aside>
  <canvas id="mini" class="glass" width="380" height="284"></canvas>
  <div id="hint" class="glass">انقر للتحكم بالماوس · W A S D حركة · Space قفز · Shift ركض · C انحناء / غطس · V منظور ثالث</div>
  <nav id="rooms" aria-label="الغرف"></nav>
  <div id="uw"></div>
  <div id="joy"><div id="knob"></div></div>
  <div id="act">
    <button id="bView" class="ab" aria-label="تبديل المنظور">منظور</button>
    <button id="bDown" class="ab" aria-label="انحناء أو غطس">انحناء / غطس</button>
    <button id="bRun" class="ab" aria-label="ركض">ركض</button>
    <button id="bJump" class="ab big" aria-label="قفز أو سباحة لأعلى">قفز</button>
  </div>
  <div id="fade"></div>
  <div id="loader"><div>جاري بناء الشقة…<span>Lagoon Beach Park · B21</span><span id="lerr"></span></div></div>
</div>

<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

  else{P.swim=false;P.dive=0;const g=ground(P.x,P.z,P.y);
    if(jump&&P.grounded&&!jumpHeld){P.vy=5.0;P.grounded=false}jumpHeld=jump;

{const rib=waters.filter(w=>w.t==='r')[4],s0=rib.s[10],s1=rib.s[40];let dx=3.8-s0[0],dz=8-s0[1];const L=Math.hypot(dx,dz);dx/=L;dz/=L;

/* ───────────────────────── input: keyboard, mouse, touch ───────────────────────── */

/* ───────────────────────── loop ───────────────────────── */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(HQ.composer){HQ.composer.setSize(w,h);HQ.gtao.setSize(w,h)}}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();let fn=0;
function frame(){const dt=Math.min(clock.getDelta(),.05),tm=clock.elapsedTime;
  shell.scale.y+=(shellK-shell.scale.y)*Math.min(1,dt*6);
  if(tween){tween.t+=dt;const k=Math.min(1,tween.t/tween.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

buildLabels();applyTheme('warm');applyTime();updateVis();
document.fonts?.ready.then(()=>{labelsG.clear();buildLabels()}).catch(()=>{});

requestAnimationFrame(()=>requestAnimationFrame(()=>{$('loader').classList.add('done');window.__ready=true}));
setTimeout(()=>{$('hint').style.opacity=0},16000);
