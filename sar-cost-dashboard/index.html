<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NSR Cost Control Dashboard | SAR</title>
  <meta name="description" content="PD-NSR 2026 cost control, KPI and weekly progress dashboard — Saudi Arabia Railways">
  <link rel="icon" type="image/png" href="assets/img/sar-logo.png">
  <script>window.SAR_VERSION = "202610020431";</script>
  <link rel="stylesheet" href="assets/css/styles.css?v=202610020431">
</head>
<body>
  <header class="app-header">
    <button class="menu-toggle" id="menuToggle" aria-label="Open navigation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="brand">
      <img class="logo" src="assets/img/sar-logo.png" alt="SAR — Saudi Arabia Railways">
      <span class="divider"></span>
      <div class="title">
        <h1>PD-NSR 2026 Cost Control Dashboard</h1>
        <p>KPI · Cost · Weekly Progress · Issues</p>
      </div>
    </div>
    <div class="header-spacer"></div>
    <div class="header-meta">
      <span class="chip" id="dataStamp">Data: —</span>
      <span class="chip blue" id="reportChip">Report Date <strong>—</strong></span>
      <button class="icon-btn ghost js-editor" id="publishBtn" type="button" title="Publish this week's report as a shareable file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v7h16v-7M12 3v12m0-12l-4 4m4-4l4 4"/></svg>
        <span>Publish</span>
      </button>
      <button class="icon-btn ghost js-editor" id="pptBtn" type="button" title="Export this week's report as a PowerPoint in the PD weekly template format">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H4zM8 20h8M12 16v4M8 12V9m4 3V7m4 5v-2"/></svg>
        <span>Export Weekly PPT</span>
      </button>
      <a class="icon-btn js-editor" href="#/import" title="Import Excel files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>
        <span>Import Excel</span>
      </a>
    </div>
  </header>

  <div class="layout">
    <nav class="sidenav" id="sidenav" aria-label="Dashboard pages"></nav>
    <div class="nav-backdrop" id="navBackdrop"></div>
    <main class="content" id="view" tabindex="-1"></main>
  </div>

  <!-- Libraries are vendored locally so the site works on internal networks and from file:// -->
  <script src="assets/vendor/xlsx.full.min.js?v=202610020431"></script>
  <script src="assets/vendor/jszip.min.js?v=202610020431"></script>
  <script src="assets/vendor/chart.umd.min.js?v=202610020431"></script>
  <script src="assets/vendor/chartjs-plugin-datalabels.min.js?v=202610020431"></script>
  <!-- Baseline data built from the Excel files (optional — generated by tools/build-default-data.js) -->
  <script src="data/default-data.js?v=202610020431" onerror="window.SAR_DEFAULT_DATA = null"></script>
  <script src="assets/js/importer.js?v=202610020431"></script>
  <script src="assets/js/store.js?v=202610020431"></script>
  <script src="assets/js/cloud.js?v=202610020431"></script>
  <script src="assets/js/ui.js?v=202610020431"></script>
  <script src="assets/js/pages.js?v=202610020431"></script>
  <script src="assets/js/print.js?v=202610020431"></script>
  <script src="assets/js/publish.js?v=202610020431"></script>
  <!-- Weekly PowerPoint export (template kept in the browser; optional local copy in data/ppt-template.js) -->
  <script src="data/ppt-template.js?v=202610020431" onerror="window.SAR_PPT_TEMPLATE = null"></script>
  <script src="assets/js/pptx-engine.js?v=202610020431"></script>
  <script src="assets/js/pptx-weekly.js?v=202610020431"></script>
  <script src="assets/js/pptx-ui.js?v=202610020431"></script>
  <script src="assets/js/app.js?v=202610020431"></script>
</body>
</html>
