<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عرض مستجدات مشروع محطة قطار الزلفي – Management Update</title>
<meta name="description" content="عرض مستجدات مشروع محطة قطار الزلفي – عرض تفاعلي بالعربية والإنجليزية (SAR template).">
<style>
/* Zulfi Railway Station – management presentation */
:root {
  --brand: #00778b; --brand-d: #005566; --brand-l: #e0f2f5; --brand-xl: #f1f9fa;
  --ink: #232e36; --ink2: #566672; --mute: #8a97a3; --line: #dce4e9; --soft: #f4f7f9; --paper: #fff; --bg: #dfe6ea;
  --good: #0a8a4a; --warn: #b87800; --bad: #d63b3b; --accent: #3d3935;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --gen: #8b95a1; --eng: #2a78d6; --proc: #eb6834; --cons: #1baf7a;
  --ph1: #00778b; --ph2: #6250d6;
  --shadow: 0 1px 2px rgba(20, 40, 55, .06), 0 4px 14px rgba(20, 40, 55, .06);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
  font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
#app { display: flex; flex-direction: column; height: 100vh; }

/* ---------- toolbar ---------- */
#bar { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 52px; background: var(--accent); color: #fff; flex: none; }
#bar .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
#bar .logo { width: 30px; height: 30px; border-radius: 7px; background: var(--brand); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
#bar .brand small { display: block; font-weight: 500; font-size: 11px; opacity: .7; letter-spacing: 0; }
#bar .grow { flex: 1; }
.tb-btn { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08); color: #fff; display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; white-space: nowrap; }
.tb-btn:hover { background: rgba(255,255,255,.18); }
.tb-btn:disabled { opacity: .35; cursor: default; }
.tb-btn.primary { background: var(--brand); border-color: var(--brand); }
.tb-btn svg { width: 16px; height: 16px; flex: none; }
.tb-field { display: flex; align-items: center; gap: 7px; font-size: 12px; color: rgba(255,255,255,.8); }
.tb-field input, .tb-field select { height: 34px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; padding: 0 8px; color-scheme: dark; }
.tb-field select option { color: #222; }
#slideNo { min-width: 64px; text-align: center; font-weight: 700; font-size: 13px; }
#slideMenu { position: relative; }
#slideList { position: absolute; top: 40px; right: 0; width: 330px; background: #fff; color: var(--ink); border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.3); padding: 6px; display: none; z-index: 50; }
#slideList.open { display: block; }
#slideList button { display: flex; width: 100%; gap: 10px; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; align-items: center; }
#slideList button:hover { background: var(--soft); }
#slideList button.on { background: var(--brand-l); color: var(--brand-d); font-weight: 700; }
#slideList .n { width: 24px; height: 24px; border-radius: 6px; background: var(--soft); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
#slideList small { color: var(--mute); display: block; font-size: 11px; }

/* ---------- filter bar ---------- */
#filters { display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 46px; background: #fff; border-bottom: 1px solid var(--line); flex: none; overflow-x: auto; white-space: nowrap; }
#filters .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
.seg button { border: 0; background: none; padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--ink2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--soft); }
.seg button.on { background: var(--brand); color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 4px 11px; font-size: 12.5px; font-weight: 600; color: var(--ink2); }
.chip:hover { border-color: var(--brand); }
.chip.on { background: var(--brand-l); border-color: var(--brand); color: var(--brand-d); }
.chip i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.f-select, .f-input { height: 30px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; background: #fff; font-size: 12.5px; }
.f-input { width: 150px; }
#filters .sep { width: 1px; height: 22px; background: var(--line); }
#fCount { font-size: 12px; color: var(--ink2); margin-left: auto; font-weight: 600; flex: none; }
#filters > * { flex: none; }
#fCount b { color: var(--brand-d); }
.linkbtn { border: 0; background: none; color: var(--brand); font-weight: 700; font-size: 12.5px; padding: 4px 6px; }
.linkbtn:hover { text-decoration: underline; }

/* ---------- stage ---------- */
#viewport { flex: 1; min-height: 0; position: relative; overflow: hidden; display: grid; place-items: center; }
#stageBox { position: relative; }
#stage { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; background: var(--paper); box-shadow: 0 8px 40px rgba(20,40,55,.25); overflow: hidden; }
.slide { position: absolute; inset: 0; padding: 30px 44px 26px; display: none; flex-direction: column; background: var(--paper); }
.slide.active { display: flex; }
.s-head { display: flex; align-items: flex-end; gap: 18px; margin-bottom: 16px; flex: none; }
.s-head .no { width: 46px; height: 46px; border-radius: 12px; background: var(--brand); color: #fff; font-weight: 800; font-size: 20px; display: grid; place-items: center; flex: none; }
.s-head h1 { margin: 0; font-size: 30px; line-height: 1.1; letter-spacing: -.01em; color: var(--accent); }
.s-head p { margin: 3px 0 0; color: var(--ink2); font-size: 14px; }
.s-head .src { margin-left: auto; font-size: 12px; color: var(--mute); border: 1px dashed var(--line); border-radius: 8px; padding: 5px 10px; text-align: right; line-height: 1.3; }
.s-head .src b { color: var(--ink2); }
.s-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 16px; min-height: 0; }
.col { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.grow { flex: 1; min-width: 0; min-height: 0; }

/* ---------- cards ---------- */
.panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.panel > .ph { display: flex; align-items: center; gap: 10px; padding: 12px 16px 6px; flex: none; }
.panel > .ph h3 { margin: 0; font-size: 15px; color: var(--accent); }
.panel > .ph .sub { color: var(--mute); font-size: 12px; }
.panel > .ph .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.panel > .pb { padding: 4px 16px 14px; flex: 1; min-height: 0; position: relative; }
.kpis { display: grid; gap: 14px; flex: none; }
.kpi { background: linear-gradient(180deg, #fff, var(--brand-xl)); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; position: relative; overflow: hidden; box-shadow: var(--shadow); }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--brand); }
.kpi.alt::before { background: var(--c7); }
.kpi.warn::before { background: var(--c4); }
.kpi .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); font-weight: 700; }
.kpi .v { font-size: 30px; font-weight: 800; color: var(--accent); letter-spacing: -.02em; margin: 2px 0; white-space: nowrap; }
.kpi .v small { font-size: 14px; font-weight: 600; color: var(--ink2); margin-left: 4px; }
.kpi .d { font-size: 12.5px; color: var(--ink2); }
.kpi[data-nav], .kpi[data-kpi] { cursor: pointer; }
.kpi[data-nav]:hover, .kpi[data-kpi]:hover { border-color: var(--brand); }
.delta { font-weight: 700; }
.delta.up { color: var(--bad); } .delta.down { color: var(--good); } .delta.zero { color: var(--mute); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 700; background: var(--soft); color: var(--ink2); white-space: nowrap; }
.pill.p1 { background: #d9eef2; color: var(--brand-d); } .pill.p2 { background: #e6e2fa; color: #4a3bb3; }
.pill.ll { background: #fdeccd; color: #8a5a00; } .pill.crit { background: #fde1e1; color: #a52626; }
.pill.GEN { background: #e7eaee; color: #4a5661; } .pill.ENG { background: #dbe8fa; color: #1c57a3; }
.pill.PROC { background: #fde4da; color: #a8431b; } .pill.CONS { background: #d7f3e8; color: #0e7a55; }
.pill.warn { background: #fdeccd; color: #8a5a00; } .pill.ok { background: #d7f3e8; color: #0e7a55; } .pill.bad { background: #fde1e1; color: #a52626; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink2); }
.legend span { cursor: default; white-space: nowrap; }
.muted { color: var(--mute); }
.hint { font-size: 12px; color: var(--mute); }

/* ---------- svg charts ---------- */
svg text { font-family: inherit; fill: var(--ink2); font-size: 12px; }
svg .ax text { font-size: 11.5px; }
svg .grid line { stroke: #e6ecf0; }
svg .axl { stroke: #c4d0d8; }
.hit { cursor: pointer; }
.hit:hover .hv, .hv.hit:hover { filter: brightness(1.08); }
.hv-ring:hover { stroke: var(--accent); stroke-width: 2; }
#tip { position: absolute; z-index: 90; pointer-events: none; background: #1f2a31; color: #fff; padding: 9px 12px; border-radius: 9px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: 340px; display: none; }
#tip b { color: #fff; } #tip .t { font-weight: 700; margin-bottom: 3px; font-size: 13px; }
#tip .r { display: flex; justify-content: space-between; gap: 18px; } #tip .r span:first-child { opacity: .8; } #tip .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }

/* ---------- tables ---------- */
.scroll { overflow: auto; min-height: 0; }
.tbl { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.tbl th { position: sticky; top: 0; z-index: 3; background: #eef3f5; color: var(--ink2); text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
.tbl th.sort { cursor: pointer; } .tbl th.sort:hover { color: var(--brand-d); }
.tbl td { padding: 6px 9px; border-bottom: 1px solid #edf1f4; white-space: nowrap; }
.tbl td.wrap { white-space: normal; }
.tbl tr.g td { background: var(--brand-l); font-weight: 700; color: var(--brand-d); border-bottom: 1px solid #c4e2e8; }
.tbl tr.act { cursor: pointer; } .tbl tr.act:hover td { background: var(--brand-xl); }
.tbl tr.sel td { background: #d3edf2 !important; }
.tbl tfoot td { position: sticky; bottom: 0; background: #fff; font-weight: 700; border-top: 2px solid var(--line); }
.tbl .num { text-align: right; }
.bar-cell { display: flex; align-items: center; gap: 7px; justify-content: flex-end; }
.bar-cell .b { height: 7px; border-radius: 4px; background: var(--brand); opacity: .75; }
.tw { width: 22px; height: 22px; border: 0; border-radius: 6px; background: none; color: inherit; font-weight: 800; }
.tw:hover { background: rgba(0,0,0,.08); }

/* ---------- forms ---------- */
.dinput { height: 28px; border: 1px solid var(--line); border-radius: 7px; padding: 0 6px; background: #fff; font-size: 12.5px; width: 124px; }
.dinput:focus, .f-input:focus, .f-select:focus, .ninput:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
.dinput.chg { background: #fff7e0; border-color: #ecc66a; }
.ninput { width: 68px; height: 28px; border: 1px solid var(--line); border-radius: 7px; padding: 0 6px; text-align: right; background: #fff; }
.btn { height: 32px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 600; font-size: 13px; color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--brand); color: var(--brand-d); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; } .btn.primary:hover { background: var(--brand-d); color: #fff; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }

/* ---------- gantt ---------- */
.gantt { position: relative; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; flex: 1; min-height: 0; }
.gwrap { position: relative; }
.ghead { position: sticky; top: 0; z-index: 8; display: flex; background: #eef3f5; border-bottom: 1px solid var(--line); }
.gleft { position: sticky; left: 0; z-index: 6; background: inherit; flex: none; display: grid; align-items: center; border-right: 1px solid var(--line); }
.ghead .gleft { z-index: 9; background: #eef3f5; }
.grow2 { display: flex; height: 25px; border-bottom: 1px solid #eef2f4; position: relative; }
.grow2:hover { background: var(--brand-xl); } .grow2:hover .gleft { background: var(--brand-xl); }
.grow2 .gleft { background: #fff; font-size: 12.5px; height: 25px; }
.grow2.grp { background: var(--brand-l); } .grow2.grp .gleft { background: var(--brand-l); font-weight: 700; color: var(--brand-d); }
.grow2.sel, .grow2.sel .gleft { background: #d3edf2; }
.gleft > div { padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gtl { position: relative; flex: none; }
.gbar { position: absolute; top: 5px; height: 15px; border-radius: 4px; cursor: grab; min-width: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.gbar:active { cursor: grabbing; }
.gbar.ll { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.35) 0 4px, transparent 4px 8px); }
.gbar.crit { outline: 2px solid var(--bad); outline-offset: 1px; }
.gbar.conf { outline: 2px dashed #8a1fbf; outline-offset: 1px; }
.gbar .h { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
.gbar .h.l { left: -2px; } .gbar .h.r { right: -2px; }
.gbar .lab { position: absolute; left: calc(100% + 6px); top: -1px; font-size: 11px; color: var(--ink2); white-space: nowrap; pointer-events: none; }
.gsum { position: absolute; top: 8px; height: 8px; background: var(--brand-d); border-radius: 1px; }
.gsum::before, .gsum::after { content: ""; position: absolute; top: 4px; border: 4px solid transparent; border-top-color: var(--brand-d); }
.gsum::before { left: 0; } .gsum::after { right: 0; }
.gghost { position: absolute; top: 20px; height: 3px; background: #99a6b0; border-radius: 2px; opacity: .85; }
.gmonth { position: absolute; top: 25px; height: 24px; text-align: center; font-size: 11px; line-height: 24px; border-left: 1px solid #d5dee4; color: var(--ink2); overflow: hidden; }
.gyear { position: absolute; top: 0; height: 25px; text-align: left; padding-left: 8px; font-size: 12px; font-weight: 700; line-height: 25px; border-left: 1px solid #c4d0d8; color: var(--accent); }
.gstripe { position: absolute; top: 0; bottom: 0; background: rgba(0,119,139,.045); pointer-events: none; }
.gline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bad); z-index: 4; pointer-events: none; }
.gline span { position: absolute; top: 2px; left: 4px; font-size: 10.5px; color: var(--bad); font-weight: 700; white-space: nowrap; background: #fff; padding: 0 3px; border-radius: 3px; }
.ghead .gline span { top: 28px; }
.glink { position: absolute; top: 0; pointer-events: none; z-index: 3; }

/* ---------- drawer ---------- */
#scrim { position: absolute; inset: 0; background: rgba(20,30,40,.22); display: none; z-index: 60; }
#drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 560px; background: #fff; z-index: 70; box-shadow: -10px 0 40px rgba(0,0,0,.2); transform: translateX(105%); transition: transform .22s ease; display: flex; flex-direction: column; }
#drawer.open { transform: none; } #scrim.open { display: block; }
#drawer .dh { padding: 20px 24px 14px; background: linear-gradient(180deg, var(--brand-l), #fff); border-bottom: 1px solid var(--line); position: relative; flex: none; }
#drawer .dh .cd { font-size: 12px; color: var(--brand-d); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
#drawer .dh h2 { margin: 3px 36px 8px 0; font-size: 21px; line-height: 1.2; color: var(--accent); }
#drawer .x { position: absolute; top: 14px; right: 16px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 18px; line-height: 1; }
#drawer .db { padding: 16px 24px 28px; overflow: auto; flex: 1; }
#drawer h4 { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink2); }
#drawer h4:first-child { margin-top: 0; }
.dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dstat { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--soft); }
.dstat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink2); font-weight: 700; }
.dstat .v { font-size: 18px; font-weight: 800; color: var(--accent); }
.dstat .v small { font-size: 12px; color: var(--ink2); font-weight: 600; }
.dlist { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.dlist .it { display: flex; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #edf1f4; align-items: center; font-size: 13px; cursor: pointer; }
.dlist .it:last-child { border-bottom: 0; } .dlist .it:hover { background: var(--brand-xl); }
.dlist .it .c { color: var(--brand-d); font-weight: 700; min-width: 48px; }
.dlist .it .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dlist .it .a { font-weight: 700; }
.datefield { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.datefield label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; color: var(--ink2); display: block; }
.datefield input { width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; margin-top: 3px; font-size: 14px; }
.nudge { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.note { background: #fff7e0; border: 1px solid #f0d58a; color: #6b4e00; padding: 8px 12px; border-radius: 9px; font-size: 12.5px; }
.note.bad { background: #fde8e8; border-color: #f2b4b4; color: #8a1d1d; }
.note.ok { background: #e3f6ec; border-color: #a9dcc2; color: #0b5a37; }
.note.info { background: var(--brand-xl); border-color: #b8dde4; color: var(--brand-d); }

/* ---------- misc ---------- */
.hm td.c { text-align: right; font-size: 11.5px; padding: 3px 5px; min-width: 52px; border-left: 1px solid #fff; }
.hm td.c.z { color: #c8d2d9; }
.hm th.m { text-align: center; min-width: 52px; padding: 5px 3px; cursor: pointer; line-height: 1.15; }
.hm th.m:hover { background: var(--brand-l); }
.hm .stk { position: sticky; z-index: 2; background: #fff; }
.hm tr.g .stk { background: var(--brand-l); }
.hm tr.tot td { background: #eef3f5; font-weight: 700; position: sticky; z-index: 2; }
.timeline { display: flex; align-items: flex-start; gap: 0; position: relative; padding: 20px 0 8px; }
.cover { background: linear-gradient(135deg, #003f4b 0%, #00778b 62%, #2c9fb2 100%) !important; color: #fff; padding: 56px 70px !important; }
.cover svg text { fill: inherit; }
.cover .eyebrow { letter-spacing: .22em; font-size: 14px; font-weight: 700; opacity: .85; text-transform: uppercase; }
.cover h1 { font-size: 80px; line-height: 1; margin: 18px 0 8px; letter-spacing: -.03em; }
.cover h2 { font-size: 28px; font-weight: 500; margin: 0; opacity: .92; }
.cover .startbox { background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.3); border-radius: 16px; padding: 18px 22px; backdrop-filter: blur(4px); }
.cover .startbox label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; opacity: .85; font-weight: 700; }
.cover .startbox input { display: block; margin-top: 6px; height: 46px; font-size: 22px; font-weight: 700; border-radius: 10px; border: 0; padding: 0 12px; background: #fff; color: var(--accent); width: 100%; }
.cover .cstat { background: rgba(255,255,255,.1); border-radius: 14px; padding: 16px 20px; }

/* thank-you */
.slide.m-thanks { background: var(--sar); color: #fff; padding: 0; overflow: hidden; }
.slide.m-thanks::before { display: none; }
.tk-st { position: absolute; bottom: -20px; width: 260px; height: 600px; background: #fff; }
.tk-st.l { left: calc(50% - 800px); transform: skewX(-24deg); transform-origin: 0 100%; }
.tk-st.r { right: calc(50% - 800px); transform: skewX(24deg); transform-origin: 100% 100%; }
.tk-title { position: absolute; top: 150px; left: 0; right: 0; text-align: center; direction: ltr; }
html[dir=rtl] .tk-title { direction: rtl; }
.tk-title h1 { margin: 0; font-size: 92px; font-weight: 800; color: #fff; }
.tk-logo { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 18px; direction: ltr; }
.tk-logo img { height: 170px; width: auto; } .tk-logo span { font-size: 18px; letter-spacing: .08em; }
.m-thanks .edtext.on { outline-color: #fff; background: rgba(255,255,255,.12); }

/* embedded data slides inside the deck */
.slide .s-body { margin-top: 0; }
body.ar .kpi .v small { margin-left: 0; margin-right: 4px; }
html[dir=rtl] .kpi::before { left: auto; right: 0; }
html[dir=rtl] .panel > .ph .right { margin-left: 0; margin-right: auto; }

/* mobile */
.mobile .m-split { flex-direction: column; margin: 0 -12px; } .mobile .m-photo { flex: none; height: 200px; clip-path: none; } .mobile .m-seam { display: none; }
.mobile .m-panel { margin: 0; clip-path: none; padding: 24px 20px !important; font-size: 90%; } .mobile .m-panel p, .mobile .st-item, .mobile .nx-item, .mobile .ab-row, .mobile .ag-item { font-size: 20px !important; }
.mobile .ab-row { flex-direction: column; gap: 4px; } .mobile .ab-k { flex: none; }
.mobile .s-head.m h1 { font-size: 24px; } .mobile .s-head.m .hlogo { height: 32px; }
.mobile .mfoot { position: relative; left: auto; right: auto; bottom: auto; margin: 20px 0 0; }
.mobile .c6 { flex-direction: column; } .mobile .c6-text { flex: none; } .mobile .c6-tiles { grid-template-columns: 1fr; } .mobile .c6-panel { clip-path: none; padding: 20px !important; font-size: 17px; }
.mobile .slide.m-cover { min-height: 0; } .mobile .mc-top { height: 100px; } .mobile .mc-logo { height: 64px; } .mobile .mc-band { height: 190px; } .mobile .mc-band .st { display: none; } .mobile .mc-title { inset: 0 16px; } .mobile .mc-title h1 { font-size: 30px; } .mobile .mc-photo { height: 220px; flex: none; }

      const a = { ...def, s: baseD[def.code][0], e: baseD[def.code][1] };
      const bb = []; for (let k = 0; k <= Z.BASE_MONTHS; k++) bb.push(bs[k]);
      a.amount = amountOf(def, st.A); a.m = distribute(a, bb, Z.BASE_MONTHS, a.amount); return a;
    });

    const dm = (() => { const k = dt.bucketOf(st.start, finish + 1); const lo = dt.addMonths(st.start, k), hi = dt.addMonths(st.start, k + 1); return k + (finish + 1 - lo) / (hi - lo); })();

      st, acts, by, N, bs, start: st.start, finish, total, totalM, cum, pct,
      base: { acts: baseActs, by: Object.fromEntries(baseActs.map((a) => [a.code, a])), finish: baseD['1.1'][1] },
      durMonths: dm, pay: payment,
      changed: acts.filter((a) => a.changed),

    baseActs.forEach((a) => a.m.forEach((v, k) => (M.base.totalM[k] += v)));

      Z.TOPO.forEach((c) => {
        if (c === code || c === Z.AUTO) return;

        let delta = -Infinity;
        a.deps.forEach((p) => { delta = Math.max(delta, after[p][1] - before[p][1]); });

        if (!isFinite(delta) || delta === 0) return;
        delta = Math.max(delta, out.start - before[c][0]);

      });
    }
    const baseD = baseDates(out.start);
    Object.keys(after).forEach((c) => {
      if (c === Z.AUTO) return;
      const b = baseD[c];
      if (after[c][0] === b[0] && after[c][1] === b[1]) delete out.ov[c];

  };

  // Earlier: the Phase 2 activities are pulled earlier by the same number of days (at-risk, before the Detailed Design gate).

      p2.filter((a) => early.has(a.item)).forEach((a) => (cur.ov[a.code] = [Math.max(st.start, bd[a.code][0] + delta), Math.max(st.start, bd[a.code][1] + delta)]));
      return cur;
    }
    if (delta === 0) return cur;
    Z.TOPO.filter((c) => Z.isP2(BY[c])).forEach((c) => {
      const m = Z.compute(cur).by[c];
      if (m.s < day) cur = Z.setActivity(cur, c, day, day + (m.e - m.s), { link: 'push' });

  };

  /* ---------------------------------------------------------- milestones */
  Z.milestones = function (M) {
    const b = M.by, bb = M.base.by, st = M.st;
    const g1 = st.ms ? st.ms.g1 : 30, g2 = st.ms ? st.ms.g2 : 30;
    const P2 = Z.phase2(M);
    const minS = (f) => Math.min(...M.acts.filter(f).map((a) => a.s));
    const maxE = (f) => Math.max(...M.acts.filter(f).map((a) => a.e));
    const bminS = (f) => Math.min(...M.base.acts.filter(f).map((a) => a.s));
    const bmaxE = (f) => Math.max(...M.base.acts.filter(f).map((a) => a.e));
    const ll = (a) => a.ll && a.kind === 'a3';
    const list = [
      { k: 'grant1', name: 'Phase 1 amount granted (funds approved) – movable', d: M.start - g1, bd: M.start - Z.DEFAULT_MS.g1, nav: 'miles', edit: 'g1' },
      { k: 'ntp', name: 'NTP – Notice to Proceed (project start)', d: M.start, bd: M.start, code: '1.1' },
      { k: 'access', name: 'Access permits approved', d: b['1.2'].e, bd: bb['1.2'].e, code: '1.2' },
      { k: 'concept', name: 'Concept design approved', d: b['2.2'].e, bd: bb['2.2'].e, code: '2.2' },
      { k: 'prelim', name: 'Preliminary design approved', d: b['2.4'].e, bd: bb['2.4'].e, code: '2.4' },
      { k: 'proc', name: 'First procurement starts (Phase 1)', d: minS((a) => a.kind === 'a1' && a.phase === 'Phase 1'), bd: bminS((a) => a.kind === 'a1' && a.phase === 'Phase 1') },
      { k: 'grant2', name: 'Phase 2 amount granted (funds approved) – movable', d: P2.start - g2, bd: P2.baseStart - Z.DEFAULT_MS.g2, nav: 'phase2', edit: 'g2' },
      { k: 'p2', name: 'Phase 2 start (release) – movable', d: P2.start, bd: P2.baseStart, nav: 'phase2', edit: 'p2' },
      { k: 'p2late', name: 'Latest Phase 2 start to hold completion', d: P2.latest, bd: P2.baseStart, nav: 'phase2' },
      { k: 'detail', name: 'Detailed design approved', d: b['2.6'].e, bd: bb['2.6'].e, code: '2.6' },
      { k: 'permit', name: 'Work permit approved', d: b['1.3'].e, bd: bb['1.3'].e, code: '1.3' },
      { k: 'cons', name: 'Construction starts on site', d: minS((a) => a.kind === 'b'), bd: bminS((a) => a.kind === 'b') },
      { k: 'll', name: 'Long-lead deliveries complete', d: maxE(ll), bd: bmaxE(ll) },
      { k: 'fin', name: 'Practical completion', d: M.finish, bd: M.base.finish, code: '1.1' },
    ];
    list.forEach((m) => (m.delta = m.d - m.bd));
    return list;
  };

  /* ------------------------------------------------------------ sharing */
  Z.serialize = function (st) {
    const o = { s: dt.iso(st.start), l: st.link, ov: {}, A: st.A, adv: st.adv, ms: st.ms, notes: st.notes };
    Object.keys(st.ov).forEach((c) => (o.ov[c] = [dt.iso(st.ov[c][0]), dt.iso(st.ov[c][1])]));
    return JSON.stringify(o);
  };
  Z.deserialize = function (txt) {
    const o = JSON.parse(txt);
    const st = Z.newState(o.s); st.link = o.l || 'two';
    if (o.adv) st.adv = { ...Z.DEFAULT_ADV, ...o.adv }; if (o.ms) st.ms = { ...Z.DEFAULT_MS, ...o.ms };

    Object.keys(o.ov || {}).forEach((c) => { if (BY[c]) st.ov[c] = [dt.parse(o.ov[c][0]), dt.parse(o.ov[c][1])]; });
    return st;
  };

<script>
/* Formatting helpers + small hand-written SVG chart builders (no external libraries). */
(function (G) {
  const Z = (G.Z = G.Z || {});
  const F = (Z.F = {});

  F.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  F.n0 = (v) => Math.round(v).toLocaleString('en-US');
  F.sar = (v) => 'SAR ' + F.n0(v);
  F.M = (v, d = 2) => (v / 1e6).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }) + 'M';
  F.compact = (v) => {
    const a = Math.abs(v);
    if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
    if (a >= 1e3) return Math.round(v / 1e3) + 'K';
    return String(Math.round(v));
  };
  F.pct = (v, d = 1) => (v * 100).toFixed(d) + '%';
  F.days = (n) => (n === 0 ? '0 d' : (n > 0 ? '+' : '−') + Math.abs(n) + ' d');
  F.deltaCls = (n) => (n > 0 ? 'up' : n < 0 ? 'down' : 'zero');
  F.deltaHtml = (n, unit) => `<span class="delta ${F.deltaCls(n)}">${n === 0 ? 'on baseline' : (n > 0 ? '+' : '−') + Math.abs(n) + (unit || ' d') + (n > 0 ? ' later' : ' earlier')}</span>`;
  F.months = (m) => (Math.abs(m - Math.round(m)) < 0.05 ? String(Math.round(m)) : m.toFixed(1));
  // tooltip payload for data-tip="" (HTML, attribute-escaped)
  F.tip = (title, rows) => F.esc(`<div class="t">${title}</div>` + (rows || []).map((r) => `<div class="r"><span>${r[0] ? `<i class="sw" style="background:${r[0]}"></i>` : ''}${r[1]}</span><b>${r[2]}</b></div>`).join(''));
  F.nice = (max, ticks = 5) => {
    if (max <= 0) return { max: 1, step: 0.25 };
    const raw = max / ticks, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
    return { max: Math.ceil(max / step) * step, step };
  };
  F.groupColor = (code) => `var(--c${parseInt(code, 10)})`;
  F.epcColor = (k) => `var(--${k.toLowerCase()})`;
  F.phaseColor = (p) => (p === 'Phase 1' ? 'var(--ph1)' : 'var(--ph2)');

  const arc = (cx, cy, r0, r1, a0, a1) => {
    const p = (r, a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const [x0, y0] = p(r1, a0), [x1, y1] = p(r1, a1), [x2, y2] = p(r0, a1), [x3, y3] = p(r0, a0);
    return `M${x0},${y0} A${r1},${r1} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 ${large} 0 ${x3},${y3} Z`;

  /* ---- donut -------------------------------------------------------- */
  F.donut = function (items, o) {

    const total = items.reduce((s, i) => s + i.value, 0) || 1;
    let a = 0, out = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">`;
    items.forEach((it) => {

      const full = da >= Math.PI * 2 - 1e-6;
      const path = full ? arc(cx, cy, r0, r1, 0, Math.PI * 2 - 0.0001) : arc(cx, cy, r0, r1, a, a + da);
      out += `<path class="hit hv" d="${path}" fill="${it.color}" stroke="#fff" stroke-width="2" ${it.attrs || ''} data-tip="${it.tip || ''}"/>`;
      a += da;
    });
    if (o.center) out += `<text x="${cx}" y="${cy - 2}" text-anchor="middle" style="font-size:${o.bigSize || 22}px;font-weight:800;fill:var(--accent)">${o.center[0]}</text><text x="${cx}" y="${cy + 17}" text-anchor="middle" style="font-size:11.5px">${o.center[1] || ''}</text>`;
    return out + '</svg>';
  };

  /* ---- horizontal bars --------------------------------------------- */
  F.hbars = function (items, o) {
    o = o || {};
    const w = o.w || 600, rowH = o.rowH || 44, labelW = o.labelW || 230, valW = o.valW || (o.stack ? 120 : 118), pad = 4;
    const max = o.max || Math.max(...items.map((i) => i.value), 1);
    const h = items.length * rowH + pad * 2;
    const bw = w - labelW - valW;
    let out = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMinYMin meet" style="min-width:${o.minW || 0}px">`;
    if (o.stack) {
      const bwS = w - valW; 
      items.forEach((it, i) => {
        const y = pad + i * rowH, len = Math.max(it.value > 0 ? 3 : 0, (it.value / max) * bwS);
        out += `<g class="hit" ${it.attrs || ''} data-tip="${it.tip || ''}"><rect x="0" y="${y}" width="${w}" height="${rowH}" fill="transparent"/>
          <text x="0" y="${y + 20}" style="font-size:13.5px;fill:var(--ink);font-weight:600">${F.esc(it.label)}</text>
          <text x="${w}" y="${y + 20}" text-anchor="end" style="font-size:12.5px">${it.sub || ''}</text>
          <rect class="hv" x="0" y="${y + 28}" width="${len}" height="26" rx="4" fill="${it.color}"/>
          <text x="${len + 8}" y="${y + 46}" style="font-size:13.5px;font-weight:700;fill:var(--accent)">${it.valText}</text></g>`;
      });
      return out + '</svg>';
    }
    items.forEach((it, i) => {
      const y = pad + i * rowH, len = Math.max(it.value > 0 ? 3 : 0, (it.value / max) * bw);
      out += `<g class="hit" ${it.attrs || ''} data-tip="${it.tip || ''}">
        <rect x="0" y="${y}" width="${w}" height="${rowH}" fill="transparent"/>
        <text x="0" y="${y + rowH / 2 + 4.5}" style="font-size:13px;fill:var(--ink)">${F.esc(it.label)}</text>
        <rect class="hv" x="${labelW}" y="${y + 9}" width="${len}" height="${rowH - 18}" rx="4" fill="${it.color}"/>
        <text x="${labelW + len + 8}" y="${y + rowH / 2 + 4.5}" style="font-size:13px;font-weight:700;fill:var(--accent)">${it.valText}</text>
        ${it.sub ? `<text x="${w}" y="${y + rowH / 2 + 4.5}" text-anchor="end" style="font-size:12px">${it.sub}</text>` : ''}
      </g>`;
    });
    return out + '</svg>';
  };

  /* ---- treemap (squarified) ---------------------------------------- */
  F.treemap = function (items, W, H) {
    const total = items.reduce((s, i) => s + i.value, 0);
    const nodes = items.filter((i) => i.value > 0).sort((a, b) => b.value - a.value).map((i) => ({ ...i, area: (i.value / total) * W * H }));
    const rects = [];
    (function squarify(list, x, y, w, h) {
      if (!list.length) return;
      const short = Math.min(w, h);
      const worst = (row, side) => { const s = row.reduce((a, n) => a + n.area, 0); const mx = Math.max(...row.map((n) => n.area)), mn = Math.min(...row.map((n) => n.area)); return Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn)); };
      let row = [list[0]], i = 1;
      while (i < list.length && worst(row.concat(list[i]), short) <= worst(row, short)) row.push(list[i++]);
      const s = row.reduce((a, n) => a + n.area, 0);
      if (w >= h) {
        const cw = s / h; let yy = y;
        row.forEach((n) => { const nh = n.area / cw; rects.push({ n, x, y: yy, w: cw, h: nh }); yy += nh; });
        squarify(list.slice(i), x + cw, y, w - cw, h);
      } else {
        const ch = s / w; let xx = x;
        row.forEach((n) => { const nw = n.area / ch; rects.push({ n, x: xx, y, w: nw, h: ch }); xx += nw; });
        squarify(list.slice(i), x, y + ch, w, h - ch);
      }
    })(nodes, 0, 0, W, H);
    let out = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="min-width:640px">`;
    rects.forEach(({ n, x, y, w, h }) => {
      const tw = w - 14, chars = Math.floor(tw / 6.6);
      let t = n.label; if (t.length > chars) t = t.slice(0, Math.max(0, chars - 1)) + '…';
      out += `<g class="hit" ${n.attrs || ''} data-tip="${n.tip || ''}"><rect class="hv" x="${x + 1}" y="${y + 1}" width="${Math.max(0, w - 2)}" height="${Math.max(0, h - 2)}" rx="6" fill="${n.color}" stroke="#fff" stroke-width="1"/>`;
      if (w > 70 && h > 38) out += `<text x="${x + 9}" y="${y + 20}" style="fill:#fff;font-weight:700;font-size:12.5px">${F.esc(t)}</text><text x="${x + 9}" y="${y + 36}" style="fill:#fff;opacity:.92;font-size:12px">${n.valText}</text>`;
      else if (w > 44 && h > 22) out += `<text x="${x + 6}" y="${y + 15}" style="fill:#fff;font-weight:700;font-size:11px">${F.esc(n.short || '')}</text>`;
      out += '</g>';
    });
    return out + '</svg>';
  };

  /* ---- sparkline-like mini bars ------------------------------------ */
  F.miniBars = function (vals, o) {
    o = o || {};
    const w = o.w || 480, h = o.h || 90, max = Math.max(...vals, 1), bw = w / vals.length;
    let out = `<svg viewBox="0 0 ${w} ${h + 16}" width="100%">`;
    vals.forEach((v, i) => {
      const bh = (v / max) * h;
      out += `<rect x="${i * bw + 1.5}" y="${h - bh}" width="${bw - 3}" height="${Math.max(bh, v > 0 ? 1.5 : 0)}" rx="2" fill="${o.color || 'var(--brand)'}" ${o.attr ? o.attr(i) : ''} data-tip="${o.tip ? o.tip(i, v) : ''}"/>`;
      if (o.label && (bw > 16 || i % 2 === 0)) out += `<text x="${i * bw + bw / 2}" y="${h + 13}" text-anchor="middle" style="font-size:9.5px">${o.label(i)}</text>`;
    });
    return out + '</svg>';
  };
})(typeof window !== 'undefined' ? window : globalThis);

  const TKL = { trackFloat: 'هامش السكة', ddDate: 'تاريخ اعتماد التصميم التفصيلي', latest: 'آخر موعد لبدء المرحلة الثانية', delayNow: 'التأخير الحالي', grantDate: 'تاريخ اعتماد التمويل', g2: 'عدد الأيام', sigCheck: 'حالة الإشارات',

    $$('.slide').forEach((s, k) => s.classList.toggle('active', k === i));
    if (A.dirty.has(i)) A.renderSlide(i);
    A.renderChrome(); A.save();
    $('#viewport').scrollTop = 0;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) { /* ignore */ }
  };
  A.next = () => { const vi = A.visIdx(), k = vi.find((x) => x > A.s.slide); if (k != null) A.go(k); };
  A.back = () => { const vi = A.visIdx().filter((x) => x < A.s.slide); if (vi.length) A.go(vi[vi.length - 1]); };

  /* ----------------------------------------------------------- scaling */
  A.fit = () => {
    const vp = $('#viewport');
    const mob = !A.forceDesktop && window.innerWidth < 900;
    if (mob !== A.mobile) {
      A.mobile = mob; $('#app').classList.toggle('mobile', mob);
      if (A.s.M && A.slides.length) { A.dirty = new Set(A.slides.map((_, i) => i)); A.renderSlide(A.s.slide); }
    }
    if (mob) { A.scale = 1; $('#stageBox').style.width = ''; $('#stageBox').style.height = ''; $('#stage').style.transform = 'none'; return; }
    const k = Math.min(vp.clientWidth / W, vp.clientHeight / H);
    A.scale = k;
    $('#stageBox').style.width = W * k + 'px'; $('#stageBox').style.height = H * k + 'px';
    $('#stage').style.transform = `scale(${k})`;
  };

  /* -------------------------------------------------------- fullscreen */
  A.isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  A.enterFull = () => { const el = $('#app'); (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); };
  A.exitFull = () => { (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document); };
  A.syncFull = () => {
    const f = A.isFull();
    $('#bFull').style.display = f ? 'none' : ''; $('#bExit').style.display = f ? '' : 'none';
    setTimeout(A.fit, 50);
  };
  A.print = () => { A.renderAll(); setTimeout(() => window.print(), 80); };

  /* ------------------------------------------------------------ drawer */
  A.openDrawer = (type, id) => { A.s.drawer = { type, id }; A.renderDrawer(); };
  A.closeDrawer = () => { A.s.drawer = null; A.renderDrawer(); };
  A.renderDrawer = () => {
    const d = A.s.drawer, el = $('#drawer'), sc = $('#scrim');
    if (!d) { el.classList.remove('open'); sc.classList.remove('open'); return; }
    const fn = A.drawers[d.type]; if (!fn) return;
    const o = fn(d.id, A.s.M, A.s);
    if (!o) { A.closeDrawer(); return; }
    const keep = $('#drawer .db') ? $('#drawer .db').scrollTop : 0;
    el.innerHTML = `<div class="dh"><div class="cd">${o.code}</div><h2>${o.title}</h2><div>${o.tags || ''}</div><button class="x" data-do="closeDrawer" aria-label="Close">×</button></div><div class="db">${o.html}</div>`;
    el.classList.add('open'); sc.classList.add('open');
    $('#drawer .db').scrollTop = keep;
  };

  /* ----------------------------------------------------------- tooltip */
  function tipMove(e) {
    const t = e.target.closest ? e.target.closest('[data-tip]') : null;
    const tip = $('#tip');
    if (!t || !t.dataset.tip) { tip.style.display = 'none'; return; }
    if (tip.dataset.src !== t.dataset.tip) { tip.innerHTML = A.tr(t.dataset.tip); tip.dataset.src = t.dataset.tip; }
    tip.style.display = 'block';
    const r = $('#stage').getBoundingClientRect(), k = A.scale;
    let x = (e.clientX - r.left) / k + 16, y = (e.clientY - r.top) / k + 16;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    if (x + w > W - 8) x = (e.clientX - r.left) / k - w - 16;
    if (y + h > H - 8) y = (e.clientY - r.top) / k - h - 16;
    tip.style.left = Math.max(6, x) + 'px'; tip.style.top = Math.max(6, y) + 'px';
  }

  /* -------------------------------------------------------- built-in actions */
  A.actions.closeDrawer = () => A.closeDrawer();
  A.actions.resetDefault = () => {
    if (!confirm('Reset the presentation to its default?\n\nThis restores the project start date (25 Oct 2026), all activity dates, weightages, filters and views.')) return;
    A.s.st = Z.newState('2026-10-25');
    Object.assign(A.s.f, { phase: 'all', epc: [], group: 'all', ll: false, crit: false, chg: false, q: '' });
    A.s.ui = {}; A.s.drawer = null; $('#fQ').value = '';
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    A.update(); A.closeDrawer();
  };
  A.actions.resetAll = A.actions.resetDefault;
  A.actions.resetAct = (el) => A.setState(Z.resetActivity(A.s.st, el.dataset.code));

  function bind() {
    const stage = $('#stage');
    stage.addEventListener('click', (e) => {
      if (!A.s.editText) return;
      const t = e.target; if (t.closest('[data-ed]') || t.closest('input,select,textarea')) return;
      const el = t.closest('[data-ovk]'); if (!el) return;
      e.stopPropagation(); e.preventDefault(); A.openOv(el);
    }, true);
    stage.addEventListener('click', (e) => {
      const t = e.target;
      if (A.s.editText && t.closest('[data-ed]')) return;
      const doEl = t.closest('[data-do]');
      if (doEl && A.actions[doEl.dataset.do]) { A.actions[doEl.dataset.do](doEl, e); return; }
      if (t.closest('input,select,textarea')) return;
      const nav = t.closest('[data-nav]'); if (nav) { A.go(+nav.dataset.nav); return; }
      if (MODE && MODE.noDrawer) return;
      const mapping = [['data-act', 'act'], ['data-grp', 'grp'], ['data-month', 'month'], ['data-cat', 'cat'], ['data-item', 'item']];
      for (const [attr, type] of mapping) {
        const el = t.closest('[' + attr + ']');
        if (el) { A.openDrawer(type, el.getAttribute(attr)); return; }
      }
    });
    stage.addEventListener('change', (e) => {
      const el = e.target.closest('[data-chg]');
      if (el && A.changes[el.dataset.chg]) A.changes[el.dataset.chg](el, e);
    });
    stage.addEventListener('input', (e) => { const el = e.target.closest && e.target.closest('[data-ed]'); if (el) el.dataset.dirty = '1'; });
    stage.addEventListener('focusout', (e) => { const el = e.target.closest && e.target.closest('[data-ed]'); if (el && A.s.editText && el.dataset.dirty) { delete el.dataset.dirty; A.saveEd(el); } });
    stage.addEventListener('paste', (e) => { const el = e.target.closest && e.target.closest('[data-ed]'); if (!el) return; e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain')); });
    $('#bEdit').onclick = A.toggleEdit; $('#edDone').onclick = A.toggleEdit;
    $('#edbar').addEventListener('click', (e) => { const b = e.target.closest('[data-do]'); if (b && A.actions[b.dataset.do]) A.actions[b.dataset.do](b, e); });
    $('#scrim').addEventListener('click', A.closeDrawer);
    stage.addEventListener('mousemove', tipMove);
    stage.addEventListener('mouseleave', () => ($('#tip').style.display = 'none'));

    // toolbar
    $('#bBack').onclick = A.back; $('#bNext').onclick = A.next;
    if ($('#bPptx')) $('#bPptx').onclick = () => A.exportPptx();
    $('#bFull').onclick = A.enterFull; $('#bExit').onclick = A.exitFull; $('#bPrint').onclick = A.print;
    if ($('#bFilters')) $('#bFilters').onclick = () => { const f = $('#filters'); f.style.display = f.style.display === 'none' ? '' : 'none'; setTimeout(A.fit, 20); };
    $('#bReset').onclick = A.actions.resetDefault;
    $('#scen').onclick = () => A.go(A.slides.findIndex((s) => s.id === 'scenario'));
    $('#startIn').onchange = (e) => { const d = dt.parse(e.target.value); if (d) A.setState(Z.setStart(A.s.st, d)); else A.renderChrome(); };
    $('#linkSel').onchange = (e) => { const st = Z.cloneState(A.s.st); st.link = e.target.value; A.setState(st); };
    $('#bSide').onclick = () => { $('#side').classList.toggle('hide'); setTimeout(A.fit, 30); };
    $('#side').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) { A.go(+b.dataset.go); if (window.innerWidth < 600) $('#side').classList.add('hide'); } });
    $('#mBack').onclick = A.back; $('#mNext').onclick = A.next;
    $('#mSide').onclick = () => $('#side').classList.toggle('hide');
    if ($('#mFilt')) $('#mFilt').onclick = () => $('#app').classList.toggle('showf');

    // filters
    const fb = $('#filters');
    fb.addEventListener('click', (e) => {
      const f = A.s.f, t = e.target.closest('button'); if (!t) return;
      if (t.dataset.fphase) f.phase = t.dataset.fphase;
      else if (t.dataset.fepc) { const i = f.epc.indexOf(t.dataset.fepc); if (i >= 0) f.epc.splice(i, 1); else f.epc.push(t.dataset.fepc); }
      else if (t.dataset.ftog) f[t.dataset.ftog] = !f[t.dataset.ftog];
      else if (t.id === 'fReset') { Object.assign(f, { phase: 'all', epc: [], group: 'all', ll: false, crit: false, chg: false, q: '' }); $('#fQ').value = ''; }
      else return;
      A.refilter();
    });
    fb.addEventListener('change', (e) => { if (e.target.id === 'fGroup') { A.s.f.group = e.target.value; A.refilter(); } });
    $('#fQ').addEventListener('input', (e) => { A.s.f.q = e.target.value.trim(); A.refilter(); });

    // keyboard
    document.addEventListener('keydown', (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (e.target.isContentEditable) { if (e.key === 'Escape') e.target.blur(); return; }
      if (tag === 'input' || tag === 'select' || tag === 'textarea') { if (e.key === 'Escape') e.target.blur(); return; }
      const fwd = A.isAr() ? 'ArrowLeft' : 'ArrowRight', bwd = A.isAr() ? 'ArrowRight' : 'ArrowLeft';
      if (e.key === fwd || e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)) { e.preventDefault(); A.next(); }
      else if (e.key === bwd || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); A.back(); }
      else if (e.key === 'Home') A.go(A.visIdx()[0]); else if (e.key === 'End') A.go(A.visIdx().slice(-1)[0]);
      else if (e.key === 'Escape') { if (A.s.drawer) A.closeDrawer(); }
      else if (e.key === 'f' || e.key === 'F') { A.isFull() ? A.exitFull() : A.enterFull(); }
    });
    window.addEventListener('resize', A.fit);
    if (window.ResizeObserver) new ResizeObserver(() => A.fit()).observe($('#viewport'));
    document.addEventListener('fullscreenchange', A.syncFull); document.addEventListener('webkitfullscreenchange', A.syncFull);
    window.addEventListener('beforeprint', A.renderAll);
  }

  A.refilter = () => {
    A.dirty = new Set(A.slides.map((_, i) => i));
    A.renderFilters();
    const keep = {}; $$('[data-keep]').forEach((el) => (keep[el.dataset.keep] = [el.scrollLeft, el.scrollTop]));
    A.renderSlide(A.s.slide, keep); A.renderDrawer(); A.save();
  };

  /* -------------------------------------------------------------- boot */
  A.setLang = (l) => {
    A.lang = l; try { localStorage.setItem(LKEY, l); } catch (e) { /* ignore */ }
    A.applyLang(); A.dirty = new Set(A.slides.map((_, i) => i));
    A.renderChrome(); A.renderSlide(A.s.slide); A.renderDrawer();
  };
  A.applyLang = () => {
    document.documentElement.lang = A.lang; document.documentElement.dir = A.isAr() ? 'rtl' : 'ltr';
    document.body.classList.toggle('ar', A.isAr());
    if (A.labels) A.labels(); A.buildSide();
  };
  A.slideInfo = (s) => { const t = MODE && MODE.titles && MODE.titles[s.id]; if (t) return A.isAr() ? t.ar : t.en; if (s.i18n) return A.isAr() ? s.i18n.ar : s.i18n.en; return [s.title, s.desc]; };
  A.buildSide = () => {
    const SEC = MODE ? MODE.sec.map((x) => [A.isAr() ? x.ar : x.en, x.ids]) : [['Introduction', ['cover']], ['1 · Dashboard', ['dash', 'miles', 'phase2']], ['2 · WBS & CBS', ['wbs', 'wbsreg']], ['3 · 26-Month Schedule', ['gantt', 'cashflow', 'matrix']], ['4 · Assumptions & Scenario', ['assump', 'scenario']]];
    $('#side').innerHTML = SEC.map(([t, ids]) => `<div class="sec">${t}</div>` + ids.map((id) => { const i = A.slides.findIndex((s) => s.id === id); if (i < 0) return ''; const [ti, de] = A.slideInfo(A.slides[i]); return `<button data-go="${i}"><span class="n">${i + 1}</span><span>${ti}<small>${de}</small></span></button>`; }).join('')).join('');
    $$('#side [data-go]').forEach((b) => { b.style.display = A.isGone(+b.dataset.go) ? 'none' : ''; });
  };
  A.boot = () => {
    if (MODE && MODE.order) A.slides = MODE.order.map((id) => A.slides.find((s) => s.id === id)).filter(Boolean);
    // slides
    $('#stage').insertAdjacentHTML('afterbegin', A.slides.map((s, i) => `<section class="slide ${s.cls || ''}" id="slide-${i}"></section>`).join(''));
    A.applyLang();
    if (window.innerWidth < 600) $('#side').classList.add('hide');
    // restore state: share link > saved session > baseline
    let st = null, slide = 0;
    try {
      const h = location.hash;
      if (h.startsWith('#s=')) st = Z.deserialize(decodeURIComponent(escape(atob(h.slice(3)))));
      else {
        const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (saved) { st = Z.deserialize(saved.ser); slide = saved.slide || 0; }
        if (/^#\d+$/.test(h)) slide = +h.slice(1) - 1;
      }
    } catch (e) { st = null; }
    A.s.st = st || Z.newState('2026-10-25');
    A.s.M = Z.compute(A.s.st);
    A.s.slide = Math.max(0, Math.min(A.slides.length - 1, slide));
    $('#fQ').value = A.s.f.q || '';
    bind(); if (A.updateEdbar) A.updateEdbar(); A.fit(); A.syncFull();
    A.dirty = new Set(A.slides.map((_, i) => i));
    A.renderChrome(); A.go(A.s.slide);
    A.renderDrawer();
  };
})(window);

</script>
<script>
/* Detail drawer content: activity, WBS group, BOQ item, month, category */
(function (G) {
  const Z = G.Z, F = Z.F, dt = Z.dt, A = Z.app;
  const pill = (c, t) => `<span class="pill ${c}">${t}</span> `;
  const stat = (k, v, extra) => `<div class="dstat"><div class="k">${k}</div><div class="v">${v}</div>${extra || ''}</div>`;
  const listItem = (a, right) => `<div class="it" data-act="${a.code}"><span class="c">${a.code}</span><span class="n" title="${F.esc(a.desc)}">${F.esc(a.name)}</span><span class="a">${right}</span></div>`;

  A.actions.nudge = (el) => {
    const a = A.s.M.by[el.dataset.code], unit = el.dataset.u, n = +el.dataset.n;
    let ns, ne;
    if (unit === 'm') { ns = dt.addMonths(a.s, n); ne = dt.addMonths(a.e + 1, n) - 1; } else { ns = a.s + n; ne = a.e + n; }
    A.edit(a.code, ns, ne);
  };

  A.drawers.act = (code, M) => {
    const a = M.by[code]; if (!a) return null;
    const auto = code === Z.AUTO;
    const preds = a.deps.map((c) => M.by[c]), succs = a.succ.map((c) => M.by[c]);
    const sibs = a.item ? M.acts.filter((x) => x.item === a.item) : (a.kind === 'eng' ? M.acts.filter((x) => x.kind === 'eng') : []);
    const tags = pill(a.phase === 'Phase 1' ? 'p1' : 'p2', a.phase) + pill(a.epc, Z.EPC_BY[a.epc].name) + (a.ll ? pill('ll', 'Long-lead') : '') + (a.critical ? pill('crit', 'Critical path') : '') + (a.changed ? pill('warn', 'Moved vs baseline') : '');
    const nb = (u, n, t) => `<button class="btn sm" data-do="nudge" data-code="${code}" data-u="${u}" data-n="${n}">${t}</button>`;
    const dstart = F.deltaHtml(a.ds), dend = F.deltaHtml(a.de);
    const html = `
      <h4>Cost</h4>
      <div class="dgrid">${stat('Amount (excl. VAT)', F.n0(a.amount) + ' <small>SAR</small>')}${stat('% of project', F.pct(a.amount / M.total, 2))}${stat('Duration', F.months(a.dur / 30.4375) + ' <small>months</small>', `<div class="hint">${a.dur} days</div>`)}${stat('Float to completion', a.critical ? '0 d' : Math.round(a.float) + ' d', `<div class="hint">${a.critical ? 'on the critical path' : 'schedule slack'}</div>`)}</div>
      <h4>Schedule – edit dates</h4>
      <div class="datefield"><div><label>Start</label><input type="date" value="${dt.iso(a.s)}" ${auto ? 'disabled' : ''} data-chg="gdate" data-code="${code}" data-w="s"></div><div><label>Finish</label><input type="date" value="${dt.iso(a.e)}" ${auto ? 'disabled' : ''} data-chg="gdate" data-code="${code}" data-w="e"></div></div>
      ${auto ? '<div class="note info" style="margin-top:10px">Preliminaries are cost-loaded evenly across the whole project, so these dates follow the project start and the latest finish.</div>' : `
      <div class="nudge">${nb('d', -7, '− 1 week')}${nb('d', 7, '+ 1 week')}${nb('m', -1, '− 1 month')}${nb('m', 1, '+ 1 month')}${a.changed ? `<button class="btn sm danger" data-do="resetAct" data-code="${code}">Reset to baseline</button>` : ''}</div>
      <div class="hint" style="margin-top:8px">Moving shifts the whole activity. Linking mode: <b>${{ two: 'successors move with it', push: 'delays are pushed to successors', off: 'successors stay put' }[M.st.link]}</b>.</div>`}
      <div class="hint" style="margin-top:8px">Baseline: ${dt.fmtShort(a.bs)} → ${dt.fmtShort(a.be)}${a.changed ? ` · start ${dstart} · finish ${dend}` : ''}</div>
      ${a.conflict ? `<div class="note bad" style="margin-top:10px">Logic conflict: starts before predecessor ${a.conflictWith.join(', ')} allows.</div>` : ''}
      <h4>Predecessors (${preds.length})</h4>
      ${preds.length ? `<div class="dlist">${preds.map((p) => listItem(p, 'ends ' + dt.fmtShort(p.e))).join('')}</div>` : '<div class="hint">Project start – no predecessor.</div>'}
      <div class="hint" style="margin-top:6px">Logic from Excel: ${F.esc(a.pred || 'Project Start')}</div>
      <h4>Successors (${succs.length})</h4>
      ${succs.length ? `<div class="dlist">${succs.map((p) => listItem(p, 'starts ' + dt.fmtShort(p.s))).join('')}</div>` : '<div class="hint">No successors.</div>'}
      ${sibs.length > 1 ? `<h4>${a.item ? 'Item chain – ' + F.esc(Z.ITEM_BY[a.item].name) : 'Design stages'}</h4><div class="dlist">${sibs.map((s) => `<div class="it" data-act="${s.code}" style="${s.code === code ? 'background:var(--brand-l)' : ''}"><span class="c">${s.code}</span><span class="n">${F.esc(s.name.split(' – ').pop())}</span><span class="a">${F.compact(s.amount)} · ${dt.fmtShort(s.s)}</span></div>`).join('')}</div>` : ''}
      <h4>Monthly spend</h4>
      ${F.miniBars(a.m, { w: 500, h: 80, label: (i) => 'M' + (i + 1), tip: (i, v) => F.tip('Month ' + (i + 1), [['', 'Spend', F.sar(v)]]) })}
      <h4>Reference</h4>
      <div style="font-size:13px;line-height:1.55"><b>Description:</b> ${F.esc(a.desc)}<br><b>BOQ ref:</b> ${F.esc(a.boq || '–')} · <b>Unit:</b> ${F.esc(a.unit || '–')}</div>`;
    return { code: 'WBS ' + a.code, title: F.esc(a.name), tags, html };
  };

  const monthBars = (M, list) => { const t = new Array(M.N).fill(0); list.forEach((a) => a.m.forEach((v, k) => (t[k] += v))); return F.miniBars(t, { w: 500, h: 80, label: (i) => 'M' + (i + 1), attr: (i) => `data-month="${i + 1}"`, tip: (i, v) => F.tip('Month ' + (i + 1) + ' · ' + dt.fmtMY(M.bs[i]), [['', 'Spend', F.sar(v)]]) }); };

  A.drawers.grp = (code, M) => {
    const g = Z.GROUP_BY[code]; if (!g) return null;
    const list = M.acts.filter((a) => a.group === code), tot = list.reduce((s, a) => s + a.amount, 0);
    const s = Math.min(...list.map((a) => a.s)), e = Math.max(...list.map((a) => a.e));
    const epc = Z.EPC.map((x) => [x, list.filter((a) => a.epc === x.key).reduce((q, a) => q + a.amount, 0)]).filter((x) => x[1] > 0);
    const html = `<div class="dgrid">${stat('Group amount', F.n0(tot) + ' <small>SAR</small>')}${stat('% of project', F.pct(tot / M.total, 2))}${stat('Starts', dt.fmt(s))}${stat('Finishes', dt.fmt(e))}</div>
      <h4>Cost by EPC category</h4>${epc.map(([x, v]) => `<div style="display:flex;align-items:center;gap:10px;margin:5px 0;font-size:13px"><span style="width:150px">${x.name}</span><span style="flex:1;background:var(--soft);height:10px;border-radius:5px"><i style="display:block;height:10px;border-radius:5px;width:${(v / tot) * 100}%;background:${F.epcColor(x.key)}"></i></span><b style="width:90px;text-align:right">${F.M(v)}</b></div>`).join('')}
      <h4>Monthly spend</h4>${monthBars(M, list)}
      <h4>Activities (${list.length})</h4><div class="dlist">${list.map((a) => listItem(a, F.compact(a.amount))).join('')}</div>`;
    return { code: 'WBS group ' + code, title: F.esc(g.name), tags: pill('p1', list.filter((a) => a.phase === 'Phase 1').length + ' in Phase 1') + pill('p2', list.filter((a) => a.phase === 'Phase 2').length + ' in Phase 2'), html };
  };

  A.drawers.item = (key, M) => {
    const it = Z.ITEM_BY[key]; if (!it) return null;
    const list = M.acts.filter((a) => a.item === key), tot = list.reduce((s, a) => s + a.amount, 0);
    const mat = list.filter((a) => a.kind !== 'b').reduce((s, a) => s + a.amount, 0);
    const html = `<div class="dgrid">${stat('Item amount', F.n0(tot) + ' <small>SAR</small>')}${stat('% of project', F.pct(tot / M.total, 2))}${stat('Materials / procurement', F.pct(tot ? mat / tot : 0, 0), `<div class="hint">${F.M(mat)} SAR</div>`)}${stat('Construction', F.pct(tot ? 1 - mat / tot : 0, 0), `<div class="hint">${F.M(tot - mat)} SAR</div>`)}</div>
      <div class="hint" style="margin-top:8px">Discipline: <b>${Z.DISC[it.disc].name}</b> · BOQ ${F.esc(list[0].boq)} · ${list[0].phase}</div>
      <h4>Procurement → construction chain</h4><div class="dlist">${list.map((a) => `<div class="it" data-act="${a.code}"><span class="c">${a.code}</span><span class="n">${F.esc(a.name.split(' – ').pop())}</span><span class="a">${F.compact(a.amount)} · ${dt.fmtShort(a.s)} → ${dt.fmtShort(a.e)}</span></div>`).join('')}</div>
      <h4>Monthly spend</h4>${monthBars(M, list)}`;
    return { code: 'BOQ item ' + key, title: F.esc(it.full || it.name), tags: pill(list[0].phase === 'Phase 1' ? 'p1' : 'p2', list[0].phase) + (list.some((a) => a.ll) ? pill('ll', 'Long-lead') : ''), html };
  };

  A.drawers.month = (id, M) => {
    const k = +id - 1; if (k < 0 || k >= M.N) return null;
    const list = M.acts.filter(A.vis), agg = Z.aggregate(M, A.vis, 'group');
    const active = list.filter((a) => a.m[k] > 0.5).sort((a, b) => b.m[k] - a.m[k]);
    const tot = agg.total[k];
    const html = `<div class="dgrid">${stat('Spend in month', F.n0(tot) + ' <small>SAR</small>')}${stat('Cumulative', F.pct(agg.pct[k]), `<div class="hint">${F.M(agg.cum[k])} SAR</div>`)}${stat('Baseline cumulative', k < Z.BASE_MONTHS ? F.pct(baseP(M, list, k)) : '100.0%')}${stat('Active activities', active.length)}</div>
      <h4>Spend by WBS group</h4>${agg.keys.map((g) => ({ g, v: agg.map[g][k] })).filter((x) => x.v > 0.5).map((x) => `<div style="display:flex;align-items:center;gap:10px;margin:5px 0;font-size:13px;cursor:pointer" data-grp="${x.g}"><span style="width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><i class="dot" style="background:${F.groupColor(x.g)}"></i>${x.g.replace('.0', '')} ${F.esc(Z.GROUP_BY[x.g].name)}</span><span style="flex:1;background:var(--soft);height:10px;border-radius:5px"><i style="display:block;height:10px;border-radius:5px;width:${(x.v / tot) * 100}%;background:${F.groupColor(x.g)}"></i></span><b style="width:80px;text-align:right">${F.compact(x.v)}</b></div>`).join('')}
      <h4>Activities spending this month</h4><div class="dlist">${active.map((a) => listItem(a, F.compact(a.m[k]))).join('') || '<div class="it">No spend</div>'}</div>
      <div class="nudge" style="margin-top:14px">${k > 0 ? `<button class="btn sm" data-month="${k}">‹ Month ${k}</button>` : ''}${k < M.N - 1 ? `<button class="btn sm" data-month="${k + 2}">Month ${k + 2} ›</button>` : ''}</div>`;
    return { code: 'Month ' + (k + 1) + ' of ' + M.N, title: `${dt.fmt(M.bs[k])} → ${dt.fmt(M.bs[k + 1] - 1)}`, tags: A.filtered() ? pill('warn', 'filtered selection') : '', html };
  };
  const baseP = (M, list, k) => { const codes = new Set(list.map((a) => a.code)); let c = 0, t = 0; M.base.acts.forEach((a) => { if (codes.has(a.code)) { a.m.forEach((v, i) => { t += v; if (i <= k) c += v; }); } }); return t ? c / t : 0; };

  A.drawers.cat = (id, M) => {
    const [type, val] = id.split(':');
    let list, title, code;
    if (type === 'phase') { list = M.acts.filter((a) => a.phase === val); title = val; code = 'Phase'; }
    else if (type === 'epc') { list = M.acts.filter((a) => a.epc === val); title = Z.EPC_BY[val].name; code = 'EPC category ' + Z.EPC_BY[val].code; }
    else { const defs = [(a) => a.epc === 'ENG' || a.code === '1.2', (a) => a.code === '1.3', (a) => a.epc === 'PROC', (a) => a.epc === 'CONS']; list = M.acts.filter(defs[+val]); title = ['Design & approvals', 'Work permit gate', 'Procurement', 'Installation & construction'][+val]; code = 'Programme stage'; }
    if (!list.length) return null;
    const tot = list.reduce((s, a) => s + a.amount, 0), grp = Z.GROUPS.map((g) => [g, list.filter((a) => a.group === g.code).reduce((q, a) => q + a.amount, 0)]).filter((x) => x[1] > 0);
    const html = `<div class="dgrid">${stat('Amount', F.n0(tot) + ' <small>SAR</small>')}${stat('% of project', F.pct(tot / M.total, 2))}${stat('Starts', dt.fmt(Math.min(...list.map((a) => a.s))))}${stat('Finishes', dt.fmt(Math.max(...list.map((a) => a.e))))}</div>
      <h4>By WBS group</h4>${grp.map(([g, v]) => `<div style="display:flex;align-items:center;gap:10px;margin:5px 0;font-size:13px;cursor:pointer" data-grp="${g.code}"><span style="width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><i class="dot" style="background:${F.groupColor(g.code)}"></i>${g.code.replace('.0', '')} ${F.esc(g.name)}</span><span style="flex:1;background:var(--soft);height:10px;border-radius:5px"><i style="display:block;height:10px;border-radius:5px;width:${(v / tot) * 100}%;background:${F.groupColor(g.code)}"></i></span><b style="width:80px;text-align:right">${F.M(v)}</b></div>`).join('')}
      <h4>Monthly spend</h4>${monthBars(M, list)}
      <h4>Activities (${list.length})</h4><div class="dlist">${list.map((a) => listItem(a, F.compact(a.amount))).join('')}</div>`;
    return { code, title: F.esc(title), tags: '', html };
  };
})(window);

</script>
<script>
/* Slides 1-3: Cover, Dashboard, Milestones & key gates */
(function (G) {
  const Z = G.Z, F = Z.F, dt = Z.dt, A = Z.app;
  A.idx = (id) => A.slides.findIndex((s) => s.id === id);


  /* editable "Schedule insights" text: {tokens} are live values */
  const INS_TPL = `<p style="margin:0 0 8px"><b>Tight tail-end:</b> {tightCount} installation activities finish in the last ~3 months ({tightCodes}…). Shortest installation windows: {shortWin}.</p>
<p style="margin:0 0 8px"><b>Peak spend:</b> month {peakMonth} ({peakDate}) at {peakAmt}.</p>
<p style="margin:0 0 8px"><b>Phase 2:</b> must start by {p2latest} to hold completion{p2late}. Move the milestone in the register (row {p2row}) or on the Phase 2 slide.</p>
<p style="margin:0 0 8px"><b>Advance payment:</b> {advAmt} ({advPct}% of contract) at NTP, recovered {advPer} per month over {advMonths} months.</p>
<p style="margin:0 0 8px"><b>Binding gate:</b> construction cannot start before the work permit on {permitDate} – it follows detailed-design approval ({ddDate}).</p>`;
  const insTokens = (M, ms, P2, tight, cons, agg, pk) => ({
    tightCount: tight.length, tightCodes: tight.slice(0, 4).map((a) => a.code).join(', '),
    shortWin: cons.map((a) => `<a data-act="${a.code}" style="color:var(--brand-d);cursor:pointer;font-weight:700">${a.code} (${F.months(a.dur / 30.4)} ${A.L('mo', 'ش')})</a>`).join(', '),
    peakMonth: pk + 1, peakDate: dt.fmtMY(M.bs[pk]), peakAmt: F.sar(agg.total[pk]),
    p2latest: `<a data-nav="${A.idx('phase2')}" style="color:var(--ph2);cursor:pointer;font-weight:700">${dt.fmt(P2.latest)}</a>`,
    p2late: P2.delay > 0 ? (A.isAr() ? ` – الإفراج الحالي متأخر ${P2.start - P2.baseStart} يوماً، والإنجاز <b style="color:var(--bad)">+${P2.delay} يوم</b>` : ` – currently released ${F.days(P2.start - P2.baseStart)} late, completion <b style="color:var(--bad)">${F.days(P2.delay)}</b>`) : '',
    p2row: ms.findIndex((m) => m.k === 'p2') + 1,
    advAmt: F.sar(M.pay.amount), advPct: M.pay.pct, advPer: F.sar(M.pay.perMonth), advMonths: M.pay.months,
    permitDate: dt.fmt(M.by['1.3'].e), ddDate: dt.fmt(M.by['2.6'].e),
  });

  A.changes.start = (el) => { const d = dt.parse(el.value); if (d) A.setState(Z.setStart(A.s.st, d)); };

  const span = (list) => {
    if (!list.length) return null;
    return { s: Math.min(...list.map((a) => a.s)), e: Math.max(...list.map((a) => a.e)) };
  };
  const durText = (sp) => { if (!sp) return '–'; const M = A.s.M; const k = dt.bucketOf(M.start, sp.s); const k2 = dt.bucketOf(M.start, sp.e + 1); const lo = dt.addMonths(M.start, k2), hi = dt.addMonths(M.start, k2 + 1); const m = k2 - k + (sp.e + 1 - lo) / (hi - lo) - (sp.s - dt.addMonths(M.start, k)) / (dt.addMonths(M.start, k + 1) - dt.addMonths(M.start, k)); return F.months(m); };

  /* ------------------------------------------------------------ cover */
  Z.registerSlide({
    id: 'cover', title: 'Cover', desc: 'Project overview & start date', cls: 'cover',
    render(M) {
      const stat = (k, v) => `<div class="cstat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
      const sec = [
        ['Section 1', 'Dashboard', 'Cost summary, WBS groups, phases & EPC split', 'dash'],
        ['Section 2', 'WBS & CBS', 'Structure, cost breakdown register & EPC categories', 'wbs'],
        ['Section 3', '26-Month Schedule', 'Gantt chart, S-curve & monthly cash flow', 'gantt'],
        ['Section 4', 'Assumptions & Weightages', 'Cost weightages, gates & scenario summary', 'assump'],
      ];
      const n = M.changed.length;
      return `<div class="cv" style="display:flex;flex:1;gap:50px">
        <div style="flex:1;display:flex;flex-direction:column">
          <div class="eyebrow">Saudi Arabia Railway Company</div>
          <h1>Zulfi Railway<br>Station</h1>
          ${A.ed('cv:h2', 'Project Cost, WBS / CBS &amp; 26-Month Schedule', null, { tag: 'h2' })}
          <div class="cv-stats" style="margin-top:46px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:900px">
            ${stat('Total project cost (excl. VAT)', F.sar(M.total))}
            ${stat('Project duration', F.months(M.durMonths) + ' months')}
            ${stat('Planned completion', dt.fmt(M.finish))}
          </div>
          <div style="margin-top:auto">
            <div class="eyebrow" style="margin-bottom:12px">Agenda</div>
            <div class="agenda">${sec.map((s) => `<button data-nav="${A.idx(s[3])}"><em>${s[0]}</em><b>${s[1]}</b><span>${s[2]}</span></button>`).join('')}</div>
          </div>
        </div>
        <div class="cv-r" style="width:430px;display:flex;flex-direction:column;gap:18px;justify-content:center">
          <div class="startbox"><label for="coverStart">Project start date</label>
            <input type="date" id="coverStart" value="${dt.iso(M.start)}" data-chg="start">
            ${A.ed('cv:blurb', 'Change the start date and every activity, Gantt bar, S-curve, milestone and monthly cash-flow figure in this presentation moves with it.', null, { style: 'margin-top:12px;font-size:13px;line-height:1.5;opacity:.92' })}</div>
          <div class="cstat"><div class="k">Scenario</div><div class="v" style="font-size:20px">${n ? `Revised – ${n} activities moved` : 'Baseline (as per Excel workbook)'}</div>
            <div style="font-size:13px;opacity:.85;margin-top:6px">Use <b>Next</b> / <b>→</b> to move through the deck, <b>F</b> for full screen.</div></div>
          <div class="cstat"><div class="k">Planned window</div><div class="v" style="font-size:20px">${dt.fmt(M.start)} → ${dt.fmt(M.finish)}</div></div>
        </div></div>`;
    },
  });

  /* -------------------------------------------------------- dashboard */
  Z.registerSlide({
    id: 'dash', title: 'Dashboard', desc: 'Cost summary & key figures',
    render(M) {
      const vis = A.visList(), sum = (f) => vis.filter(f).reduce((s, a) => s + a.amount, 0);
      const tot = vis.reduce((s, a) => s + a.amount, 0), p1 = sum((a) => a.phase === 'Phase 1'), p2 = sum((a) => a.phase === 'Phase 2');
      const sp = span(vis), filt = A.filtered();
      const tag = filt ? ' <span class="pill warn">filtered</span>' : '';
      const kpi = (k, v, d, cls, nav, attrs) => `<div class="kpi ${cls || ''}" ${nav ? `data-nav="${A.idx(nav)}"` : ''} ${attrs || ''}><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
      const kp = `<div class="kpis" style="grid-template-columns:1.25fr 1fr 1.25fr 1.2fr 1fr 1fr">
        ${kpi('Total project cost (excl. VAT)' + tag, F.n0(tot) + '<small>SAR</small>', `${F.pct(tot / M.total)} of full contract`, '', 'wbsreg')}
        ${kpi('VAT (15%)', F.n0(tot * Z.VAT) + '<small>SAR</small>', 'Saudi standard rate', 'alt')}
        ${kpi('Total project cost (incl. VAT)', F.n0(tot * (1 + Z.VAT)) + '<small>SAR</small>', 'Contract value with VAT', '', 'wbsreg')}
        ${kpi('Project duration', sp ? durText(sp) + '<small>months</small>' : '–', sp ? `${dt.fmtShort(sp.s)} → ${dt.fmtShort(sp.e)}` : '', 'warn', 'gantt')}
        ${kpi('Phase 1 total (excl. VAT)', F.M(p1) + '<small>SAR</small>', `${F.pct(tot ? p1 / tot : 0)} of selection`, '', null, 'data-cat="phase:Phase 1" style="cursor:pointer"')}
        ${kpi('Phase 2 total (excl. VAT)', F.M(p2) + '<small>SAR</small>', `${F.pct(tot ? p2 / tot : 0)} of selection`, 'alt', null, 'data-cat="phase:Phase 2" style="cursor:pointer"')}
      </div>`;

      // WBS groups
      const gItems = Z.GROUPS.map((g) => {
        const v = vis.filter((a) => a.group === g.code).reduce((s, a) => s + a.amount, 0);
        return { label: g.code + '  ' + g.name, value: v, color: F.groupColor(g.code), attrs: `data-grp="${g.code}"`, valText: F.M(v), sub: F.pct(tot ? v / tot : 0), tip: F.tip(g.code + ' ' + g.name, [[F.groupColor(g.code), 'Amount', F.sar(v)], ['', 'Share of selection', F.pct(tot ? v / tot : 0)], ['', 'Activities', vis.filter((a) => a.group === g.code).length], ['', 'Click', 'for details']]) };
      });
      const phItems = ['Phase 1', 'Phase 2'].map((p) => { const v = sum((a) => a.phase === p); return { label: p, value: v, color: F.phaseColor(p), attrs: `data-cat="phase:${p}"`, tip: F.tip(p, [[F.phaseColor(p), 'Amount', F.sar(v)], ['', 'Share', F.pct(tot ? v / tot : 0)]]) }; });
      const epItems = Z.EPC.map((e) => { const v = sum((a) => a.epc === e.key); return { label: e.name, value: v, color: F.epcColor(e.key), attrs: `data-cat="epc:${e.key}"`, key: e.key, tip: F.tip(e.name, [[F.epcColor(e.key), 'Amount', F.sar(v)], ['', 'Share', F.pct(tot ? v / tot : 0)]]) }; });
      const leg = (items) => `<div class="legend" style="flex-direction:column;gap:9px;flex:1;min-width:0">${items.map((i) => `<span class="hit" ${i.attrs} style="display:block;line-height:1.25"><i class="dot" style="background:${i.color}"></i>${i.label.replace(' of Materials', '').replace('Installation & Construction', 'Construction').replace(' / Preliminaries', '').replace(' (Design)', '')}<br><b style="color:var(--accent);margin-left:16px">${F.M(i.value)}</b> <span class="muted">${F.pct(tot ? i.value / tot : 0)}</span></span>`).join('')}</div>`;

      const agg = Z.aggregate(M, A.vis, 'all');
      const y1 = agg.total.slice(0, 12).reduce((s, v) => s + v, 0), y2 = agg.total.slice(12).reduce((s, v) => s + v, 0);
      const peakI = agg.total.indexOf(Math.max(...agg.total));

      return A.head('1', 'Dashboard', 'Project cost at a glance – click any bar, slice or tile for details', 'Sheet 1 · Dashboard') +
        `<div class="s-body">${kp}
        <div class="row grow" style="min-height:0">
          <div class="panel" style="width:640px"><div class="ph"><h3>Cost by WBS group</h3><span class="sub">SAR, excl. VAT</span></div>
            <div class="pb">${F.hbars(gItems, { w: 606, rowH: 74, stack: true, valW: 110, minW: 460, max: Math.max(...gItems.map((i) => i.value), 1) })}</div></div>
          <div class="panel grow"><div class="ph"><h3>Cumulative spend – S-curve</h3><div class="right"><button class="btn sm" data-nav="${A.idx('cashflow')}">Open cash flow ›</button></div></div>
            <div class="pb">${F.scurve(M, agg, { w: 378, h: 440, L: 40, R: 8, step: 3 })}
              <div class="row" style="margin-top:8px;gap:10px">
                <div class="dstat grow"><div class="k">Year 1 (M1–12)</div><div class="v">${F.M(y1)}</div><div class="hint">${F.pct(agg.sum ? y1 / agg.sum : 0)} of cost</div></div>
                <div class="dstat grow"><div class="k">Year 2 (M13+)</div><div class="v">${F.M(y2)}</div><div class="hint">${F.pct(agg.sum ? y2 / agg.sum : 0)} of cost</div></div>
                <div class="dstat grow" data-month="${peakI + 1}" style="cursor:pointer"><div class="k">Peak month</div><div class="v">M${peakI + 1} <small>${dt.fmtMY(M.bs[peakI])}</small></div><div class="hint">${F.M(agg.total[peakI])}</div></div>
              </div></div></div>
          <div class="panel" style="width:430px"><div class="ph"><h3>Phase &amp; EPC split</h3></div>
            <div class="pb" style="display:flex;flex-direction:column;gap:6px">
              <div style="display:flex;align-items:center;gap:14px"><div style="width:160px;flex:none">${F.donut(phItems, { size: 160, center: [F.pct(tot ? p1 / tot : 0, 0), 'Phase 1'], bigSize: 24 })}</div>${leg(phItems)}</div>
              <div style="display:flex;align-items:center;gap:14px"><div style="width:160px;flex:none">${F.donut(epItems, { size: 160, center: [F.M(tot, 1), 'by EPC'], bigSize: 21 })}</div>${leg(epItems)}</div>
            </div></div>
        </div></div>`;
    },
  });

  /* -------------------------------------------------------- milestones */
  Z.registerSlide({
    id: 'miles', title: 'Milestones & key gates', desc: 'Design → permit → procurement → construction', cls: '',
    render(M) {
      const ms = Z.milestones(M), P2 = Z.phase2(M);
      const X0 = 205, X1 = 1490, t0 = Math.min(M.start, ...ms.map((m) => m.d)) - 4, T = M.finish - t0 + 1;
      const x = (d) => X0 + ((d - t0) / T) * (X1 - X0);
      const PH = (ph) => M.acts.filter((a) => a.phase === ph && a.code !== Z.AUTO);
      const bands = [
        ['Phase 1', PH('Phase 1'), 'var(--ph1)', 'phase:Phase 1'],
        ['Phase 2', PH('Phase 2'), 'var(--ph2)', 'phase:Phase 2'],
        ['Design & approvals', M.acts.filter((a) => a.epc === 'ENG' || a.code === '1.2'), 'var(--eng)', 'band:0'],
        ['Work permit gate', M.acts.filter((a) => a.code === '1.3'), 'var(--c4)', 'band:1'],
        ['Procurement', M.acts.filter((a) => a.epc === 'PROC'), 'var(--proc)', 'band:2'],
        ['Installation & construction', M.acts.filter((a) => a.epc === 'CONS'), 'var(--cons)', 'band:3'],
      ];
      const SHORT = { grant1: 'Phase 1 funds granted', ntp: 'NTP', access: 'Access permits', concept: 'Concept design', prelim: 'Preliminary design', proc: '1st procurement', grant2: 'Phase 2 funds granted', p2: 'Phase 2 start', p2late: 'Latest Phase 2 start', detail: 'Detailed design', permit: 'Work permit', cons: 'Construction start', ll: 'Long-lead done', fin: 'Completion' };
      const KEY = ['grant1', 'ntp', 'grant2', 'p2', 'p2late'];
      // one chronological list: milestones and activity bars together, earliest on top
      const rows = [];
      bands.forEach((bd) => { const sp = span(bd[1]); if (sp) rows.push({ t: 'b', d: sp.s, bd, sp }); });
      ms.forEach((m, i) => rows.push({ t: 'm', d: m.d, m, i }));
      rows.sort((p, q) => p.d - q.d || (p.t === 'm' ? -1 : 1) - (q.t === 'm' ? -1 : 1));
      const TOP = 34, RH = 23, BOT = TOP + rows.length * RH + 4, H = BOT + 40;
      let svg = `<svg viewBox="0 0 1512 ${H}" width="100%" height="${H}" style="min-width:900px" data-t0="${t0}" data-t="${T}" data-x0="${X0}" data-x1="${X1}" data-b1="${M.start}" data-b2="${P2.start}" data-top="${TOP}" data-rh="${RH}" data-n="${rows.length}" data-bot="${BOT}">`;
      rows.forEach((r, i) => { if (i % 2 === 0) svg += `<rect x="0" y="${TOP + i * RH}" width="1512" height="${RH}" fill="#f4f8fa"/>`; });
      svg += `<rect id="hrow" x="0" y="0" width="1512" height="${RH}" fill="var(--brand)" opacity=".10" style="display:none" pointer-events="none"/><rect id="hcol" x="0" y="${TOP - 4}" width="26" height="${BOT - TOP + 4}" fill="var(--brand)" opacity=".10" style="display:none" pointer-events="none"/>`;
      // date ruler – top and bottom
      for (let k = 0; k <= M.N; k += 3) { const d = M.bs[Math.min(k, M.N)]; if (d < t0) continue; svg += `<line x1="${x(d)}" x2="${x(d)}" y1="${TOP - 4}" y2="${BOT}" stroke="#d9e2e8"/><text x="${x(d)}" y="12" text-anchor="middle" style="font-size:11px">${dt.fmtMY(d)}</text><text x="${x(d)}" y="25" text-anchor="middle" style="font-size:10px;fill:var(--mute)">M${k + 1}</text><text x="${x(d)}" y="${BOT + 16}" text-anchor="middle" style="font-size:11px">${dt.fmtMY(d)}</text><text x="${x(d)}" y="${BOT + 29}" text-anchor="middle" style="font-size:10px;fill:var(--mute)">M${k + 1}</text>`; }
      svg += `<line x1="${X0}" x2="${X1}" y1="${BOT}" y2="${BOT}" stroke="#9fb0bb" stroke-width="2"/>`;
      ms.filter((m) => ['ntp', 'p2', 'p2late'].includes(m.k)).forEach((m) => {
        const c = m.k === 'ntp' ? 'var(--c3)' : m.k === 'p2' ? 'var(--ph2)' : 'var(--bad)';
        svg += `<line x1="${x(m.d)}" x2="${x(m.d)}" y1="${TOP - 4}" y2="${BOT}" stroke="${c}" stroke-width="1.5" stroke-dasharray="${m.k === 'ntp' ? '0' : '5 4'}" opacity=".6"/>`;
      });
      const mk = [];
      rows.forEach((r, i) => {
