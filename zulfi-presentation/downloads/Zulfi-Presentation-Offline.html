  A.actions.p2reset = () => apply(Z.phase2(A.s.M).baseStart);

  Z.registerSlide({
    id: 'phase2', title: 'Why Phase 2 starts with Phase 1', desc: 'Critical Phase 2 activities & start scenarios',
    render(M) {
      const P = Z.phase2(M), st = M.st, g2 = st.ms.g2;
      const off = P.start - P.baseStart, delay = P.delay;
      const lo = M.start - P.baseStart, hi = 540;
      const p2amt = P.list.reduce((s, a) => s + a.amount, 0);
      const crit = P.list.filter((a) => a.floatB <= 45).sort((a, b) => a.floatB - b.floatB || a.s - b.s);
      const trackF = Math.min(...P.list.filter((a) => a.item === '7.2').map((a) => a.floatB));
      const state = off < 0 ? ['at risk – starts before the Detailed Design gate', 'var(--c4)'] : off === 0 ? ['baseline plan', 'var(--good)'] : ['released late – completion is exposed', 'var(--bad)'];
      const pre = (label, day, extra) => `<button class="chip ${Math.abs(day - P.start) < 1 ? 'on' : ''}" data-do="p2set" data-day="${day}" ${extra || ''}>${label}</button>`;
      const kpi = (k, v, d, cls) => `<div class="kpi ${cls || ''}"><div class="k">${k}</div><div class="v" style="font-size:24px">${v}</div><div class="d">${d}</div></div>`;

      // timeline: two clear periods (Phase 1 alone / both together), one bar per phase, then the Phase 2 packages
      const t0 = M.start - 5, t1 = Math.max(M.finish, M.base.finish) + 20, W = 940, L = 128, R = 14, rowH = 38, pkTop = 96;
      const x = (d) => L + ((d - t0) / (t1 - t0)) * (W - L - R);
      const P1 = M.acts.filter((a) => a.phase === 'Phase 1' && a.code !== Z.AUTO);
      const p1End = Math.max(...P1.map((a) => a.e)), ovEnd = Math.min(p1End, M.finish), bot = pkTop + ITEMS.length * rowH;
      const q2 = { s: P.start, e: Math.max(...P.list.map((a) => a.e)) };
      const aMonths = (P.start - M.start) / 30.4375, bMonths = (ovEnd + 1 - P.start) / 30.4375;
      let svg = `<svg viewBox="0 0 ${W} ${bot + 20}" width="100%" style="min-width:760px">`;
      svg += `<rect x="${x(P.start)}" y="32" width="${Math.max(0, x(ovEnd + 1) - x(P.start))}" height="${bot - 32}" fill="var(--ph2)" opacity=".06"/>`;
      for (let k = 0; k <= M.N; k += 3) { const d = M.bs[Math.min(k, M.N)]; svg += `<line x1="${x(d)}" x2="${x(d)}" y1="32" y2="${bot}" stroke="#e6ecf0"/><text x="${x(d)}" y="${bot + 14}" text-anchor="middle" style="font-size:10.5px">${dt.fmtMY(d)}</text>`; }
      // period header
      if (x(P.start) - x(M.start) > 6) svg += `<rect x="${x(M.start)}" y="2" width="${x(P.start) - x(M.start)}" height="26" rx="5" fill="#d9eef2"/><text x="${(x(M.start) + x(P.start)) / 2}" y="19" text-anchor="middle" style="font-size:11.5px;font-weight:800;fill:var(--brand-d)">Phase 1 alone · ${F.months(aMonths)} months</text>`;
      svg += `<rect x="${x(P.start)}" y="2" width="${Math.max(6, x(ovEnd + 1) - x(P.start))}" height="26" rx="5" fill="#e3def9"/><text x="${(x(P.start) + x(ovEnd + 1)) / 2}" y="19" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#4a3bb3">Phase 1 + Phase 2 together · ${F.months(bMonths)} months</text>`;
      // one bar per phase
      svg += `<text x="0" y="50" style="font-size:12.5px;font-weight:800;fill:var(--ph1)">Phase 1</text><rect x="${x(M.start)}" y="36" width="${x(p1End + 1) - x(M.start)}" height="20" rx="4" fill="var(--ph1)"/><text x="${x(M.start) + 8}" y="50" style="fill:#fff;font-size:11px;font-weight:700">${dt.fmtShort(M.start)} → ${dt.fmtShort(p1End)}</text>`;
      svg += `<text x="0" y="74" style="font-size:12.5px;font-weight:800;fill:var(--ph2)">Phase 2</text><rect x="${x(q2.s)}" y="60" width="${Math.max(4, x(q2.e + 1) - x(q2.s))}" height="20" rx="4" fill="var(--ph2)"/><text x="${x(q2.s) + 8}" y="74" style="fill:#fff;font-size:11px;font-weight:700">${dt.fmtShort(q2.s)} → ${dt.fmtShort(q2.e)}</text>`;
      // Phase 2 packages
      ITEMS.forEach(([key, name], i) => {
        const y = pkTop + i * rowH, list = P.list.filter((a) => a.item === key), f = Math.min(...list.map((a) => a.floatB));
        const first = Math.min(...list.map((a) => a.s)), short = { '7.2': 'Railway Track', '3.3': 'FF&E (Furniture)', '6.1': 'Access Road', '4.3': 'Generator Room' }[key];
        svg += `<text x="0" y="${y + 15}" style="font-size:12px;font-weight:700;fill:var(--accent)">${key} ${short}</text>`;
        const early = f <= 45 && first <= P.start + 45;
        const lab = f < 0 ? `late ${-Math.round(f)} d` : early ? `MUST START BY ${dt.fmtShort(first + f)}` : f <= 45 ? 'critical – cannot slip' : `${Math.round(f)} d float`;
        const col = f < 0 ? 'var(--bad)' : f <= 0 ? 'var(--bad)' : f <= 45 ? 'var(--warn)' : 'var(--good)';
        if (early || f < 0) svg += `<text x="${x(first) - 6}" y="${y + 19}" text-anchor="end" style="font-size:11px;font-weight:800;fill:${col}">${lab} ▶</text>`;
        else svg += `<text x="${x(first) - 6}" y="${y + 19}" text-anchor="end" style="font-size:10.5px;font-weight:700;fill:${col}">${lab}</text>`;
        list.forEach((a) => {
          const c = a.kind === 'b' ? 'var(--cons)' : a.kind === 'a3' ? 'var(--proc)' : '#f3a888';
          if (a.changed) svg += `<rect x="${x(a.bs)}" y="${y + 26}" width="${Math.max(2, x(a.be + 1) - x(a.bs))}" height="3" fill="#99a6b0"/>`;
          svg += `<g class="hit" data-act="${a.code}" data-tip="${F.tip(a.code + ' · ' + F.esc(a.name), [['', 'Start', dt.fmt(a.s)], ['', 'Finish', dt.fmt(a.e)], ['', 'Float to baseline completion', Math.round(a.floatB) + ' d'], ['', 'Latest start', dt.fmt(a.s + a.floatB)]])}"><rect class="hv" x="${x(a.s)}" y="${y + 5}" width="${Math.max(3, x(a.e + 1) - x(a.s))}" height="19" rx="3" fill="${c}" ${early && a === list[0] ? 'stroke="var(--bad)" stroke-width="2"' : ''}/></g>`;
        });
      });
      svg += `<line x1="${x(P.start)}" x2="${x(P.start)}" y1="30" y2="${bot}" stroke="var(--ph2)" stroke-width="2"/>`;
      if (delay > 0) svg += `<line x1="${x(M.finish)}" x2="${x(M.finish)}" y1="30" y2="${bot}" stroke="var(--bad)" stroke-width="2"/><text x="${x(M.finish) - 4}" y="${pkTop - 6}" text-anchor="end" style="font-size:10.5px;font-weight:800;fill:var(--bad)">New completion ${dt.fmtShort(M.finish)} (${F.days(delay)})</text>`;
      svg += '</svg>';

      const rows = crit.map((a) => {
        const f = Math.round(a.floatB);
        const pill = f < 0 ? `<span class="pill bad">late ${-f} d</span>` : f === 0 ? '<span class="pill crit">critical</span>' : `<span class="pill warn">${f} d float</span>`;
        return `<tr class="act" data-act="${a.code}"><td><b style="color:var(--brand-d)">${a.code}</b></td><td style="max-width:300px;overflow:hidden;text-overflow:ellipsis">${F.esc(a.name)}${a.ll ? ' <span class="pill ll">long-lead</span>' : ''}</td><td>${dt.fmtShort(a.s)}</td><td><b>${dt.fmtShort(a.s + a.floatB)}</b></td><td class="num">${F.compact(a.amount)}</td><td>${pill}</td></tr>`;
      }).join('');

      return A.head('1c', 'Why Phase 2 must start with Phase 1', 'The Phase 2 packages that drive the completion date – move the Phase 2 start and see the consequences', 'Sheet 3 + Sheet 4 · gates & long-lead') +
        `<div class="s-body" style="gap:12px">
          <div class="panel"><div class="pb" style="padding:12px 16px">
            <div class="row" style="align-items:center;gap:14px;flex-wrap:wrap">
              <b style="color:var(--ph2)">Move the Phase 2 start (release)</b>
              <input type="date" class="dinput" style="width:150px;height:32px" value="${dt.iso(P.start)}" min="${dt.iso(M.start)}" data-chg="p2date">
              <input type="range" id="p2range" min="${lo}" max="${hi}" step="1" value="${off}" style="width:300px;accent-color:var(--ph2)" data-chg="p2range">
              <span id="p2lbl" style="min-width:210px;font-weight:700;color:${state[1]}">${F.days(off)} · ${state[0]}</span>
              <span class="seg" style="border:0;gap:6px;background:none">${pre('With Phase 1 (NTP)', M.start)}${pre('Baseline', P.baseStart)}${pre('+1 month', dt.addMonths(P.baseStart, 1))}${pre('+3 months', dt.addMonths(P.baseStart, 3))}${pre('+6 months', dt.addMonths(P.baseStart, 6))}</span>
              <button class="btn sm" data-do="p2reset">Reset</button>
            </div>
          </div></div>
          <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
            ${kpi('Phase 2 start (release)', dt.fmt(P.start), `baseline ${dt.fmtShort(P.baseStart)} · ${F.deltaHtml(off)}`, 'alt')}
            ${kpi('Latest start to hold completion', dt.fmt(P.latest), P.latest - P.start >= 0 ? `${Math.round(P.latest - P.start)} days of margin left` : `<b style="color:var(--bad)">${Math.round(P.start - P.latest)} days too late</b>`, P.latest - P.start >= 0 ? '' : 'warn')}
            ${kpi('Project completion', dt.fmt(M.finish), delay > 0 ? `<span class="delta up">${F.days(delay)} vs baseline ${dt.fmtShort(M.base.finish)}</span>` : `<span class="delta zero">on baseline ${dt.fmtShort(M.base.finish)}</span>`, delay > 0 ? 'warn' : '')}
            ${kpi('Phase 2 amount granted by', dt.fmt(P.start - g2), `${g2} days before the Phase 2 start · Phase 2 value ${F.M(p2amt)} SAR`, '')}
          </div>
          <div class="row grow" style="gap:14px">
            <div class="panel" style="width:960px"><div class="ph"><h3>Phase 2 packages on the programme</h3><span class="sub">click a bar for details</span><div class="right legend" style="font-size:11px"><span><i class="dot" style="background:#f3a888"></i>Prequal. / PO</span><span><i class="dot" style="background:var(--proc)"></i>Manufacture &amp; delivery</span><span><i class="dot" style="background:var(--cons)"></i>Installation</span><span><i class="dot" style="background:#99a6b0;height:3px;vertical-align:3px"></i>Baseline</span></div></div><div class="pb" style="padding-top:0;overflow-x:auto;overflow-y:hidden">${svg}</div></div>
            <div class="panel grow"><div class="ph"><h3>Why it must start with Phase 1</h3></div><div class="pb scroll" style="font-size:12px;line-height:1.42;padding-top:0">
              ${A.ed('why:p2', WHY_TPL, whyTokens(M, P, g2, delay, trackF))}
            </div></div>
          </div>
          <div class="panel" style="max-height:170px;flex:none"><div class="ph"><h3>Critical Phase 2 activities that must start early</h3><span class="sub">float to the baseline completion ≤ 45 days · ${crit.length} of ${P.list.length} Phase 2 activities</span></div>
            <div class="pb scroll" data-keep="p2tbl" style="padding-top:0"><table class="tbl tight"><thead><tr><th>WBS</th><th>Activity</th><th>Start</th><th>Must start by</th><th class="num">SAR</th><th>Status</th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="empty">No critical Phase 2 activity</td></tr>'}</tbody></table></div></div>
        </div>`;
    },
    after(el) {
      const r = el.querySelector('#p2range'), l = el.querySelector('#p2lbl');
      if (r && l) r.addEventListener('input', () => { const P = Z.phase2(A.s.M); l.textContent = dt.fmt(P.baseStart + (+r.value)) + ' (' + F.days(+r.value) + ')'; });
    },
  });
})(window);

</script>
<script>
/* Slides 4-5: WBS structure (treemap, EPC) and the CBS register table */
(function (G) {
  const Z = G.Z, F = Z.F, dt = Z.dt, A = Z.app;

  /* ----------------------------------------------------- WBS structure */
  Z.registerSlide({
    id: 'wbs', title: 'WBS structure & cost', desc: 'Treemap, cumulative % and EPC Level-0',
    render(M) {
      const vis = A.visList(), tot = vis.reduce((s, a) => s + a.amount, 0), all = M.total;
      // leaf nodes: BOQ items + the two lump groups
      const nodes = {};
      vis.forEach((a) => {
        const key = a.item || a.group;
        const n = nodes[key] || (nodes[key] = { key, group: a.group, value: 0, count: 0, isItem: !!a.item });
        n.value += a.amount; n.count++;
      });
      const items = Object.values(nodes).map((n) => {
        const nm = n.isItem ? Z.ITEM_BY[n.key].name : Z.GROUP_BY[n.key].name;
        const code = n.isItem ? n.key : n.key.replace('.0', '.0');
        return {
          label: `${code} ${nm}`, short: code, value: n.value, color: F.groupColor(n.group),
          attrs: n.isItem ? `data-item="${n.key}"` : `data-grp="${n.key}"`, valText: F.M(n.value) + ' · ' + F.pct(tot ? n.value / tot : 0),
          tip: F.tip(`${code} ${nm}`, [[F.groupColor(n.group), 'Amount', F.sar(n.value)], ['', 'Share', F.pct(tot ? n.value / tot : 0)], ['', 'Activities', n.count], ['', 'Click', 'for breakdown']]),
        };
      });
      // groups cumulative table
      let cum = 0;
      const grows = Z.GROUPS.map((g) => {
        const v = vis.filter((a) => a.group === g.code).reduce((s, a) => s + a.amount, 0); cum += v;
        return `<tr class="act" data-grp="${g.code}"><td><i class="dot" style="background:${F.groupColor(g.code)}"></i><b>${g.code}</b></td><td style="max-width:190px;overflow:hidden;text-overflow:ellipsis" title="${F.esc(g.name)}">${F.esc(g.name)}</td><td class="num">${F.n0(v)}</td><td class="num">${F.pct(tot ? v / tot : 0)}</td><td class="num">${F.pct(tot ? cum / tot : 0)}</td></tr>`;
      }).join('');
      // EPC level 0
      const emax = Math.max(...Z.EPC.map((e) => vis.filter((a) => a.epc === e.key).reduce((s, a) => s + a.amount, 0)), 1);
      const erows = Z.EPC.map((e) => {
        const v = vis.filter((a) => a.epc === e.key).reduce((s, a) => s + a.amount, 0);
        return `<tr class="act" data-cat="epc:${e.key}"><td><b>${e.code}</b></td><td>${e.name}</td><td class="num">${F.n0(v)}</td><td class="num"><div class="bar-cell"><span class="b" style="width:${(v / emax) * 90}px;background:${F.epcColor(e.key)}"></span>${F.pct(tot ? v / tot : 0)}</div></td></tr>`;
      }).join('');
      return A.head('2', 'WBS &amp; CBS structure', 'Work breakdown structure sized by cost – click any block for its cost breakdown and schedule', 'Sheet 2 · WBS &amp; CBS') +
        `<div class="s-body"><div class="row grow">
          <div class="panel grow"><div class="ph"><h3>Cost treemap</h3><span class="sub">area = SAR amount, colour = WBS group</span>
            <div class="right"><div class="legend">${Z.GROUPS.map((g) => `<span><i class="dot" style="background:${F.groupColor(g.code)}"></i>${g.code.replace('.0', '')}</span>`).join('')}</div></div></div>
            <div class="pb" style="padding-top:2px">${items.length ? F.treemap(items, 980, 700) : '<div class="empty">No activities match the filters</div>'}</div></div>
          <div class="col" style="width:540px">
            <div class="panel"><div class="ph"><h3>Level-1 WBS groups</h3><span class="sub">SAR excl. VAT</span></div><div class="pb scroll" style="padding-top:0">
              <table class="tbl"><thead><tr><th>WBS</th><th>Group</th><th class="num">Amount</th><th class="num">%</th><th class="num">Cum. %</th></tr></thead><tbody>${grows}</tbody>
              <tfoot><tr><td></td><td>Total</td><td class="num">${F.n0(tot)}</td><td class="num">${F.pct(all ? tot / all : 0)}</td><td></td></tr></tfoot></table></div></div>
            <div class="panel"><div class="ph"><h3>EPC Level-0 summary</h3><span class="sub">General · Engineering · Procurement · Construction</span></div><div class="pb" style="padding-top:0">
              <table class="tbl"><thead><tr><th>Code</th><th>Category</th><th class="num">Amount</th><th class="num">%</th></tr></thead><tbody>${erows}</tbody></table></div></div>
          </div></div></div>`;
    },
  });

  /* ------------------------------------------------------- CBS register */
  const COLS = [
    ['code', 'WBS', (a) => a.idx], ['desc', 'Description', (a) => a.desc], ['boq', 'BOQ ref', (a) => a.boq || ''], ['phase', 'Phase', (a) => a.phase],
    ['amount', 'Amount (SAR)', (a) => a.amount, 'num'], ['pct', '% total', (a) => a.amount, 'num'], ['cum', 'Cum. %', null, 'num'], ['ll', 'Long-lead', (a) => (a.ll ? 1 : 0)],
    ['epc', 'EPC', (a) => a.epc], ['s', 'Start', (a) => a.s], ['e', 'Finish', (a) => a.e], ['pred', 'Predecessor / logical link', (a) => a.pred || ''],
  ];
  const ui = () => (A.s.ui.reg = A.s.ui.reg || { col: 'code', dir: 1, collapsed: [] });

  A.actions.regSort = (el) => { const r = ui(); const c = el.dataset.col; if (r.col === c) r.dir = -r.dir; else { r.col = c; r.dir = c === 'amount' || c === 'pct' ? -1 : 1; } A.refilter(); };
  A.actions.regToggle = (el) => { const r = ui(), g = el.dataset.g, i = r.collapsed.indexOf(g); if (i >= 0) r.collapsed.splice(i, 1); else r.collapsed.push(g); A.refilter(); };
  A.actions.regExpand = () => { ui().collapsed = []; A.refilter(); };
  A.actions.regCollapse = () => { ui().collapsed = Z.GROUPS.map((g) => g.code); A.refilter(); };

  Z.registerSlide({
    id: 'wbsreg', title: 'CBS register', desc: 'Sortable cost breakdown with live dates',
    render(M) {
      const r = ui(), vis = A.visList(), tot = vis.reduce((s, a) => s + a.amount, 0);
      const grouped = r.col === 'code' && r.dir === 1;
      const colDef = COLS.find((c) => c[0] === r.col);
      let list = vis.slice();
      if (!grouped && colDef && colDef[2]) list.sort((a, b) => { const x = colDef[2](a), y = colDef[2](b); return (x < y ? -1 : x > y ? 1 : a.idx - b.idx) * r.dir; });
      else if (r.col === 'code' && r.dir === -1) list.reverse();
      let run = 0; const dtxt = (a, w) => `<td ${a.changed ? 'style="background:#fff7e0"' : ''}>${dt.fmtShort(a[w])}</td>`;
      const row = (a) => {
        run += a.amount;
        return `<tr class="act" data-act="${a.code}"><td><b style="color:var(--brand-d)">${a.code}</b></td><td style="max-width:340px;overflow:hidden;text-overflow:ellipsis" title="${F.esc(a.desc)}">${F.esc(a.desc)}${a.critical ? ' <i class="dot" style="background:var(--bad);margin:0 0 0 4px" title="On the critical path"></i>' : ''}</td><td>${a.boq || ''}</td><td><span class="pill ${a.phase === 'Phase 1' ? 'p1' : 'p2'}">${a.phase}</span></td><td class="num">${F.n0(a.amount)}</td><td class="num"><div class="bar-cell"><span class="b" style="width:${Math.min(60, (a.amount / M.total) * 1400)}px"></span>${F.pct(a.amount / M.total, 2)}</div></td><td class="num">${F.pct(M.total ? run / M.total : 0)}</td><td>${a.ll ? '<span class="pill ll">Yes</span>' : '<span class="muted">No</span>'}</td><td><span class="pill ${a.epc}">${a.epc}</span></td>${dtxt(a, 's')}${dtxt(a, 'e')}<td style="max-width:330px;overflow:hidden;text-overflow:ellipsis" title="${F.esc(a.pred || '')}">${F.esc(a.pred || '')}</td></tr>`;
      };
      let body = '';
      if (grouped) {
        Z.GROUPS.forEach((g) => {
          const ga = list.filter((a) => a.group === g.code); if (!ga.length) return;
          const gv = ga.reduce((s, a) => s + a.amount, 0), col = r.collapsed.includes(g.code);
          body += `<tr class="g" data-grp="${g.code}" style="cursor:pointer"><td><button class="tw" data-do="regToggle" data-g="${g.code}">${col ? '▸' : '▾'}</button> ${g.code}</td><td colspan="3">${F.esc(g.name)} <span class="muted" style="font-weight:500">· ${ga.length} activities</span></td><td class="num">${F.n0(gv)}</td><td class="num">${F.pct(gv / M.total, 2)}</td><td></td><td colspan="2"></td><td>${dt.fmtShort(Math.min(...ga.map((a) => a.s)))}</td><td>${dt.fmtShort(Math.max(...ga.map((a) => a.e)))}</td><td></td></tr>`;
          if (col) run += gv; else body += ga.map(row).join('');
        });
      } else body = list.map(row).join('');
      const head = COLS.map((c) => `<th class="${c[3] || ''} ${c[2] ? 'sort' : ''}" ${c[2] ? `data-do="regSort" data-col="${c[0]}"` : ''}>${c[1]}${r.col === c[0] ? (r.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('');
      return A.head('2b', 'CBS register', 'Every WBS line with cost, % of total, cumulative % and its live schedule dates', 'Sheet 2 · WBS &amp; CBS') +
        `<div class="s-body"><div class="panel grow"><div class="ph"><h3>Cost breakdown register</h3><span class="sub">click a header to sort · click a row for details · payment terms: ${M.pay.pct}% advance at NTP (SAR ${F.n0(M.pay.amount)}), recovered in equal monthly deductions</span>
          <div class="right"><button class="btn sm" data-do="regExpand">Expand all</button><button class="btn sm" data-do="regCollapse">Collapse all</button></div></div>
          <div class="pb scroll" data-keep="reg" style="padding:0 0 0"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body || '<tr><td colspan="12" class="empty">No activities match the filters</td></tr>'}</tbody>
          <tfoot><tr><td colspan="12">Total excl. VAT: <b>${F.n0(tot)}</b> SAR &nbsp;·&nbsp; VAT 15%: <b>${F.n0(tot * Z.VAT)}</b> &nbsp;·&nbsp; Total incl. VAT: <b>${F.n0(tot * (1 + Z.VAT))}</b> SAR &nbsp;·&nbsp; ${vis.length} lines</td></tr></tfoot></table></div></div></div>`;
    },
  });
})(window);

</script>
<script>
/* Slide 6: interactive Gantt chart – edit dates inline, drag bars, links highlight */
(function (G) {
  const Z = G.Z, F = Z.F, dt = Z.dt, A = Z.app;
  const DESK = { code: 88, name: 200, s: 118, e: 118, dur: 60 }, MOB = { code: 70, name: 134, s: 0, e: 0, dur: 0 };
  const LW = Object.assign({}, DESK);
  let LEFT = 0;
  const setCols = () => { Object.assign(LW, A.mobile ? MOB : DESK); LEFT = LW.code + LW.name + LW.s + LW.e + LW.dur; };
  setCols();
  const RH = 25, HH = 59;
  const ui = () => (A.s.ui.g = A.s.ui.g || { zoom: 'fit', collapsed: [], base: true });

  A.actions.phaseFilter = (el) => { const f = A.s.f; f.phase = f.phase === el.dataset.p ? 'all' : el.dataset.p; A.refilter(); };
  // always-on Phase 1 / Phase 2 summary (whole project, ignores the filters) – click to filter by that phase
  Z.phaseStrip = (M, compact) => {
    const cur = A.s.f.phase;
    return ['Phase 1', 'Phase 2'].map((p) => {
      const l = M.acts.filter((a) => a.phase === p), v = l.reduce((s, a) => s + a.amount, 0);
      const s0 = Math.min(...l.map((a) => a.s)), e0 = Math.max(...l.map((a) => a.e)), c = F.phaseColor(p);
      return `<div class="hit" data-do="phaseFilter" data-p="${p}" title="Click to show only ${p}" style="display:flex;align-items:center;gap:12px;border:2px solid ${cur === p ? c : 'var(--line)'};background:${cur === p ? 'var(--brand-xl)' : '#fff'};border-left:8px solid ${c};border-radius:12px;padding:${compact ? '8px 12px' : '8px 16px'};cursor:pointer;flex:1;min-width:0">
        <div><div style="font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:${c}">${p}</div><div style="font-size:${compact ? 17 : 20}px;font-weight:800;color:var(--accent)">${F.M(v)} <span style="font-size:12px;color:var(--ink2);font-weight:600">SAR · ${F.pct(M.total ? v / M.total : 0, 0)}</span></div></div>
        <div style="font-size:12px;color:var(--ink2);line-height:1.35;margin-left:auto;text-align:right">${l.length} activities<br>${dt.fmtShort(s0)} → ${dt.fmtShort(e0)}</div></div>`;
    }).join('');
  };

  A.actions.gZoom = (el) => { ui().zoom = el.dataset.z; A.refilter(); };
  A.actions.gBase = () => { ui().base = !ui().base; A.refilter(); };
  A.actions.gToggle = (el) => { const u = ui(), g = el.dataset.g, i = u.collapsed.indexOf(g); if (i >= 0) u.collapsed.splice(i, 1); else u.collapsed.push(g); A.refilter(); };
  A.actions.gExpand = () => { ui().collapsed = []; A.refilter(); };
  A.actions.gCollapse = () => { ui().collapsed = Z.GROUPS.map((g) => g.code); A.refilter(); };

  A.changes.gdate = (el) => {
    const a = A.s.M.by[el.dataset.code], d = dt.parse(el.value);
    if (!d) { A.refilter(); return; }
    let ns = a.s, ne = a.e;
    if (el.dataset.w === 's') ns = d; else ne = d;
    A.edit(a.code, ns, ne);
  };

  const dims = (M) => {
    setCols();
    const u = ui(), t0 = M.start, t1 = M.bs[M.N];
    const avail = A.mobile ? M.N * 36 : 1512 - LEFT - 16;
    const tlW = u.zoom === 'fit' ? avail : M.N * (u.zoom === 'wide' ? 54 : 84);
    return { t0, t1, tlW, ppd: tlW / (t1 - t0) };
  };
  A.ganttDims = dims;

  Z.registerSlide({
    id: 'gantt', title: 'Gantt chart', desc: 'Edit dates · drag bars · dependencies',
    render(M) {
      setCols();
      const u = ui(), { t0, tlW, ppd } = dims(M);
      const x = (d) => (d - t0) * ppd;
      const vis = A.visList();
      // header
      let head = '';
      let y = dt.parts(M.start).y;
      for (let yr = y; yr <= dt.parts(M.bs[M.N]).y; yr++) {
        const a = Math.max(t0, dt.ymd(yr, 0, 1)), b = Math.min(M.bs[M.N], dt.ymd(yr + 1, 0, 1));
        if (b > a) head += `<div class="gyear" style="left:${x(a)}px;width:${(b - a) * ppd}px">${yr}</div>`;
      }
      let stripes = '';
      for (let k = 0; k < M.N; k++) {
        const l = x(M.bs[k]), w = (M.bs[k + 1] - M.bs[k]) * ppd;
        head += `<div class="gmonth hit" data-month="${k + 1}" style="left:${l}px;width:${w}px;top:25px;height:34px;line-height:15px;padding-top:3px" data-tip="${F.tip('Month ' + (k + 1), [['', 'From', dt.fmt(M.bs[k])], ['', 'To', dt.fmt(M.bs[k + 1] - 1)]])}">${w >= 38 ? dt.mon(M.bs[k]) : ''}<br><span style="color:var(--mute);font-size:10px">${w >= 22 ? 'M' + (k + 1) : ''}</span></div>`;
        if (k % 2 === 0) stripes += `<div class="gstripe" style="left:${l}px;width:${w}px"></div>`;
      }
      const status = A.s.ui.status;
      const stLine = (top) => (status && status >= t0 && status <= M.bs[M.N] ? `<div class="gline" style="left:${x(status)}px"><span>${dt.fmtShort(status)}</span></div>` : '');
      let rows = '';
      Z.GROUPS.forEach((g) => {
        const ga = vis.filter((a) => a.group === g.code); if (!ga.length) return;
        const col = u.collapsed.includes(g.code);
        const s = Math.min(...ga.map((a) => a.s)), e = Math.max(...ga.map((a) => a.e)), gv = ga.reduce((q, a) => q + a.amount, 0);
        rows += `<div class="grow2 grp" data-row="${g.code}"><div class="gleft" style="width:${LEFT}px;grid-template-columns:${LW.code}px ${LW.name}px ${LW.s}px ${LW.e}px ${LW.dur}px">
          <div><button class="tw" data-do="gToggle" data-g="${g.code}">${col ? '▸' : '▾'}</button></div>
          <div class="hit" data-grp="${g.code}" title="${F.esc(g.name)}" style="cursor:pointer">${g.code.replace('.0', '')} · ${F.esc(g.name)}</div><div>${dt.fmtShort(s)}</div><div>${dt.fmtShort(e)}</div><div style="text-align:right">${F.compact(gv)}</div></div>
          <div class="gtl" style="width:${tlW}px"><div class="gsum" style="left:${x(s)}px;width:${Math.max(3, (e + 1 - s) * ppd)}px"></div></div></div>`;
        if (col) return;
        ga.forEach((a) => {
          const w = Math.max(4, (a.e + 1 - a.s) * ppd), cls = ['gbar', a.ll ? 'll' : '', a.critical ? 'crit' : '', a.conflict ? 'conf' : ''].join(' ');
          const auto = a.code === Z.AUTO;
          const tip = F.tip(`${a.code} · ${F.esc(a.name)}`, [['', 'Start', dt.fmt(a.s)], ['', 'Finish', dt.fmt(a.e)], ['', 'Amount', F.sar(a.amount)], ['', 'Float', a.critical ? 'critical (0 d)' : Math.round(a.float) + ' d'], ...(a.changed ? [['', 'vs baseline', `${F.days(a.ds)} start / ${F.days(a.de)} finish`]] : [])]);
          rows += `<div class="grow2 ${A.s.drawer && A.s.drawer.type === 'act' && A.s.drawer.id === a.code ? 'sel' : ''}" data-row="${a.code}"><div class="gleft" style="width:${LEFT}px;grid-template-columns:${LW.code}px ${LW.name}px ${LW.s}px ${LW.e}px ${LW.dur}px">
            <div class="hit" data-act="${a.code}" style="color:var(--brand-d);font-weight:700;cursor:pointer;padding-left:10px;display:flex;align-items:center;gap:6px"><span style="width:6px;height:16px;border-radius:2px;flex:none;background:${F.phaseColor(a.phase)}" title="${a.phase}"></span>${a.code}<span class="pill ${a.phase === 'Phase 1' ? 'p1' : 'p2'}" style="font-size:10px;padding:0 5px">${a.phase === 'Phase 1' ? 'P1' : 'P2'}</span></div>
            <div class="hit" data-act="${a.code}" title="${F.esc(a.desc)}" style="cursor:pointer">${F.esc(a.name)}</div>
            <div><input type="date" class="dinput ${a.ds ? 'chg' : ''}" style="width:112px;height:21px;font-size:11.5px;padding:0 3px" value="${dt.iso(a.s)}" ${auto ? 'disabled title="Spans the whole project"' : ''} data-chg="gdate" data-code="${a.code}" data-w="s"></div>
            <div><input type="date" class="dinput ${a.de ? 'chg' : ''}" style="width:112px;height:21px;font-size:11.5px;padding:0 3px" value="${dt.iso(a.e)}" ${auto ? 'disabled' : ''} data-chg="gdate" data-code="${a.code}" data-w="e"></div>
            <div style="text-align:right;color:var(--ink2)">${F.months(a.dur / 30.4375)}m</div></div>
            <div class="gtl" style="width:${tlW}px">
              ${u.base && a.changed ? `<div class="gghost" style="left:${x(a.bs)}px;width:${Math.max(3, (a.be + 1 - a.bs) * ppd)}px"></div>` : ''}
              <div class="${cls}" data-act="${a.code}" data-code="${a.code}" ${auto ? 'data-fixed="1"' : ''} style="left:${x(a.s)}px;width:${w}px;background:${F.epcColor(a.epc)}" data-tip="${tip}">${auto ? '' : '<span class="h l"></span><span class="h r"></span>'}<span class="lab" style="${x(a.s) + w > tlW - 54 ? 'left:auto;right:calc(100% + 6px)' : ''}">${F.compact(a.amount)}</span></div>
            </div></div>`;
        });
      });
      const nRows = (rows.match(/class="grow2/g) || []).length;
      const zbtn = (z, t) => `<button data-do="gZoom" data-z="${z}" class="${u.zoom === z ? 'on' : ''}">${t}</button>`;
      return A.head('3', 'Schedule – Gantt chart', 'Type a new date, or drag a bar / its ends – dependent activities, S-curve and cash flow all update live', 'Sheet 3 · 26-Month Schedule') +
        `<div class="s-body" style="gap:10px">
          <div class="row" style="gap:12px;flex:none">${Z.phaseStrip(M, true)}</div>
          <div class="row" style="align-items:center;gap:14px;flex:none">
            <span class="seg">${zbtn('fit', 'Fit')}${zbtn('wide', 'Wide')}${zbtn('xwide', 'Extra wide')}</span>
            <button class="chip ${u.base ? 'on' : ''}" data-do="gBase">Show baseline</button>
            <button class="btn sm" data-do="gExpand">Expand groups</button><button class="btn sm" data-do="gCollapse">Collapse groups</button>
            <div class="legend" style="margin-left:auto">${Z.EPC.map((e) => `<span><i class="dot" style="background:${F.epcColor(e.key)}"></i>${{ GEN: 'General', ENG: 'Engineering', PROC: 'Procurement', CONS: 'Construction' }[e.key]}</span>`).join('')}
              <span><i class="dot" style="background:var(--ph1)"></i>Phase 1</span><span><i class="dot" style="background:var(--ph2)"></i>Phase 2</span><span><i class="dot" style="background:repeating-linear-gradient(135deg,#aaa 0 3px,#fff 3px 6px)"></i>Long-lead</span><span><i class="dot" style="border:2px solid var(--bad);background:#fff"></i>Critical</span><span><i class="dot" style="border:2px dashed #8a1fbf;background:#fff"></i>Logic conflict</span><span><i class="dot" style="background:#99a6b0;height:3px;vertical-align:3px"></i>Baseline</span></div>
          </div>
          <div class="gantt" data-keep="gantt" id="gantt"><div class="gwrap" style="width:${LEFT + tlW}px">
            <div class="ghead"><div class="gleft" style="width:${LEFT}px;height:${HH}px;grid-template-columns:${LW.code}px ${LW.name}px ${LW.s}px ${LW.e}px ${LW.dur}px;font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--ink2)"><div>WBS</div><div>Activity</div><div>Start</div><div>Finish</div><div style="text-align:right">Dur</div></div>
              <div class="gtl" style="width:${tlW}px;height:${HH}px">${head}${stLine()}</div></div>
            <div style="position:relative">${rows || '<div class="empty">No activities match the filters</div>'}
              <div style="position:absolute;left:${LEFT}px;top:0;width:${tlW}px;height:${nRows * RH}px;pointer-events:none">${stripes}${stLine()}</div></div>
          </div></div>
          <div class="hint">Linking mode: <b>${{ two: 'Auto-link – successors move with the activity', push: 'Push delays only', off: 'Off – activities move independently' }[M.st.link]}</b> (change it in the top bar). Edits that break a finish-to-start link are outlined in purple.</div>
        </div>`;
    },
    after(el) { bindGantt(el); },
  });

  /* ---------------------------------------------------- drag & hover */
  function bindGantt(root) {
    const g = root.querySelector('#gantt'); if (!g) return;
    const M = A.s.M, { ppd } = dims(M);
    let drag = null;
    g.addEventListener('pointerdown', (e) => {
      const bar = e.target.closest('.gbar'); if (!bar || bar.dataset.fixed || e.button !== 0) return;
      const a = M.by[bar.dataset.code];
      drag = { bar, a, x0: e.clientX, mode: e.target.classList.contains('l') ? 'l' : e.target.classList.contains('r') ? 'r' : 'm', moved: false, l0: parseFloat(bar.style.left), w0: parseFloat(bar.style.width), ds: 0, de: 0 };
      bar.setPointerCapture(e.pointerId); e.preventDefault();
    });
    g.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const dd = Math.round((e.clientX - drag.x0) / A.scale / ppd);
      if (Math.abs(e.clientX - drag.x0) > 3) drag.moved = true;
      if (!drag.moved) return;
      const a = drag.a; let ds = 0, de = 0;
      if (drag.mode === 'm') { ds = dd; de = dd; } else if (drag.mode === 'l') { ds = Math.min(dd, a.e - a.s); } else { de = Math.max(dd, a.s - a.e); }
      ds = Math.max(ds, M.start - a.s);
      drag.ds = ds; drag.de = de;
      drag.bar.style.left = drag.l0 + ds * ppd + 'px';
      drag.bar.style.width = Math.max(4, drag.w0 + (de - ds) * ppd) + 'px';
      const tip = document.querySelector('#tip');
      tip.innerHTML = `<div class="t">${a.code} · ${F.esc(a.name)}</div><div class="r"><span>Start</span><b>${dt.fmt(a.s + ds)}</b></div><div class="r"><span>Finish</span><b>${dt.fmt(a.e + de)}</b></div><div class="r"><span>Duration</span><b>${a.e + de - a.s - ds + 1} d</b></div>`;
      tip.dataset.src = ''; tip.style.display = 'block';
      const r = document.querySelector('#stage').getBoundingClientRect();
      tip.style.left = (e.clientX - r.left) / A.scale + 14 + 'px'; tip.style.top = (e.clientY - r.top) / A.scale + 14 + 'px';
    });
    const end = (e) => {
      if (!drag) return;
      const d = drag; drag = null;
      document.querySelector('#tip').style.display = 'none';
      if (d.moved) {
        G.__ganttSuppress = true; setTimeout(() => (G.__ganttSuppress = false), 50);
        if (d.ds || d.de) A.edit(d.a.code, d.a.s + d.ds, d.a.e + d.de); else A.refilter();
      }
    };
    g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
    // relationship highlight
    g.addEventListener('mouseover', (e) => {
      const row = e.target.closest('.grow2'); g.querySelectorAll('.rp,.rs').forEach((n) => n.classList.remove('rp', 'rs'));
      if (!row || row.classList.contains('grp')) return;
      const a = M.by[row.dataset.row]; if (!a) return;
      a.deps.forEach((c) => { const n = g.querySelector(`[data-row="${c}"]`); if (n) n.classList.add('rp'); });
      a.succ.forEach((c) => { const n = g.querySelector(`[data-row="${c}"]`); if (n) n.classList.add('rs'); });
    });
    g.addEventListener('mouseleave', () => g.querySelectorAll('.rp,.rs').forEach((n) => n.classList.remove('rp', 'rs')));
  }
  // block the drawer click that follows a drag
  document.addEventListener('click', (e) => { if (G.__ganttSuppress) { e.stopPropagation(); e.preventDefault(); } }, true);
})(window);

</script>
<script>
/* Slides 7-8: monthly cash flow + S-curve, and the cash-flow matrix */
(function (G) {
  const Z = G.Z, F = Z.F, dt = Z.dt, A = Z.app;
  const ui = () => (A.s.ui.cf = A.s.ui.cf || { dim: 'group', per: 1, basis: 'cost' });
  const mxui = () => (A.s.ui.mx = A.s.ui.mx || { unit: 'k', heat: true });

  A.changes.status = (el) => { A.s.ui.status = dt.parse(el.value) || null; A.refilter(); };
  A.actions.clearStatus = () => { A.s.ui.status = null; A.refilter(); };
  A.actions.cfBasis = (el) => { ui().basis = el.dataset.b; A.refilter(); };
  A.actions.cfPer = (el) => { ui().per = +el.dataset.p; A.refilter(); };
  A.actions.cfDim = (el) => { ui().dim = el.dataset.d; A.refilter(); };
  A.actions.mxUnit = (el) => { mxui().unit = el.dataset.u; A.refilter(); };
  A.actions.mxHeat = () => { mxui().heat = !mxui().heat; A.refilter(); };

  const seriesMeta = (dim, key) => {
    if (dim === 'group') { const g = Z.GROUP_BY[key]; return { name: key.replace('.0', '') + ' ' + g.name, color: F.groupColor(key) }; }
    if (dim === 'epc') return { name: Z.EPC_BY[key].name, color: F.epcColor(key) };
    if (dim === 'phase') return { name: key, color: F.phaseColor(key) };
    return { name: 'Monthly spend', color: 'var(--brand)' };
  };
  const ORDER = { group: Z.GROUPS.map((g) => g.code), epc: Z.EPC.map((e) => e.key), phase: ['Phase 1', 'Phase 2'], all: ['all'] };

  // baseline cumulative % for the same set of activities
  const baseCurve = (M, list) => {
    const codes = new Set(list.map((a) => a.code));
    const tot = new Array(M.N).fill(0);
    M.base.acts.forEach((a) => { if (codes.has(a.code)) a.m.forEach((v, k) => (tot[k] += v)); });
    const sum = tot.reduce((x, y) => x + y, 0);
    let c = 0; return tot.map((v) => (sum ? (c += v) / sum : 0));
  };

  /* period helpers: view the project by month (per=1) or quarter (per=3) */
  const periods = (M, per) => Math.ceil(M.N / per);
  const sumP = (arr, k, per) => { let t = 0; for (let i = k * per; i < Math.min(arr.length, (k + 1) * per); i++) t += arr[i]; return t; };
  const lastIdx = (M, k, per) => Math.min(M.N, (k + 1) * per) - 1;
  const pLabel = (M, k, per) => (per === 1 ? 'M' + (k + 1) : 'Q' + (k + 1));
  const pSub = (M, k, per) => (per === 1 ? dt.mon(M.bs[k]) : 'M' + (k * per + 1) + '–' + (lastIdx(M, k, per) + 1));
  const pTitle = (M, k, per) => (per === 1 ? 'Month ' + (k + 1) + ' · ' + dt.fmt(M.bs[k]) + ' → ' + dt.fmtShort(M.bs[k + 1] - 1)
    : 'Quarter ' + (k + 1) + ' · M' + (k * per + 1) + '–M' + (lastIdx(M, k, per) + 1) + ' · ' + dt.fmtShort(M.bs[k * per]) + ' → ' + dt.fmtShort(M.bs[lastIdx(M, k, per) + 1] - 1));
  const statusX = (M, st, per, L, bw) => { const k = dt.bucketOf(M.start, st); return L + ((k + (st - M.bs[k]) / (M.bs[k + 1] - M.bs[k])) / per) * bw; };

  /* ---- reusable S-curve (also on the dashboard) ---- */
  F.scurve = function (M, agg, o) {
    o = o || {};
    const per = o.per || 1, P = periods(M, per);
    const w = o.w || 600, h = o.h || 260, L = o.L || 44, R = o.R || 14, T = 12, B = o.B || 34;
    const pw = w - L - R, ph = h - T - B, bw = pw / P;
    const X = (k) => L + (k + 0.5) * bw, Y = (p) => T + ph - p * ph;
    const base = o.baseArr || baseCurve(M, agg.list);
    const LB = o.labels || { cur: 'Cumulative', base: 'Baseline', spend: per === 1 ? 'Monthly spend' : 'Quarter spend' };
    const pct = []; const bpct = [];
    for (let k = 0; k < P; k++) { pct.push(agg.pct[lastIdx(M, k, per)]); bpct.push(base[lastIdx(M, k, per)]); }
    let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="min-width:${w > 900 ? 780 : 0}px">`;
    [0, 0.25, 0.5, 0.75, 1].forEach((p) => (s += `<g class="grid"><line x1="${L}" x2="${w - R}" y1="${Y(p)}" y2="${Y(p)}"/></g><text x="${L - 6}" y="${Y(p) + 4}" text-anchor="end" style="font-size:11px">${p * 100}%</text>`));
    for (let k = 0; k < P; k++) if (per > 1 || k % (o.step || 3) === 0) s += `<text x="${X(k)}" y="${h - B + 15}" text-anchor="middle" style="font-size:11px">${pLabel(M, k, per)}</text>` + (o.dates === false ? '' : `<text x="${X(k)}" y="${h - B + 28}" text-anchor="middle" style="font-size:9.5px;fill:var(--mute)">${per === 1 ? dt.fmtMY(M.bs[k]) : pSub(M, k, per)}</text>`);
    const pts = pct.map((p, k) => [X(k), Y(p)]);
    const poly = (arr) => arr.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
    s += `<path d="${poly([[L, Y(0)], ...pts])} L${X(P - 1)},${Y(0)} L${L},${Y(0)}Z" fill="var(--brand)" opacity=".1"/>`;
    s += `<path d="${poly([[L, Y(0)], ...bpct.map((p, k) => [X(k), Y(p)])])}" fill="none" stroke="#8a97a3" stroke-width="2" stroke-dasharray="5 4"/>`;
    s += `<path d="${poly([[L, Y(0)], ...pts])}" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linejoin="round"/>`;
    const st = A.s.ui.status;
    if (st && st >= M.start && st < M.bs[M.N]) {
      const xf = statusX(M, st, per, L, bw), v = agg.sum ? Z.cumAt(M, agg.cum, st) / agg.sum : 0;
      s += `<line x1="${xf}" x2="${xf}" y1="${T}" y2="${T + ph}" stroke="var(--bad)" stroke-width="2"/><circle cx="${xf}" cy="${Y(v)}" r="5" fill="var(--bad)" stroke="#fff" stroke-width="2"/><text x="${xf + 6}" y="${T + 12}" style="font-size:11px;font-weight:700;fill:var(--bad)">${dt.fmtShort(st)} · ${F.pct(v)}</text>`;
    }
    for (let k = 0; k < P; k++) {
      const dv = pct[k] - bpct[k], spend = sumP(agg.total, k, per);
      s += `<rect class="hit" ${per === 1 ? `data-month="${k + 1}"` : ''} x="${L + k * bw}" y="${T}" width="${bw}" height="${ph}" fill="transparent" data-tip="${F.tip(pTitle(M, k, per), [['var(--brand)', LB.cur, F.pct(pct[k]) + ' · ' + F.M(agg.cum[lastIdx(M, k, per)])], ['#8a97a3', LB.base, F.pct(bpct[k])], ['', LB.spend, F.sar(spend)], ['', 'Δ vs baseline', (dv >= 0 ? '+' : '−') + Math.abs(dv * 100).toFixed(1) + ' pts']])}"/>`;
      s += `<circle cx="${X(k)}" cy="${Y(pct[k])}" r="${per === 1 ? 2.6 : 3.6}" fill="var(--brand)" stroke="#fff" stroke-width="1" pointer-events="none"/>`;
    }
    return s + '</svg>';
  };

  /* ---- stacked columns (month or quarter) ---- */
  function stackChart(M, agg, dim, w, h, per) {
    const P = periods(M, per);
    const L = 58, R = 14, T = 12, B = 38, pw = w - L - R, ph = h - T - B, bw = pw / P;
    const tot = []; for (let k = 0; k < P; k++) tot.push(sumP(agg.total, k, per));
    const nice = F.nice(Math.max(...tot, 1), 5);
    const Y = (v) => T + ph - (v / nice.max) * ph;
    let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="min-width:780px">`;
    for (let v = 0; v <= nice.max + 1; v += nice.step) s += `<g class="grid"><line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}"/></g><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" style="font-size:11px">${F.compact(v)}</text>`;
    const keys = ORDER[dim].filter((k) => agg.map[k]);
    const gap = per === 1 ? 3 : 10;
    for (let k = 0; k < P; k++) {
      let acc = 0; const rows = [];
      keys.forEach((key) => {
        const v = sumP(agg.map[key], k, per); if (v <= 0) return;
        const y1 = Y(acc + v), y0 = Y(acc); acc += v;
        s += `<rect x="${L + k * bw + gap}" y="${y1}" width="${bw - gap * 2}" height="${Math.max(0, y0 - y1 - 1.5)}" fill="${seriesMeta(dim, key).color}" ${y0 - y1 > 8 ? 'rx="2"' : ''} stroke="#fff" stroke-width=".5"/>`;
        rows.push([seriesMeta(dim, key).color, seriesMeta(dim, key).name, F.n0(v)]);
      });
      s += `<text x="${L + (k + 0.5) * bw}" y="${h - B + 14}" text-anchor="middle" style="font-size:11px">${pLabel(M, k, per)}</text><text x="${L + (k + 0.5) * bw}" y="${h - B + 27}" text-anchor="middle" style="font-size:9.5px;fill:var(--mute)">${pSub(M, k, per)}</text>`;
      s += `<rect class="hit" ${per === 1 ? `data-month="${k + 1}"` : ''} x="${L + k * bw}" y="${T}" width="${bw}" height="${ph}" fill="transparent" data-tip="${F.tip(pTitle(M, k, per), [...rows.reverse(), ['', '<b>Total</b>', '<b>' + F.sar(tot[k]) + '</b>'], ['', 'Cumulative', F.pct(agg.pct[lastIdx(M, k, per)])]])}"/>`;
    }
    const st = A.s.ui.status;
    if (st && st >= M.start && st < M.bs[M.N]) { const xf = statusX(M, st, per, L, bw); s += `<line x1="${xf}" x2="${xf}" y1="${T}" y2="${T + ph}" stroke="var(--bad)" stroke-width="2"/>`; }
    return s + '</svg>';
  }

  /* ---- payments view: work done + advance (up), recovery (down) ---- */
  function payChart(M, w, h, per) {
    const pay = M.pay, P = periods(M, per);
    const L = 58, R = 14, T = 12, B = 38, pw = w - L - R, ph = h - T - B, bw = pw / P;
    const up = [], dn = [];
    for (let k = 0; k < P; k++) { up.push(sumP(M.totalM, k, per) + sumP(pay.advIn, k, per)); dn.push(sumP(pay.rec, k, per)); }
    const maxUp = Math.max(...up, 1), maxDn = Math.max(...dn, 0);
    const nice = F.nice(maxUp + maxDn, 6), top = Math.ceil(maxUp / nice.step) * nice.step, bot = Math.ceil(maxDn / nice.step) * nice.step;
    const span = top + bot, Y = (v) => T + ph - ((v + bot) / span) * ph;
    let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="min-width:780px">`;
    for (let v = -bot; v <= top + 1; v += nice.step) s += `<g class="grid"><line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}"/></g><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" style="font-size:11px">${F.compact(v)}</text>`;
    s += `<line x1="${L}" x2="${w - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#7d8b96" stroke-width="1.5"/>`;
    for (let k = 0; k < P; k++) {
      const work = sumP(M.totalM, k, per), adv = sumP(pay.advIn, k, per), rec = sumP(pay.rec, k, per), x = L + k * bw + (per === 1 ? 3 : 10), ww = bw - (per === 1 ? 6 : 20);
      s += `<rect x="${x}" y="${Y(work)}" width="${ww}" height="${Math.max(0, Y(0) - Y(work) - 1)}" fill="var(--brand)" rx="2"/>`;
      if (adv > 0) s += `<rect x="${x}" y="${Y(work + adv)}" width="${ww}" height="${Math.max(0, Y(work) - Y(work + adv) - 1.5)}" fill="var(--c1)" rx="2"/>`;
      if (rec > 0) s += `<rect x="${x}" y="${Y(0) + 1}" width="${ww}" height="${Math.max(0, Y(-rec) - Y(0) - 1)}" fill="var(--c2)" rx="2"/>`;
      const netv = work + adv - rec;
      s += `<text x="${L + (k + 0.5) * bw}" y="${h - B + 14}" text-anchor="middle" style="font-size:11px">${pLabel(M, k, per)}</text><text x="${L + (k + 0.5) * bw}" y="${h - B + 27}" text-anchor="middle" style="font-size:9.5px;fill:var(--mute)">${pSub(M, k, per)}</text>`;
      s += `<rect class="hit" ${per === 1 ? `data-month="${k + 1}"` : ''} x="${L + k * bw}" y="${T}" width="${bw}" height="${ph}" fill="transparent" data-tip="${F.tip(pTitle(M, k, per), [['var(--brand)', 'Work done', F.sar(work)], ['var(--c1)', 'Advance received', F.sar(adv)], ['var(--c2)', 'Advance recovery', '− ' + F.sar(rec)], ['', '<b>Net payment</b>', '<b>' + F.sar(netv) + '</b>'], ['', 'Advance balance', F.sar(pay.balance[lastIdx(M, k, per)])]])}"/>`;
    }
    return s + '</svg>';
  }

  const lblS = 'font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)';
  const basisSeg = (b) => `<span class="lbl" style="${lblS}">Basis</span><span class="seg"><button data-do="cfBasis" data-b="cost" class="${b === 'cost' ? 'on' : ''}">Work done (cost)</button><button data-do="cfBasis" data-b="pay" class="${b === 'pay' ? 'on' : ''}">Payments (with advance)</button></span><span class="sep" style="margin:0 2px"></span>`;
  function payView(M, per) {
    const pay = M.pay, dtp = (d) => dt.fmtMY(d);
    const pkI = pay.net.indexOf(Math.max(...pay.net));
    const kp = (k, v, d, extra) => `<div class="dstat" ${extra || ''}><div class="k">${k}</div><div class="v">${v}</div><div class="hint">${d}</div></div>`;
    const fake = { pct: pay.cumPct, cum: pay.cum, total: pay.net, sum: M.total, list: M.acts };
    const workPct = M.cum.map((v) => v / M.total);
    return A.head('3b', 'Cash flow &amp; payments', 'Advance payment of ' + pay.pct + '% received at NTP and recovered in equal monthly deductions', 'Payment terms · applied to the total contract value') +
      `<div class="s-body" style="gap:12px">
        <div class="row" style="align-items:center;gap:14px;flex:none">${basisSeg('pay')}
          <span class="lbl" style="${lblS}">View</span>
          <span class="seg"><button data-do="cfPer" data-p="1" class="${per === 1 ? 'on' : ''}">Monthly</button><button data-do="cfPer" data-p="3" class="${per === 3 ? 'on' : ''}">Quarterly</button></span>
          <span class="hint">Edit the advance % and recovery start on the Assumptions slide.</span>
        </div>
        <div class="row grow" style="gap:16px">
          <div class="col grow" style="gap:12px">
            <div class="panel" style="flex:1.15"><div class="ph"><h3>${per === 1 ? 'Monthly' : 'Quarterly'} payments</h3><span class="sub">SAR · work done + advance above the line, recovery below</span>
              <div class="right legend"><span><i class="dot" style="background:var(--brand)"></i>Work done</span><span><i class="dot" style="background:var(--c1)"></i>Advance received</span><span><i class="dot" style="background:var(--c2)"></i>Advance recovery</span></div></div>
              <div class="pb" style="padding-top:0">${payChart(M, 1090, 305, per)}</div></div>
            <div class="panel" style="flex:1"><div class="ph"><h3>Cumulative payments vs work done</h3>
              <div class="right legend"><span><i class="dot" style="background:var(--brand)"></i>Cumulative payments</span><span><i class="dot" style="background:#8a97a3"></i>Cumulative work done</span></div></div>
              <div class="pb" style="padding-top:0">${F.scurve(M, fake, { w: 1090, h: 245, L: 58, R: 14, B: 36, step: 1, dates: false, per, baseArr: workPct, labels: { cur: 'Cumulative payments', base: 'Cumulative work done', spend: per === 1 ? 'Net payment' : 'Net payment (quarter)' } })}</div></div>
          </div>
          <div class="col" style="width:372px;gap:12px">
            ${kp('Advance payment (' + pay.pct + '%)', F.sar(pay.amount), 'of ' + F.sar(M.total) + ' · received at NTP ' + dt.fmtShort(M.start))}
            ${kp('Monthly recovery', F.sar(pay.perMonth), `equal deductions · month ${pay.from} → ${M.N} (${pay.months} months)`)}
            <div class="row" style="gap:12px">${kp('Balance after 12 months', F.M(pay.balance[Math.min(11, M.N - 1)]), 'advance still to recover', 'style="flex:1"')}${kp('Balance at end', F.sar(pay.balance[M.N - 1]), 'fully recovered', 'style="flex:1"')}</div>
            ${kp('Net payment in month 1', F.sar(pay.net[0]), 'work done + advance − recovery')}
            ${kp('Peak net payment', `M${pkI + 1} <small>${dtp(M.bs[pkI])}</small>`, F.sar(pay.net[pkI]), `data-month="${pkI + 1}" style="cursor:pointer"`)}
            ${kp('Total payments', F.sar(pay.cum[M.N - 1]), 'equals the contract value – the advance nets to zero')}
            <div class="note info" style="margin-top:auto">${A.ed('note:pay', 'The advance is paid on account, not extra cost: total payments equal the contract value (excl. VAT). Payments are for the whole contract (filters do not apply).')}</div>
          </div>
        </div></div>`;
  }

  Z.registerSlide({
    id: 'cashflow', title: 'Cash flow & S-curve', desc: 'Monthly spend, cumulative %, vs baseline',
    render(M) {
      const u = ui(), dim = u.dim, st = A.s.ui.status, per = u.per || 1;
      if ((u.basis || 'cost') === 'pay') return payView(M, per);
      const agg = Z.aggregate(M, A.vis, dim === 'all' ? 'all' : dim);
      const tot = agg.sum, y1 = agg.total.slice(0, 12).reduce((a, b) => a + b, 0), y2 = tot - y1;
      const pk = agg.total.indexOf(Math.max(...agg.total)), m50 = agg.pct.findIndex((p) => p >= 0.5);
      const keys = ORDER[dim].filter((k) => agg.map[k]);
      const dbtn = (d, t) => `<button data-do="cfDim" data-d="${d}" class="${dim === d ? 'on' : ''}">${t}</button>`;
      const atSt = st ? Z.cumAt(M, agg.cum, st) : null;
      const kp = (k, v, d, extra) => `<div class="dstat" ${extra || ''}><div class="k">${k}</div><div class="v">${v}</div><div class="hint">${d}</div></div>`;
      return A.head('3b', 'Cash flow &amp; S-curve', 'Monthly cost-loaded spend and cumulative progress against the baseline plan', 'Sheet 3 · 26-Month Schedule (rows 80–86 + charts)') +
        `<div class="s-body" style="gap:12px">
          <div class="row" style="align-items:center;gap:14px;flex:none">
            ${basisSeg('cost')}
            <span class="lbl" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)">Stack by</span>
            <span class="seg">${dbtn('group', 'WBS group')}${dbtn('epc', 'EPC category')}${dbtn('phase', 'Phase')}${dbtn('all', 'Total')}</span>
            <span class="lbl" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-left:10px">View</span>
            <span class="seg"><button data-do="cfPer" data-p="1" class="${per === 1 ? 'on' : ''}">Monthly</button><button data-do="cfPer" data-p="3" class="${per === 3 ? 'on' : ''}">Quarterly</button></span>
            <span class="lbl" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-left:10px">Status date</span>
            <input type="date" class="dinput" style="width:140px;height:30px" value="${st ? dt.iso(st) : ''}" min="${dt.iso(M.start)}" max="${dt.iso(M.bs[M.N] - 1)}" data-chg="status">
            ${st ? '<button class="btn sm" data-do="clearStatus">Clear</button>' : '<span class="hint">pick a date to read planned progress</span>'}
          </div>
          <div class="row grow" style="gap:16px">
            <div class="col grow" style="gap:12px">
              <div class="panel" style="flex:1.15"><div class="ph"><h3>${per === 1 ? 'Monthly' : 'Quarterly'} spend</h3><span class="sub">SAR per project ${per === 1 ? 'month · click for detail' : 'quarter (3 months)'}</span><div class="right legend" style="max-width:640px;justify-content:flex-end">${keys.map((k) => `<span><i class="dot" style="background:${seriesMeta(dim, k).color}"></i>${seriesMeta(dim, k).name.replace(/^(\d) .*/, (m, d) => m.length > 24 ? m.slice(0, 22) + '…' : m)}</span>`).join('')}</div></div><div class="pb" style="padding-top:0">${stackChart(M, agg, dim, 1090, 305, per)}</div></div>
              <div class="panel" style="flex:1"><div class="ph"><h3>S-curve – cumulative % complete (cost)</h3>
                <div class="right legend"><span><i class="dot" style="background:var(--brand)"></i>Current plan</span><span><i class="dot" style="background:#8a97a3"></i>Baseline</span></div></div>
                <div class="pb" style="padding-top:0">${F.scurve(M, agg, { w: 1090, h: 245, L: 58, R: 14, B: 36, step: 1, dates: false, per })}</div></div>
            </div>
            <div class="col" style="width:372px;gap:12px">
              <div class="col" style="gap:8px">${Z.phaseStrip(M, true)}</div>
              ${kp('Total (selection)', F.sar(tot), `${agg.list.length} activities · ${F.pct(M.total ? tot / M.total : 0)} of project`)}
              <div class="row" style="gap:12px">${kp('Year 1 · M1–12', F.M(y1), F.pct(tot ? y1 / tot : 0) + ' of cost', 'style="flex:1"')}${kp('Year 2 · M13+', F.M(y2), F.pct(tot ? y2 / tot : 0) + ' of cost', 'style="flex:1"')}</div>
              ${kp('Peak month', `M${pk + 1} <small>${dt.fmtMY(M.bs[pk])}</small>`, F.sar(agg.total[pk]), `data-month="${pk + 1}" style="cursor:pointer"`)}
              ${kp('Average monthly spend', F.M(tot / M.N), `over ${M.N} months`)}
              ${kp('50% of cost reached', m50 >= 0 ? `M${m50 + 1} <small>${dt.fmtMY(M.bs[m50])}</small>` : '–', m50 >= 0 ? `cumulative ${F.pct(agg.pct[m50])}` : '')}
              ${kp('Planned progress at status date', st ? F.pct(tot ? atSt / tot : 0) : '–', st ? `${dt.fmt(st)} · ${F.sar(atSt)}` : 'choose a status date above', st ? 'style="border-color:var(--bad)"' : '')}
              <div class="note info" style="margin-top:auto">${A.ed('note:cf', 'Baseline = the original Excel plan re-based on the current start date. Move activities or change assumptions and the gap shows here.')}</div>
            </div>
          </div></div>`;
    },
  });

  /* ------------------------------------------------------------ matrix */
  Z.registerSlide({
    id: 'matrix', title: 'Cash-flow matrix', desc: 'Activity × month heat-map (Excel grid)',
    render(M) {
      const u = mxui(), vis = A.visList();
      const fmt = (v) => (v < 0.5 ? '' : u.unit === 'sar' ? F.n0(v) : u.unit === 'k' ? F.n0(v / 1000) : (v / 1e6).toFixed(2));
      const maxCell = Math.max(...vis.flatMap((a) => a.m), 1);
      const cell = (v, a) => `<td class="c ${v < 0.5 ? 'z' : ''}" style="${u.heat && v >= 0.5 ? `background:rgba(0,119,139,${(0.07 + 0.78 * Math.sqrt(v / maxCell)).toFixed(2)});${v / maxCell > 0.45 ? 'color:#fff;' : ''}` : ''}">${v < 0.5 ? '·' : fmt(v)}</td>`;
      const SC = [0, 58, 292];
      let head = `<th class="stk" style="left:0;z-index:5;min-width:58px">WBS</th><th class="stk" style="left:58px;z-index:5;min-width:234px">Activity</th><th class="stk num" style="left:292px;z-index:5;min-width:92px">Total</th>`;
      for (let k = 0; k < M.N; k++) head += `<th class="m hit" data-month="${k + 1}" data-tip="${F.tip('Month ' + (k + 1), [['', 'From', dt.fmt(M.bs[k])], ['', 'To', dt.fmt(M.bs[k + 1] - 1)]])}">M${k + 1}<br><span style="font-weight:500;color:var(--mute)">${dt.fmtMY(M.bs[k])}</span></th>`;
      let body = '';
      Z.GROUPS.forEach((g) => {
        const ga = vis.filter((a) => a.group === g.code); if (!ga.length) return;
        const gm = new Array(M.N).fill(0); ga.forEach((a) => a.m.forEach((v, k) => (gm[k] += v)));
        body += `<tr class="g"><td class="stk" style="left:0">${g.code.replace('.0', '')}</td><td class="stk" style="left:58px" data-grp="${g.code}"><span style="cursor:pointer">${F.esc(g.name)}</span></td><td class="stk num" style="left:292px">${F.n0(gm.reduce((x, y) => x + y, 0))}</td>${gm.map((v) => `<td class="c" style="font-weight:700">${fmt(v) || '·'}</td>`).join('')}</tr>`;
        ga.forEach((a) => { body += `<tr class="act" data-act="${a.code}"><td class="stk" style="left:0;color:var(--brand-d);font-weight:700">${a.code}</td><td class="stk" style="left:58px;max-width:234px;overflow:hidden;text-overflow:ellipsis" title="${F.esc(a.desc)}">${F.esc(a.name)}</td><td class="stk num" style="left:292px">${F.n0(a.amount)}</td>${a.m.map((v) => cell(v, a)).join('')}</tr>`; });
      });
      const agg = Z.aggregate(M, A.vis, 'all');
      const ft = (label, vals, top, f) => `<tr class="tot"><td class="stk" style="left:0;bottom:${top}px;z-index:4"></td><td class="stk" style="left:58px;bottom:${top}px;z-index:4">${label}</td><td class="stk num" style="left:292px;bottom:${top}px;z-index:4">${f === 'sum' ? F.n0(agg.sum) : f === 'adv' ? F.n0(M.pay.amount) : f === 'rec' ? F.n0(-M.pay.amount) : f === 'net' ? F.n0(M.total) : ''}</td>${vals.map((v) => `<td class="c" style="bottom:${top}px">${f === 'pct' ? F.pct(v, 1) : v < 0 ? '−' + fmt(-v) : fmt(v) || '·'}</td>`).join('')}</tr>`;
      const ubtn = (k, t) => `<button data-do="mxUnit" data-u="${k}" class="${u.unit === k ? 'on' : ''}">${t}</button>`;
      return A.head('3c', 'Cash-flow matrix', 'Every activity’s cost spread across the project months – the Excel schedule grid, live', 'Sheet 3 · 26-Month Schedule (grid)') +
        `<div class="s-body" style="gap:10px"><div class="row" style="align-items:center;gap:14px;flex:none"><span class="lbl" style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mute)">Units</span><span class="seg">${ubtn('sar', 'SAR')}${ubtn('k', 'SAR thousand')}${ubtn('m', 'SAR million')}</span>
          <button class="chip ${u.heat ? 'on' : ''}" data-do="mxHeat">Heat-map</button><span class="hint">Click a row for activity details, a month header for the month's breakdown.</span></div>
          <div class="panel grow"><div class="pb scroll hm" data-keep="matrix" style="padding:0"><table class="tbl hm"><thead><tr>${head}</tr></thead><tbody>${body || '<tr><td colspan="30" class="empty">No activities match the filters</td></tr>'}</tbody>
          <tfoot style="display:table-footer-group">${ft('Total monthly spend', agg.total, 130, 'sum')}${ft('Cumulative spend', agg.cum, 104)}${ft('Cumulative % complete', agg.pct, 78, 'pct')}${ft('Advance payment received', M.pay.advIn, 52, 'adv')}${ft('Advance recovery (−)', M.pay.rec.map((v) => -v), 26, 'rec')}${ft('Net payment', M.pay.net, 0, 'net')}</tfoot></table></div></div></div>`;
    },
  });
})(window);

</script>
<script>
/* Slides 9-10: Assumptions & weightages (editable) and the scenario summary */
(function (G) {
  const Z = G.Z, F = Z.F, dt = Z.dt, A = Z.app;

  A.changes.asm = (el) => {
    const key = el.dataset.k;
    if (key.startsWith('adv.') || key.startsWith('ms.')) {
      const lim = { 'adv.pct': [0, 100], 'adv.from': [1, 60], 'ms.g1': [0, 730], 'ms.g2': [0, 730] }[key] || [0, 100];
      const val = Math.round(Math.max(lim[0], Math.min(lim[1], parseFloat(el.value))));
      if (!isFinite(val)) { A.refilter(); return; }
      const st2 = Z.cloneState(A.s.st); const [g, f] = key.split('.'); st2[g][f] = val; A.setState(st2); return;
    }
    const v = Math.max(0, Math.min(100, parseFloat(el.value)));
    if (!isFinite(v)) { A.refilter(); return; }
    const st = Z.cloneState(A.s.st), path = el.dataset.k.split('.');
    if (path[0] === 'proc') st.A.proc[+path[1]] = v; else st.A[path[0]][path[1]] = v;
    A.setState(st);
  };
  A.actions.asmReset = () => { const st = Z.cloneState(A.s.st); st.A = Z.cloneA(Z.DEFAULT_A); st.adv = { ...Z.DEFAULT_ADV }; st.ms = { ...Z.DEFAULT_MS }; A.setState(st); };

  const inp = (k, v, max) => `<input class="ninput" type="number" min="0" max="${max || 100}" step="1" value="${+(+v).toFixed(2)}" data-chg="asm" data-k="${k}">`;
  const sumChip = (s) => (Math.abs(s - 100) < 0.001 ? '<span class="pill ok">= 100%</span>' : `<span class="pill warn">sums to ${+s.toFixed(2)}%</span>`);

  Z.registerSlide({
    id: 'assump', title: 'Assumptions & weightages', desc: 'Editable cost weightages & schedule gates',
    render(M) {
      const a = M.st.A, by = M.by;
      const disc = Object.entries(Z.DISC).map(([k, d]) => {
        const c = 100 - a.disc[k];
        return `<tr><td><b>${d.name}</b></td><td>${inp('disc.' + k, a.disc[k])} %</td><td class="num"><b>${+c.toFixed(2)}%</b> ${c <= a.disc[k] ? '<span class="pill warn">materials ≥ construction</span>' : ''}</td><td class="muted" style="max-width:300px;overflow:hidden;text-overflow:ellipsis;font-size:12px" title="${F.esc(d.applies)}">${d.applies}</td></tr>`;
      }).join('');
      const ps = a.proc.reduce((x, y) => x + y, 0), dsum = a.stage.concept + a.stage.prelim + a.stage.detail, ss = a.sub.sub + a.sub.appr;
      const dur = (c1, c2) => F.months((by[c2].e - by[c1].s + 1) / 30.4375);
      const procRows = [['Vendor Prequalification', 0], ['PO Issuance', 1], ['Manufacture and Delivery to Site', 2]].map(([n, i]) => `<tr><td>${n}</td><td>${inp('proc.' + i, a.proc[i])} %</td></tr>`).join('');
      const stRows = [['Concept Design', 'concept', '2.1', '2.2'], ['Preliminary Design', 'prelim', '2.3', '2.4'], ['Detailed Design', 'detail', '2.5', '2.6']].map(([n, k, c1, c2]) => `<tr><td>${n}<div class="hint">${dur(c1, c2)} months</div></td><td>${inp('stage.' + k, a.stage[k])} %</td><td class="num">${F.pct(a.stage[k] / (dsum || 1), 2)}</td></tr>`).join('');
      const p1a1 = M.acts.filter((x) => x.kind === 'a1' && x.phase === 'Phase 1'), p2a1 = M.acts.filter((x) => x.kind === 'a1' && x.phase === 'Phase 2');
      const lag = p1a1.length ? Math.min(...p1a1.map((x) => x.s)) - by['2.4'].e : 0;
      const gates = [
        ['Access permits (request submission & approval)', `${dt.fmtShort(by['1.2'].s)} → ${dt.fmtShort(by['1.2'].e)}`, '1.2'],
        ['Concept design – submission / approval', `${dt.fmtShort(by['2.1'].s)} / ${dt.fmtShort(by['2.2'].e)}`, '2.1'],
        ['Work permit approval (14 days)', `${dt.fmtShort(by['1.3'].s)} → ${dt.fmtShort(by['1.3'].e)}`, '1.3'],
        ['Work permit predecessor', 'FS: Detailed Design Approval (2.6) – ends ' + dt.fmtShort(by['2.6'].e), '2.6'],
        ['Construction commencement', 'Later of Work Permit OR own Manufacture & Delivery', null],
        ['Phase 1 procurement lag after Preliminary Design approval', `${lag} day${lag === 1 ? '' : 's'} (Excel: 15 days → next month)`, '2.4'],
        ['Phase 2 procurement gate', 'After Detailed Design approval · from ' + (p2a1.length ? dt.fmtShort(Math.min(...p2a1.map((x) => x.s))) : '–'), '2.6'],
        ['Long-lead threshold', '4+ months lead time · Signalling, Track, Turnout, Substation, Generator', null],
        ['Total project duration', `${F.months(M.durMonths)} months (${dt.fmtShort(M.start)} → ${dt.fmtShort(M.finish)}) · baseline 26`, null],
      ];
      const proc = M.acts.filter((x) => x.epc === 'PROC').reduce((s, x) => s + x.amount, 0), cons = M.acts.filter((x) => x.epc === 'CONS').reduce((s, x) => s + x.amount, 0);
      const eng = M.acts.filter((x) => x.epc === 'ENG').reduce((s, x) => s + x.amount, 0), gen = by['1.1'].amount + by['1.2'].amount + by['1.3'].amount;
      const parts = [['General', gen, 'var(--gen)'], ['Engineering', eng, 'var(--eng)'], ['Procurement', proc, 'var(--proc)'], ['Construction', cons, 'var(--cons)']];
      return A.head('4', 'Assumptions &amp; weightages', 'Edit any weightage – amounts, cash flow and S-curve recalculate; the total contract value stays fixed', 'Sheet 4 · Assumptions &amp; Weightages') +
        `<div class="s-body"><div class="row grow">
          <div class="col grow" style="gap:14px">
            <div class="panel"><div class="ph"><h3>1 · Discipline materials / construction split</h3><span class="sub">construction is always the higher share</span></div><div class="pb" style="padding-top:0"><table class="tbl tight"><thead><tr><th>Discipline</th><th>Materials</th><th class="num">Construction</th><th>Applies to</th></tr></thead><tbody>${disc}</tbody></table></div></div>
            <div class="row" style="gap:14px">
              <div class="panel" style="width:320px"><div class="ph"><h3>2 · Procurement stages</h3>${sumChip(ps)}</div><div class="pb" style="padding-top:0"><table class="tbl"><thead><tr><th>Stage</th><th>Weight</th></tr></thead><tbody>${procRows}</tbody></table><div class="hint" style="margin-top:6px">Within each item’s procurement share.</div></div></div>
              <div class="panel grow"><div class="ph"><h3>3 · Design stages</h3>${sumChip(dsum)}</div><div class="pb" style="padding-top:0"><table class="tbl"><thead><tr><th>Stage</th><th>Raw</th><th class="num">Normalised</th></tr></thead><tbody>${stRows}</tbody></table><div class="hint" style="margin-top:6px">Raw weights sum to 105% – normalised so design stays SAR ${F.n0(Z.DESIGN_TOTAL)}.</div></div></div>
              <div class="panel" style="width:230px"><div class="ph"><h3>4 · Sub-activity</h3></div><div class="pb" style="padding-top:0"><table class="tbl"><thead><tr><th>Sub-activity</th><th>Weight</th></tr></thead><tbody><tr><td>Submission</td><td>${inp('sub.sub', a.sub.sub)} %</td></tr><tr><td>Approval</td><td>${inp('sub.appr', a.sub.appr)} %</td></tr></tbody></table><div style="margin-top:6px">${sumChip(ss)}</div></div></div>
            </div>
            <div class="panel"><div class="ph"><h3>6 · Advance payment &amp; funding milestones</h3><span class="sub">taken from the total contract value</span></div><div class="pb" style="padding-top:0"><table class="tbl tight"><thead><tr><th>Item</th><th>Value</th><th>Result</th></tr></thead><tbody>
              <tr><td>Advance payment (received at NTP)</td><td>${inp('adv.pct', M.pay.pct)} % of contract</td><td><b>${F.sar(M.pay.amount)}</b></td></tr>
              <tr><td>Recovery starts in month (equal monthly deductions to the last month)</td><td>${inp('adv.from', M.pay.from, 60)} month</td><td><b>${F.sar(M.pay.perMonth)}</b> × ${M.pay.months} months</td></tr>
              <tr><td>Phase 1 amount granted – before NTP</td><td>${inp('ms.g1', M.st.ms.g1, 730)} days</td><td><b>${dt.fmt(M.start - M.st.ms.g1)}</b></td></tr>
              <tr><td>Phase 2 amount granted – before the Phase 2 start</td><td>${inp('ms.g2', M.st.ms.g2, 730)} days</td><td><b>${dt.fmt(Z.phase2(M).start - M.st.ms.g2)}</b></td></tr></tbody></table></div></div>
            <div class="row" style="align-items:center;gap:12px"><button class="btn" data-do="asmReset">Reset weightages to Excel values</button><span class="hint">Changes are saved in this browser and included in the share link.</span></div>
          </div>
          <div class="col" style="width:560px;gap:14px">
            <div class="panel grow" style="min-height:0"><div class="ph"><h3>5 · Schedule gates &amp; key assumptions</h3><span class="sub">live values</span></div><div class="pb scroll" style="padding-top:0"><table class="tbl tight"><thead><tr><th>Rule</th><th>Value now</th></tr></thead><tbody>${gates.map((g) => `<tr class="${g[2] ? 'act' : ''}" ${g[2] ? `data-act="${g[2]}"` : ''}><td class="wrap" style="width:230px">${g[0]}</td><td class="wrap"><b>${g[1]}</b></td></tr>`).join('')}</tbody></table></div></div>
            <div class="panel"><div class="ph"><h3>Impact on cost mix</h3><span class="sub">total stays SAR ${F.n0(M.total)}</span></div><div class="pb">
              <div style="display:flex;height:26px;border-radius:7px;overflow:hidden">${parts.map((p) => `<div style="width:${(p[1] / M.total) * 100}%;background:${p[2]}" data-tip="${F.tip(p[0], [['', 'Amount', F.sar(p[1])], ['', 'Share', F.pct(p[1] / M.total)]])}"></div>`).join('')}</div>
              <table class="tbl tight" style="margin-top:10px"><thead><tr><th>Discipline</th><th class="num">Materials</th><th class="num">Construction</th></tr></thead><tbody>${Object.entries(Z.DISC).map(([k, d]) => { const its = Z.ITEMS.filter((i) => i.disc === k).map((i) => i.key); const mt = M.acts.filter((x) => its.includes(x.item) && x.kind !== 'b').reduce((s, x) => s + x.amount, 0), cs = M.acts.filter((x) => its.includes(x.item) && x.kind === 'b').reduce((s, x) => s + x.amount, 0); return `<tr><td>${d.name}</td><td class="num">${F.M(mt)}</td><td class="num">${F.M(cs)}</td></tr>`; }).join('')}</tbody></table>
              <div class="legend" style="margin-top:8px">${parts.map((p) => `<span><i class="dot" style="background:${p[2]}"></i>${p[0]} <b style="color:var(--accent)">${F.pct(p[1] / M.total)}</b></span>`).join('')}</div></div></div>
          </div></div></div>`;
    },
  });

  /* ------------------------------------------------------- scenario */
  const csv = (M) => {
    const hdr = ['WBS', 'Activity', 'Phase', 'EPC', 'Amount_SAR', 'Start', 'Finish', 'Duration_days', 'Baseline_start', 'Baseline_finish', 'Start_shift_days', 'Finish_shift_days'];
    for (let k = 0; k < M.N; k++) hdr.push('M' + (k + 1) + ' ' + dt.fmtMY(M.bs[k]));
    const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
    const rows = M.acts.map((a) => [a.code, q(a.desc), a.phase, a.epc, Math.round(a.amount * 100) / 100, dt.iso(a.s), dt.iso(a.e), a.dur, dt.iso(a.bs), dt.iso(a.be), a.ds, a.de, ...a.m.map((v) => Math.round(v))]);
    return [hdr.join(','), ...rows.map((r) => r.join(','))].join('\n');
  };
  A.actions.exportCsv = () => {
    const blob = new Blob(['﻿' + csv(A.s.M)], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'zulfi-schedule-' + dt.iso(A.s.M.start) + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  A.actions.shareLink = () => {
    const url = location.href.split('#')[0] + '#s=' + btoa(unescape(encodeURIComponent(Z.serialize(A.s.st))));
    const done = () => { const b = document.querySelector('[data-do="shareLink"]'); if (b) { b.textContent = 'Link copied ✓'; setTimeout(() => A.refilter(), 1600); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => prompt('Copy this link', url)); else prompt('Copy this link', url);
  };

  Z.registerSlide({
    id: 'scenario', title: 'Scenario summary', desc: 'Baseline vs revised · changes · export',
    render(M) {
      const ag = Z.aggregate(M, () => true, 'all'), bt = M.base.totalM;
      const y1 = ag.total.slice(0, 12).reduce((a, b) => a + b, 0), by1 = bt.slice(0, 12).reduce((a, b) => a + b, 0);
      const pk = ag.total.indexOf(Math.max(...ag.total)), bpk = bt.indexOf(Math.max(...bt));
      const m50 = ag.pct.findIndex((p) => p >= 0.5), b50 = M.base.pct.findIndex((p) => p >= 0.5);
      const fd = M.finish - M.base.finish;
      const row = (k, b, r, d) => `<tr><td>${k}</td><td class="muted">${b}</td><td><b>${r}</b></td><td>${d}</td></tr>`;
      const ch = M.changed.filter((a) => a.code !== Z.AUTO);
      const crow = ch.map((a) => `<tr class="act" data-act="${a.code}"><td><b style="color:var(--brand-d)">${a.code}</b></td><td style="max-width:260px;overflow:hidden;text-overflow:ellipsis">${F.esc(a.name)}</td><td class="muted">${dt.fmtShort(a.bs)} → ${dt.fmtShort(a.be)}</td><td><b>${dt.fmtShort(a.s)} → ${dt.fmtShort(a.e)}</b></td><td>${F.deltaHtml(a.ds, ' d')}</td><td>${F.deltaHtml(a.de, ' d')}</td></tr>`).join('');
      const asmChanged = JSON.stringify(M.st.A) !== JSON.stringify(Z.DEFAULT_A);
      return A.head('5', 'Scenario summary', 'What changed versus the Excel baseline – and how to take it with you', 'Derived from all four sheets') +
        `<div class="s-body"><div class="kpis" style="grid-template-columns:repeat(4,1fr)">
          <div class="kpi"><div class="k">Project start</div><div class="v" style="font-size:24px">${dt.fmt(M.start)}</div><div class="d">anchor for all 26 monthly buckets</div></div>
          <div class="kpi ${fd > 0 ? 'warn' : ''}"><div class="k">Planned completion</div><div class="v" style="font-size:24px">${dt.fmt(M.finish)}</div><div class="d">${F.deltaHtml(fd)}</div></div>
          <div class="kpi alt"><div class="k">Activities moved</div><div class="v">${ch.length}<small>of ${M.acts.length - 1}</small></div><div class="d">${asmChanged ? 'Weightages edited too' : 'Weightages as per Excel'}</div></div>
          <div class="kpi ${M.conflicts.length ? 'warn' : ''}"><div class="k">Dependency conflicts</div><div class="v">${M.conflicts.length}</div><div class="d">${M.conflicts.length ? 'review in the Gantt' : 'all links respected'}</div></div>
        </div>
        <div class="row grow">
          <div class="col" style="width:640px;gap:14px">
            <div class="panel"><div class="ph"><h3>Baseline vs revised</h3></div><div class="pb" style="padding-top:0"><table class="tbl"><thead><tr><th>Metric</th><th>Baseline</th><th>Revised</th><th>Δ</th></tr></thead><tbody>
              ${row('Phase 2 start (release)', dt.fmtShort(Z.phase2(M).baseStart), dt.fmtShort(Z.phase2(M).start), F.deltaHtml(Z.phase2(M).start - Z.phase2(M).baseStart))}
              ${row('Advance payment', 'SAR ' + F.n0(M.pay.amount), 'SAR ' + F.n0(M.pay.amount), `<span class="delta zero">${M.pay.pct}% · ${F.n0(M.pay.perMonth)}/month</span>`)}
              ${row('Completion date', dt.fmtShort(M.base.finish), dt.fmtShort(M.finish), F.deltaHtml(fd))}
              ${row('Duration (months)', '26', F.months(M.durMonths), F.deltaHtml(Math.round((M.durMonths - 26) * 30.4375)))}
              ${row('Total cost (excl. VAT)', F.M(M.total), F.M(M.total), '<span class="delta zero">fixed</span>')}
              ${row('Year-1 spend (M1–12)', F.M(by1), F.M(y1), `<span class="delta ${y1 > by1 ? 'down' : y1 < by1 ? 'up' : 'zero'}">${y1 === by1 ? '–' : (y1 > by1 ? '+' : '−') + F.M(Math.abs(y1 - by1))}</span>`)}
              ${row('Peak month', `M${bpk + 1} · ${F.M(bt[bpk])}`, `M${pk + 1} · ${F.M(ag.total[pk])}`, '')}
              ${row('50% of cost reached', 'M' + (b50 + 1), m50 >= 0 ? 'M' + (m50 + 1) : '–', m50 >= 0 ? `${m50 - b50 >= 0 ? '+' : '−'}${Math.abs(m50 - b50)} mo` : '')}
            </tbody></table></div></div>
            <div class="panel grow"><div class="ph"><h3>Take it with you</h3></div><div class="pb" style="display:flex;flex-direction:column;gap:10px">
              <div class="row" style="flex-wrap:wrap;gap:10px"><button class="btn primary" data-do="shareLink">Copy share link</button><button class="btn" data-do="exportCsv">Export schedule (CSV)</button><button class="btn" onclick="Z.app.print()">Print / save PDF</button><button class="btn danger" data-do="resetAll">Reset everything to baseline</button></div>
              <div class="hint">${A.ed('hint:scen', 'The share link carries the start date, every moved activity and edited weightage – anyone who opens it sees the same scenario. Your edits are also remembered in this browser.')}</div></div></div>
          </div>
          <div class="panel grow"><div class="ph"><h3>Moved activities</h3><span class="sub">${ch.length} versus baseline</span></div><div class="pb scroll" data-keep="scen" style="padding:0">
            ${ch.length ? `<table class="tbl"><thead><tr><th>WBS</th><th>Activity</th><th>Baseline</th><th>Revised</th><th>Start Δ</th><th>Finish Δ</th></tr></thead><tbody>${crow}</tbody></table>` : '<div class="empty">No changes yet.<br>Edit a date on the Gantt slide, or change the project start in the top bar –<br>this list and every chart will update.</div>'}</div></div>
        </div></div>`;
    },
  });
})(window);

</script>
<script>
  // toolbar icon + label markup
  (function () {
    var I = Z.app.icons, set = function (id, h) { document.getElementById(id).innerHTML = h; };
    var T = function (t) { return '<span class="t">' + t + '</span>'; };
    set('mBack', I.prev + 'Back'); set('mNext', 'Next' + I.next); set('mSide', I.menu + 'Sections'); set('mFilt', I.filter + 'Filters');
    if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) { document.getElementById('bFull').style.display = 'none'; }
    set('bReset', I.reset + T('Reset'));
    set('bEdit', I.pencil + T('Edit text')); set('bSide', I.menu + T('Sections')); set('bFilters', I.filter + T('Filters'));
    set('bBack', I.prev + T('Back')); set('bNext', T('Next') + I.next);
    set('bFull', I.full + T('Full screen')); set('bExit', I.exit + T('Exit full screen')); set('bPrint', I.print + T('Print'));
    Z.app.boot();
  })();
</script>
</body>
