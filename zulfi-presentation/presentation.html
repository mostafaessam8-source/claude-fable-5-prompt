<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zulfi Railway Station – Project Presentation</title>
<meta name="description" content="Interactive management presentation: WBS, cost breakdown, 26-month schedule, Gantt chart and S-curve for the Zulfi Railway Station project.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="bar">
    <a class="brand" href="index.html" title="Back to the guide" style="color:inherit;text-decoration:none"><div class="logo">SAR</div><div>Zulfi Railway Station<small>Cost, WBS &amp; 26-month schedule</small></div></a>
    <span class="grow"></span>
    <label class="tb-field" title="Changing the project start date moves the whole schedule"><span class="t">Project start</span> <input type="date" id="startIn"></label>
    <label class="tb-field" title="How dependent activities react when you move an activity"><span class="t">Linking</span>
      <select id="linkSel"><option value="two">Auto-link</option><option value="push">Push only</option><option value="off">Off</option></select></label>
    <button class="tb-btn" id="scen" title="Open the scenario summary"></button>
    <button class="tb-btn" id="bReset" title="Reset the presentation to its default (start date 25 Oct 2026, no changes)"></button>
    <span class="grow"></span>
    <button class="tb-btn" id="bEdit" title="Edit the text on the slides (saved with the scenario)"></button>
    <button class="tb-btn" id="bSide" title="Show / hide the sections menu"></button>
    <button class="tb-btn" id="bFilters" title="Show / hide the filter bar"></button>
    <button class="tb-btn" id="bBack" title="Previous slide (←)"></button>
    <span id="slideNo"></span>
    <button class="tb-btn" id="bNext" title="Next slide (→)"></button>
    <button class="tb-btn" id="bPptx" title="Export the deck as an editable PowerPoint file"></button>
    <button class="tb-btn" id="bFull" title="Full screen (F)"></button>
    <button class="tb-btn" id="bExit" title="Exit full screen (Esc)" style="display:none"></button>
    <a class="tb-btn" data-online href="management.html" title="Management update – Arabic / English" style="text-decoration:none">عربي</a>
    <a class="tb-btn" data-online href="index.html#download" title="Guide and offline download" style="text-decoration:none">Guide</a>
    <button class="tb-btn" id="bPrint" title="Print all slides / save as PDF"></button>
  </header>
  <div id="edbar"><b>Edit text</b> · click any dashed text and type · click any name or label to rename it · <kbd>Ctrl</kbd>+<kbd>B</kbd> bold · coloured <span class="tk">{tags}</span> are live values and update by themselves · changes are saved automatically<span style="flex:1"></span><button class="btn sm" data-do="edResetSlide">Restore this slide</button><button class="btn sm" data-do="edResetAll">Restore all</button><button class="btn sm primary" id="edDone">Done</button></div>
  <div id="filters"><span id="fDyn"></span><span class="sep"></span><input class="f-input" id="fQ" type="search" placeholder="Search code or activity…"><button class="linkbtn" id="fReset">Clear filters</button><span id="fCount"></span></div>
  <div id="mnav"><button id="mBack"></button><button id="mSide"></button><span id="mNo"></span><button id="mFilt"></button><button id="mNext"></button></div>
  <div id="body"><nav id="side" aria-label="Sections"></nav><main id="viewport"><div id="stageBox"><div id="stage"><div id="scrim"></div><aside id="drawer" aria-label="Details"></aside><div id="tip"></div></div></div></main></div>
</div>
<script src="data.js"></script>
<script src="js/engine.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/fmt.js"></script>
<script src="js/drawers.js"></script>
<script src="js/slides-overview.js"></script>
<script src="js/slides-phase2.js"></script>
<script src="js/slides-wbs.js"></script>
<script src="js/slides-schedule.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/slides-cashflow.js"></script>
<script src="js/slides-assump.js"></script>
<script src="js/pptx.js"></script>
<script>
  // toolbar icon + label markup
  (function () {
    var I = Z.app.icons, set = function (id, h) { document.getElementById(id).innerHTML = h; };
    var T = function (t) { return '<span class="t">' + t + '</span>'; };
    set('mBack', I.prev + 'Back'); set('mNext', 'Next' + I.next); set('mSide', I.menu + 'Sections'); set('mFilt', I.filter + 'Filters');
    if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) { document.getElementById('bFull').style.display = 'none'; }
    set('bReset', I.reset + T('Reset'));
    set('bEdit', I.pencil + T('Edit text')); set('bSide', I.menu + T('Sections')); set('bFilters', I.filter + T('Filters'));
    set('bBack', I.prev + T('Back')); set('bNext', T('Next') + I.next);
    set('bPptx', I.ppt + T('PowerPoint')); set('bFull', I.full + T('Full screen')); set('bExit', I.exit + T('Exit full screen')); set('bPrint', I.print + T('Print'));
    Z.app.boot();
  })();
</script>
<div id="zbuild" style="position:fixed;left:6px;bottom:3px;font:10px/1 sans-serif;color:#768692;opacity:.7;z-index:5;pointer-events:none" class="noprint">build __BUILD__</div><script>(function(e){if(e.textContent.indexOf('__BUI'+'LD__')>0)e.remove()})(document.getElementById('zbuild'))</script>
</body>
</html>
