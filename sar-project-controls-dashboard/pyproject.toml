[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-project-controls-dashboard"
version = "1.0.0"
description = "SAR Project Controls Dashboard - Primavera P6 XER baseline vs current analyzer"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "matplotlib>=3.8", "numpy>=1.26", "openpyxl>=3.1", "reportlab>=4.0", "rapidfuzz>=3.0"]

[project.scripts]
sar-pcd = "sar_pcd.__main__:main"

[tool.setuptools.packages.find]
include = ["sar_pcd*"]

[tool.setuptools.package-data]
sar_pcd = ["resources/*", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
