<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P6 Web – Schedule Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Crect x='6' y='8' width='12' height='4' rx='1' fill='%23fff'/%3E%3Crect x='11' y='14' width='14' height='4' rx='1' fill='%23fff'/%3E%3Crect x='8' y='20' width='10' height='4' rx='1' fill='%23fca5a5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="titlebar"></div>
  <header id="topbar">
    <div class="brand"><svg viewBox="0 0 32 32" width="22" height="22"><rect width="32" height="32" rx="7" fill="#2563eb"/><rect x="6" y="8" width="12" height="4" rx="1" fill="#fff"/><rect x="11" y="14" width="14" height="4" rx="1" fill="#fff"/><rect x="8" y="20" width="10" height="4" rx="1" fill="#fca5a5"/></svg><b>P6&nbsp;Web</b></div>
    <nav id="menubar"></nav>
    <div class="spacer"></div>
    <button id="projBtn" class="projname" title=""></button>
    <button id="langBtn" class="tbtn" title="Language / اللغة">EN</button>
    <button id="themeBtn" class="tbtn" title="Theme"></button>
  </header>
  <div id="toolbar"></div>
  <div id="work">
    <aside id="sideL" class="side"></aside>
    <div id="center">
      <div id="winhead"></div>
      <div id="wintabs"></div>
      <div id="layoutbar"></div>
      <div id="winpane"></div>
      <main id="main">
        <section id="tablePane">
          <div id="tHead"></div>
          <div id="tBody"><div id="tRows"></div></div>
        </section>
        <div id="vsplit" title="⇆"></div>
        <section id="ganttPane">
          <div id="gHead"></div>
          <div id="gScroll"></div>
        </section>
      </main>
      <div id="hsplit" title="⇅"></div>
      <section id="details"></section>
    </div>
    <aside id="sideR" class="side"></aside>
  </div>
  <footer id="statusbar"></footer>
  <div id="tip" hidden></div>
  <div id="ctx" hidden></div>
  <div id="toasts"></div>
  <div id="dropzone" hidden><div>⬇</div></div>
</div>
<input type="file" id="fileInput" hidden accept=".xer,.xml,.csv,.tsv,.txt,.json,.p6web">
<script src="js/core.js"></script>
<script src="js/io.js"></script>
<script src="js/sample.js"></script>
<script src="js/evm.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n2.js"></script>
<script src="js/columns.js"></script>
<script src="js/gantt.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/dialogs2.js"></script>
<script src="js/details2.js"></script>
<script src="js/print.js"></script>
<script src="js/win.js"></script>
<script src="js/menus.js"></script>
<script src="js/p6ui.js"></script>
<script>App.boot();</script>
</body>
</html>
