<script>
/* P6 Web – P6-style Columns dialog, code managers, user-defined fields, float-path analysis. */
(function (g) {
  'use strict';
  const P6 = g.P6, App = g.App, D = App.dialogs;
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = P6.esc, t = (k, ...a) => P6.t(k, ...a);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const modal = (o) => D.modal(o);
  const label = (k) => t('col_' + k);

  // =============== Columns (Available Options tree / Selected Options list) ===============
  D.columns = function () {
    let cols = clone(App.cfg.cols);
    const open = new Set(['gen']);
    let selA = null;           // {type:'g'|'k', id}
    let selB = new Set();      // keys selected on the right
    let q = '';
    const body = document.createElement('div');
    body.className = 'colsdlg';
    const draw = () => {
      P6.rebuildDynCols(App.p);
      const chosen = new Set(cols.map((c) => c.k));
      const groups = P6.colGroups(App.p).filter((gr) => gr.keys.length || ['acg', 'acp', 'pcode', 'udf'].includes(gr.id));
      const left = groups.map((gr) => {
        const keys = gr.keys.filter((k) => !chosen.has(k) && (!q || label(k).toLowerCase().includes(q.toLowerCase())));
        if (q && !keys.length) return '';
        const isOpen = open.has(gr.id) || !!q;
        return `<div class="cg${selA && selA.type === 'g' && selA.id === gr.id ? ' on' : ''}" data-g="${gr.id}"><span class="pm" data-tog="${gr.id}">${isOpen ? '−' : '+'}</span>${esc(gr.label[App.cfg.lang === 'en' ? 0 : 1])}</div>` +
          (isOpen ? keys.map((k) => `<div class="ck2${selA && selA.type === 'k' && selA.id === k ? ' on' : ''}" data-k="${esc(k)}" dir="auto">${esc(label(k))}</div>`).join('') : '');
      }).join('');
      body.innerHTML = `<div class="cd-left"><div class="cd-h">${esc(t('available_opts'))}<input id="cd_q" placeholder="${esc(t('search'))}" value="${esc(q)}" dir="auto"></div><div class="cd-list" id="cd_a">${left}</div></div>
        <div class="cd-mid"><button class="cdb" data-a="add" title="${esc(t('add'))}">▶</button><button class="cdb" data-a="addall">⏩</button><button class="cdb" data-a="rem">◀</button><button class="cdb" data-a="remall">⏪</button></div>
        <div class="cd-right"><div class="cd-h">${esc(t('selected_opts'))}</div><div class="cd-list" id="cd_b">${cols.map((c, i) => `<div class="ck2${selB.has(c.k) ? ' on' : ''}" data-b="${i}" dir="auto">${esc(c.title || label(c.k))}</div>`).join('')}</div></div>
        <div class="cd-ud"><button class="cdb" data-a="up">▲</button><button class="cdb" data-a="down">▼</button></div>
        <div class="cd-btns"><button class="btn pri" data-a="ok">✔ ${esc(t('ok'))}</button><button class="btn" data-a="cancel">⦸ ${esc(t('cancel'))}</button><button class="btn" data-a="apply">${esc(t('apply'))}</button><button class="btn" data-a="copy">${esc(t('copy_from'))}</button><button class="btn" data-a="default">▶ ${esc(t('default'))}</button><button class="btn" data-a="edit"${selB.size === 1 ? '' : ' disabled'}>${esc(t('edit_column'))}</button><button class="btn" data-a="help">? ${esc(t('help'))}</button></div>`;
      const sc = $('#cd_a', body); if (sc && draw.sa != null) sc.scrollTop = draw.sa;
      const sb = $('#cd_b', body); if (sb && draw.sb != null) sb.scrollTop = draw.sb;
    };
    draw();
    const m = modal({ title: t('columns'), cls: 'wide colsmodal', body, buttons: [], sticky: true });
    const apply = () => { if (!cols.length) return App.toast(t('err_no_cols'), true); App.cfg.cols = clone(cols); App.cfg.layoutName = ''; App.saveCfg(); App.refresh(); };
    const addKeys = (keys) => { keys.forEach((k) => { if (!cols.some((c) => c.k === k)) cols.push({ k, w: App.ALL_COLS[k].w }); }); };
    const visibleLeaf = () => { const chosen = new Set(cols.map((c) => c.k)); return P6.colGroups(App.p).flatMap((gr) => gr.keys).filter((k) => !chosen.has(k)); };
    body.addEventListener('input', (e) => { if (e.target.id === 'cd_q') { q = e.target.value; draw.sa = null; draw(); const i = $('#cd_q', body); i.focus(); i.setSelectionRange(q.length, q.length); } });
    body.addEventListener('click', (e) => {
      draw.sa = ($('#cd_a', body) || {}).scrollTop; draw.sb = ($('#cd_b', body) || {}).scrollTop;
      const tog = e.target.closest('[data-tog]');
      if (tog) { const id = tog.dataset.tog; if (open.has(id)) open.delete(id); else open.add(id); selA = { type: 'g', id }; return draw(); }
      const gk = e.target.closest('[data-g]'); if (gk) { selA = { type: 'g', id: gk.dataset.g }; return draw(); }
      const kk = e.target.closest('#cd_a [data-k]'); if (kk) { selA = { type: 'k', id: kk.dataset.k }; return draw(); }
      const bb = e.target.closest('[data-b]');
      if (bb) { const k = cols[+bb.dataset.b].k; if (e.ctrlKey || e.metaKey) { if (selB.has(k)) selB.delete(k); else selB.add(k); } else selB = new Set([k]); return draw(); }
      const btn = e.target.closest('[data-a]'); if (!btn || btn.disabled) return;
      const a = btn.dataset.a;
      if (a === 'add') {
        if (selA && selA.type === 'k') addKeys([selA.id]);
        else if (selA && selA.type === 'g') addKeys(P6.colGroups(App.p).find((x) => x.id === selA.id).keys);
        selA = null;
      } else if (a === 'addall') addKeys(visibleLeaf());
      else if (a === 'rem') { cols = cols.filter((c) => !selB.has(c.k)); selB.clear(); }
      else if (a === 'remall') { cols = cols.slice(0, 1); selB.clear(); }
      else if (a === 'up' || a === 'down') {
        const idx = cols.map((c, i) => (selB.has(c.k) ? i : -1)).filter((i) => i >= 0);
        if (a === 'up') idx.forEach((i) => { if (i > 0 && !selB.has(cols[i - 1].k)) [cols[i - 1], cols[i]] = [cols[i], cols[i - 1]]; });
        else idx.reverse().forEach((i) => { if (i < cols.length - 1 && !selB.has(cols[i + 1].k)) [cols[i + 1], cols[i]] = [cols[i], cols[i + 1]]; });
      } else if (a === 'ok') { apply(); return m.close(); }
      else if (a === 'cancel') return m.close();
      else if (a === 'apply') apply();
      else if (a === 'default') { cols = App.DEF_COLS.map((k) => ({ k, w: App.ALL_COLS[k].w })); selB.clear(); }
      else if (a === 'copy') {
        const r = btn.getBoundingClientRect(), saved = App.cfg.layouts || {};
        return App.popMenu([...Object.keys(App.LAYOUTS).map((k) => ({ l: t('lay_' + k), fn: () => { cols = App.LAYOUTS[k].cols.map((c) => ({ k: c, w: App.ALL_COLS[c].w })); selB.clear(); draw(); } })), ...(Object.keys(saved).length ? ['-'] : []), ...Object.keys(saved).map((n) => ({ l: n, fn: () => { cols = clone(saved[n].cols); selB.clear(); draw(); } }))], r.left, r.bottom);
      } else if (a === 'edit') return editColumn([...selB][0]);
      else if (a === 'help') return modal({ title: t('help'), cls: 'mid', body: `<div style="line-height:1.8">${t('cols_help_html')}</div>`, buttons: [{ label: t('close'), cls: 'pri', fn: () => {} }] });
      draw();
    });
    body.addEventListener('dblclick', (e) => {
      const kk = e.target.closest('#cd_a [data-k]'); if (kk) { addKeys([kk.dataset.k]); selA = null; draw(); return; }
      const bb = e.target.closest('[data-b]'); if (bb) { const k = cols[+bb.dataset.b].k; if (cols.length > 1) { cols = cols.filter((c) => c.k !== k); selB.clear(); draw(); } return; }
      const gk = e.target.closest('[data-g]'); if (gk && !e.target.closest('[data-tog]')) { const id = gk.dataset.g; if (open.has(id)) open.delete(id); else open.add(id); draw(); }
    });
    function editColumn(k) {
      const c = cols.find((x) => x.k === k); if (!c) return;
      const bd = `<div class="grid2"><div class="fld w2"><label>${esc(t('col_title'))}</label><input id="ec_t" dir="auto" value="${esc(c.title || '')}" placeholder="${esc(label(k))}"></div>
        <div class="fld"><label>${esc(t('col_width'))}</label><input id="ec_w" value="${c.w}"></div>
        <div class="fld"><label>${esc(t('col_align'))}</label><select id="ec_a"><option value="">${esc(t('align_auto'))}</option><option value="left"${c.align === 'left' ? ' selected' : ''}>${esc(t('align_left'))}</option><option value="center"${c.align === 'center' ? ' selected' : ''}>${esc(t('align_center'))}</option><option value="right"${c.align === 'right' ? ' selected' : ''}>${esc(t('align_right'))}</option></select></div></div>`;
      modal({ title: t('edit_column'), body: bd, buttons: [{ label: t('cancel'), fn: () => {} }, { label: t('ok'), cls: 'pri', fn: (cl, el) => {
        c.title = $('#ec_t', el).value.trim() || undefined; c.w = Math.max(40, parseInt($('#ec_w', el).value, 10) || c.w); c.align = $('#ec_a', el).value || undefined; draw();
      } }] });
    }
  };

  // =============== Activity / project codes ===============
  D.codes = function (kind) {
    const p = App.p, isPc = kind === 'pc';
    const types = () => (isPc ? p.pcTypes : p.codeTypes.filter((c) => c.scope === (kind === 'acp' ? 'project' : 'global')));
    const vals = (id) => (isPc ? p.pcVals : p.codeVals).filter((v) => v.type === id);
    let cur = (types()[0] || {}).id;
    const body = document.createElement('div');
    const draw = () => {
      const ts = types(), ct = ts.find((x) => x.id === cur) || (cur = (ts[0] || {}).id, ts[0]);
      body.innerHTML = `<div class="two"><div><b>${esc(t('code_types'))}</b><table class="mini"><tbody>${ts.map((x) => `<tr data-t="${x.id}"${x.id === cur ? ' class="rsel"' : ''}><td><input data-f="name" dir="auto" value="${esc(x.name)}"></td><td style="width:70px"><input data-f="len" value="${x.len || 20}" title="${esc(t('max_len'))}"></td><td style="width:28px"><button class="ib" data-delt="${x.id}">×</button></td></tr>`).join('') || `<tr><td class="empty">—</td></tr>`}</tbody></table><div style="margin-top:8px"><button class="btn sm" id="ct_add">+ ${esc(t('add_code_type'))}</button></div></div>
        <div><b>${esc(t('code_values'))}${ct ? ' – ' + esc(ct.name) : ''}</b>${ct ? `<table class="mini"><thead><tr><th style="width:90px">${esc(t('code_short'))}</th><th>${esc(t('col_name'))}</th><th style="width:110px">${esc(t('parent_wbs'))}</th><th style="width:28px"></th></tr></thead><tbody>${vals(ct.id).map((v) => `<tr data-v="${v.id}"><td><input data-f="short" dir="auto" value="${esc(v.short)}"></td><td><input data-f="name" dir="auto" value="${esc(v.name)}"></td><td><select data-f="parent"><option value="">—</option>${vals(ct.id).filter((x) => x.id !== v.id).map((x) => `<option value="${x.id}"${v.parent === x.id ? ' selected' : ''}>${esc(x.short)}</option>`).join('')}</select></td><td><button class="ib" data-delv="${v.id}">×</button></td></tr>`).join('')}</tbody></table><div style="margin-top:8px"><button class="btn sm" id="cv_add">+ ${esc(t('add_code_value'))}</button></div>` : ''}
        ${isPc && ct ? `<div class="fld" style="margin-top:14px"><label>${esc(t('pc_assigned'))}</label><select id="pc_sel"><option value="">—</option>${vals(ct.id).map((v) => `<option value="${v.id}"${(p.pcAssign || {})[ct.id] === v.id ? ' selected' : ''}>${esc(v.short + ' – ' + v.name)}</option>`).join('')}</select></div>` : ''}</div></div>`;
    };
    draw();
    modal({ title: t(kind === 'pc' ? 'act_pcodes' : kind === 'acp' ? 'act_codes_project' : 'act_codes_global'), cls: 'wide', body, buttons: [{ label: t('close'), cls: 'pri', fn: () => {} }], onClose: () => { App.refresh({ details: true }); } });
    const commit = (lbl, fn) => App.mutate(lbl, fn, { noSched: true });
    body.addEventListener('click', (e) => {
      const tr = e.target.closest('tr[data-t]'); if (tr && !e.target.closest('button') && e.target.tagName !== 'INPUT') { cur = +tr.dataset.t; return draw(); }
      if (e.target.id === 'ct_add') {
        const n = prompt(t('code_type_name'), ''); if (!n) return;
        commit(t('add_code_type'), () => { const o = { id: P6.nextId(p), name: n, len: 20 }; if (isPc) p.pcTypes.push(o); else { o.scope = kind === 'acp' ? 'project' : 'global'; p.codeTypes.push(o); } cur = o.id; });
        return draw();
      }
      const dt = e.target.closest('[data-delt]');
      if (dt) { const id = +dt.dataset.delt; if (!confirm(t('confirm_generic'))) return; commit(t('delete'), () => { if (isPc) { p.pcTypes = p.pcTypes.filter((x) => x.id !== id); p.pcVals = p.pcVals.filter((x) => x.type !== id); delete p.pcAssign[id]; } else { p.codeTypes = p.codeTypes.filter((x) => x.id !== id); p.codeVals = p.codeVals.filter((x) => x.type !== id); p.tasks.forEach((tk) => { delete tk.codes[id]; }); } }); cur = (types()[0] || {}).id; return draw(); }
      if (e.target.id === 'cv_add' && cur != null) { commit(t('add_code_value'), () => { const o = { id: P6.nextId(p), type: cur, short: 'NEW' + (vals(cur).length + 1), name: '', parent: null }; (isPc ? p.pcVals : p.codeVals).push(o); }); return draw(); }
      const dv = e.target.closest('[data-delv]');
      if (dv) { const id = +dv.dataset.delv; commit(t('delete'), () => { if (isPc) { p.pcVals = p.pcVals.filter((x) => x.id !== id && x.parent !== id); Object.keys(p.pcAssign).forEach((k) => { if (p.pcAssign[k] === id) delete p.pcAssign[k]; }); } else { p.codeVals = p.codeVals.filter((x) => x.id !== id); p.tasks.forEach((tk) => Object.keys(tk.codes).forEach((k) => { if (tk.codes[k] === id) delete tk.codes[k]; })); } }); return draw(); }
    });
    body.addEventListener('change', (e) => {
      const x = e.target;
      if (x.id === 'pc_sel') return commit(t('edit'), () => { if (x.value === '') delete p.pcAssign[cur]; else p.pcAssign[cur] = +x.value; });
      const tr = x.closest('tr'); if (!tr) return; const f = x.dataset.f;
      if (tr.dataset.t) { const ct = types().find((c) => c.id === +tr.dataset.t); commit(t('edit'), () => { if (f === 'len') ct.len = Math.max(1, parseInt(x.value, 10) || 20); else ct.name = x.value; }); }
      else if (tr.dataset.v) { const v = (isPc ? p.pcVals : p.codeVals).find((c) => c.id === +tr.dataset.v); commit(t('edit'), () => { if (f === 'parent') v.parent = x.value === '' ? null : +x.value; else v[f] = x.value; }); }
      draw();
    });
  };

  // =============== user-defined fields ===============
  D.udf = function () {
    const p = App.p;
    const body = document.createElement('div');
    const draw = () => {
      body.innerHTML = `<table class="mini"><thead><tr><th>${esc(t('udf_title'))}</th><th style="width:130px">${esc(t('udf_type'))}</th><th style="width:28px"></th></tr></thead><tbody>${p.udfs.map((u) => `<tr data-u="${u.id}"><td><input data-f="name" dir="auto" value="${esc(u.name)}"></td><td><select data-f="ty">${['text', 'number', 'cost', 'date'].map((x) => `<option value="${x}"${u.ty === x ? ' selected' : ''}>${esc(t('ut_' + x))}</option>`).join('')}</select></td><td><button class="ib" data-del="${u.id}">×</button></td></tr>`).join('') || `<tr><td colspan="3" class="empty">${esc(t('no_udf'))}</td></tr>`}</tbody></table><div style="margin-top:8px"><button class="btn sm" id="u_add">+ ${esc(t('add'))}</button></div>`;
    };
    draw();
    modal({ title: t('udf_manage'), cls: 'mid', body, buttons: [{ label: t('close'), cls: 'pri', fn: () => {} }], onClose: () => App.refresh({ details: true }) });
    body.addEventListener('click', (e) => {
      if (e.target.id === 'u_add') { const n = prompt(t('udf_title'), ''); if (n) { App.mutate(t('add'), () => { p.udfs.push({ id: P6.nextId(p), name: n, ty: 'text' }); }, { noSched: true }); draw(); } }
      const d = e.target.closest('[data-del]'); if (d) { const id = +d.dataset.del; if (!confirm(t('confirm_generic'))) return; App.mutate(t('delete'), () => { p.udfs = p.udfs.filter((u) => u.id !== id); p.tasks.forEach((tk) => { delete tk.udf[id]; }); }, { noSched: true }); draw(); }
    });
    body.addEventListener('change', (e) => { const tr = e.target.closest('tr[data-u]'); if (!tr) return; const u = p.udfs.find((x) => x.id === +tr.dataset.u); App.mutate(t('edit'), () => { u[e.target.dataset.f] = e.target.value; if (e.target.dataset.f === 'ty') p.tasks.forEach((tk) => { delete tk.udf[u.id]; }); }, { noSched: true }); });
  };

  // =============== multiple float paths ===============
  D.floatPaths = function () {
    const p = App.p;
    const body = document.createElement('div');
    const run = () => {
      const n = P6.floatPaths(p, p.floatPathMax || 10);
      const by = {}; p.tasks.forEach((tk) => { if (tk.fp) (by[tk.fp] = by[tk.fp] || []).push(tk); });
      body.querySelector('#fp_res').innerHTML = Object.keys(by).map((k) => { const l = by[k].sort((a, b) => a.fpo - b.fpo); return `<tr><td><b>${k}</b></td><td>${l.length}</td><td dir="auto">${esc(l[0].code)} → ${esc(l[l.length - 1].code)} · ${esc(l[l.length - 1].name)}</td><td>${App.fmtN(Math.min(...l.map((x) => x.tf)))}</td></tr>`; }).join('') || `<tr><td colspan="4" class="empty">—</td></tr>`;
      return n;
    };
    body.innerHTML = `<div class="hint">${esc(t('fp_hint'))}</div><div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:10px"><div class="fld"><label>${esc(t('fp_max'))}</label><input id="fp_n" style="width:90px" value="${p.floatPathMax || 10}"></div><button class="btn pri" id="fp_run">${esc(t('fp_calc'))}</button><button class="btn" id="fp_cols">${esc(t('fp_cols'))}</button></div>
      <table class="mini"><thead><tr><th style="width:70px">${esc(t('col_fp'))}</th><th style="width:90px">${esc(t('col_n'))}</th><th>${esc(t('fp_path'))}</th><th style="width:90px">${esc(t('col_tf'))}</th></tr></thead><tbody id="fp_res"></tbody></table>`;
    modal({ title: t('fp_title'), cls: 'mid', body, buttons: [{ label: t('close'), cls: 'pri', fn: () => {} }], onClose: () => App.refresh() });
    run();
    body.addEventListener('click', (e) => {
      if (e.target.id === 'fp_run') { p.floatPathMax = Math.max(1, parseInt($('#fp_n', body).value, 10) || 10); run(); }
      if (e.target.id === 'fp_cols') { ['fp', 'fpo'].forEach((k) => { if (!App.cfg.cols.some((c) => c.k === k)) App.cfg.cols.push({ k, w: App.ALL_COLS[k].w }); }); App.saveCfg(); App.toast(t('fp_cols_added')); }
    });
  };
})(window);

</script>
<script>
/* P6 Web – extra Activity Details tabs: Predecessors, Successors, Notebook, WPs & Docs, Expenses, Summary, Risks, Discussion + tab customiser. */
(function (g) {
  'use strict';
  const P6 = g.P6, App = g.App;
  const esc = P6.esc, t = (k, ...a) => P6.t(k, ...a);
  const $ = (s, r) => (r || document).querySelector(s);
  const fmtD = P6.fmtDate;
  const X = (P6.detExtra = {});
  const TOPICS = ['Notes', 'Scope', 'Constraints', 'Remarks', 'Safety'];
  const arr = (tk, k) => (tk[k] = tk[k] || []);
  const del = `<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>`;

  // ---------- generic list editor ----------
  const LISTS = {
    topics: { cols: [{ f: 'topic', w: 150, sel: () => App.p.memoTypes && App.p.memoTypes.length ? [...new Set([...TOPICS, ...App.p.memoTypes.map((m) => m.name)])] : TOPICS }, { f: 'text', area: 1 }], fresh: () => ({ topic: 'Notes', text: '' }) },
    docs: { cols: [{ f: 'title', w: 200 }, { f: 'url', w: 300 }, { f: 'notes' }], fresh: () => ({ title: t('new_doc'), url: '', notes: '' }), extra: (it) => (/^(https?:\/\/|www\.)/i.test(it.url || '') ? `<a class="btn sm" target="_blank" rel="noopener" href="${esc(/^www\./i.test(it.url) ? 'https://' + it.url : it.url)}">↗</a>` : '') },
    expenses: { cols: [{ f: 'name', w: 200 }, { f: 'vendor', w: 160 }, { f: 'budget', num: 1, w: 120 }, { ro: (it, tk) => P6.fmtKind('money', (+it.budget || 0) * (tk.status === 'C' ? 1 : (tk.pct || 0) / 100)), l: 'actual_cost', w: 120 }], fresh: () => ({ name: t('new_expense'), vendor: '', budget: 0 }) },
    risks: { cols: [{ f: 'name', w: 240 }, { f: 'prob', n15: 1, w: 90 }, { f: 'impact', n15: 1, w: 90 }, { ro: (it) => (+it.prob || 1) * (+it.impact || 1), l: 'risk_score', w: 80 }, { f: 'status', w: 120, sel: () => ['Open', 'Mitigated', 'Closed'] }, { f: 'notes' }], fresh: () => ({ name: t('new_risk'), prob: 3, impact: 3, status: 'Open', notes: '' }) },
    discuss: { cols: [{ ro: (it) => it.author, l: 'author', w: 120 }, { ro: (it) => it.date, l: 'date', w: 130 }, { f: 'text', area: 1 }], fresh: () => ({ author: App.cfg.user || 'USER', date: new Date().toLocaleString(), text: '' }) }
  };
  function listTab(tk, key) {
    const L = LISTS[key], items = arr(tk, key);
    const head = L.cols.map((c) => `<th${c.w ? ` style="min-width:${c.w}px"` : ''}>${esc(t('f_' + (c.f || c.l)))}</th>`).join('') + '<th style="width:60px"></th>';
    const rows = items.map((it) => `<tr data-lid="${it.id}">` + L.cols.map((c) => {
      if (c.ro) return `<td style="color:var(--muted)">${esc(c.ro(it, tk))}</td>`;
      const v = it[c.f] == null ? '' : it[c.f];
      if (c.sel) return `<td><select data-lst="${key}" data-lf="${c.f}">${c.sel().map((o) => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></td>`;
      if (c.n15) return `<td><select data-lst="${key}" data-lf="${c.f}">${[1, 2, 3, 4, 5].map((n) => `<option${+v === n ? ' selected' : ''}>${n}</option>`).join('')}</select></td>`;
      if (c.area) return `<td><textarea data-lst="${key}" data-lf="${c.f}" rows="2" dir="auto" style="width:100%;min-width:260px">${esc(v)}</textarea></td>`;
      return `<td><input data-lst="${key}" data-lf="${c.f}" dir="auto"${c.num ? ' inputmode="decimal"' : ''} value="${esc(v)}"></td>`;
    }).join('') + `<td style="white-space:nowrap">${L.extra ? L.extra(it) : ''}<button class="ib" data-lstdel="${key}:${it.id}">${del}</button></td></tr>`).join('');
    const total = key === 'expenses' ? `<span class="hint" style="margin:0">${esc(t('col_bc_E'))}: <b>${P6.fmtKind('money', items.reduce((a, x) => a + (+x.budget || 0), 0))}</b></span>` : '';
    return `<div style="overflow:auto"><table class="mini wide"><thead><tr>${head}</tr></thead><tbody>${rows || `<tr><td colspan="${L.cols.length + 1}" class="empty">${esc(t('empty_list'))}</td></tr>`}</tbody></table></div><div style="margin-top:8px;display:flex;gap:12px;align-items:center"><button class="btn sm" data-lstadd="${key}">+ ${esc(t('add'))}</button>${total}</div>`;
  }
  X.notes = (tk) => { if (tk.notes && !arr(tk, 'topics').length) { tk.topics.push({ id: P6.nextId(App.p), topic: 'Notes', text: tk.notes }); tk.notes = ''; } return listTab(tk, 'topics'); };
  X.docs = (tk) => listTab(tk, 'docs');
  X.expenses = (tk) => listTab(tk, 'expenses');
  X.risks = (tk) => listTab(tk, 'risks');
  X.discuss = (tk) => listTab(tk, 'discuss');

  // ---------- predecessors / successors (one side each) ----------
  function relSide(tk, isPred) {
    const p = App.p, list = p.rels.filter((r) => (isPred ? r.s : r.p) === tk.id);
    const rows = list.map((r) => {
      const o = App.taskById(isPred ? r.p : r.s); if (!o) return '';
      return `<tr data-rel="${r.id}"><td><input data-rf="code" value="${esc(o.code)}" list="codes"></td><td dir="auto" style="color:var(--muted)">${esc(o.name)}</td><td style="color:var(--muted)">${esc(App.p.wbs.find((w) => w.id === o.wbs).code)}</td><td><select data-rf="type">${['FS', 'SS', 'FF', 'SF'].map((x) => `<option${x === r.type ? ' selected' : ''}>${x}</option>`).join('')}</select></td><td><input data-rf="lag" value="${App.fmtN(r.lag)}"></td><td style="color:var(--muted)">${fmtD(o.es)}</td><td style="color:var(--muted)">${fmtD(o.ef)}</td><td style="color:var(--muted)">${o.tf == null ? '' : App.fmtN(o.tf)}</td><td><button class="ib" data-rdel="${r.id}">${del}</button></td></tr>`;
    }).join('');
    return `<datalist id="codes">${p.tasks.map((x) => `<option value="${esc(x.code)}">${esc(x.name)}</option>`).join('')}</datalist><div style="overflow:auto"><table class="mini wide"><thead><tr><th style="min-width:110px">${esc(t('col_code'))}</th><th style="min-width:240px">${esc(t('col_name'))}</th><th>${esc(t('col_wbs'))}</th><th style="width:90px">${esc(t('rel_type'))}</th><th style="width:70px">${esc(t('lag'))}</th><th>${esc(t('col_es'))}</th><th>${esc(t('col_ef'))}</th><th>${esc(t('col_tf'))}</th><th style="width:28px"></th></tr></thead><tbody>${rows}<tr><td colspan="9"><input data-radd="${isPred ? 'p' : 's'}" list="codes" placeholder="+ ${esc(t('add_rel_ph'))}" style="border-color:var(--line)"></td></tr></tbody></table></div>`;
  }
  X.pred = (tk) => relSide(tk, true);
  X.succ = (tk) => relSide(tk, false);

  // ---------- summary ----------
  X.summary = (tk) => {
    const c = App.getCtx(), row = { kind: 't', t: tk };
    const keys = [['Dates', ['es', 'ef', 'as', 'af', 'ls', 'lf', 'bs', 'bf', 'vs', 'vf']], ['Durations', ['dur', 'rem', 'actd', 'atcd', 'tf', 'ff']], ['Percent Completes', ['pct', 'durPct', 'phys', 'unitsPct', 'costPct', 'schedPct', 'perfPct']], ['Costs', ['bc', 'ac', 'rc', 'atc', 'blc', 'cvar']], ['Earned Value', ['pv', 'ev', 'sv', 'cv', 'spi', 'cpi', 'eac', 'etc', 'vac']], ['Units', ['bu', 'au', 'ru', 'atu']]];
    return `<div class="sumgrid">${keys.map(([g, ks]) => `<fieldset><legend>${esc(g)}</legend>${ks.map((k) => { const r = P6.regCell(k, row, c) || { text: '', cls: '' }; return `<div class="srow"><span>${esc(t('col_' + k))}</span><b class="${r.cls.includes('neg') ? 'neg' : ''}">${esc(r.text)}</b></div>`; }).join('')}</fieldset>`).join('')}</div>`;
  };

  // ---------- event handlers ----------
  P6.bindDetExtra = function () {
    const el = $('#details');
    el.addEventListener('change', (e) => {
      const x = e.target; if (!x.dataset.lst) return;
      const tk = App.focusTask(); if (!tk) return;
      const key = x.dataset.lst, it = arr(tk, key).find((q) => q.id === +x.closest('tr').dataset.lid); if (!it) return;
      const f = x.dataset.lf, L = LISTS[key], col = L.cols.find((c) => c.f === f);
      App.mutate(t('edit'), () => {
        if (col && col.num) { const v = parseFloat(String(x.value).replace(',', '.')); if (isNaN(v) || v < 0) return t('err_num'); it[f] = v; } else if (col && col.n15) it[f] = +x.value; else it[f] = x.value;
        if (key === 'expenses') tk.exp = tk.expenses.reduce((a, q) => a + (+q.budget || 0), 0);
      }, { noSched: true });
    });
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const tk = App.focusTask(); if (!tk) return;
      if (b.dataset.lstadd) { const key = b.dataset.lstadd; App.mutate(t('add'), () => { const o = LISTS[key].fresh(); o.id = P6.nextId(App.p); arr(tk, key).push(o); if (key === 'expenses') tk.exp = tk.expenses.reduce((a, q) => a + (+q.budget || 0), 0); }, { noSched: true }); }
      else if (b.dataset.lstdel) { const [key, id] = b.dataset.lstdel.split(':'); App.mutate(t('delete'), () => { tk[key] = arr(tk, key).filter((q) => q.id !== +id); if (key === 'expenses') tk.exp = tk.expenses.reduce((a, q) => a + (+q.budget || 0), 0); }, { noSched: true }); }
    });
  };

  // ---------- Activity Details tab customiser (Available Tabs / Display Tabs) ----------
  App.dialogs.detTabs = function () {
    let disp = (App.cfg.detTabs && App.cfg.detTabs.length ? App.cfg.detTabs : App.DEF_TABS).slice();
    let sa = null, sb = null;
    const body = document.createElement('div'); body.className = 'colsdlg dtd';
    const draw = () => {
      const avail = App.DEF_TABS.filter((k) => !disp.includes(k));
      body.innerHTML = `<div class="cd-left"><div class="cd-h">${esc(t('available_tabs'))}</div><div class="cd-list">${avail.map((k) => `<div class="ck2${sa === k ? ' on' : ''}" data-a="${k}">${esc(t('tab_' + k))}</div>`).join('')}</div></div>
        <div class="cd-mid"><button class="cdb" data-x="add"${avail.length ? '' : ' disabled'}>▶</button><button class="cdb" data-x="addall"${avail.length ? '' : ' disabled'}>⏩</button><button class="cdb" data-x="rem">◀</button><button class="cdb" data-x="remall">⏪</button></div>
        <div class="cd-right"><div class="cd-h">${esc(t('display_tabs'))}</div><div class="cd-list">${disp.map((k) => `<div class="ck2${sb === k ? ' on' : ''}" data-b="${k}">${esc(t('tab_' + k))}</div>`).join('')}</div></div>
        <div class="cd-ud"><button class="cdb" data-x="up">▲</button><button class="cdb" data-x="down">▼</button></div>
        <div class="cd-btns"><button class="btn pri" data-x="ok">✔ ${esc(t('ok'))}</button><button class="btn" data-x="cancel">⦸ ${esc(t('cancel'))}</button><button class="btn" data-x="apply">${esc(t('apply'))}</button><button class="btn" data-x="default">▶ ${esc(t('default'))}</button></div>`;
    };
    draw();
    const m = App.dialogs.modal({ title: t('activity_details'), cls: 'mid colsmodal', body, buttons: [], sticky: true });
    const apply = () => { if (!disp.length) return App.toast(t('err_no_cols'), true); App.cfg.detTabs = disp.slice(); App.saveCfg(); App.renderDetails(); };
    body.addEventListener('click', (e) => {
      const a = e.target.closest('[data-a]'), b = e.target.closest('[data-b]'), x = e.target.closest('[data-x]');
      if (a) { sa = a.dataset.a; return draw(); } if (b) { sb = b.dataset.b; return draw(); }
      if (!x || x.disabled) return;
      const k = x.dataset.x;
      if (k === 'add' && sa) { disp.push(sa); sa = null; } else if (k === 'addall') App.DEF_TABS.forEach((q) => { if (!disp.includes(q)) disp.push(q); });
      else if (k === 'rem' && sb && disp.length > 1) { disp = disp.filter((q) => q !== sb); sb = null; } else if (k === 'remall') { disp = disp.slice(0, 1); sb = null; }
      else if (k === 'up' && sb) { const i = disp.indexOf(sb); if (i > 0) [disp[i - 1], disp[i]] = [disp[i], disp[i - 1]]; }
      else if (k === 'down' && sb) { const i = disp.indexOf(sb); if (i < disp.length - 1) [disp[i + 1], disp[i]] = [disp[i], disp[i + 1]]; }
      else if (k === 'default') disp = App.DEF_TABS.slice();
      else if (k === 'apply') apply(); else if (k === 'ok') { apply(); return m.close(); } else if (k === 'cancel') return m.close();
      draw();
    });
    body.addEventListener('dblclick', (e) => { const a = e.target.closest('[data-a]'), b = e.target.closest('[data-b]'); if (a) { disp.push(a.dataset.a); sa = null; draw(); } else if (b && disp.length > 1) { disp = disp.filter((q) => q !== b.dataset.b); sb = null; draw(); } });
  };
})(window);

</script>
<script>
/* P6 Web – Page Setup, Print Setup, Print Preview (table + Gantt rendered together) and project portfolios. */
(function (g) {
  'use strict';
  const P6 = g.P6, App = g.App, D = App.dialogs;
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = P6.esc, t = (k, ...a) => P6.t(k, ...a);
  const PAPER = { A4: [297, 210], A3: [420, 297], Letter: [279, 216], Legal: [356, 216] };
  const WCOL = [['#0000ff', '#fff'], ['#66ff66', '#000'], ['#ffff00', '#000'], ['#0000ff', '#fff'], ['#ff0000', '#fff']];
  const opt = (v, l, c) => `<option value="${v}"${String(c) === String(v) ? ' selected' : ''}>${esc(l)}</option>`;
  const ps = () => Object.assign({ paper: 'A4', orient: 'landscape', margin: 10, what: 'both', header: true, footer: true, fit: true }, App.cfg.print);

  D.pageSetup = function () {
    const c = ps();
    const body = `<div class="grid2"><div class="fld"><label>${esc(t('paper'))}</label><select id="pg_p">${Object.keys(PAPER).map((k) => opt(k, k, c.paper)).join('')}</select></div>
      <div class="fld"><label>${esc(t('orientation'))}</label><select id="pg_o">${opt('landscape', t('landscape'), c.orient)}${opt('portrait', t('portrait'), c.orient)}</select></div>
      <div class="fld"><label>${esc(t('margin_mm'))}</label><input id="pg_m" value="${c.margin}"></div></div>
      <label class="chk" style="margin-top:12px"><input type="checkbox" id="pg_h"${c.header ? ' checked' : ''}> ${esc(t('print_header'))}</label>
      <label class="chk"><input type="checkbox" id="pg_f"${c.footer ? ' checked' : ''}> ${esc(t('print_footer'))}</label>`;
    D.modal({ title: t('page_setup'), cls: 'mid', body, buttons: [{ label: t('cancel'), fn: () => {} }, { label: t('save'), cls: 'pri', fn: (cl, el) => {
      Object.assign(App.cfg.print, { paper: $('#pg_p', el).value, orient: $('#pg_o', el).value, margin: Math.max(0, Math.min(40, +$('#pg_m', el).value || 10)), header: $('#pg_h', el).checked, footer: $('#pg_f', el).checked }); App.saveCfg();
    } }] });
  };
  D.printSetup = function () {
    const c = ps();
    const body = `<div class="grid2"><div class="fld"><label>${esc(t('print_what'))}</label><select id="ps_w">${opt('both', t('view_both'), c.what)}${opt('table', t('view_table'), c.what)}${opt('gantt', t('view_gantt'), c.what)}</select></div></div>
      <label class="chk" style="margin-top:12px"><input type="checkbox" id="ps_fit"${c.fit ? ' checked' : ''}> ${esc(t('fit_width'))}</label><p class="hint">${esc(t('print_hint'))}</p>`;
    D.modal({ title: t('print_setup'), cls: 'mid', body, buttons: [{ label: t('cancel'), fn: () => {} }, { label: t('save'), cls: 'pri', fn: (cl, el) => { Object.assign(App.cfg.print, { what: $('#ps_w', el).value, fit: $('#ps_fit', el).checked }); App.saveCfg(); } }] });
  };

  // render the Gantt for ALL rows into a static SVG (off-screen)
  function ganttSvg(rows, px, rowH) {
    const o = App.gantt.o, W = Math.ceil((o.maxDay - o.minDay + 1) * px), H = rows.length * rowH;
    const host = document.createElement('div');
    host.style.cssText = `position:fixed;left:0;top:0;width:${W}px;height:${H}px;overflow:hidden;visibility:hidden;direction:ltr`;
    const head = document.createElement('div'); head.style.cssText = 'height:46px;width:' + W + 'px';
    document.body.appendChild(host); document.body.appendChild(head); head.style.cssText += ';position:fixed;left:0;top:0;visibility:hidden';
    const gt = new P6.Gantt(head, host);
    gt.o.cb = {};
    gt.set({ rows, ru: App.ru, rowH, px, minDay: o.minDay, maxDay: o.maxDay, sel: new Set(), show: Object.assign({}, App.cfg.show, { today: true }), p: App.p, rels: true, spot: null });
    gt.draw();
    const body = gt.svg.outerHTML, hd = gt.hsvg.outerHTML;
    host.remove(); head.remove();
    return { body, hd, W, H };
  }

  D.printPreview = function () {
    const c = ps(), p = App.p, rows = App.rows.slice(0, 1500), RH = 22;
    const [pw, ph] = c.orient === 'landscape' ? PAPER[c.paper] : [PAPER[c.paper][1], PAPER[c.paper][0]];
    const mm = 3.78; // css px per mm
    const innerW = (pw - 2 * c.margin) * mm, innerH = (ph - 2 * c.margin) * mm;
    const cols = App.cfg.cols;
    const ctx = App.getCtx();
    const cellText = (k, row) => { const r = P6.regCell(k, row, ctx); return r ? r.text : ''; };
    const wantTable = c.what !== 'gantt', wantGantt = c.what !== 'table';
    const tableW = cols.reduce((a, x) => a + x.w, 0);
    let ganttW = 0, g = null;
    // choose a Gantt scale so that table + gantt fit the paper width when "fit" is on
    const span = App.gantt.o.maxDay - App.gantt.o.minDay + 1;
    let px = App.gantt.o.px;
    if (wantGantt && c.fit) px = Math.max(0.2, (innerW - (wantTable ? Math.min(tableW, innerW * 0.55) : 0) - 8) / span);
    if (wantGantt) { g = ganttSvg(rows, px, RH); ganttW = g.W; }
    const thead = cols.map((x) => `<div class="pvh" style="width:${x.w}px">${esc(x.title || t('col_' + x.k))}</div>`).join('');
    const wbsPb = P6.normGrp && P6.normGrp(App.cfg).levels.some((L) => L.by === 'wbs' && L.pbreak);
    const trs = rows.map((row, ri) => {
      const lvl = row.kind !== 't' ? row.level % 5 : -1;
      const style = row.kind !== 't' ? `background:${WCOL[lvl][0]};color:${WCOL[lvl][1]};font-weight:700` : '';
      return `${(row.pb || (row.kind === 'w' && row.level === 0 && wbsPb && ri > 0)) ? '<div class="pvpb" title="Page break"></div>' : ''}<div class="pvr" style="height:${RH}px;${style}">${cols.map((x, i) => `<div class="pvc" style="width:${x.w}px">${i === 0 ? '<span style="display:inline-block;width:' + row.level * 10 + 'px"></span>' : ''}${esc(row.kind !== 't' && i === 0 ? row.w.name : cellText(x.k, row))}</div>`).join('')}</div>`;
    }).join('');
    const sheetW = (wantTable ? tableW : 0) + (wantGantt ? ganttW : 0);
    const scale = c.fit ? Math.min(1, innerW / sheetW) : 1;
    const hdr = c.header ? `<div class="pvhead"><b dir="auto">${esc(p.name)}</b><span>${esc(t('layout'))}: ${esc(App.cfg.layoutName || t('lay_' + App.cfg.layout))}</span><span>${esc(t('data_date'))}: ${P6.fmtDate(p.dataDate)}</span></div>` : '';
    const ftr = c.footer ? `<div class="pvfoot"><span>${esc(t('printed'))}: ${new Date().toLocaleString()}</span><span>${esc(App.cfg.user || '')}</span></div>` : '';
    const html = `<div class="pv-paper" style="width:${pw * mm}px;min-height:${ph * mm}px;padding:${c.margin * mm}px"><style id="pvpage">@page{size:${pw}mm ${ph}mm;margin:0}</style>${hdr}
      <div class="pvsheet" style="transform:scale(${scale});transform-origin:0 0;width:${sheetW}px;height:${(46 + rows.length * RH + 2) * scale ? 46 + rows.length * RH : 0}px;margin-bottom:${-(46 + rows.length * RH) * (1 - scale)}px">
        <div style="display:flex;direction:ltr">${wantTable ? `<div style="width:${tableW}px;flex:none"><div class="pvthead" style="height:46px;display:flex;direction:ltr">${thead}</div>${trs}</div>` : ''}${wantGantt ? `<div style="width:${ganttW}px;flex:none"><div style="height:46px;overflow:hidden">${g.hd.replace('<svg ', '<svg style="background:#f2f2f2" ')}</div>${g.body}</div>` : ''}</div></div>${ftr}</div>`;
    const wrap = document.createElement('div'); wrap.className = 'pvwrap'; wrap.innerHTML = html;
    D.modal({ title: t('print_preview'), cls: 'wide pvmodal', body: wrap, buttons: [{ label: t('page_setup'), fn: () => { D.pageSetup(); return true; } }, { label: t('print_setup'), fn: () => { D.printSetup(); return true; } }, { label: t('cancel'), fn: () => {} }, { label: '🖨 ' + t('print'), cls: 'pri', fn: () => { document.body.classList.add('printing-pv'); const pv = wrap.cloneNode(true); pv.id = 'pvprint'; document.body.appendChild(pv); setTimeout(() => { window.print(); setTimeout(() => { pv.remove(); document.body.classList.remove('printing-pv'); }, 300); }, 80); return false; } }], sticky: true });
  };

  // ---------- portfolios ----------
  D.portfolios = async function () {
    const list = (await App.listProjects()).sort((a, b) => b.updated - a.updated);
    const F = App.cfg; F.portfolios = F.portfolios || {};
    let cur = F.portfolio || Object.keys(F.portfolios)[0] || '';
    const body = document.createElement('div');
    const draw = () => {
      const names = Object.keys(F.portfolios), sel = F.portfolios[cur] || [];
      body.innerHTML = `<div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:10px"><div class="fld" style="flex:1"><label>${esc(t('portfolio'))}</label><select id="pf_sel">${names.map((n) => opt(n, n, cur)).join('') || `<option value="">—</option>`}</select></div><button class="btn" id="pf_new">+ ${esc(t('new_portfolio'))}</button><button class="btn dng" id="pf_del"${cur ? '' : ' disabled'}>${esc(t('delete'))}</button></div>
        <div class="hint">${esc(t('portfolio_hint'))}</div>${cur ? `<div class="plist">${list.map((x) => `<label class="pitem"><input type="checkbox" data-id="${esc(x.id)}"${sel.includes(x.id) ? ' checked' : ''}><div style="flex:1"><div class="nm" dir="auto">${esc(x.name)}</div><div class="sub">${esc(t('activities'))}: ${x.tasks}</div></div></label>`).join('')}</div>` : ''}`;
    };
    draw();
    D.modal({ title: t('manage_portfolios'), cls: 'mid', body, buttons: [{ label: t('close'), cls: 'pri', fn: () => {} }], onClose: () => { App.saveCfg(); App.buildMenus(); } });
    body.addEventListener('change', (e) => {
      if (e.target.id === 'pf_sel') { cur = e.target.value; return draw(); }
      if (e.target.dataset.id) { const a = F.portfolios[cur]; const id = e.target.dataset.id; if (e.target.checked) { if (!a.includes(id)) a.push(id); } else F.portfolios[cur] = a.filter((x) => x !== id); App.saveCfg(); }
    });
    body.addEventListener('click', (e) => {

      { k: 'prio', l: 'priority', w: 110, ed: 'sel', opts: () => ['Top', 'High', 'Normal', 'Low'].map((x) => [x, x]), get: (r) => r.priority, set: (r, v) => { r.priority = v; } },
      { k: 'resp', l: 'responsible', w: 150, ed: 'text', get: (r) => r.resp || '', set: (r, v) => { r.resp = v; } },

  const TPARAM = {
    tf: { l: 'col_tf', v: (tk) => tk.tf }, fvar: { l: 'col_vf', v: (tk) => (tk.ef != null && tk.bf != null ? tk.ef - tk.bf : null) }, svar: { l: 'col_vs', v: (tk) => (tk.es != null && tk.bs != null ? tk.es - tk.bs : null) },

      { k: 'param', l: 'th_param', w: 220, ed: 'sel', opts: () => Object.keys(TPARAM).map((k) => [k, t(TPARAM[k].l)]), get: (r) => r.param, set: (r, v) => { r.param = v; } },
      { k: 'op', l: 'th_op', w: 90, ed: 'sel', opts: () => [['lt', '<'], ['gt', '>']], get: (r) => r.op, set: (r, v) => { r.op = v; } },

      { k: 'prio', l: 'priority', w: 110, ed: 'sel', opts: () => ['Top', 'High', 'Normal', 'Low'].map((x) => [x, x]), get: (r) => r.priority, set: (r, v) => { r.priority = v; } },
      { k: 'resp', l: 'responsible', w: 150, ed: 'text', get: (r) => r.resp || '', set: (r, v) => { r.resp = v; } },
      { k: 'on', l: 'th_active', w: 80, ed: 'chk', get: (r) => r.active !== false, set: (r, v) => { r.active = !!v; } }
    ];
    const bar = `▽ ${esc(t('display'))}: ${esc(t('win_thresholds'))} <span style="margin-inline-start:auto;display:flex;gap:6px"><button class="btn sm" data-a="add">+ ${esc(t('add'))}</button><button class="btn sm dng" data-a="del">${esc(t('delete'))}</button><button class="btn sm pri" data-a="mon">${esc(t('monitor_thresholds'))}</button></span>`;
    el.innerHTML = `<div class="wbox"><div class="wtop" style="flex:1"><div class="dockhead">${bar}</div><div class="wtable">${grid(cols, rows, { key: (r) => r.id, sel: wsel.thresholds })}</div><p class="hint" style="padding:8px 12px">${esc(t('th_hint'))}</p></div></div>`;
    wire(el, 'thresholds', cols, () => rows, (r) => r.id);

      if (b && b.dataset.a === 'del') { const id = +wsel.thresholds; App.mutate(t('delete'), () => { p.thresholds = p.thresholds.filter((x) => x.id !== id); }, { noSched: true }); return; }
      if (b && b.dataset.a === 'mon') return App.monitorThresholds();
      base(e);
    };
  }
  App.monitorThresholds = function () {
    const p = App.p; let n = 0;

      p.issues = p.issues.filter((i) => !i.auto);
      for (const th of p.thresholds) {

        }
      }
    }, { noSched: true });
    App.toast(t('th_found', n));
    if (App.win === 'thresholds') App.showWin('issues');
  };

  // ======================= render dispatcher =======================
  const R = { projects: renderProjects, resources: renderResources, assign: renderAssign, wbs: renderWbs, expenses: renderExpenses, docs: renderDocs, thresholds: renderThresholds, issues: renderIssues, risks: renderRisks };

  };
})(window);

      App.mutate(t('mi_renumber'), () => { const used = new Set(App.p.tasks.filter((x) => !order.includes(x)).map((x) => x.code.toLowerCase())); let n = st; for (const tk of order) { let c2 = pre + n; while (used.has(c2.toLowerCase())) { n += inc; c2 = pre + n; } tk.code = c2; used.add(c2.toLowerCase()); n += inc; } }, { noSched: true });

  };

  let findState = { text: '', field: 'any', cs: false, idx: -1 };

    for (let c = 1; c <= n; c++) { const k = back ? (i - c + n * 2) % n : (i + c) % n; const r = rows[k]; if (r.kind === 't' && matches(r.t)) { App.selectRow(r, null); App.ensureVisible(k); return; } }

  D.replace = function () {
    const body = `<div class="grid2"><div class="fld w2"><label>${esc(t('find_what'))}</label><input id="rp_f" dir="auto" value="${esc(findState.text)}"></div><div class="fld w2"><label>${esc(t('replace_with'))}</label><input id="rp_r" dir="auto"></div>
      <div class="fld"><label>${esc(t('find_in'))}</label><select id="rp_in"><option value="name">${esc(t('col_name'))}</option><option value="code">${esc(t('col_code'))}</option></select></div><div class="fld"><label>${esc(t('rn_scope'))}</label><select id="rp_sc"><option value="all">${esc(t('rn_all'))}</option><option value="sel">${esc(t('rn_sel'))}</option></select></div></div><label class="chk" style="margin-top:8px"><input type="checkbox" id="rp_c"> ${esc(t('match_case'))}</label>`;
    modal({ title: t('mi_replace'), cls: 'mid', body, buttons: [{ label: t('cancel'), fn: () => {} }, { label: t('mi_replace_all'), cls: 'pri', fn: (c, el) => {
      const f = $('#rp_f', el).value, r = $('#rp_r', el).value, fld = $('#rp_in', el).value, cs = $('#rp_c', el).checked, scope = $('#rp_sc', el).value;
      if (!f) return false;
      const tasks = (scope === 'sel' ? App.selTasks() : App.p.tasks); let n = 0;
      const re = new RegExp(f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), cs ? 'g' : 'gi');
      let dup = null;
      App.mutate(t('mi_replace'), () => { for (const tk of tasks) { const nv = String(tk[fld]).replace(re, () => { n++; return r; }); if (nv !== tk[fld]) { if (fld === 'code' && App.p.tasks.some((x) => x !== tk && x.code.toLowerCase() === nv.toLowerCase())) { dup = nv; continue; } tk[fld] = nv; } } if (dup) return t('err_code_dup', dup); }, { noSched: true });
      App.toast(t('replaced_n', n));
    } }] });
  };
  App.toggleSpell = function () { F().spell = !F().spell; App.saveCfg(); App.buildMenus(); App.toast(t(F().spell ? 'spell_on' : 'spell_off')); document.querySelectorAll('#details input[type=text],#details input:not([type]),#details textarea').forEach((e) => { e.spellcheck = !!F().spell; }); };

  // ================= View features =================
  App.collapseTo = function () {

  };
  D.barsDialog = function () {
    const sh = F().show, lm = F().labelMode || 'name';
    const items = [['base', 'show_baseline'], ['crit', 'show_critical'], ['rels', 'show_rels'], ['labels', 'show_labels'], ['float', 'show_float'], ['today', 'show_today']];
    const body = `<div class="plist" style="gap:2px">${items.map(([k, l]) => `<label class="chk"><input type="checkbox" data-k="${k}"${sh[k] ? ' checked' : ''}> ${esc(t(l))}</label>`).join('')}<label class="chk"><input type="checkbox" data-k="pline"${F().pline ? ' checked' : ''}> ${esc(t('mi_progressline'))}</label></div>
      <div class="fld" style="max-width:260px;margin-top:12px"><label>${esc(t('bar_size'))}</label><select id="bd_s">${[1, 2, 3, 4, 5].map((n) => `<option value="${n}"${(F().barSize || 3) === n ? ' selected' : ''}>${n} – ${esc(t('bs_' + n))}</option>`).join('')}</select></div>

  // ================= Check Schedule =================
  D.checkSchedule = function () {

    const hasPred = new Set(p.rels.map((r) => r.s)), hasSucc = new Set(p.rels.map((r) => r.p));

      ['chk_nopred', open.filter((x) => !hasPred.has(x.id) && x.type !== 'TT_Mile'), 0],
      ['chk_nosucc', open.filter((x) => !hasSucc.has(x.id) && x.type !== 'TT_FinMile'), 0],

  // ================= bottom docks: Trace Logic, Activity Usage Spreadsheet, Additional Activities View =================
  const NB = { fields: { dates: true, float: true, dur: true }, depth: 2, colors: { n: '#dbe9fb', c: '#ffd6d6', d: '#d8f3d8', s: '#fff2a8' } };
  App.renderNetwork = function (el) {
    const tk = App.focusTask(), cfg = Object.assign({}, NB, F().net);
    if (!tk) { el.innerHTML = `<div class="dockhead">▽ ${esc(t('mi_trace'))}</div><div class="empty">${esc(t('select_hint'))}</div>`; return; }
    const p = App.p, byId = new Map(p.tasks.map((x) => [x.id, x])), W = 200, H = cfg.fields.dates || cfg.fields.float ? 62 : 44, GX = 70, GY = 14;
    const lvlP = new Map([[tk.id, 0]]), lvlS = new Map([[tk.id, 0]]);
    const walk = (map, dir) => { let fr = [tk.id]; for (let d = 1; d <= cfg.depth; d++) { const nx = []; for (const id of fr) for (const r of p.rels) { const o = dir < 0 ? (r.s === id ? r.p : null) : (r.p === id ? r.s : null); if (o != null && !map.has(o)) { map.set(o, d); nx.push(o); } } fr = nx; } };
    walk(lvlP, -1); walk(lvlS, 1);
    const cols = new Map(); // level -> [ids]  (negative = predecessors)
    for (const [id, d] of lvlP) if (id !== tk.id) { const k = -d; if (!cols.has(k)) cols.set(k, []); cols.get(k).push(id); }
    for (const [id, d] of lvlS) if (id !== tk.id) { if (!cols.has(d)) cols.set(d, []); cols.get(d).push(id); }
    cols.set(0, [tk.id]);
    const keys = [...cols.keys()].sort((a, b) => a - b), pos = new Map();
    const maxRows = Math.max(...keys.map((k) => cols.get(k).length)), totalH = maxRows * (H + GY);
    keys.forEach((k, ci) => { const ids = cols.get(k).sort((a, b) => (byId.get(a).es || 0) - (byId.get(b).es || 0)); const off = (totalH - ids.length * (H + GY)) / 2; ids.forEach((id, ri) => pos.set(id, { x: 20 + ci * (W + GX), y: 14 + off + ri * (H + GY) })); });
    const width = 40 + keys.length * (W + GX), height = totalH + 30;
    let lines = '', boxes = '';
    for (const r of p.rels) { const a = pos.get(r.p), b = pos.get(r.s); if (!a || !b) continue; const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2; lines += `<path d="M${x1} ${y1}H${x1 + GX / 2}V${y2}H${x2}" fill="none" stroke="${byId.get(r.p).crit && byId.get(r.s).crit ? '#d00' : '#667'}" stroke-width="1.3" marker-end="url(#nah)"/><text x="${(x1 + x2) / 2}" y="${Math.min(y1, y2) - 3}" font-size="9" fill="#555" text-anchor="middle">${r.type}${r.lag ? (r.lag > 0 ? '+' : '') + r.lag : ''}</text>`; }
    for (const [id, ps] of pos) {
      const x = byId.get(id), fill = id === tk.id ? cfg.colors.s : x.status === 'C' ? cfg.colors.d : x.crit ? cfg.colors.c : cfg.colors.n;
      boxes += `<g class="nbox" data-id="${id}" style="cursor:pointer"><rect x="${ps.x}" y="${ps.y}" width="${W}" height="${H}" rx="3" fill="${fill}" stroke="${x.crit && x.status !== 'C' ? '#d00' : '#456'}" stroke-width="${id === tk.id ? 2.2 : 1.2}"/><text x="${ps.x + 6}" y="${ps.y + 14}" font-size="11" font-weight="700" fill="#000">${esc(x.code)}</text><text x="${ps.x + 6}" y="${ps.y + 28}" font-size="10.5" fill="#000">${esc(x.name.length > 30 ? x.name.slice(0, 29) + '…' : x.name)}</text>`;
      if (cfg.fields.dates) boxes += `<text x="${ps.x + 6}" y="${ps.y + 42}" font-size="10" fill="#223">${fmtD(x.es)} → ${fmtD(x.ef)}</text>`;
      if (cfg.fields.float || cfg.fields.dur) boxes += `<text x="${ps.x + 6}" y="${ps.y + 56}" font-size="10" fill="#223">${cfg.fields.dur ? 'D: ' + fmtN(x.dur) + '  ' : ''}${cfg.fields.float ? 'TF: ' + (x.tf == null ? '–' : fmtN(x.tf)) : ''}</text>`;
      boxes += '</g>';
    }
    el.innerHTML = `<div class="dockhead">▽ ${esc(t('mi_trace'))}: <b dir="auto">${esc(tk.code)}</b> <span style="margin-inline-start:auto;display:flex;gap:6px"><button class="btn sm" data-n="d1">${esc(t('depth'))} −</button><button class="btn sm" data-n="d2">${esc(t('depth'))} +</button><button class="btn sm" data-n="tpl">${esc(t('mi_boxtpl'))}</button><button class="btn sm" data-n="hide">▾</button></span></div><div style="flex:1;overflow:auto;direction:ltr"><svg width="${width}" height="${height}" font-family="Tahoma,Arial,sans-serif"><defs><marker id="nah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#445"/></marker></defs>${lines}${boxes}</svg></div>`;
    el.style.display = 'flex'; el.style.flexDirection = 'column';
    el.onclick = (e) => {
      const b = e.target.closest('.nbox'); if (b) { const r = App.rows[App.rowIdx.get('t' + b.dataset.id)]; if (r) App.selectRow(r, null); else App.setSel(['t' + b.dataset.id]); return; }
      const n = e.target.closest('[data-n]'); if (!n) return;
      const net = Object.assign({}, NB, F().net); const k = n.dataset.n;
      if (k === 'd1') net.depth = Math.max(1, net.depth - 1); else if (k === 'd2') net.depth = Math.min(5, net.depth + 1); else if (k === 'hide') return App.setDock('none'); else if (k === 'tpl') return D.chartTemplate();

    };

  App.renderUsageSheet = function (el) {
    const p = App.p, u = Object.assign({ m: 'units', sheetFor: 'sel', cum: true }, F().usage), o = App.gantt.o;
    const tk = App.focusTask(), tasks = u.sheetFor === 'all' || !tk ? p.tasks : [tk];
    const periods = []; let d = P6.mkDay(P6.ymd(o.minDay).y, P6.ymd(o.minDay).m, 1);
    while (d < o.maxDay && periods.length < 48) { const y = P6.ymd(d), nx = P6.mkDay(y.y, y.m + 1, 1); periods.push([d, nx, P6.MON[y.m] + ' ' + String(y.y).slice(2)]); d = nx; }

    let run = 0; const cumRow = u.cum ? `<tr style="background:var(--panel2)"><td style="position:sticky;left:0;background:var(--panel2)"><b>${esc(t('cumulative'))}</b></td>${[...cum].map((v) => { run += v; return `<td style="text-align:right">${fmtN(run)}</td>`; }).join('')}<td></td></tr>` : '';

    el.onclick = (e) => { const n = e.target.closest('[data-n]'); if (!n) return; if (n.dataset.n === 'opt') D.bottomOptions(); else App.setDock('none'); };

        <div class="cd-btns"><button class="btn pri" data-a="ok">✔ ${esc(t('ok'))}</button><button class="btn" data-a="cancel">⦸ ${esc(t('cancel'))}</button><button class="btn" data-a="apply">${esc(t('apply'))}</button><button class="btn" data-a="new">+ ${esc(t('flt_new'))}</button><button class="btn" data-a="del"${kind === 'user' || kind === 'global' ? '' : ' disabled'}>${esc(t('delete'))}</button><button class="btn" data-a="copy"${st.cur ? '' : ' disabled'}>${esc(t('copy'))}</button><button class="btn" data-a="paste"${fclip ? '' : ' disabled'}>${esc(t('paste'))}</button><button class="btn" data-a="mod"${kind === 'user' || kind === 'global' ? '' : ' disabled'}>${esc(t('flt_modify'))}</button><button class="btn" data-a="mkglobal"${kind === 'user' ? '' : ' disabled'}>${esc(t('flt_makeglobal'))}</button><button class="btn" data-a="aslayout">${esc(t('flt_aslayout'))}</button><button class="btn" data-a="help">? ${esc(t('help'))}</button></div>`;
    };
    draw();
    const m = D.modal({ title: t('flt_title'), cls: 'wide fltmodal', body, buttons: [], sticky: true });
    const apply = () => { c.fsel = [...st.sel]; c.fany = st.any; c.filter.mode = 'all'; App.saveCfg(); App.refresh(); App.buildMenus(); };
    const lookup = (id) => c.userFilters.find((x) => x.id === id) || c.globalFilters.find((x) => x.id === id);
    body.addEventListener('change', (e) => {
      const x = e.target;
      if (x.id === 'fl_all') { if (x.checked) st.sel.clear(); draw(); return; }
      if (x.name === 'fl_m') { st.any = x.value === 'any'; return; }
      if (x.dataset.s) { if (x.checked) st.sel.add(x.dataset.s); else st.sel.delete(x.dataset.s); draw(); }
    });
    body.addEventListener('click', (e) => {
      const g = e.target.closest('.fg'); if (g) { st.open[g.dataset.g] = !st.open[g.dataset.g]; return draw(); }
      const fr = e.target.closest('.fr'); if (fr && !e.target.closest('input')) { st.cur = fr.dataset.id; return draw(); }
      const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; const a = b.dataset.a;
      if (a === 'ok') { apply(); m.close(); } else if (a === 'cancel') m.close(); else if (a === 'apply') apply();
      else if (a === 'new') D.filterEditor(null, (f) => { c.userFilters.push(f); st.cur = f.id; App.saveCfg(); draw(); });
      else if (a === 'mod') { const f = lookup(st.cur); if (f) D.filterEditor(f, (n) => { Object.assign(f, n); App.saveCfg(); draw(); }); }
      else if (a === 'del') { if (!confirm(t('confirm_generic'))) return; c.userFilters = c.userFilters.filter((x) => x.id !== st.cur); c.globalFilters = c.globalFilters.filter((x) => x.id !== st.cur); st.sel.delete(st.cur); st.cur = null; App.saveCfg(); draw(); }
      else if (a === 'copy') { const f = lookup(st.cur); fclip = f ? clone(f) : { name: P6.filterName(st.cur), builtin: st.cur }; draw(); }
      else if (a === 'paste') { if (fclip) { const f = fclip.builtin ? { conds: [], join: 'and', builtin: fclip.builtin } : clone(fclip); f.id = 'u' + Date.now().toString(36); f.name = fclip.name + ' (2)'; if (f.builtin) { f.conds = []; } c.userFilters.push(f); st.cur = f.id; App.saveCfg(); draw(); } }
      else if (a === 'mkglobal') { const f = lookup(st.cur); if (f) { c.userFilters = c.userFilters.filter((x) => x !== f); c.globalFilters.push(f); App.saveCfg(); draw(); } }
      else if (a === 'aslayout') { apply(); App.saveLayoutAs(); }
      else if (a === 'help') D.modal({ title: t('help'), cls: 'mid', body: `<div style="line-height:1.8">${t('flt_help_html')}</div>`, buttons: [{ label: t('close'), cls: 'pri', fn: () => {} }] });
    });
  };
})(window);

</script>
<script>
/* P6 Web – Group and Sort engine (multi-level grouping by any field) and the Group and Sort / Sort dialogs. */
(function (g) {
  'use strict';
  const P6 = g.P6, App = g.App, D = App.dialogs;
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = P6.esc, t = (k, ...a) => P6.t(k, ...a);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const PAL = ['#c8f5c8', '#cfd4ff', '#ffd1f0', '#fff6b8', '#c9eef7', '#ffe0c2', '#e2d4f7', '#d9d9d9'];
  const WBS_PAL = ['#0000ff', '#66ff66', '#ffff00', '#0000ff', '#ff0000'];
  P6.contrast = (hex) => { const h = String(hex || '#fff').replace('#', ''); const n = h.length === 3 ? h.split('').map((c) => c + c).join('') : h.padEnd(6, '0'); const r = parseInt(n.slice(0, 2), 16), gg = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16); return (0.299 * r + 0.587 * gg + 0.114 * b) / 255 > 0.55 ? '#000' : '#fff'; };
  const newLevel = (by) => ({ by, indent: true, toLevel: 'All', interval: '', color: null, hideEmpty: false, alpha: false, show: { title: false, id: false, name: true } });
  P6.normSorts = (cfg) => (cfg.sorts && cfg.sorts.length ? cfg.sorts : [{ k: cfg.sort || 'code', dir: cfg.sortDir || 1 }]);
  P6.normGrp = (cfg) => {
    if (!cfg.grp) cfg.grp = { levels: cfg.group === 'none' ? [] : [newLevel('wbs')], totals: true, grand: false, summ: false, shrink: false, wbsColors: null };
    const G = cfg.grp; G.levels = G.levels || []; if (G.totals === undefined) G.totals = true;
    cfg.group = G.levels.length ? 'wbs' : 'none';
    return G;
  };
  // ----- group fields
  const DATE_INT = { Day: (d) => d, Week: (d) => d - P6.dow(d), Month: (d) => { const y = P6.ymd(d); return P6.mkDay(y.y, y.m, 1); }, Quarter: (d) => { const y = P6.ymd(d); return P6.mkDay(y.y, y.m - (y.m % 3), 1); }, Year: (d) => P6.mkDay(P6.ymd(d).y, 0, 1) };
  const dateLabel = (interval, d) => { const y = P6.ymd(d); return interval === 'Year' ? String(y.y) : interval === 'Quarter' ? 'Q' + (Math.floor(y.m / 3) + 1) + ' ' + y.y : interval === 'Month' ? P6.MON[y.m] + ' ' + y.y : P6.fmtDate(d); };
  P6.groupFields = function (p) {
    const base = [['wbs', 'WBS'], ['status', 'col_status'], ['type', 'col_type'], ['cal', 'col_cal'], ['crit', 'col_crit'], ['pct', 'col_pct'], ['es', 'col_es'], ['ef', 'col_ef'], ['tf', 'col_tf'], ['dur', 'col_dur'], ['primname', 'col_primname'], ['fp', 'col_fp'], ['cstr', 'col_cstr']];
    const out = base.map(([k, l]) => [k, l === 'WBS' ? 'WBS' : t(l)]);
    for (const ct of p.codeTypes || []) out.push(['ac:' + ct.id, ct.name]);
    for (const u of p.udfs || []) if (u.scope !== 'resource') out.push(['udf:' + u.id, u.name]);
    return out;
  };
  function keyOf(by, tk, ctx, L) {
    const none = { k: '￿', s: 1e15, label: t('grp_none') };
    const iv = parseFloat(L.interval);
    switch (by) {
      case 'status': return { k: tk.status, s: ['NS', 'IP', 'C'].indexOf(tk.status), label: t('st_' + tk.status) };
      case 'type': return { k: tk.type, s: 0, label: t('type_' + tk.type) };
      case 'cal': { const c = ctx.cals.get(tk.cal); return { k: String(tk.cal), s: 0, label: c ? c.name : '' }; }
      case 'crit': { const c = !!tk.crit && tk.status !== 'C'; return { k: c ? '1' : '0', s: c ? 0 : 1, label: c ? t('critical') : t('non_critical') }; }
      case 'primname': { const a = ctx.asgBy.get(tk.id); const r = a ? ctx.rs.get(a[0].rsrc) : null; return r ? { k: String(r.id), s: 0, label: r.name } : none; }
      case 'cstr': return tk.ct ? { k: tk.ct, s: 0, label: t('cs_' + tk.ct) } : none;
      case 'pct': case 'tf': case 'dur': case 'fp': {
        const v = by === 'pct' ? tk.pct : by === 'tf' ? tk.tf : by === 'dur' ? tk.dur : tk.fp; if (v == null) return none;
        if (iv > 0 && by !== 'fp') { const lo = Math.floor(v / iv) * iv; return { k: String(lo), s: lo, label: lo + ' – ' + (lo + iv) }; }
        return { k: String(v), s: v, label: String(Math.round(v * 100) / 100) };
      }
      case 'es': case 'ef': { const d = tk[by]; if (d == null) return none; const fn = DATE_INT[L.interval]; if (!fn) return { k: String(d), s: d, label: P6.fmtDate(d) }; const s = fn(d); return { k: String(s), s, label: dateLabel(L.interval, s) }; }
      default:
        if (/^ac:/.test(by)) { const id = (tk.codes || {})[by.slice(3)]; const v = ctx.codeVal.get(id); if (!v) return none; const sh = L.show || {}; const ct = (ctx.p.codeTypes.find((c) => c.id === v.type) || {}).name; const parts = []; if (sh.title) parts.push(ct + ':'); if (sh.id || (!sh.title && !sh.name)) parts.push(v.short); if (sh.name) parts.push(v.name); return { k: String(id), s: ctx.p.codeVals.indexOf(v), label: parts.join(' ').trim() || v.short }; }
        if (/^udf:/.test(by)) { const v = (tk.udf || {})[by.slice(4)]; if (v == null || v === '') return none; const u = ctx.p.udfs.find((x) => x.id === +by.slice(4)); const lab = u && u.ty === 'date' ? P6.fmtDate(v) : String(v); return { k: lab, s: typeof v === 'number' ? v : 0, label: lab }; }
        return none;
    }
  }
  // ----- aggregation for group bands
  function aggRu(ts) {
    const r = { es: Infinity, ef: -Infinity, bs: Infinity, bf: -Infinity, dur: 0, rem: 0, done: 0, count: ts.length, tf: Infinity, as: Infinity, af: -Infinity, allC: true, nNS: 0, nIP: 0, nC: 0, nCrit: 0, ls: Infinity, lf: -Infinity };
    for (const x of ts) {
      if (x.es != null) { r.es = Math.min(r.es, x.es); r.ef = Math.max(r.ef, x.ef); } if (x.bs != null) { r.bs = Math.min(r.bs, x.bs); r.bf = Math.max(r.bf, x.bf); }
      if (x.as != null) r.as = Math.min(r.as, x.as); if (x.af != null) r.af = Math.max(r.af, x.af);
      r.dur += x.dur || 0; r.done += (x.dur || 0) * (x.pct || 0) / 100; r.rem += x.status === 'C' ? 0 : x.rem || 0; if (x.tf != null) r.tf = Math.min(r.tf, x.tf);
      if (x.status !== 'C') r.allC = false; if (x.status === 'NS') r.nNS++; else if (x.status === 'IP') r.nIP++; else r.nC++; if (x.crit) r.nCrit++;
      if (x.ls != null && x.status !== 'C') { r.ls = Math.min(r.ls, x.ls); r.lf = Math.max(r.lf, x.lf); }
    }
    r.pct = r.dur > 0 ? Math.round((r.done / r.dur) * 100) : 0;
    ['es', 'bs', 'tf', 'ls'].forEach((k) => { if (!isFinite(r[k])) { r[k] = null; if (k === 'es') r.ef = null; if (k === 'bs') r.bf = null; if (k === 'ls') r.lf = null; } });
    return r;
  }
  function aggM(ts, T) { const m = P6.blankMetrics(); for (const x of ts) { const y = T.get(x.id); if (y) P6.METRIC_BASE.forEach((k) => { m[k] += y[k]; }); } return P6.deriveMetrics(m); }

  P6.buildRows = function (p, G, S, o) {
    const rows = []; S.levelColors = [];
    const ctx = S.ctx, all = p.tasks.filter(o.matches).sort(o.cmp);
    const reg = (id, ts) => { S.ru.set(id, aggRu(ts)); ctx.M.W.set(id, aggM(ts, ctx.M.T)); };
    const emit = (ts, depth) => { if (G.summ) return; for (const tk of ts) rows.push({ kind: 't', id: tk.id, level: depth, t: tk }); };
    const kids = new Map(); p.wbs.forEach((w) => kids.set(w.id, [])); const roots = [];
    for (const w of p.wbs) { if (w.parent != null && kids.has(w.parent)) kids.get(w.parent).push(w); else roots.push(w); }
    const ws = (a, b) => (a.seq - b.seq) || o.nat(a.code, b.code);
    const wpal = G.wbsColors || WBS_PAL;
    const level = (ts, li, depth, path) => {
      if (li >= G.levels.length) return emit(ts, depth);
      const L = G.levels[li];
      if (L.by === 'wbs') wbsLevel(ts, li, depth, path, L); else catLevel(ts, li, depth, path, L);
    };
    const wbsLevel = (ts, li, depth, path, L) => {
      const tby = new Map(); ts.forEach((tk) => { if (!tby.has(tk.wbs)) tby.set(tk.wbs, []); tby.get(tk.wbs).push(tk); });
      const showEmpty = li === 0 && !o.filtering && path === '' && ts.length === all.length;
      const cnt = new Map(); const count = (w) => { let n = (tby.get(w.id) || []).length; for (const k of kids.get(w.id)) n += count(k); cnt.set(w.id, n); return n; }; roots.forEach(count);
      const maxD = L.toLevel === 'All' || !L.toLevel ? Infinity : Math.max(1, parseInt(L.toLevel, 10) || 1) - 1;
      const sub = (w) => { const out = (tby.get(w.id) || []).slice(); for (const k of kids.get(w.id)) out.push(...sub(k)); return out; };
      const walk = (w, wd) => {
        if (!showEmpty && !cnt.get(w.id)) return;
        const lv = depth + wd, own = wd < maxD ? (tby.get(w.id) || []).slice().sort(o.cmp) : sub(w).sort(o.cmp);
        const ks = wd < maxD ? kids.get(w.id).slice().sort(ws) : [];
        // totals of a WBS row cover only the activities in this branch of the grouping / filter, so a parent always equals the sum of what is shown under it
        const ak = 'wa:' + path + ':' + w.id; reg(ak, sub(w));
        rows.push({ kind: 'w', id: w.id, ak, level: lv, w, hasKids: ks.length + own.length > 0 });
        S.levelColors[lv] = wpal[wd % wpal.length];
        if (S.collapsed.has(w.id) && !o.filtering) return;
        for (const k of ks) walk(k, wd + 1);
        level(own, li + 1, lv + 1, path + 'w' + w.id);
      };
      roots.slice().sort(ws).forEach((w) => walk(w, 0));
    };
    const catLevel = (ts, li, depth, path, L) => {
      const map = new Map();
      for (const tk of ts) { const v = keyOf(L.by, tk, ctx, L); if (!map.has(v.k)) map.set(v.k, { v, ts: [] }); map.get(v.k).ts.push(tk); }
      if (/^ac:/.test(L.by) && !L.hideEmpty) for (const v of p.codeVals.filter((x) => x.type === +L.by.slice(3))) { const k = String(v.id); if (!map.has(k)) map.set(k, { v: keyOf(L.by, { codes: { [L.by.slice(3)]: v.id } }, ctx, L), ts: [] }); }
      let list = [...map.values()];
      list.sort(L.alpha ? (a, b) => o.nat(a.v.label, b.v.label) : (a, b) => (a.v.s - b.v.s) || o.nat(a.v.label, b.v.label));
      const cd = L.indent === false ? depth : depth + 1, color = L.color || PAL[li % PAL.length];
      for (const grp of list) {
        const id = 'g:' + path + '/' + li + ':' + grp.v.k;
        reg(id, grp.ts); rows.push({ kind: 'g', id, level: depth, w: { id, name: grp.v.label, code: '' }, hasKids: true, color, pb: !!L.pbreak });
        S.levelColors[depth] = color;
        if (S.collapsed.has(id) && !o.filtering) continue;
        level(grp.ts, li + 1, cd, path + '/' + id);
      }
    };
    if (G.grand && G.levels.length) { reg('g:grand', all); rows.push({ kind: 'g', id: 'g:grand', level: 0, w: { id: 'g:grand', name: t('grand_total'), code: '' }, hasKids: false, color: '#bfbfbf' }); }
    level(all, 0, 0, '');
    return rows;
  };

  // ================= Group and Sort dialog =================
  D.groupSort = function () {
    const G = clone(P6.normGrp(App.cfg)); let selI = 0;
    const fields = P6.groupFields(App.p);
    const body = document.createElement('div'); body.className = 'grpdlg';
    const acOpt = () => (fields.some(([k]) => /^ac:/.test(k)) ? '' : `<option value="__codes">${esc(t('grp_defcodes'))}</option>`);
    const rowsHtml = () => {
      const out = []; const lv = G.levels;
      lv.forEach((L, i) => {
        const wbs = L.by === 'wbs', color = wbs ? (G.wbsColors || WBS_PAL)[0] : (L.color || PAL[i % PAL.length]);
        out.push(`<tr data-i="${i}" class="${selI === i ? 'on' : ''}"><td><select data-k="by">${fields.map(([k, l]) => `<option value="${esc(k)}"${L.by === k ? ' selected' : ''}>${esc(wbs && k === 'wbs' ? 'WBS ' + t('grp_level') + ' 1' : l)}</option>`).join('')}${acOpt()}<option value="">${esc(t('grp_none'))}</option></select></td><td style="text-align:center"><input type="checkbox" data-k="indent"${L.indent !== false ? ' checked' : ''}></td><td><input data-k="toLevel" value="${esc(wbs ? L.toLevel || 'All' : '')}"${wbs ? '' : ' disabled'} style="width:70px"></td><td><input data-k="interval" value="${esc(L.interval || '')}" placeholder="${/^(es|ef)$/.test(L.by) ? 'Month' : /^(pct|tf|dur)$/.test(L.by) ? '10' : ''}" style="width:90px"></td><td style="text-align:center"><input type="checkbox" data-k="pbreak"${L.pbreak ? ' checked' : ''}></td><td><input type="color" data-k="color" value="${color}"> <span style="color:#666;font-size:11px">8 Arial</span></td></tr>`);
        if (wbs) for (let w = 1; w < 5; w++) out.push(`<tr class="wl"><td style="color:#888;padding-inline-start:20px">WBS ${esc(t('grp_level'))} ${w + 1}</td><td></td><td></td><td></td><td></td><td><input type="color" data-w="${w}" value="${(G.wbsColors || WBS_PAL)[w]}"></td></tr>`);
      });
      if (lv.length < 8) out.push(`<tr data-i="${lv.length}" class="${selI === lv.length ? 'on' : ''}"><td><select data-k="by" data-new="1"><option value="">—</option>${fields.map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join('')}${acOpt()}</select></td><td></td><td></td><td></td><td></td><td></td></tr>`);
      return out.join('');
    };
    const draw = () => {
      const L = G.levels[selI] || null;
      body.innerHTML = `<div class="gd-wrap"><div class="gd-main"><fieldset><legend>${esc(t('grp_display'))}</legend><label class="chk"><input type="checkbox" id="gd_tot"${G.totals !== false ? ' checked' : ''}> ${esc(t('grp_totals'))}</label><label class="chk" style="margin-inline-start:22px"><input type="checkbox" id="gd_grand"${G.grand ? ' checked' : ''}${G.totals === false ? ' disabled' : ''}> ${esc(t('grp_grand'))}</label><label class="chk" style="margin-inline-start:22px"><input type="checkbox" id="gd_sum"${G.summ ? ' checked' : ''}> ${esc(t('grp_summ'))}</label><label class="chk"><input type="checkbox" id="gd_shr"${G.shrink ? ' checked' : ''}> ${esc(t('grp_shrink'))}</label></fieldset>
        <fieldset><legend>${esc(t('grp_by'))}</legend><div class="gd-tbl"><table class="mini"><thead><tr><th>${esc(t('grp_by'))}</th><th style="width:60px">${esc(t('grp_indent'))}</th><th style="width:90px">${esc(t('grp_tolevel'))}</th><th style="width:110px">${esc(t('grp_interval'))}</th><th style="width:70px">${esc(t('grp_pbreak'))}</th><th style="width:130px">${esc(t('grp_fontcolor'))}</th></tr></thead><tbody>${rowsHtml()}</tbody></table></div></fieldset>
        <fieldset><legend>${esc(t('grp_options'))}</legend><label class="chk"><input type="checkbox" id="go_he"${L && L.hideEmpty ? ' checked' : ''}${L && /^ac:/.test(L.by) ? '' : ' disabled'}> ${esc(t('grp_hideempty'))}</label><label class="chk"><input type="checkbox" id="go_al"${L && L.alpha ? ' checked' : ''}${L && L.by !== 'wbs' ? '' : ' disabled'}> ${esc(t('grp_alpha'))}</label><div style="margin-top:6px">${esc(t('grp_show'))}:</div>
        ${['title', 'id', 'name'].map((k) => `<label class="chk" style="margin-inline-start:12px"><input type="checkbox" data-sh="${k}"${L && L.show && L.show[k] ? ' checked' : ''}${L && /^ac:/.test(L.by) ? '' : ' disabled'}> ${esc(t('grp_show_' + k))}</label>`).join('')}</fieldset></div>
<div class="gd-side"><button class="btn pri" data-a="ok"><b class="gi" style="color:#2e9b2e">✔</b>${esc(t('ok'))}</button><button class="btn" data-a="cancel"><b class="gi" style="color:#d03a2f">⦸</b>${esc(t('cancel'))}</button><hr><button class="btn" data-a="apply"><b class="gi" style="color:#2f6fc4">▤</b>${esc(t('apply'))}</button><button class="btn" data-a="del"${L ? '' : ' disabled'}><b class="gi" style="color:#d03a2f">✖</b>${esc(t('delete'))}</button><hr><button class="btn" data-a="sort"><b class="gi" style="color:#2b3340">▭</b>${esc(t('grp_sort'))}…</button><button class="btn" data-a="default"><b class="gi" style="color:#2e9b2e">▶</b>${esc(t('default'))}</button><hr><button class="btn" data-a="help"><b class="gi" style="color:#e0a800">?</b>${esc(t('help'))}</button></div></div>`;

<script>
/* P6 Web – Primavera-style chrome: context menus, side bars, layout strip, resource usage dock, assign dialogs, preferences. */
(function (g) {
  'use strict';
  const P6 = g.P6, App = g.App;
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = P6.esc, t = (k, ...a) => P6.t(k, ...a);
  const D = App.dialogs;
  const fmtD = P6.fmtDate;
  const modal = (o) => D.modal(o);
  const clone = (o) => JSON.parse(JSON.stringify(o));

  // ================= popup menu with sub-menus =================
  function closeMenus() { document.querySelectorAll('.pmenu').forEach((m) => m.remove()); }
  function popMenu(items, x, y, level) {
    level = level || 0;
    if (!level) closeMenus();
    const m = document.createElement('div');
    m.className = 'pmenu'; m.dir = P6.dir(); m.dataset.level = level;
    const act = items.filter(Boolean);
    m.innerHTML = act.map((it, i) => (it === '-' ? '<hr>' : `<div class="pi${it.dis ? ' dis' : ''}" data-i="${i}"><span class="ico2">${it.i && P6.hasIcon(it.i) ? P6.icon(it.i) : it.ck ? '✓' : ''}</span>${esc(it.l)}${it.sub ? '<span class="ar">▸</span>' : it.k ? `<span class="k">${esc(it.k)}</span>` : ''}</div>`)).join('');
    document.body.appendChild(m);
    const zz = P6.uiZoom ? P6.uiZoom() : 1; x /= zz; y /= zz;
    const w = m.offsetWidth, h = m.offsetHeight, iw = innerWidth / zz, ih = innerHeight / zz;
    m.style.left = Math.max(2, Math.min(x, iw - w - 4)) + 'px';
    m.style.top = Math.max(2, Math.min(y, ih - h - 4)) + 'px';
    const killDeeper = () => document.querySelectorAll('.pmenu').forEach((e) => { if (+e.dataset.level > level) e.remove(); });
    m.addEventListener('mouseover', (e) => {
      const pi = e.target.closest('.pi'); if (!pi) return;
      const it = act[+pi.dataset.i];
      killDeeper();
      if (it && it.sub && !it.dis) { const r = pi.getBoundingClientRect(); const sm = popMenu(it.sub, r.right - 2, r.top - 3, level + 1); const sr = sm.getBoundingClientRect(); if (sr.right > innerWidth) sm.style.left = Math.max(2, r.left - sr.width + 2) + 'px'; }
    });
    m.addEventListener('click', (e) => {
      const pi = e.target.closest('.pi'); if (!pi) return;
      const it = act[+pi.dataset.i];
      if (!it || it.dis || it.sub) return;
      closeMenus();
      if (it.fn) it.fn();
    });
    m.addEventListener('contextmenu', (e) => e.preventDefault());
    return m;
  }
  App.popMenu = popMenu;
  document.addEventListener('mousedown', (e) => { if (!e.target.closest('.pmenu')) closeMenus(); }, true);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenus(); });
  addEventListener('blur', closeMenus);

  // ================= activity operations =================
  let clip = null;
  const keysOf = (ids) => ids.map((i) => 't' + i);
  function copySel(silent) {
    const ts = App.selTasks();
    if (!ts.length) return false;
    const ids = new Set(ts.map((x) => x.id));
    clip = { tasks: clone(ts), rels: clone(App.p.rels.filter((r) => ids.has(r.p) && ids.has(r.s))), asg: clone(App.p.asg.filter((a) => ids.has(a.task))) };
    if (!silent) App.toast(t('copied', ts.length));
    return true;
  }
  function cutSel() {
    if (!copySel(true)) return;
    const ids = new Set(App.selTasks().map((x) => x.id));
    App.mutate(t('cut'), () => {
      App.p.tasks = App.p.tasks.filter((x) => !ids.has(x.id));
      App.p.rels = App.p.rels.filter((r) => !ids.has(r.p) && !ids.has(r.s));
      App.p.asg = App.p.asg.filter((a) => !ids.has(a.task));
      App.sel.clear(); App.focus = null;
    });
    App.toast(t('cut_done', clip.tasks.length));
  }
  function pasteSel() {
    if (!clip || !clip.tasks.length) return App.toast(t('clip_empty'), true);
    const fr = App.rows[App.rowIdx.get(App.focus)];
    const wbs = App.wbsOfRow(fr) != null ? App.wbsOfRow(fr) : App.p.wbs[0].id;
    const map = new Map(); let keys = [];
    App.mutate(t('paste'), () => {
      const p = App.p;
      for (const o of clip.tasks) {
        const c = clone(o); c.id = P6.nextId(p); c.wbs = wbs; c.seq = Math.max(0, ...p.tasks.map((x) => x.seq)) + 1;
        if (p.tasks.some((x) => x.code === c.code)) c.code = P6.autoCode(p);

        p.tasks.push(c); map.set(o.id, c); keys.push('t' + c.id);
      }
      for (const r of clip.rels) p.rels.push({ id: P6.nextId(p), p: map.get(r.p).id, s: map.get(r.s).id, type: r.type, lag: r.lag });
      for (const a of clip.asg) if (p.rsrc.some((x) => x.id === a.rsrc)) p.asg.push({ id: P6.nextId(p), task: map.get(a.task).id, rsrc: a.rsrc, qty: a.qty });
    });
    App.collapsed.delete(wbs); App.refresh(); App.setSel(keys);
  }
  Object.assign(App, { copySel, cutSel, pasteSel });
  App.exportsLater = () => Object.assign(App, { assignRel, assignResources, constraintDialog, moveToWbsDialog, calendarMenu, setProgress, applySaved, saveLayoutAs });

  function setProgress(kind) {
    const ts = App.selTasks(); if (!ts.length) return;
    App.mutate(t('progress'), () => {
      for (const tk of ts) {
        if (kind === 'NS') App.setStatus(tk, 'NS');
        else if (kind === 'IP') { App.setStatus(tk, 'IP'); }
        else if (kind === 'C') App.setStatus(tk, 'C');
        else App.setPct(tk, +kind);
      }
    });
  }
  function relatives(dir) {
    const ts = App.selTasks(); if (!ts.length) return;
    const adj = new Map();
    for (const r of App.p.rels) { const a = dir > 0 ? r.p : r.s, b = dir > 0 ? r.s : r.p; if (!adj.has(a)) adj.set(a, []); adj.get(a).push(b); }
    const seen = new Set(), st = ts.map((x) => x.id);
    while (st.length) { const x = st.pop(); for (const y of adj.get(x) || []) if (!seen.has(y)) { seen.add(y); st.push(y); } }
    ts.forEach((x) => seen.add(x.id));
    const keys = [...seen].map((i) => 't' + i).filter((k) => App.rowIdx.has(k));
    App.setSel(keys);
    App.toast(t('selected_n', keys.length));

    } else if ((d.kind === 'days' || d.kind === 'num') && r && typeof r.v === 'number' && (d.group === 'dur' || c.k === 'tf' || c.k === 'ff')) v = r.v.toFixed(2);

<script>
/* P6 Web – Schedule Comparison. Compares the open schedule against another schedule (XER/PMXML file, a project in the database, or the baseline).

    const cw = wn(cur);

    const cnt = { start: 0, finish: 0, dur: 0, pct: 0, float: 0, status: 0, name: 0, cons: 0 };
    for (const tk of cur.tasks) {
      const o = om.get(key(tk.code));
      if (!o) { added.push(tk); continue; }
      const ch = [];
      const add = (f, a, b, num) => { ch.push({ f, a, b, d: num }); };
      if ((o.es != null || tk.es != null) && o.es !== tk.es) { cnt.start++; add('Start', o.es, tk.es, tk.es != null && o.es != null ? tk.es - o.es : null); }
      if ((o.ef != null || tk.ef != null) && o.ef !== tk.ef) { cnt.finish++; add('Finish', o.ef, tk.ef, tk.ef != null && o.ef != null ? tk.ef - o.ef : null); }
      if (o.dur !== tk.dur) { cnt.dur++; add('Duration', o.dur, tk.dur, tk.dur - o.dur); }
      if ((o.pct || 0) !== (tk.pct || 0)) { cnt.pct++; add('% Complete', o.pct || 0, tk.pct || 0, (tk.pct || 0) - (o.pct || 0)); }
      if (o.tf !== tk.tf && (o.tf != null || tk.tf != null)) { cnt.float++; add('Total Float', o.tf, tk.tf, o.tf != null && tk.tf != null ? tk.tf - o.tf : null); }
      if (o.status !== tk.status) { cnt.status++; add('Status', o.status, tk.status, null); }
      if (o.name !== tk.name) { cnt.name++; add('Name', o.name, tk.name, null); }
      if ((o.ct || '') !== (tk.ct || '') || (o.cd || null) !== (tk.cd || null)) { cnt.cons++; add('Constraint', (o.ct || '') + (o.cd != null ? ' ' + fd(o.cd) : ''), (tk.ct || '') + (tk.cd != null ? ' ' + fd(tk.cd) : ''), null); }

    S.push({ name: 'Logic', title: B('Logic changes', 'تغييرات العلاقات'), cols: [{ h: 'Change', w: 12 }, { h: 'Predecessor', w: 18 }, { h: 'Successor', w: 18 }, { h: 'Type', w: 8 }, { h: 'Lag', t: 'n', w: 8 }], rows: res.logic.map((x) => [x.kind, x.pred, x.succ, x.type, x.lag]), fill: (r) => (r[0] === 'Added' ? '#E3F4E1' : '#FDE2E0') });
