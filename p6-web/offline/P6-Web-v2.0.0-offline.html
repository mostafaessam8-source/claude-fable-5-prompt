<script>
/* P6 Web – Progress update through Excel. Export a template of the activities (inputs highlighted), fill it in the field, import it back:
   preview with validations, then apply actual start / finish / % complete / remaining duration to the schedule. Matches by Activity ID. */
(function (g) {
  'use strict';
  const P6 = g.P6, App = g.App, D = App.dialogs;
  const esc = P6.esc, B = (en, ar) => (P6.dir() === 'rtl' ? ar : en);
  const fd = (d) => (d == null ? '' : P6.fmtDate(d));
  const norm = (s) => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9؀-ۿ]/g, '');
  const HEAD = { code: ['activityid', 'id', 'code', 'رقمالنشاط'], as: ['actualstart', 'as', 'بدايةفعلية'], af: ['actualfinish', 'af', 'نهايةفعلية'], pct: ['complete', 'completepct', 'pct', 'percentcomplete', 'نسبةالانجاز', 'نسبةالإنجاز'], rem: ['remainingduration', 'remaining', 'remdur', 'المتبقي'] };

  App.progressTemplate = function () {
    const p = App.p, DD = p.dataDate;
    const rows = p.tasks.filter((x) => x.status !== 'C' && !(P6.isHammock && P6.isHammock(x))).sort((a, b) => (a.es == null ? 1e9 : a.es) - (b.es == null ? 1e9 : b.es)).map((x) => {
      const w = p.wbs.find((q) => q.id === x.wbs);
      return [x.code, x.name, w ? w.code : '', x.status, x.es, x.ef, x.dur, x.pct || 0, x.as, null, null, null];
    });
    App.xlsxBook('Progress-Update-Template.xlsx', [{ name: 'Progress', title: p.name + ' – ' + B('Progress update', 'تحديث التقدم'), subtitle: B('Data date: ', 'تاريخ البيانات: ') + fd(DD) + B('  |  Fill the yellow columns only, then import it back via Tools ▸ Import Progress from Excel.', '  |  املأ الأعمدة الصفراء فقط ثم استوردها من Tools ▸ Import Progress from Excel.'),
      cols: [{ h: 'Activity ID', w: 16 }, { h: 'Activity Name', w: 46 }, { h: 'WBS', w: 14 }, { h: 'Status', w: 8 }, { h: 'Planned Start', t: 'd', w: 14 }, { h: 'Planned Finish', t: 'd', w: 14 }, { h: 'Orig Dur', t: 'n', w: 9 }, { h: 'Current %', t: 'n', w: 10 },
        { h: 'Actual Start', t: 'd', w: 14, input: 1 }, { h: 'Actual Finish', t: 'd', w: 14, input: 1 }, { h: '% Complete', t: 'n', w: 11, input: 1 }, { h: 'Remaining Duration', t: 'n', w: 12, input: 1 }], rows }]);
  };

  function toDay(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return v > 20000 && v < 80000 ? Math.round(v) - 25569 : undefined; // Excel serial -> P6 day
    const s = String(v).trim(); if (!s) return null; const d = P6.parseDate(s); return d == null ? undefined : d;
  }
  function toNum(v) { if (v == null || v === '') return null; const n = typeof v === 'number' ? v : parseFloat(String(v).replace('%', '').replace(',', '.')); return isFinite(n) ? n : undefined; }

  // rows: array of arrays (first row containing an "Activity ID" header is the header)
  function parse(rows) {
    let hi = rows.findIndex((r) => (r || []).some((c) => HEAD.code.includes(norm(c))));
    if (hi < 0) throw new Error(B('No "Activity ID" column found', 'لم يتم العثور على عمود Activity ID'));
    const hdr = rows[hi].map(norm), col = {};
    for (const k of Object.keys(HEAD)) { const i = hdr.findIndex((h) => HEAD[k].includes(h)); if (i >= 0) col[k] = i; }
    if (col.as == null && col.af == null && col.pct == null && col.rem == null) throw new Error(B('No progress columns (Actual Start / Actual Finish / % Complete / Remaining Duration)', 'لا توجد أعمدة تقدم (Actual Start / Actual Finish / % Complete / Remaining Duration)'));
    const by = new Map(App.p.tasks.map((x) => [String(x.code).toLowerCase(), x])), DD = App.p.dataDate, out = [];
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r] || [], code = String(row[col.code] == null ? '' : row[col.code]).trim(); if (!code) continue;
      const v = { as: col.as != null ? toDay(row[col.as]) : null, af: col.af != null ? toDay(row[col.af]) : null, pct: col.pct != null ? toNum(row[col.pct]) : null, rem: col.rem != null ? toNum(row[col.rem]) : null };
      if (v.as == null && v.af == null && v.pct == null && v.rem == null) continue;
      const tk = by.get(code.toLowerCase()), errs = [], warn = [];
      if (!tk) errs.push(B('Unknown Activity ID', 'رقم نشاط غير موجود'));
      for (const k of ['as', 'af']) if (v[k] === undefined) errs.push(B('Bad date in ', 'تاريخ غير صالح في ') + (k === 'as' ? 'Actual Start' : 'Actual Finish'));
      if (v.pct === undefined) errs.push(B('Bad % Complete', '% غير صالح')); else if (v.pct != null && (v.pct < 0 || v.pct > 100)) errs.push(B('% Complete must be 0–100', 'النسبة يجب أن تكون 0–100'));
      if (v.rem === undefined) errs.push(B('Bad Remaining Duration', 'مدة متبقية غير صالحة')); else if (v.rem != null && v.rem < 0) errs.push(B('Remaining cannot be negative', 'المتبقي لا يمكن أن يكون سالباً'));
      if (typeof v.as === 'number' && typeof v.af === 'number' && v.af < v.as) errs.push(B('Actual Finish before Actual Start', 'النهاية الفعلية قبل البداية الفعلية'));
      if (typeof v.as === 'number' && v.as > DD) warn.push(B('Actual Start after data date', 'البداية الفعلية بعد تاريخ البيانات'));
      if (typeof v.af === 'number' && v.af > DD) warn.push(B('Actual Finish after data date', 'النهاية الفعلية بعد تاريخ البيانات'));
      if (tk && tk.status === 'C') warn.push(B('Already completed – will be overwritten', 'مكتمل بالفعل – سيتم الكتابة فوقه'));

  }

  function apply(items) {
    let n = 0;
    App.mutate(B('Import progress from Excel', 'استيراد التقدم من Excel'), () => {
      for (const it of items) {
        if (it.errs.length || !it.tk) continue;
        const tk = it.tk, v = it.v;

        if (v.af != null || (v.pct != null && v.pct >= 100)) { if (v.af != null) tk.af = v.af; App.setStatus(tk, 'C'); if (v.af != null) tk.af = v.af; }
        else if (v.pct != null) App.setPct(tk, v.pct);
        else if (tk.status === 'NS' && (v.as != null || v.rem != null)) App.setStatus(tk, 'IP');
        if (v.as != null && tk.status === 'NS') App.setStatus(tk, 'IP');
        if (v.as != null) tk.as = v.as;
        if (v.rem != null && tk.status === 'IP') { tk.rem = v.rem; if (tk.pctType === 'dur' && tk.dur > 0 && v.pct == null) tk.pct = Math.max(0, Math.min(99, Math.round(100 * (1 - v.rem / tk.dur)))); }

  }

  function preview(items, fname) {
    const bad = items.filter((x) => x.errs.length), ok = items.length - bad.length, wr = items.filter((x) => !x.errs.length && x.warn.length).length;
    const body = document.createElement('div');
    body.innerHTML = `<p class="hint">${esc(fname)} – ${esc(B('Data date: ', 'تاريخ البيانات: ') + fd(App.p.dataDate))}</p>
      <div class="cmpcards"><div class="cmpc good"><b>${ok}</b><span>${esc(B('Ready to apply', 'جاهز للتطبيق'))}</span></div><div class="cmpc ${wr ? 'bad' : ''}"><b>${wr}</b><span>${esc(B('With warnings', 'بتحذيرات'))}</span></div><div class="cmpc ${bad.length ? 'bad' : ''}"><b>${bad.length}</b><span>${esc(B('Errors (skipped)', 'أخطاء (تُتجاهل)'))}</span></div></div>
      <div class="tbl-scroll"><table class="mini cmpt"><thead><tr><th>${esc(B('Row', 'صف'))}</th><th>ID</th><th>${esc(B('Name', 'الاسم'))}</th><th>Actual Start</th><th>Actual Finish</th><th>%</th><th>Rem</th><th>${esc(B('Notes', 'ملاحظات'))}</th></tr></thead><tbody>${items.slice(0, 500).map((x) => `<tr><td>${x.row}</td><td>${esc(x.code)}</td><td>${esc(x.tk ? x.tk.name : '')}</td><td>${typeof x.v.as === 'number' ? fd(x.v.as) : ''}</td><td>${typeof x.v.af === 'number' ? fd(x.v.af) : ''}</td><td>${x.v.pct == null || x.v.pct === undefined ? '' : x.v.pct}</td><td>${x.v.rem == null || x.v.rem === undefined ? '' : x.v.rem}</td><td class="${x.errs.length ? 'cmp-bad' : x.warn.length ? '' : 'cmp-good'}">${esc(x.errs.concat(x.warn).join('; ') || '✓')}</td></tr>`).join('')}</tbody></table></div>`;
    D.modal({ title: B('Import Progress from Excel', 'استيراد التقدم من Excel'), cls: 'wide dsh-modal', body, buttons: [{ label: P6.t('cancel'), fn: () => {} }, { label: B('Apply ' + ok + ' updates', 'طبّق ' + ok + ' تحديث'), cls: 'pri', fn: () => { if (!ok) return false; apply(items); } }] });
  }

  function csv(tx, sep) {
    const out = []; let row = [], cur = '', q = false;
    for (let i = 0; i < tx.length; i++) {
      const c = tx[i];
      if (q) { if (c === '"') { if (tx[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true; else if (c === sep) { row.push(cur); cur = ''; } else if (c === '\n') { row.push(cur.replace(/\r$/, '')); out.push(row); row = []; cur = ''; } else cur += c;
    }

  }
  App.progressImport = function () {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,.csv,.tsv,.txt';
    inp.onchange = async () => {

<script>
/* P6 Web – What-If scenarios & delay analysis (TIA-style). A scenario is a list of changes applied to a throw-away copy of the schedule,
   re-scheduled, and compared with the current schedule (finish movement, critical path, changed activities). Scenarios are saved with the project
   and can be applied to the live schedule (undoable). Changes: duration, delay event, lag, add / remove relationship, constraint, scale durations. */
(function (g) {
  'use strict';
  const P6 = g.P6, App = g.App, D = App.dialogs;
  const esc = P6.esc, B = (en, ar) => (P6.dir() === 'rtl' ? ar : en);
  const fd = (d) => (d == null ? '' : P6.fmtDate(d));
  const byCode = (p, c) => p.tasks.find((x) => String(x.code).toLowerCase() === String(c || '').trim().toLowerCase());
  const clone = (p) => JSON.parse(JSON.stringify(p, (k, v) => (k === 'xer' || k === 'scenarios' ? undefined : v)));

  const KINDS = {
    dur: () => B('Change duration', 'تغيير مدة نشاط'), event: () => B('Delay event (TIA)', 'حدث تأخير (TIA)'), lag: () => B('Change lag', 'تغيير Lag علاقة'),
    addrel: () => B('Add relationship', 'إضافة علاقة'), rmrel: () => B('Remove relationship', 'حذف علاقة'), cons: () => B('Set constraint', 'وضع قيد'), scale: () => B('Scale open durations', 'تغيير نسبي لمدد الأنشطة المفتوحة')
  };
  const describe = (o) => {
    switch (o.k) {
      case 'dur': return `${o.code}: ${o.mode === 'add' ? (o.v >= 0 ? '+' : '') + o.v + ' d' : o.mode === 'pct' ? o.v + '%' : '= ' + o.v + ' d'}`;
      case 'event': return `${o.name || 'Delay'} ${o.days} d → ${o.succ}${o.pred ? ' (after ' + o.pred + ')' : ''}`;
      case 'lag': return `${o.from} → ${o.to}: lag = ${o.lag} d`;
      case 'addrel': return `${o.from} → ${o.to} (${o.type}${o.lag ? ' ' + o.lag : ''})`;
      case 'rmrel': return `${o.from} ✕ ${o.to}`;
      case 'cons': return `${o.code}: ${o.ct}${o.date ? ' ' + o.date : ''}`;
      case 'scale': return `${o.v}% ${B('of open durations', 'من مدد الأنشطة المفتوحة')}${o.wbs ? ' · WBS ' + o.wbs : ''}`;
    }
    return '';
  };

  /* Apply ops to project p (mutating). Returns array of warnings. */
  P6.applyScenario = function (p, ops) {
    const warn = [];
    for (const o of ops) {
      if (o.k === 'scale') {
        const w = o.wbs ? p.wbs.find((q) => String(q.code).toLowerCase() === String(o.wbs).toLowerCase()) : null, ids = new Set();
        if (w) { const st = [w.id]; while (st.length) { const x = st.pop(); ids.add(x); p.wbs.filter((q) => q.parent === x).forEach((q) => st.push(q.id)); } }
        for (const t of p.tasks) if (t.status !== 'C' && !P6.isMile(t) && !P6.isHammock(t) && (!w || ids.has(t.wbs))) { t.dur = Math.max(1, Math.round(t.dur * o.v / 100)); if (t.status === 'NS') t.rem = t.dur; else t.rem = Math.max(0, Math.round((t.rem || 0) * o.v / 100)); }
      } else if (o.k === 'dur') {
        const t = byCode(p, o.code); if (!t) { warn.push('? ' + o.code); continue; }
        const nd = o.mode === 'add' ? t.dur + o.v : o.mode === 'pct' ? Math.round(t.dur * o.v / 100) : o.v, d = Math.max(0, nd);
        if (t.status === 'C') { warn.push(o.code + ' ' + B('is completed', 'مكتمل')); continue; }
        if (t.status === 'NS') { t.dur = d; t.rem = d; } else { t.rem = Math.max(0, t.rem + (d - t.dur)); t.dur = d; }
      } else if (o.k === 'event') {
        const s = byCode(p, o.succ); if (!s) { warn.push('? ' + o.succ); continue; }
        const pr = o.pred ? byCode(p, o.pred) : null;
        const n = P6.newTask(p, s.wbs, { name: o.name || 'Delay event', dur: o.days, rem: o.days, cal: s.cal, code: 'DLY-' + (p.tasks.filter((x) => /^DLY-/.test(x.code)).length + 1) });
        p.tasks.push(n);
        p.rels.push({ id: P6.nextId(p), p: n.id, s: s.id, type: 'FS', lag: 0 });
        if (pr) p.rels.push({ id: P6.nextId(p), p: pr.id, s: n.id, type: 'FS', lag: 0 });
        else for (const r of p.rels.filter((q) => q.s === s.id && q.p !== n.id)) { p.rels.push({ id: P6.nextId(p), p: r.p, s: n.id, type: r.type, lag: r.lag }); }
      } else if (o.k === 'lag' || o.k === 'rmrel') {
        const a = byCode(p, o.from), b = byCode(p, o.to), r = a && b && p.rels.find((q) => q.p === a.id && q.s === b.id);
        if (!r) { warn.push(o.from + '→' + o.to + ' ' + B('not found', 'غير موجودة')); continue; }
        if (o.k === 'lag') r.lag = o.lag; else p.rels = p.rels.filter((q) => q !== r);
      } else if (o.k === 'addrel') {
        const a = byCode(p, o.from), b = byCode(p, o.to); if (!a || !b) { warn.push(o.from + '→' + o.to + ' ?'); continue; }
        if (P6.wouldLoop && P6.wouldLoop(p, a.id, b.id)) { warn.push(B('Loop: ', 'حلقة: ') + o.from + '→' + o.to); continue; }
        p.rels.push({ id: P6.nextId(p), p: a.id, s: b.id, type: o.type || 'FS', lag: o.lag || 0 });
      } else if (o.k === 'cons') {
        const t = byCode(p, o.code); if (!t) { warn.push('? ' + o.code); continue; }
        t.ct = o.ct === 'NONE' ? '' : o.ct; t.cd = o.date ? P6.parseDate(o.date) : null;
      }
    }
    return warn;
  };

  P6.runScenario = function (p, ops) {
    const base = clone(p), tr = clone(p); P6.schedule(base); const warn = P6.applyScenario(tr, ops); P6.schedule(tr);
    return { res: P6.compare(tr, base), warn, base, tr };
  };

  App.whatIf = function () {
    const p = App.p; if (!p) return;
    p.scenarios = p.scenarios || []; let cur = p.scenarios[0] || null, last = null;
    const root = document.createElement('div'); root.className = 'wif'; root.dir = P6.dir();
    const dl = `<datalist id="wif_codes">${p.tasks.slice(0, 3000).map((t) => `<option value="${esc(t.code)}">${esc(t.name)}</option>`).join('')}</datalist>`;
    const save = () => App.scheduleSave();
    const input = (id, ph, w) => `<input id="${id}" list="wif_codes" placeholder="${esc(ph)}" style="width:${w || 110}px">`;
    function formFor(k) {
      const num = (id, ph, v) => `<input id="${id}" type="number" placeholder="${esc(ph)}" value="${v == null ? '' : v}" style="width:80px">`;
      switch (k) {
        case 'dur': return input('f_code', B('Activity ID', 'رقم النشاط')) + `<select id="f_mode"><option value="add">${B('Add days (±)', 'إضافة أيام (±)')}</option><option value="pct">${B('% of duration', '% من المدة')}</option><option value="set">${B('Set to days', 'تعيين بأيام')}</option></select>` + num('f_v', B('value', 'القيمة'));
        case 'event': return `<input id="f_name" placeholder="${esc(B('Event name', 'اسم الحدث'))}" style="width:150px">` + num('f_days', B('days', 'أيام')) + input('f_succ', B('Delays activity', 'يؤخر النشاط')) + input('f_pred', B('After (optional)', 'بعد (اختياري)'));
        case 'lag': return input('f_from', B('From', 'من')) + input('f_to', B('To', 'إلى')) + num('f_lag', 'lag');
        case 'rmrel': return input('f_from', B('From', 'من')) + input('f_to', B('To', 'إلى'));
        case 'addrel': return input('f_from', B('From', 'من')) + input('f_to', B('To', 'إلى')) + `<select id="f_type"><option>FS</option><option>SS</option><option>FF</option><option>SF</option></select>` + num('f_lag', 'lag', 0);
        case 'cons': return input('f_code', B('Activity ID', 'رقم النشاط')) + `<select id="f_ct">${['SNET', 'FNET', 'SNLT', 'FNLT', 'MSO', 'MFO', 'NONE'].map((c) => `<option>${c}</option>`).join('')}</select><input id="f_date" placeholder="dd-mmm-yy" style="width:90px">`;
        case 'scale': return num('f_v', B('% (e.g. 120)', '% (مثلاً 120)'), 100) + `<input id="f_wbs" placeholder="${esc(B('WBS code (optional)', 'كود WBS (اختياري)'))}" style="width:150px">`;
      }
      return '';
    }
    function readOp(k, el) {
      const v = (id) => { const e = el.querySelector('#' + id); return e ? e.value.trim() : ''; }, n = (id) => { const x = parseFloat(v(id)); return isFinite(x) ? x : NaN; };
      const o = { k };
      if (k === 'dur') Object.assign(o, { code: v('f_code'), mode: v('f_mode'), v: n('f_v') });
      else if (k === 'event') Object.assign(o, { name: v('f_name'), days: n('f_days'), succ: v('f_succ'), pred: v('f_pred') });
      else if (k === 'lag') Object.assign(o, { from: v('f_from'), to: v('f_to'), lag: n('f_lag') });
      else if (k === 'rmrel') Object.assign(o, { from: v('f_from'), to: v('f_to') });
      else if (k === 'addrel') Object.assign(o, { from: v('f_from'), to: v('f_to'), type: v('f_type'), lag: n('f_lag') || 0 });
      else if (k === 'cons') Object.assign(o, { code: v('f_code'), ct: v('f_ct'), date: v('f_date') });
      else if (k === 'scale') Object.assign(o, { v: n('f_v'), wbs: v('f_wbs') });
      const need = { dur: ['code', 'v'], event: ['days', 'succ'], lag: ['from', 'to', 'lag'], rmrel: ['from', 'to'], addrel: ['from', 'to'], cons: ['code'], scale: ['v'] }[k];
      if (need.some((f) => o[f] === '' || (typeof o[f] === 'number' && isNaN(o[f])))) return null;
      return o;
    }
    function draw() {
      const sc = p.scenarios;
      root.innerHTML = `${dl}<div class="wif-bar"><label>${esc(B('Scenario', 'السيناريو'))}</label><select id="wif_sel">${sc.map((s, i) => `<option value="${i}"${s === cur ? ' selected' : ''}>${esc(s.name)}</option>`).join('') || `<option>—</option>`}</select><button class="btn" id="wif_new">+ ${esc(B('New', 'جديد'))}</button><button class="btn" id="wif_ren"${cur ? '' : ' disabled'}>${esc(B('Rename', 'إعادة تسمية'))}</button><button class="btn" id="wif_dup"${cur ? '' : ' disabled'}>${esc(B('Duplicate', 'نسخ'))}</button><button class="btn" id="wif_del"${cur ? '' : ' disabled'}>${esc(B('Delete', 'حذف'))}</button></div>`
        + (cur ? `<div class="wif-add"><select id="wif_k">${Object.keys(KINDS).map((k) => `<option value="${k}">${esc(KINDS[k]())}</option>`).join('')}</select><span id="wif_form">${formFor('dur')}</span><button class="btn pri" id="wif_addop">${esc(B('Add change', 'أضف التغيير'))}</button></div>
        <div class="tbl-scroll" style="max-height:170px"><table class="mini cmpt"><thead><tr><th>#</th><th>${esc(B('Type', 'النوع'))}</th><th>${esc(B('Change', 'التغيير'))}</th><th></th></tr></thead><tbody>${cur.ops.map((o, i) => `<tr><td>${i + 1}</td><td>${esc(KINDS[o.k]())}</td><td>${esc(describe(o))}</td><td><a data-rm="${i}" style="cursor:pointer;color:#c0392b">✕</a></td></tr>`).join('') || `<tr><td colspan="4" style="text-align:center;color:#888">${esc(B('No changes yet – add some above', 'لا تغييرات بعد – أضف من الأعلى'))}</td></tr>`}</tbody></table></div>
        <div class="wif-run"><button class="btn pri" id="wif_run">▶ ${esc(B('Run scenario', 'شغّل السيناريو'))}</button><button class="btn" id="wif_apply" disabled>${esc(B('Apply to live schedule', 'طبّق على الجدول الفعلي'))}</button><button class="btn" id="wif_xl" disabled>${esc(B('Export to Excel', 'تصدير Excel'))}</button><button class="btn" id="wif_all">${esc(B('Compare all scenarios', 'قارن كل السيناريوهات'))}</button></div><div id="wif_out"></div>` : `<p class="hint">${esc(B('Create a scenario to start: e.g. "Delay in procurement +20 d", "Add crew to compress", "Remove a link".', 'أنشئ سيناريو للبدء: مثلاً "تأخير التوريد +20 يوم" أو "إضافة طاقم للضغط" أو "حذف علاقة".'))}</p>`);
      const $ = (s) => root.querySelector(s);
      $('#wif_sel').onchange = (e) => { cur = sc[+e.target.value]; last = null; draw(); };
      $('#wif_new').onclick = () => { const nm = prompt(B('Scenario name', 'اسم السيناريو'), 'Scenario ' + (sc.length + 1)); if (!nm) return; cur = { id: Date.now(), name: nm, ops: [] }; sc.push(cur); last = null; save(); draw(); };
      if (cur) {
        $('#wif_ren').onclick = () => { const nm = prompt(B('Scenario name', 'اسم السيناريو'), cur.name); if (nm) { cur.name = nm; save(); draw(); } };
        $('#wif_dup').onclick = () => { const c = JSON.parse(JSON.stringify(cur)); c.id = Date.now(); c.name += ' (copy)'; sc.push(c); cur = c; save(); draw(); };
        $('#wif_del').onclick = () => { if (!confirm(B('Delete this scenario?', 'حذف السيناريو؟'))) return; p.scenarios = sc.filter((s) => s !== cur); cur = p.scenarios[0] || null; last = null; save(); draw(); };
        $('#wif_k').onchange = (e) => { $('#wif_form').innerHTML = formFor(e.target.value); };
        $('#wif_addop').onclick = () => { const k = $('#wif_k').value, o = readOp(k, root); if (!o) return App.toast(B('Fill in all fields', 'املأ كل الحقول'), true); cur.ops.push(o); last = null; save(); draw(); };
        root.querySelectorAll('[data-rm]').forEach((a) => { a.onclick = () => { cur.ops.splice(+a.dataset.rm, 1); last = null; save(); draw(); }; });
        $('#wif_run').onclick = () => {
          if (!cur.ops.length) return App.toast(B('Add at least one change', 'أضف تغييراً واحداً على الأقل'), true);
          try { last = P6.runScenario(p, cur.ops); } catch (e) { console.error(e); return App.toast(String(e.message || e), true); }
          const out = $('#wif_out'); out.innerHTML = (last.warn.length ? `<p class="cmp-bad">⚠ ${esc(last.warn.join(' · '))}</p>` : '') + (last.tr.loops && last.tr.loops.length ? `<p class="cmp-bad">⚠ ${esc(B('Logic loop in scenario', 'حلقة منطقية في السيناريو'))}</p>` : '');
          out.appendChild(P6.compare.view(last.res, { cur: cur.name, oth: p.name + ' (' + B('current', 'الحالي') + ')' }));
          $('#wif_apply').disabled = false; $('#wif_xl').disabled = false;
        };
        $('#wif_apply').onclick = () => {
          if (!confirm(B('Apply this scenario to the live schedule? (Undo with Ctrl+Z)', 'تطبيق السيناريو على الجدول الفعلي؟ (تراجع بـ Ctrl+Z)'))) return;
          App.mutate(B('Apply what-if scenario', 'تطبيق سيناريو ماذا لو') + ': ' + cur.name, () => { P6.applyScenario(App.p, cur.ops); });
          App.toast(B('Scenario applied', 'تم تطبيق السيناريو'));
        };
        $('#wif_xl').onclick = () => { if (last) { const sh = P6.compare.sheets(last.res, last.tr, last.base, { cur: cur.name, oth: p.name }); sh.splice(1, 0, { name: 'Changes list', title: B('Scenario changes', 'تغييرات السيناريو'), cols: [{ h: '#', t: 'n', w: 5 }, { h: 'Type', w: 26 }, { h: 'Change', w: 70 }], rows: cur.ops.map((o, i) => [i + 1, KINDS[o.k](), describe(o)]) }); App.xlsxBook('WhatIf-' + cur.name.replace(/[^\w\-]+/g, '_') + '.xlsx', sh); } };
        $('#wif_all').onclick = () => {
          if (!sc.length) return;
          const rows = sc.map((s) => { try { const r = P6.runScenario(p, s.ops).res.sum; return { s, r }; } catch (e) { return { s, r: null }; } });
          const out = $('#wif_out');
          out.innerHTML = `<div class="tbl-scroll"><table class="mini cmpt"><thead><tr><th>${esc(B('Scenario', 'السيناريو'))}</th><th>${esc(B('Changes', 'تغييرات'))}</th><th>${esc(B('Project finish', 'نهاية المشروع'))}</th><th>${esc(B('Movement (d)', 'الحركة (يوم)'))}</th><th>${esc(B('Activities changed', 'أنشطة متغيرة'))}</th><th>${esc(B('Critical in/out', 'حرج دخل/خرج'))}</th></tr></thead><tbody>${rows.map(({ s, r }) => `<tr><td>${esc(s.name)}</td><td>${s.ops.length}</td><td>${r ? fd(r.cfin) : '–'}</td><td class="${r && r.dfin > 0 ? 'cmp-bad' : r && r.dfin < 0 ? 'cmp-good' : ''}">${r && r.dfin != null ? (r.dfin > 0 ? '+' : '') + r.dfin : '–'}</td><td>${r ? r.changed : ''}</td><td>${r ? r.critIn + '/' + r.critOut : ''}</td></tr>`).join('')}</tbody></table></div>`;
        };
      }
    }
    draw();
    D.modal({ title: B('What-If Scenarios', 'سيناريوهات ماذا لو'), cls: 'wide dsh-modal', body: root, sticky: true, buttons: [{ label: P6.t('close'), fn: () => {} }] });
  };
})(window);

</script>
<script>
/* P6 Web – Command Palette (Ctrl+K): one box to run any menu command, open any window, jump to an activity, WBS or resource. */
(function (g) {
  'use strict';
  const P6 = g.P6, App = g.App;
  const esc = P6.esc, t = (k) => P6.t(k);
  const norm = (s) => String(s == null ? '' : s).toLowerCase().replace(/[ً-ٰٟ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
  const clean = (s) => String(s || '').replace(/…|\.\.\./g, '').trim();
  let ov = null, items = [], sel = 0, recent = [];
  try { recent = JSON.parse(localStorage.getItem('p6web.recentCmd') || '[]'); } catch (e) { recent = []; }

  function commands() {
    const out = [], seen = new Set();
    const add = (cat, label, hint, fn, key) => { label = clean(label); if (!label || seen.has(cat + label)) return; seen.add(cat + label); out.push({ cat, label, hint: hint || '', fn, key: key || cat + ':' + label, n: norm(label) }); };
    let defs = []; try { defs = App.menuDefs ? App.menuDefs() : []; } catch (e) { defs = []; }
    for (const [mid, list] of defs) {
      const mname = t('m_' + mid);
      for (const it of list) {
        if (it === '-' || !it) continue;
        if (Array.isArray(it)) {
          const lab = t(it[0]);
          if (it[4]) { for (const s of it[4]) { if (s && s !== '-' && s.l && s.fn && !s.dis && !s.sub) add('Command', lab + ' › ' + s.l, mname, s.fn); } }
          else if (it[1] && !it[5]) add('Command', lab, mname + (it[2] ? '  ' + it[2] : ''), it[1]);
        }
      }
    }
    for (const w of Object.keys(App.WINS || {})) add('Window', t(App.WINS[w].title), 'Open window', () => App.openWin(w));
    add('Command', B('Toggle full screen', 'ملء الشاشة'), 'F11', () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); });
    add('Command', B('Switch theme', 'تغيير الثيم'), 'View', () => document.getElementById('themeBtn') && document.getElementById('themeBtn').click());
    add('Command', B('Switch language', 'تغيير اللغة'), 'View', () => document.getElementById('langBtn') && document.getElementById('langBtn').click());
    return out;
  }
  const B = (en, ar) => (App.cfg.lang === 'ar' ? ar : en);

  function search(q) {
    const nq = norm(q).trim(), res = [];
    const cmds = commands();
    if (!nq) { const r = recent.map((k) => cmds.find((c) => c.key === k)).filter(Boolean); return (r.length ? r : cmds.filter((c) => c.cat === 'Window')).slice(0, 12).map((c) => Object.assign({}, c, { cat: r.length ? 'Recent' : c.cat })); }
    const toks = nq.split(/\s+/);
    for (const c of cmds) {
      if (!toks.every((k) => c.n.includes(k))) continue;
      const score = (c.n.startsWith(nq) ? 100 : c.n.includes(nq) ? 60 : 30) - c.n.length * 0.1 + (recent.includes(c.key) ? 20 : 0);
      res.push(Object.assign({ score }, c));
    }
    if (App.p && nq.length >= 2) {
      let n = 0;
      for (const tk of App.p.tasks) {
        const a = norm(tk.code), b = norm(tk.name);
        if (toks.every((k) => a.includes(k) || b.includes(k))) { res.push({ cat: 'Activity', label: tk.code + ' – ' + tk.name, hint: P6.fmtDate(tk.es) + ' → ' + P6.fmtDate(tk.ef) + (tk.crit ? ' · critical' : ''), score: 40 + (a === nq ? 50 : a.startsWith(nq) ? 25 : 0), key: 'a:' + tk.id, fn: () => { App.showWin('activities'); setTimeout(() => { const k = 't' + tk.id; if (!App.rowIdx.has(k)) return App.toast(B('Hidden by the current filter', 'مخفي بالفلتر الحالي'), true); App.setSel([k]); App.ensureVisible(App.rowIdx.get(k)); }, 60); } }); if (++n >= 25) break; }
      }
      let m = 0;
      for (const w of App.p.wbs) { if (toks.every((k) => norm(w.name).includes(k) || norm(w.code).includes(k))) { res.push({ cat: 'WBS', label: (w.code ? w.code + ' – ' : '') + w.name, hint: 'WBS', score: 35, key: 'w:' + w.id, fn: () => { App.showWin('activities'); setTimeout(() => { const k = 'w' + w.id; if (!App.rowIdx.has(k)) return App.toast(B('Hidden by the current layout', 'مخفي بالتخطيط الحالي'), true); App.setSel([k]); App.ensureVisible(App.rowIdx.get(k)); }, 60); } }); if (++m >= 8) break; } }
      for (const r of App.p.rsrc) if (toks.every((k) => norm(r.name).includes(k))) res.push({ cat: 'Resource', label: r.name, hint: 'Resource', score: 30, key: 'r:' + r.id, fn: () => { App.wsel.resources = String(r.id); App.openWin('resources'); } });
    }
    return res.sort((a, b) => b.score - a.score).slice(0, 40);
  }

  function draw() {
    const list = ov.querySelector('.pal-list');
    list.innerHTML = items.length ? items.map((c, i) => `<div class="pal-it${i === sel ? ' on' : ''}" data-i="${i}"><span class="pal-cat pal-${c.cat}">${esc(c.cat)}</span><span class="pal-lb">${esc(c.label)}</span><span class="pal-h">${esc(c.hint)}</span></div>`).join('') : `<div class="pal-empty">${esc(B('No matches', 'لا توجد نتائج'))}</div>`;
    const on = list.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' });
  }
  function run(c) {
    close(); if (!c || !c.fn) return;
    recent = [c.key].concat(recent.filter((k) => k !== c.key)).slice(0, 8); try { localStorage.setItem('p6web.recentCmd', JSON.stringify(recent)); } catch (e) { /* ignore */ }
    setTimeout(() => { try { c.fn(); } catch (e) { App.toast(String(e.message || e), true); } }, 30);
  }
  function close() { if (ov) { ov.remove(); ov = null; } }
  App.openPalette = function () {
    if (ov) return close();
    ov = document.createElement('div'); ov.id = 'pal'; ov.dir = App.cfg.lang === 'ar' ? 'rtl' : 'ltr';
    ov.innerHTML = `<div class="pal-box"><input class="pal-in" placeholder="${esc(B('Type a command, activity ID or name, WBS, resource…', 'اكتب أمراً أو رقم/اسم نشاط أو WBS أو مورداً…'))}" autocomplete="off" spellcheck="false"><div class="pal-list"></div><div class="pal-foot">${esc(B('↑↓ navigate · Enter run · Esc close', '↑↓ تنقل · Enter تنفيذ · Esc إغلاق'))}</div></div>`;
    document.body.appendChild(ov);
    const inp = ov.querySelector('.pal-in'); items = search(''); sel = 0; draw(); inp.focus();
    inp.oninput = () => { items = search(inp.value); sel = 0; draw(); };
    inp.onkeydown = (e) => {
      if (e.key === 'ArrowDown') { sel = Math.min(items.length - 1, sel + 1); draw(); e.preventDefault(); } else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
      else if (e.key === 'Enter') { run(items[sel]); e.preventDefault(); } else if (e.key === 'Escape') { close(); e.preventDefault(); }
    };
    ov.addEventListener('mousedown', (e) => { const it = e.target.closest('.pal-it'); if (it) { run(items[+it.dataset.i]); e.preventDefault(); } else if (e.target === ov) close(); });
    ov.addEventListener('mousemove', (e) => { const it = e.target.closest('.pal-it'); if (it && +it.dataset.i !== sel) { sel = +it.dataset.i; ov.querySelectorAll('.pal-it').forEach((x, i) => x.classList.toggle('on', i === sel)); } });
  };
  addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.code === 'KeyK' && !e.shiftKey && !e.altKey) { if (!App.p) return; e.preventDefault(); e.stopImmediatePropagation(); App.openPalette(); }
  }, true);
  // visible entry point in the top bar
  const ensure = () => { const hd = document.getElementById('topbar'); if (!hd || document.getElementById('palBtn')) return; const b = document.createElement('button'); b.id = 'palBtn'; b.type = 'button'; b.title = 'Ctrl+K'; b.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span>Search anything</span><kbd>Ctrl K</kbd>'; b.onclick = App.openPalette; const sp = hd.querySelector('.spacer'); if (sp) sp.before(b); else hd.appendChild(b); };
  document.addEventListener('DOMContentLoaded', ensure); setTimeout(ensure, 300); setTimeout(ensure, 1500);
})(window);

</script>
<script>
/* P6 Web – project database (like P6's Projects window): EPS tree, projects with Project ID / status / manager,
   copy, move, delete, export, plus whole-database backup and restore. Everything is stored in this browser (IndexedDB). */
(function (g) {
  'use strict';
  const P6 = g.P6, App = g.App, D = App.dialogs;
  const t = (k, ...a) => P6.t(k, ...a), esc = P6.esc;
  const ar = () => App.cfg.lang !== 'en';
  const B = (en, arb) => (ar() ? arb : en);
  const fmtD = (d) => (d == null ? '' : P6.fmtDate(d));
  const STATUS = [['Active', 'Active', 'نشط'], ['Planned', 'Planned', 'مخطط'], ['Inactive', 'Inactive', 'غير نشط'], ['WhatIf', 'What-If', 'سيناريو (What-If)']];
  const stLabel = (s) => { const x = STATUS.find((y) => y[0] === s) || STATUS[0]; return ar() ? x[2] : x[1]; };
  const st = () => App.store();
  const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const ROOT = 'root';
  let sel = null; // 'e:<id>' | 'p:<id>'

  // ---------- data ----------
  const epsAll = async () => { try { return (await st().epsAll()) || []; } catch (e) { return []; } };
  const epsPut = (n) => st().epsPut(n);
  const epsDel = (id) => st().epsDel(id);
  const projAll = () => App.listProjects();
  const rootName = () => App.cfg.epsRoot || B('Enterprise', 'المؤسسة (Enterprise)');
  async function patchProject(id, fn) {
    if (App.p && App.p.id === id) { fn(App.p.meta = App.p.meta || {}, App.p); App.p.name = App.p.name; await App.saveNowP(); return; }
    const got = await st().get(id); if (!got) return; const rec = got.rec;
    const p = JSON.parse(rec.data); p.meta = p.meta || {}; fn(p.meta, p);
    Object.assign(rec, { name: p.name, eps: p.meta.eps || ROOT, code: p.meta.code || '', status: p.meta.status || 'Active', manager: p.meta.manager || '', data: JSON.stringify(p), updated: Date.now() });
    await st().put(rec, undefined, { force: true });
  }

  // ---------- window ----------
  App.renderProjectsDB = async function (el) {
    if (App.p && !App.p.meta) App.p.meta = { eps: ROOT, code: App.nextCode(App.p.name), status: 'Active', manager: '' };
    let projs = await projAll();
    if (App.p && !projs.some((x) => x.id === App.p.id)) { await App.saveNowP(); projs = await projAll(); }
    const eps = await epsAll();
    const cur = App.p && App.p.id, open = (App.cfg.epsOpen = App.cfg.epsOpen || {});
    const kids = (pid) => eps.filter((e) => (e.parent || ROOT) === pid).sort((a, b) => a.name.localeCompare(b.name));
    const pOf = (eid) => projs.filter((p) => (p.eps || ROOT) === eid || (eid === ROOT && !eps.some((e) => e.id === p.eps))).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    const isOpen = (id) => open[id] !== false;
    const rows = [];
    const walk = (id, lvl) => {
      if (id !== ROOT) {} // eslint-disable-line no-empty
      for (const e of kids(id)) { rows.push({ k: 'e:' + e.id, e, lvl }); if (isOpen(e.id)) walk(e.id, lvl + 1); }
      for (const p of pOf(id)) rows.push({ k: 'p:' + p.id, p, lvl });
    };
    rows.push({ k: 'e:' + ROOT, e: { id: ROOT, name: rootName(), code: '' }, lvl: 0 });
    if (isOpen(ROOT)) walk(ROOT, 1);
    if (!sel || !rows.some((r) => r.k === sel)) sel = cur ? 'p:' + cur : 'e:' + ROOT;
    const total = projs.reduce((a, p) => a + (p.size || 0), 0);
    let est = ''; try { const s = await navigator.storage.estimate(); est = ` · ${B('Browser storage', 'تخزين المتصفح')}: ${(s.usage / 1048576).toFixed(1)} / ${(s.quota / 1048576 / 1024).toFixed(1)} GB`; } catch (e) { /* ignore */ }
    const th = (s, w) => `<th style="min-width:${w}px">${esc(s)}</th>`;
    const body = rows.map((r) => {
      const pad = r.lvl * 18 + 6;
      if (r.e) { const has = kids(r.e.id).length || pOf(r.e.id).length; return `<tr data-k="${r.k}" class="${sel === r.k ? 'wsel ' : ''}pdb-eps"><td style="padding-inline-start:${pad}px"><div class="pdb-c"><span class="tw" data-tw="${esc(r.e.id)}">${has ? (isOpen(r.e.id) ? '−' : '+') : ''}</span>${P6.icon('eps')}<b dir="auto">${esc(r.e.name)}</b></div></td><td>${esc(r.e.code || '')}</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`; }
      const p = r.p, c = p.id === cur;
      return `<tr data-k="${r.k}" class="${sel === r.k ? 'wsel ' : ''}${c ? 'curproj' : ''}"><td style="padding-inline-start:${pad + 18}px"><div class="pdb-c">${P6.icon('projects')}<span dir="auto">${esc(p.name || '')}</span>${c ? '<span>●</span>' : ''}</div></td><td dir="ltr">${esc(p.code || '')}</td><td>${esc(stLabel(p.status))}</td><td style="text-align:end">${p.tasks}</td><td>${fmtD(p.start)}</td><td>${fmtD(p.finish)}</td><td>${fmtD(p.dataDate)}</td><td>${esc(new Date(p.updated).toLocaleString())}</td></tr>`;
    }).join('');
    const btn = (a, label, cls) => `<button class="btn sm${cls ? ' ' + cls : ''}" data-a="${a}">${esc(label)}</button>`;
    el.innerHTML = `<div class="pdb"><div class="pdb-bar">${btn('neweps', B('New EPS', 'EPS جديد'))}${btn('newproj', B('New Project', 'مشروع جديد'))}${btn('open', t('open_project'))}${btn('props', B('Properties…', 'خصائص…'))}${btn('copy', B('Copy', 'نسخ'))}${btn('xer', B('Export XER', 'تصدير XER'))}${btn('del', t('delete'), 'dng')}<span class="sp"></span>${btn('backup', B('Backup database', 'نسخ احتياطي للقاعدة'))}${btn('restore', B('Restore…', 'استعادة…'))}</div>
      <div class="pdb-grid"><table class="mini pdbt"><thead><tr>${th(B('EPS / Project Name', 'EPS / اسم المشروع'), 300)}${th(B('Project ID', 'رقم المشروع'), 110)}${th(B('Status', 'الحالة'), 90)}${th(t('activities'), 70)}${th(t('col_es'), 90)}${th(t('col_ef'), 90)}${th(t('data_date'), 90)}${th(t('last_saved'), 160)}</tr></thead><tbody>${body}</tbody></table></div>
      <div class="pdb-info">${B('Projects', 'المشاريع')}: ${projs.length} · ${B('EPS nodes', 'عقد EPS')}: ${eps.length} · ${(total / 1048576).toFixed(2)} MB${est}</div></div>`;
    const rerender = () => App.renderWin();
    el.onclick = async (e) => {
      const tw = e.target.closest('[data-tw]'); if (tw) { open[tw.dataset.tw] = !isOpen(tw.dataset.tw); App.saveCfg(); return rerender(); }
      const tr = e.target.closest('tr[data-k]'); if (tr && !e.target.closest('button')) { sel = tr.dataset.k; el.querySelectorAll('tr.wsel').forEach((q) => q.classList.remove('wsel')); tr.classList.add('wsel'); return; }

  };

  const selId = () => (sel ? sel.slice(2) : null), selIsP = () => !!sel && sel[0] === 'p';
  const epsSelect = (eps, val, id) => `<select id="${id}"><option value="${ROOT}"${val === ROOT || !val ? ' selected' : ''}>${esc(rootName())}</option>${eps.map((e) => `<option value="${esc(e.id)}"${val === e.id ? ' selected' : ''}>${esc(e.name)}</option>`).join('')}</select>`;
  const actions = {
    async neweps(rr, d) {
      const parent = selIsP() ? ((d.projs.find((p) => p.id === selId()) || {}).eps || ROOT) : selId() || ROOT;
      const name = prompt(B('New EPS node name', 'اسم عقدة EPS الجديدة'), ''); if (!name) return;
      await epsPut({ id: uid('e'), name: name.trim(), code: name.trim().slice(0, 12).toUpperCase().replace(/\s+/g, '-'), parent }); App.cfg.epsOpen[parent] = true; rr();
    },
    async newproj(rr, d) {
      App._pendingEps = selIsP() ? ((d.projs.find((p) => p.id === selId()) || {}).eps || ROOT) : selId() || ROOT; D.newProject();
    },
    async open(rr) {
      if (!selIsP()) return; const q = await App.loadProject(selId()); if (q) { App.openProject(q); App.showWin('activities'); }
    },
    async props(rr, d) {
      const body = document.createElement('div');
      if (selIsP()) {
        const p = d.projs.find((x) => x.id === selId()); if (!p) return;
        body.innerHTML = `<div class="grid2"><div class="fld w2"><label>${esc(t('project_name'))}</label><input id="pp_n" dir="auto" value="${esc(p.name)}"></div><div class="fld"><label>${esc(B('Project ID', 'رقم المشروع'))}</label><input id="pp_c" dir="ltr" value="${esc(p.code || '')}"></div><div class="fld"><label>${esc(B('Status', 'الحالة'))}</label><select id="pp_s">${STATUS.map(([k, en, arb]) => `<option value="${k}"${(p.status || 'Active') === k ? ' selected' : ''}>${esc(ar() ? arb : en)}</option>`).join('')}</select></div><div class="fld"><label>EPS</label>${epsSelect(d.eps, p.eps, 'pp_e')}</div><div class="fld"><label>${esc(B('Responsible Manager', 'مدير المشروع'))}</label><input id="pp_m" dir="auto" value="${esc(p.manager || '')}"></div></div>`;
        D.modal({ title: B('Project Properties', 'خصائص المشروع'), cls: 'mid', body, buttons: [{ label: t('cancel'), fn: () => {} }, { label: t('save'), cls: 'pri', fn: async (c, el) => {
          const v = (i) => el.querySelector('#' + i).value;
          await patchProject(p.id, (m, pr) => { pr.name = v('pp_n').trim() || pr.name; m.code = v('pp_c').trim(); m.status = v('pp_s'); m.eps = v('pp_e'); m.manager = v('pp_m').trim(); });
          rr();
        } }] });
      } else {
        const id = selId(), n = id === ROOT ? { id: ROOT, name: rootName(), code: '' } : d.eps.find((x) => x.id === id); if (!n) return;
        body.innerHTML = `<div class="grid2"><div class="fld w2"><label>${esc(B('EPS name', 'اسم EPS'))}</label><input id="pe_n" dir="auto" value="${esc(n.name)}"></div>${id === ROOT ? '' : `<div class="fld"><label>${esc(B('EPS ID', 'رقم EPS'))}</label><input id="pe_c" dir="ltr" value="${esc(n.code || '')}"></div><div class="fld"><label>${esc(B('Parent', 'الأب'))}</label>${epsSelect(d.eps.filter((x) => x.id !== id), n.parent, 'pe_p')}</div>`}</div>`;
        D.modal({ title: B('EPS Properties', 'خصائص EPS'), cls: 'mid', body, buttons: [{ label: t('cancel'), fn: () => {} }, { label: t('save'), cls: 'pri', fn: async (c, el) => {
          const nm = el.querySelector('#pe_n').value.trim(); if (!nm) return;
          if (id === ROOT) App.cfg.epsRoot = nm; else {
            const par = el.querySelector('#pe_p').value; let a = par; const seen = new Set(); while (a && a !== ROOT && !seen.has(a)) { if (a === id) return App.toast(B('An EPS node cannot be moved under itself', 'لا يمكن نقل العقدة تحت نفسها'), true); seen.add(a); a = (d.eps.find((x) => x.id === a) || {}).parent; }
            await epsPut(Object.assign({}, n, { name: nm, code: el.querySelector('#pe_c').value.trim(), parent: par }));
          }
          App.saveCfg(); rr();
        } }] });
      }
    },
    async copy(rr, d) {
      if (!selIsP()) return; const id = selId();
      const got = await st().get(id); if (!got) return; const rec = got.rec, raw = got.raw;
      const p = JSON.parse(rec.data); const nid = uid('p'); p.id = nid; p.name = (p.name || '') + B(' (copy)', ' (نسخة)'); p.meta = Object.assign({}, p.meta, { code: ((p.meta && p.meta.code) || 'PROJ') + '-C', status: 'Planned' });
      const data = JSON.stringify(p);
      await st().put(Object.assign({}, rec, { id: nid, name: p.name, code: p.meta.code, status: 'Planned', updated: Date.now(), data }), raw || undefined, { force: true });
      sel = 'p:' + nid; rr();
    },
    async xer() {
      if (!selIsP()) return; const q = await App.loadProject(selId()); if (!q) return;
      App.download((q.name || 'project').replace(/[^\w؀-ۿ.-]+/g, '_') + '.xer', P6.toXER(q), 'text/plain');
    },
    async del(rr, d) {
      if (selIsP()) {
        const id = selId(); if (App.p && id === App.p.id) return App.toast(t('err_cur_proj'), true);
        if (!confirm(t('confirm_delete_project'))) return; await App.deleteProject(id); sel = null; rr();
      } else {
        const id = selId(); if (id === ROOT) return;
        if (d.eps.some((e) => e.parent === id) || d.projs.some((p) => p.eps === id)) return App.toast(B('Move or delete the nodes and projects inside this EPS first', 'انقل أو احذف العقد والمشاريع داخل هذا الـ EPS أولاً'), true);
        if (!confirm(B('Delete this EPS node?', 'حذف عقدة EPS؟'))) return; await epsDel(id); sel = null; rr();
      }
    },
    async backup() {
      if (App.p && App.dirty) await App.saveNowP();
      const [eps, projs] = await Promise.all([epsAll(), st().list()]);
      const out = { format: 'p6web-db', version: 1, saved: new Date().toISOString(), epsRoot: App.cfg.epsRoot || null, eps, projects: [] };
      for (const r0 of projs || []) { const got = await st().get(r0.id); if (got) out.projects.push({ rec: got.rec, raw: got.raw || null }); }
      App.download('P6Web-Database-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(out), 'application/json');
      App.toast(B(`Backup saved: ${out.projects.length} projects`, `تم حفظ نسخة احتياطية: ${out.projects.length} مشروع`));
    },
    restore(rr) {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return;
        let db; try { db = JSON.parse(await f.text()); } catch (e) { return App.toast(B('Not a valid backup file', 'ملف نسخة احتياطية غير صالح'), true); }
        if (!db || db.format !== 'p6web-db' || !Array.isArray(db.projects)) return App.toast(B('Not a P6 Web backup file', 'هذا ليس ملف نسخة احتياطية لـ P6 Web'), true);
        const have = new Set((await projAll()).map((p) => p.id)); let added = 0, over = 0, skipped = 0;
        const overwrite = db.projects.some((x) => have.has(x.rec.id)) ? confirm(B('Some projects already exist. OK = overwrite them, Cancel = keep existing ones.', 'بعض المشاريع موجودة. موافق = استبدالها، إلغاء = الإبقاء على الموجودة.')) : false;
        for (const x of db.projects) {
          const id = x.rec.id, exists = have.has(id);
          if (exists && (!overwrite || (App.p && App.p.id === id))) { skipped++; continue; }
          await st().put(x.rec, x.raw || undefined, { force: true }); exists ? over++ : added++;
        }
        for (const e of db.eps || []) await epsPut(e);
        if (db.epsRoot) { App.cfg.epsRoot = db.epsRoot; App.saveCfg(); }
        App.toast(B(`Restored: ${added} new, ${over} overwritten, ${skipped} skipped`, `تمت الاستعادة: ${added} جديد، ${over} مستبدل، ${skipped} متجاوز`)); rr();
      };
      inp.click();
    }
  };
  App.epsAll = epsAll;
})(window);

<script>
/* P6 Web – shared online database on Google Drive.

// Execute as: Me   |   Who has access: Anyone
const FOLDER = 'P6WebDB';          // folder created in your Google Drive (used when FOLDER_ID is empty)
const FOLDER_ID = '';               // optional: ID of an existing Drive folder to use instead (the part after /folders/ in its link)

function folder_() { if (FOLDER_ID) return DriveApp.getFolderById(FOLDER_ID); const it = DriveApp.getFoldersByName(FOLDER); return it.hasNext() ? it.next() : DriveApp.createFolder(FOLDER); }
function file_(name, create) { const f = folder_(), it = f.getFilesByName(name); if (it.hasNext()) return it.next(); return create ? f.createFile(name, '{}', 'application/json') : null; }

function write_(name, obj) { file_(name, true).setContent(JSON.stringify(obj)); }
function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
function doGet() { const ix = read_('index.json', { projects: {}, eps: {} }); return out_({ ok: true, name: 'P6 Web database', projects: Object.keys(ix.projects).length, time: Date.now() }); }
function doPost(e) {
  const lock = LockService.getScriptLock(); lock.waitLock(25000);
  try {
    const q = JSON.parse(e.postData.contents);
    if (KEY && q.key !== KEY) return out_({ ok: false, error: 'Wrong access key' });
    const ix = read_('index.json', { projects: {}, eps: {} });
    if (q.op === 'ping') return out_({ ok: true, projects: Object.keys(ix.projects).length });
    if (q.op === 'list') return out_({ ok: true, list: Object.keys(ix.projects).map(function (k) { return ix.projects[k]; }) });
    if (q.op === 'get') { const f = read_('p_' + q.id + '.json', null); return out_(f ? { ok: true, rec: f.rec, raw: f.raw || null } : { ok: false, error: 'not found' }); }
    if (q.op === 'put') {
      const old = ix.projects[q.rec.id];
      if (!q.force && q.expect != null && old && old.updated !== q.expect) return out_({ ok: false, conflict: true, updated: old.updated });
      const meta = {}; Object.keys(q.rec).forEach(function (k) { if (k !== 'data') meta[k] = q.rec[k]; });
      const prev = read_('p_' + q.rec.id + '.json', {});
      write_('p_' + q.rec.id + '.json', { rec: q.rec, raw: q.raw != null ? q.raw : (prev.raw || null) });
      ix.projects[q.rec.id] = meta; write_('index.json', ix); return out_({ ok: true });
    }

    if (q.op === 'epsAll') return out_({ ok: true, list: Object.keys(ix.eps).map(function (k) { return ix.eps[k]; }) });
    if (q.op === 'epsPut') { ix.eps[q.node.id] = q.node; write_('index.json', ix); return out_({ ok: true }); }
    if (q.op === 'epsDel') { delete ix.eps[q.id]; write_('index.json', ix); return out_({ ok: true }); }
    return out_({ ok: false, error: 'unknown op' });
  } catch (err) { return out_({ ok: false, error: String(err) }); } finally { lock.releaseLock(); }
}`;

      async epsAll() { try { const j = await call('epsAll'); return j.list || []; } catch (e) { if (!isNet(e)) throw e; return L.epsAll(); } },

  // ======================================================================================================

  // ======================================================================================================
  App.driveFolderId = (s) => { s = String(s || '').trim(); const m = /\/folders\/([A-Za-z0-9_-]{10,})/.exec(s) || /[?&]id=([A-Za-z0-9_-]{10,})/.exec(s) || /^([A-Za-z0-9_-]{15,})$/.exec(s); return m ? m[1] : null; };
  const SCOPE = 'https://www.googleapis.com/auth/drive';
  let TOK = null, EXP = 0;

<script>
/* P6 Web – Dashboard analytics engine (S-curve, SPI, manpower, look-ahead, out-of-sequence, areas of concern, risks).

(function (g) {
  'use strict';
  const P6 = g.P6, DA = (P6.dash = {});

  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  DA.fmt = (d) => { if (d == null) return ''; const y = P6.ymd(d); return String(y.d).padStart(2, '0') + '-' + MON[y.m] + '-' + y.y; };
  DA.lbl = (d, gran) => { const y = P6.ymd(d); return gran === 'month' ? MON[y.m] + ' ' + String(y.y).slice(2) : String(y.d).padStart(2, '0') + ' ' + MON[y.m] + ' ' + String(y.y).slice(2); };
  DA.frac = frac;

  // ---------- filtering ----------
  DA.defaults = () => ({ wbs: 'all', status: 'all', crit: false, floatMax: '', type: 'all', rsrc: '', code: '', q: '', basis: 'auto', gran: 'auto', period: 14, ahead: 4, aocRatio: 1.5, aocDays: 5 });
  DA.subset = function (p, f) {
    let wset = null;

      const id = +f.wbs, kids = new Map(); p.wbs.forEach((w) => { if (w.parent != null) { if (!kids.has(w.parent)) kids.set(w.parent, []); kids.get(w.parent).push(w.id); } });
      wset = new Set(); const st = [id]; while (st.length) { const x = st.pop(); wset.add(x); (kids.get(x) || []).forEach((k) => st.push(k)); }
    }
    let rset = null; if (f.rsrc) { rset = new Set(p.asg.filter((a) => String(a.rsrc) === String(f.rsrc)).map((a) => a.task)); }
    const q = (f.q || '').trim().toLowerCase(), fm = f.floatMax === '' || f.floatMax == null ? null : +f.floatMax;
    const cv = f.code ? String(f.code).split(':') : null;
    return p.tasks.filter((t) => {
      if (P6.isHammock && P6.isHammock(t)) return false;
      if (wset && !wset.has(t.wbs)) return false;
      if (f.status && f.status !== 'all' && t.status !== f.status) return false;
      if (f.crit && !(t.crit && t.status !== 'C')) return false;
      if (fm != null && !(t.tf != null && t.tf <= fm)) return false;
      if (f.type === 'tasks' && isMs(t)) return false;
      if (f.type === 'ms' && !isMs(t)) return false;
      if (rset && !rset.has(t.id)) return false;
      if (cv && !((t.codes || {})[cv[0]] == cv[1])) return false;
      if (q && !(String(t.code).toLowerCase().includes(q) || String(t.name).toLowerCase().includes(q))) return false;
      return true;
    });
  };

  // ---------- weights (progress basis) ----------
  DA.basisOf = (p, f, M) => {
    if (f.basis && f.basis !== 'auto') return f.basis;
    let c = 0, u = 0; for (const m of M.T.values()) { c += m.bc; u += m.bu_L; }
    return c > 0 ? 'cost' : u > 0 ? 'hours' : 'duration';
  };
  DA.weights = (tasks, M, basis) => {
    const W = new Map();
    for (const t of tasks) {
      const m = M.T.get(t.id) || {};
      let w = basis === 'cost' ? (m.blc != null ? m.blc : m.bc) : basis === 'hours' ? (m.bu_L || 0) : Math.max(0, (t.bf != null && t.bs != null ? t.bf - t.bs + 1 : (t.ef != null && t.es != null ? t.ef - t.es + 1 : 0)));
      if (!(w > 0)) w = 0; W.set(t.id, w);
    }
    return W;
  };

  // ---------- buckets ----------
  DA.range = (tasks, dd) => {
    let lo = Infinity, hi = -Infinity;
    for (const t of tasks) for (const d of [t.bs, t.es, t.as]) if (d != null && d < lo) lo = d;
    for (const t of tasks) for (const d of [t.bf, t.ef, t.af]) if (d != null && d > hi) hi = d;
    if (!isFinite(lo)) lo = dd; if (!isFinite(hi)) hi = dd; return [Math.min(lo, dd), Math.max(hi, dd)];
  };
  DA.buckets = (lo, hi, gran) => {
    const out = [];
    if (gran === 'month') { let y = P6.ymd(lo); let d = P6.mkDay(y.y, y.m + 1, 1) - 1; while (d < hi + 30) { out.push(d); y = P6.ymd(d + 1); d = P6.mkDay(y.y, y.m + 1, 1) - 1; if (out.length > 400) break; } }
    else { let d = lo + 6 - ((P6.dow(lo) + 6) % 7); d = Math.max(d, lo); while (d < hi + 7) { out.push(d); d += 7; if (out.length > 900) break; } }
    // trim to the last bucket that covers hi
    const k = out.findIndex((x) => x >= hi); return k >= 0 ? out.slice(0, k + 1) : out;
  };
  DA.granOf = (lo, hi, f) => (f.gran && f.gran !== 'auto' ? f.gran : hi - lo > 540 ? 'month' : 'week');

  // ---------- S-curve / SPI ----------
  DA.curves = function (p, tasks, W, gran) {
    const dd = p.dataDate, [lo, hi] = DA.range(tasks, dd), B = DA.buckets(lo, hi, gran);
    let tot = 0; for (const t of tasks) tot += W.get(t.id) || 0;
    const planned = new Array(B.length).fill(0), actual = new Array(B.length).fill(null), fc = new Array(B.length).fill(null);
    for (const t of tasks) {
      const w = W.get(t.id) || 0; if (!w) continue;
      const bs = t.bs != null ? t.bs : t.es, bf = t.bf != null ? t.bf : t.ef;
      const as = t.as != null ? t.as : t.es, ef = t.af != null ? t.af : t.ef;
      const done = t.status === 'C' ? 1 : t.status === 'IP' ? Math.min(1, (t.pct || 0) / 100) : 0;
      const rs = t.status === 'NS' ? Math.max(dd + 1, t.es != null ? t.es : dd + 1) : dd + 1;
      B.forEach((d, i) => {
        planned[i] += w * frac(bs, bf, d);
        if (d <= dd) actual[i] = (actual[i] || 0) + w * (t.status === 'C' ? frac(as, ef, d) : t.status === 'IP' ? done * frac(as, dd, d) : 0);
        else fc[i] = (fc[i] || 0) + w * (done + (1 - done) * frac(rs, t.ef, d));
      });
    }
    // make forecast continuous with the last actual point
    let ev = 0; for (const t of tasks) { const w = W.get(t.id) || 0; ev += w * (t.status === 'C' ? 1 : t.status === 'IP' ? Math.min(1, (t.pct || 0) / 100) : 0); }
    const k = B.findIndex((d) => d > dd);
    const pct = (v) => (tot > 0 && v != null ? (100 * v) / tot : null);
    const pl = planned.map(pct), ac = actual.map(pct), fo = fc.map(pct);
    const spi = B.map((d, i) => (d <= dd && pl[i] > 0.05 && ac[i] != null ? ac[i] / pl[i] : null));
    // planned % and actual % exactly at the data date
    let pvDD = 0; for (const t of tasks) pvDD += (W.get(t.id) || 0) * frac(t.bs != null ? t.bs : t.es, t.bf != null ? t.bf : t.ef, dd);
    return { B, planned: pl, actual: ac, forecast: fo, spi, tot, evDD: pct(ev), pvDD: pct(pvDD), kDD: k, gran, lo, hi };
  };
  DA.taskSpi = (t, w, dd) => {
    const pv = w * frac(t.bs != null ? t.bs : t.es, t.bf != null ? t.bf : t.ef, dd), ev = w * (t.status === 'C' ? 1 : t.status === 'IP' ? Math.min(1, (t.pct || 0) / 100) : 0);
    return { pv, ev, spi: pv > 0 ? ev / pv : (ev > 0 ? 1.5 : null) };
  };

  // ---------- manpower (labour units) ----------
  DA.manpower = function (p, tasks, gran, M) {
    const dd = p.dataDate, [lo, hi] = DA.range(tasks, dd), B = DA.buckets(lo, hi, gran);
    const ids = new Set(tasks.map((t) => t.id)), tby = new Map(tasks.map((t) => [t.id, t])), rs = new Map(p.rsrc.map((r) => [r.id, r]));
    const per = new Map(); // resource id -> {name, act[], rem[], plan[]}
    const spread = (arr, qty, s, e) => { if (!(qty > 0) || s == null || e == null || e < s) return; const len = e - s + 1; B.forEach((d, i) => { const b0 = i ? B[i - 1] + 1 : -Infinity; const ov = Math.min(e, d) - Math.max(s, b0) + 1; if (ov > 0) arr[i] += qty * ov / len; }); };
    for (const a of p.asg) {
      if (!ids.has(a.task)) continue; const r = rs.get(a.rsrc); if (!r || r.type !== 'RT_Labor') continue; const t = tby.get(a.task);
      if (!per.has(r.id)) per.set(r.id, { id: r.id, name: r.name, act: new Array(B.length).fill(0), rem: new Array(B.length).fill(0), plan: new Array(B.length).fill(0), total: 0 });
      const x = per.get(r.id), sp = P6.asgSplit(a, t);
      spread(x.plan, a.qty, t.bs != null ? t.bs : t.es, t.bf != null ? t.bf : t.ef);
      spread(x.act, sp.act, t.as != null ? t.as : t.es, t.af != null ? t.af : Math.min(dd, t.ef != null ? t.ef : dd));
      spread(x.rem, sp.rem, t.status === 'NS' ? Math.max(dd + 1, t.es != null ? t.es : dd + 1) : dd + 1, t.ef);
      x.total += a.qty;
    }
    const list = [...per.values()].sort((a, b) => b.total - a.total);
    const sum = (k) => B.map((_, i) => list.reduce((s, x) => s + x[k][i], 0));
    return { B, list, act: sum('act'), rem: sum('rem'), plan: sum('plan'), gran };
  };

  // ---------- look-ahead / achieved ----------
  DA.lookahead = (p, tasks, ref, weeks) => {
    const end = ref + weeks * 7 - 1;
    return tasks.filter((t) => t.status !== 'C' && t.es != null && t.es <= end && t.ef >= ref).map((t) => ({
      t, kind: t.status === 'NS' ? (t.es >= ref ? 'Starting' : 'Late start') : (t.ef <= end ? 'Finishing' : 'Ongoing'), start: t.es, finish: t.ef
    })).sort((a, b) => a.start - b.start || a.finish - b.finish);
  };
  DA.achieved = (p, tasks, ref, days) => {
    const from = ref - days + 1;
    return { from, to: ref,
      completed: tasks.filter((t) => t.status === 'C' && t.af != null && t.af >= from && t.af <= ref).sort((a, b) => a.af - b.af),
      started: tasks.filter((t) => t.as != null && t.as >= from && t.as <= ref && t.status !== 'C'),
      progressed: tasks.filter((t) => t.status === 'IP' && (t.pct || 0) > 0) };
  };

  // ---------- out-of-sequence ----------
  // returns every relationship whose logic is violated by recorded progress, with a suggested fix
  DA.oos = function (p, tasks) {
    const byId = new Map(p.tasks.map((t) => [t.id, t])), sub = tasks ? new Set(tasks.map((t) => t.id)) : null, out = [];
    for (const r of p.rels) {
      const a = byId.get(r.p), b = byId.get(r.s); if (!a || !b) continue; if (sub && !sub.has(a.id) && !sub.has(b.id)) continue;

        if (b.as != null && a.status !== 'C') { issue = a.status === 'IP' ? 'Successor started while predecessor still in progress' : 'Successor started but predecessor not started'; days = b.as - (a.as != null ? a.as : p.dataDate); }
        else if (b.as != null && a.af != null && a.af > b.as) { issue = 'Successor started before predecessor finished'; days = a.af - b.as; }
      } else if (r.type === 'SS') {
        if (b.as != null && a.as == null) { issue = 'Successor started but predecessor not started'; days = 0; }
        else if (b.as != null && a.as != null && a.as > b.as) { issue = 'Successor started before predecessor started'; days = a.as - b.as; }
      } else if (r.type === 'FF') {
        if (b.af != null && a.status !== 'C') { issue = 'Successor finished while predecessor not finished'; days = 0; }
        else if (b.af != null && a.af != null && a.af > b.af) { issue = 'Successor finished before predecessor finished'; days = a.af - b.af; }
      } else if (r.type === 'SF') {

      }

        const fix = r.type === 'FS' ? (a.status === 'IP' || (a.af != null && a.af > b.as) ? 'ss' : 'remove') : (r.type === 'SS' || r.type === 'FF' ? 'remove' : 'remove');
        out.push({ rel: r, pred: a, succ: b, issue, days: Math.max(0, days), fix: r.type === 'FS' && fix === 'ss' ? 'ss' : (r.type === 'FS' ? 'remove' : 'review') });
      }
    }

  };

  // ---------- areas of concern ----------
  DA.aoc = function (p, tasks, f, oos) {
    const dd = p.dataDate, ratio = +f.aocRatio || 1.5, minD = +f.aocDays || 5, rows = [];
    const rels = p.rels, preds = new Map(), succs = new Map();
    rels.forEach((r) => { preds.set(r.s, (preds.get(r.s) || 0) + 1); succs.set(r.p, (succs.get(r.p) || 0) + 1); });
    const add = (rule, sev, t, metric, detail, action) => rows.push({ rule, sev, t, metric, detail, action });
    const plannedCal = (t) => (t.bs != null && t.bf != null ? t.bf - t.bs + 1 : Math.max(1, Math.round((t.dur || 1) * 7 / 5)));
    for (const t of tasks) {
      if (isMs(t)) { if (t.status !== 'C' && t.tf != null && t.tf < 0) add('Negative Float', 4, t, `${t.tf} d`, 'Milestone forecast beyond its constraint / target date', 'Review the driving path and recover time'); continue; }
      const pc = plannedCal(t);
      if (t.status === 'C' && t.as != null && t.af != null) {
        const ac = t.af - t.as + 1;
        if (ac / pc >= ratio && ac - pc >= minD) add('Duration Overrun (Completed)', ac / pc >= 3 ? 5 : ac / pc >= 2 ? 4 : 3, t, `${ac} d actual vs ${pc} d planned (${(ac / pc).toFixed(1)}x)`, `Took ${ac - pc} d longer than planned`, 'Re-baseline similar activities; record lessons learned');
      } else if (t.status === 'IP' && t.as != null) {
        const el = dd - t.as + 1;
        if (el / pc >= ratio && el - pc >= minD && (t.pct || 0) < 100) add('Overrunning In-Progress', el / pc >= 3 ? 5 : el / pc >= 2 ? 4 : 3, t, `${el} d elapsed vs ${pc} d planned, ${t.pct || 0}% done`, `Open for ${el - pc} d beyond its planned duration`, 'Confirm remaining duration and resources; escalate if stalled');
      }
      if (t.status === 'NS' && t.bs != null && t.bs < dd && dd - t.bs >= minD) { const dl = dd - t.bs; add('Late Start', dl > 30 ? 5 : dl > 14 ? 4 : 3, t, `${dl} d late (baseline start ${DA.fmt(t.bs)})`, 'Not started although its baseline start has passed', 'Mobilise or re-sequence; confirm predecessors and access'); }
      if (t.status !== 'C' && t.bf != null && t.bf < dd && t.status !== 'NS') { const dl = dd - t.bf; if (dl >= minD) add('Late Finish (Open)', dl > 30 ? 5 : dl > 14 ? 4 : 3, t, `${dl} d past baseline finish`, `Baseline finish ${DA.fmt(t.bf)} has passed`, 'Recovery plan / resource loading review'); }
      if (t.status !== 'C' && t.tf != null && t.tf < 0) add('Negative Float', t.tf <= -30 ? 5 : t.tf <= -10 ? 4 : 3, t, `${t.tf} d float`, 'Forecast later than the constraint or contract date', 'Compress or re-sequence the driving path');
      if (t.ct === 'MSO' || t.ct === 'MFO') add('Hard Constraint', t.crit ? 4 : 2, t, t.ct, 'Mandatory constraint overrides network logic', 'Replace with logic or soft constraint where possible');
      if ((t.dur || 0) > 60 && t.type !== 'TT_LOE' && t.type !== 'TT_WBS') add('Excessive Duration', 2, t, `${t.dur} d`, 'Activity longer than 60 days cannot be tracked precisely', 'Split into shorter, measurable activities');
      if (t.type !== 'TT_LOE' && t.status !== 'C' && (!preds.get(t.id) || !succs.get(t.id))) add('Open End', 2, t, !preds.get(t.id) ? 'No predecessor' : 'No successor', 'Logic gap: float will be overstated', 'Add the missing predecessor / successor');
    }
    const ids = new Set(tasks.map((t) => t.id)), by = new Map(p.tasks.map((t) => [t.id, t]));
    for (const r of rels) if (r.lag > 30 && (ids.has(r.p) || ids.has(r.s))) { const s = by.get(r.s); if (s) add('Long Lag', 2, s, `${r.type} +${r.lag} d`, `Lag from ${(by.get(r.p) || {}).code}`, 'Replace the lag with an explicit activity'); }
    for (const o of oos || []) add('Out-of-Sequence', o.days > 14 ? 4 : 3, o.succ, `${o.rel.type} from ${o.pred.code}`, o.issue, 'Fix the logic (Dashboard ▸ Out-of-Sequence)');
    return rows.sort((a, b) => b.sev - a.sev);
  };

  // ---------- risk register (project risks + auto-detected schedule risks) ----------
  DA.rating = (s) => (s >= 17 ? 'Extreme' : s >= 10 ? 'High' : s >= 5 ? 'Medium' : 'Low');
  DA.risks = function (p, tasks, k, aocRows, oos, mp) {
    const out = [], dd = p.dataDate; let n = 0; const id = () => 'AR-' + String(++n).padStart(2, '0');
    const add = (cat, name, pr, im, items, action, detail) => out.push({ id: id(), src: 'Auto-detected', cat, name, pr, im, score: pr * im, rating: DA.rating(pr * im), items, action, detail });
    const open = tasks.filter((t) => t.status !== 'C');
    const neg = open.filter((t) => t.tf != null && t.tf < 0);
    if (neg.length) { const m = Math.min(...neg.map((t) => t.tf)); add('Schedule', 'Forecast completion later than the contractual / constraint date', m <= -30 ? 5 : 4, m <= -30 ? 5 : 4, neg, 'Recovery programme: fast-track or crash the driving path', `Worst negative float ${m} days across ${neg.length} activities`); }
    if (k.spi != null && k.spi < 0.9) add('Progress', `Schedule performance below plan (SPI ${k.spi.toFixed(2)})`, k.spi < 0.75 ? 5 : 4, 4, tasks.filter((t) => { const x = k.taskSpi.get(t.id); return x && x.spi != null && x.spi < 0.9 && x.pv > 0; }), 'Increase resources / working hours on lagging work packages', `Earned ${k.ev.toFixed(1)}% vs planned ${k.pv.toFixed(1)}%`);
    if (oos.length) add('Schedule Quality', 'Progress recorded out of sequence: network logic and float are unreliable', 4, 3, oos.map((o) => o.succ), 'Correct logic (use Dashboard ▸ Out-of-Sequence auto-fix)', `${oos.length} relationships violated`);
    const late = aocRows.filter((r) => r.rule === 'Late Start').map((r) => r.t); if (late.length) add('Progress', 'Activities not started although baseline start has passed', late.length > 10 ? 5 : 4, 3, late, 'Confirm mobilisation, access and approvals', `${late.length} late starts`);
    const ov = aocRows.filter((r) => r.rule === 'Duration Overrun (Completed)').map((r) => r.t); if (ov.length) add('Planning', 'Actual durations are repeatedly longer than planned', ov.length > 10 ? 4 : 3, 3, ov, 'Revisit productivity assumptions for the remaining similar scope', `${ov.length} completed activities over-ran`);
    const stalled = aocRows.filter((r) => r.rule === 'Overrunning In-Progress').map((r) => r.t); if (stalled.length) add('Progress', 'In-progress activities are open far beyond their planned duration', 3, 4, stalled, 'Verify true remaining durations; check for stalled work', `${stalled.length} activities`);
    const crit = open.filter((t) => t.crit); if (open.length && crit.length / open.length > 0.3) add('Schedule', 'More than 30% of remaining activities are critical – little schedule flexibility', 4, 4, crit, 'Add logic review; look for parallel paths and buffers', `${crit.length} of ${open.length} remaining activities are critical`);
    const hard = open.filter((t) => (t.ct === 'MSO' || t.ct === 'MFO')); if (hard.length) add('Schedule Quality', 'Mandatory constraints override network logic', 3, 4, hard, 'Replace with logic or soft constraints', `${hard.length} activities`);
    const lead = open.filter((t) => /procure|manufactur|deliver|supply|long.?lead|shipping/i.test(t.name) && (t.tf == null || t.tf < 30)); if (lead.length) add('Procurement', 'Procurement / long-lead items with little or no float', 3, 4, lead, 'Expedite orders; confirm vendor delivery dates', `${lead.length} items with float < 30 d`);
    const open2 = tasks.filter((t) => t.status !== 'C' && !isMs(t)); if (mp && mp.avg > 0 && mp.peak / mp.avg > 2) add('Resources', `Labour peaking: peak ${Math.round(mp.peak)} h per period vs average ${Math.round(mp.avg)} h`, 3, 3, open2, 'Level resources / smooth the histogram', 'Peak-to-average ratio ' + (mp.peak / mp.avg).toFixed(1));
    const oe = aocRows.filter((r) => r.rule === 'Open End').map((r) => r.t); if (oe.length > 5) add('Schedule Quality', 'Open-ended activities overstate float', 3, 3, oe, 'Complete network logic', `${oe.length} open ends`);
    for (const t of p.tasks) for (const r of t.risks || []) out.push({ id: 'RR-' + r.id, src: 'Risk Register', cat: 'Register', name: r.name, pr: +r.prob || 1, im: +r.impact || 1, score: (+r.prob || 1) * (+r.impact || 1), rating: DA.rating((+r.prob || 1) * (+r.impact || 1)), items: [t], action: r.notes || '', detail: `Status: ${r.status || 'Open'}` });
    return out.sort((a, b) => b.score - a.score);
  };

  // ---------- one call for everything ----------
  DA.analyse = function (p, f) {
    const tasks = DA.subset(p, f), M = P6.metrics(p), basis = DA.basisOf(p, f, M), W = DA.weights(tasks, M, basis);
    const [lo, hi] = DA.range(tasks, p.dataDate), gran = DA.granOf(lo, hi, f), cur = DA.curves(p, tasks, W, gran), mp = DA.manpower(p, tasks, gran, M);
    const taskSpi = new Map(); let ev = 0, pv = 0, tot = 0;
    for (const t of tasks) { const w = W.get(t.id) || 0, x = DA.taskSpi(t, w, p.dataDate); taskSpi.set(t.id, x); ev += x.ev; pv += x.pv; tot += w; }
    const k = { ev: tot ? 100 * ev / tot : 0, pv: tot ? 100 * pv / tot : 0, spi: pv > 0 ? ev / pv : null, tot, taskSpi };
    const oos = DA.oos(p, tasks), aoc = DA.aoc(p, tasks, f, oos);
    const mpt = mp.plan.map((_, i) => mp.act[i] + mp.rem[i]); const nz = mpt.filter((x) => x > 0);
    const mpStat = { peak: nz.length ? Math.max(...mpt) : 0, avg: nz.length ? nz.reduce((a, b) => a + b, 0) / nz.length : 0 };
    const risks = DA.risks(p, tasks, k, aoc, oos, mpStat);
    return { tasks, M, W, basis, cur, mp, mpStat, k, oos, aoc, risks, gran, dcma: DA.dcma(p, tasks) };
  };

  /* DCMA 14-point schedule assessment (on the activities in scope; summary / LOE activities excluded). Day-based. */
  DA.dcma = function (p, tasks) {
    const dd = p.dataDate, real = tasks.filter((t) => !P6.isHammock(t)), open = real.filter((t) => t.status !== 'C'), ids = new Set(real.map((t) => t.id));
    const rels = p.rels.filter((r) => ids.has(r.p) && ids.has(r.s)), byId = new Map(p.tasks.map((t) => [t.id, t]));
    const hasP = new Set(rels.map((r) => r.s)), hasS = new Set(rels.map((r) => r.p));
    const pct = (n, d) => (d ? 100 * n / d : 0), out = [];
    const add = (n, name, desc, val, thr, pass, unit, items, rl) => out.push({ n, name, desc, val, thr, pass, unit, items: items || [], rels: rl || [] });
    const noLogic = open.filter((t) => !(hasP.has(t.id) && hasS.has(t.id)) && !(P6.isMile(t) && ((t.type === 'TT_Mile' && !hasP.has(t.id) && hasS.has(t.id)) || (t.type === 'TT_FinMile' && hasP.has(t.id) && !hasS.has(t.id)))));
    add(1, 'Logic', 'Open activities missing a predecessor or successor', pct(noLogic.length, open.length), '≤ 5%', pct(noLogic.length, open.length) <= 5, '%', noLogic);
    const leads = rels.filter((r) => (r.lag || 0) < 0);
    add(2, 'Leads', 'Relationships with negative lag', pct(leads.length, rels.length), '0%', leads.length === 0, '%', leads.map((r) => byId.get(r.s)), leads);
    const lags = rels.filter((r) => (r.lag || 0) > 0);
    add(3, 'Lags', 'Relationships with positive lag', pct(lags.length, rels.length), '≤ 5%', pct(lags.length, rels.length) <= 5, '%', lags.map((r) => byId.get(r.s)), lags);
    const fs = rels.filter((r) => (r.type || 'FS') === 'FS');
    add(4, 'Relationship types', 'Finish-to-Start relationships', pct(fs.length, rels.length), '≥ 90%', pct(fs.length, rels.length) >= 90, '%', rels.filter((r) => (r.type || 'FS') !== 'FS').map((r) => byId.get(r.s)), rels.filter((r) => (r.type || 'FS') !== 'FS'));
    const hard = open.filter((t) => ['MSO', 'MFO', 'SNLT', 'FNLT'].includes(t.ct));
    add(5, 'Hard constraints', 'Open activities with Mandatory / "No Later Than" constraints', pct(hard.length, open.length), '≤ 5%', pct(hard.length, open.length) <= 5, '%', hard);
    const hf = open.filter((t) => t.tf != null && t.tf > 44);
    add(6, 'High float', 'Open activities with total float > 44 days', pct(hf.length, open.length), '≤ 5%', pct(hf.length, open.length) <= 5, '%', hf);
    const nf = open.filter((t) => t.tf != null && t.tf < 0);
    add(7, 'Negative float', 'Open activities with negative total float', pct(nf.length, open.length), '0%', nf.length === 0, '%', nf);
    const hd = open.filter((t) => !P6.isMile(t) && t.dur > 44);
    add(8, 'High duration', 'Open activities with duration > 44 days', pct(hd.length, open.length), '≤ 5%', pct(hd.length, open.length) <= 5, '%', hd);
    const inv = real.filter((t) => (t.as != null && t.as > dd) || (t.af != null && t.af > dd) || (t.status !== 'C' && t.es != null && t.es < dd && t.status === 'NS') || (t.status === 'IP' && t.ef != null && t.ef < dd));
    add(9, 'Invalid dates', 'Actuals after the data date, or forecast dates before it', inv.length, '0', inv.length === 0, '#', inv);
    const asg = new Set(p.asg.map((a) => a.task)), nores = open.filter((t) => !P6.isMile(t) && t.dur > 0 && !asg.has(t.id) && !(t.expenses && t.expenses.length));
    add(10, 'Resources', 'Open activities with duration > 0 and no resource / cost', pct(nores.length, open.filter((t) => !P6.isMile(t) && t.dur > 0).length), '0%', nores.length === 0, '%', nores);
    const shouldDone = real.filter((t) => t.bf != null && t.bf <= dd), missed = shouldDone.filter((t) => t.status !== 'C' || (t.af != null && t.af > t.bf));
    add(11, 'Missed tasks', 'Activities that finished (or should have) later than the baseline finish', pct(missed.length, shouldDone.length), '≤ 5%', pct(missed.length, shouldDone.length) <= 5, '%', missed);
    const crit = open.filter((t) => t.crit), fin = open.reduce((m, t) => (t.ef != null && t.ef > m ? t.ef : m), -Infinity);
    add(12, 'Critical path test', 'A critical path exists and drives the project finish', crit.length ? 1 : 0, 'exists', crit.length > 0 && !open.some((t) => t.tf != null && t.tf < 0 && !t.crit), 'bool', crit);
    const minTf = open.reduce((m, t) => (t.tf != null && t.tf < m ? t.tf : m), Infinity), cpl = isFinite(fin) ? Math.max(1, fin - dd) : 0, cpli = cpl && isFinite(minTf) ? (cpl + minTf) / cpl : null;
    add(13, 'CPLI', 'Critical Path Length Index = (CP length + total float) / CP length', cpli, '≥ 0.95', cpli != null && cpli >= 0.95, 'idx', []);
    const done = real.filter((t) => t.status === 'C' && t.af != null && t.af <= dd).length, bei = shouldDone.length ? done / shouldDone.length : null;
    add(14, 'BEI', 'Baseline Execution Index = tasks completed / tasks that should be complete', bei, '≥ 0.95', bei != null && bei >= 0.95, 'idx', shouldDone.filter((t) => t.status !== 'C'));
    const passed = out.filter((c) => c.pass).length;
    return { checks: out, passed, total: out.length, score: Math.round(100 * passed / out.length) };
  };
})(window);

<script>
/* P6 Web – Project Controls Dashboard window (SAR-style template). All text is English by design.

(function (g) {

  // ---------- small UI helpers ----------

  const sevChip = (s) => chip(['', 'Very Low', 'Low', 'Medium', 'High', 'Critical'][s] || s, [C.grey, C.grey, C.green, C.amber, C.orange, C.red][s] || C.grey);

  const goBtn = (t) => `<a class="dsh-go" data-go="${t.id}" title="Open in Activities">Open ▸</a>`;

    { h: 'Status', get: (t) => chip(stName[t.status], stCol[t.status]), raw: 1 }, { h: '%', get: (t) => (t.status === 'C' ? 100 : t.pct || 0), al: 'r' },
    { h: 'Start', get: (t) => fd(t.es), al: 'r' }, { h: 'Finish', get: (t) => fd(t.ef), al: 'r' }, { h: 'BL Finish', get: (t) => fd(t.bf), al: 'r' },
    { h: 'Float', get: (t) => (t.tf == null ? '' : `<b style="color:${t.tf < 0 ? C.red : t.tf === 0 ? C.orange : C.dark}">${t.tf}</b>`), raw: 1, al: 'r' },

  const kv = (rows) => `<div class="dsh-kv">${rows.map(([k, v, col]) => `<div><span>${esc(k)}</span><b${col ? ` style="color:${col}"` : ''}>${esc(v)}</b></div>`).join('')}</div>`;

  function detail(title, sub, body, extra) {

  function actCard(id) {

    const x = A.k.taskSpi.get(id) || {}, by = new Map(P.tasks.map((q) => [q.id, q]));

    const planCal = t.bs != null && t.bf != null ? t.bf - t.bs + 1 : null, actCal = t.as != null ? (t.af != null ? t.af : P.dataDate) - t.as + 1 : null;
    detail(`${t.code} – ${t.name}`, `${chip(stName[t.status], stCol[t.status])} ${t.crit && t.status !== 'C' ? chip('Critical', C.red) : ''} ${chip('WBS ' + (wbsOf(t).code || ''), C.teal)}`,
      kv([['Planned start (BL)', fd(t.bs) || '–'], ['Planned finish (BL)', fd(t.bf) || '–'], ['Current start', fd(t.es)], ['Current finish', fd(t.ef)], ['Actual start', fd(t.as) || '–'], ['Actual finish', fd(t.af) || '–'],
        ['% complete', (t.status === 'C' ? 100 : t.pct || 0) + '%'], ['Original duration', (t.dur != null ? t.dur : '–') + ' d'], ['Remaining duration', (t.status === 'C' ? 0 : t.rem != null ? t.rem : '–') + ' d'], ['Total float', t.tf == null ? '–' : t.tf + ' d', t.tf < 0 ? C.red : null], ['Free float', t.ff == null ? '–' : t.ff + ' d'],
        ['Start variance vs BL', t.bs != null && t.es != null ? t.es - t.bs + ' d' : '–'], ['Finish variance vs BL', t.bf != null && t.ef != null ? t.ef - t.bf + ' d' : '–', t.bf != null && t.ef > t.bf ? C.red : null], ['SPI', x.spi != null ? x.spi.toFixed(2) : '–', spiCol(x.spi)],
        ['Planned calendar days', planCal != null ? planCal + ' d' : '–'], ['Actual / elapsed days', actCal != null ? actCal + ' d' : '–', actCal && planCal && actCal > planCal * 1.5 ? C.red : null], ['Constraint', t.ct || 'None'], ['Calendar', (P.cals.find((c) => c.id === t.cal) || {}).name || '–'], ['Resources', as]]) +
      `<h4>Predecessors (${pr.length})</h4>${rt(pr, 'p')}<h4>Successors (${su.length})</h4>${rt(su, 's')}<p><a class="dsh-go" data-go="${t.id}">Open in Activities ▸</a></p>`);

  // ---------- SVG chart helpers ----------
  const niceMax = (v) => { if (!(v > 0)) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))), m = v / e; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e; };

  function tipAttr(s) { return ` data-tip="${esc(s)}"`; }
  function lineChart(o) {

    const step = Math.max(1, Math.ceil(n / 11));
    o.B.forEach((d, i) => { if (i % step === 0) s += `<line x1="${X(d)}" x2="${X(d)}" y1="${f.T + f.ih}" y2="${f.T + f.ih + 4}" stroke="${C.grey}"/><text x="${X(d)}" y="${f.H - 18}" text-anchor="middle" class="ax">${esc(DA.lbl(d, o.gran))}</text>`; });

      if (se.area) { const ok = pts.filter(Boolean); if (ok.length > 1) s += `<path d="M${ok[0][0]} ${Y(0)}L${ok.map((p) => p[0] + ' ' + p[1]).join('L')}L${ok[ok.length - 1][0]} ${Y(0)}Z" fill="${se.color}" opacity=".12"/>`; }

    const bw = f.iw / Math.max(1, n - 1);
