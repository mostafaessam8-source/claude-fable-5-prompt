<!doctype html>
<html lang="ar" dir="ltr">
<head>
<!-- P6 Web – Schedule Studio v2.0.0 (4f6cd82) – offline single-file build -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P6 Web – Schedule Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Crect x='6' y='8' width='12' height='4' rx='1' fill='%23fff'/%3E%3Crect x='11' y='14' width='14' height='4' rx='1' fill='%23fff'/%3E%3Crect x='8' y='20' width='10' height='4' rx='1' fill='%23fca5a5'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f5f9; --panel:#ffffff; --panel2:#f8fafc; --line:#dde3ec; --line2:#eaeef5; --text:#1b2433; --muted:#6b7a90;
  --accent:#2563eb; --accent-soft:#e6efff; --sel:#dbe8ff; --sel2:#eef4ff; --wbs:#eef2f8; --danger:#dc2626; --ok:#16a34a;
  --bar:#4f8df7; --bar-act:#1e40af; --bar-crit:#ef4444; --bar-crit-act:#991b1b; --bar-base:#94a3b8; --sum:#1f2a44; --mile:#7c3aed;
  --weekend:#00000008; --grid:#e8edf4; --shadow:0 8px 30px rgba(15,23,42,.18); --rowh:24px;
  --font:"Segoe UI",system-ui,-apple-system,"Noto Sans Arabic",Tahoma,Arial,sans-serif;
}
:root[data-theme=dark]{
  --bg:#0f1420; --panel:#161c2b; --panel2:#1a2133; --line:#2a3348; --line2:#222b3f; --text:#e5eaf3; --muted:#8b98b0;
  --accent:#5b9bff; --accent-soft:#1d2c4d; --sel:#233a66; --sel2:#1b2a4a; --wbs:#1c2437; --danger:#f87171; --ok:#4ade80;
  --bar:#4f8df7; --bar-act:#93b4ff; --bar-crit:#f26464; --bar-crit-act:#fca5a5; --bar-base:#64748b; --sum:#c7d2ea; --mile:#a78bfa;
  --weekend:#ffffff0a; --grid:#222b3f; --shadow:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.35 var(--font);background:var(--bg);color:var(--text);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:calc(100vh / var(--uz,1))}
.spacer{flex:1}
svg{display:block}
/* top bar */
#topbar{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;margin-inline-end:10px;font-size:14px}
#menubar{display:flex;gap:2px}
.menu{position:relative}
.menu>button,.tbtn{background:none;border:0;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--text)}
.menu>button:hover,.menu.open>button,.tbtn:hover{background:var(--accent-soft)}
.dd{position:absolute;top:100%;inset-inline-start:0;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;z-index:60;display:none}
.menu.open .dd{display:block}
.dd .it{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:start;white-space:nowrap}
.dd .it:hover{background:var(--accent-soft)}
.dd .it .k{margin-inline-start:auto;color:var(--muted);font-size:11px;padding-inline-start:18px}
.dd .it .ck{width:14px;color:var(--accent);font-weight:700}
.dd hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}
.projname{border:1px solid var(--line);background:var(--panel2);padding:4px 10px;border-radius:7px;cursor:pointer;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projname:hover{border-color:var(--accent)}
/* toolbar */
#toolbar{display:flex;align-items:center;gap:2px;height:38px;padding:0 8px;background:var(--panel2);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;white-space:nowrap}
#toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 6px;flex:none}
.ib{display:inline-flex;align-items:center;gap:5px;height:28px;min-width:28px;padding:0 7px;border:1px solid transparent;background:none;border-radius:6px;cursor:pointer;flex:none;color:var(--text)}
.ib:hover:not(:disabled){background:var(--accent-soft);border-color:var(--line)}
.ib:disabled{opacity:.35;cursor:default}
.ib.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib.pri{background:var(--accent);color:#fff}
.ib.pri:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
.sbox{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 6px;height:28px;flex:none}
.sbox input{border:0;outline:0;background:none;width:130px}
.sel{height:28px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 6px;flex:none}
/* main */
#main{flex:1;display:flex;min-height:0;background:var(--panel)}
#tablePane{width:640px;min-width:160px;display:flex;flex-direction:column;position:relative;overflow:hidden;flex:none}
#ganttPane{flex:1;min-width:120px;display:flex;flex-direction:column;position:relative;overflow:hidden;direction:ltr}
#vsplit{width:5px;cursor:col-resize;background:var(--line);flex:none;position:relative;z-index:5}
#vsplit:hover,#vsplit.drag{background:var(--accent)}
#hsplit{height:5px;cursor:row-resize;background:var(--line);flex:none}
#hsplit:hover,#hsplit.drag{background:var(--accent)}
#tHead{height:46px;background:var(--panel2);border-bottom:1px solid var(--line);overflow:hidden;position:relative;flex:none}
#tHead .hin{position:absolute;top:0;left:0;height:100%;display:flex}
.th{position:relative;height:100%;display:flex;align-items:flex-end;padding:0 6px 6px;font-weight:600;font-size:12px;color:var(--muted);border-inline-end:1px solid var(--line);user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.th:hover{color:var(--text)}
.th .rz{position:absolute;inset-inline-end:-3px;top:0;width:7px;height:100%;cursor:col-resize;z-index:2}
.th.r{justify-content:flex-end}
#tBody{flex:1;overflow:auto;position:relative;scrollbar-gutter:stable}
#tRows{position:relative;min-width:100%}
.tr{position:absolute;left:0;height:var(--rowh);display:flex;border-bottom:1px solid var(--line2);cursor:default}
.tr.wbs{background:var(--wbs);font-weight:600}
.tr.sel{background:var(--sel)}
.tr.sel.wbs{background:var(--sel)}
.tr.focus{outline:1.5px solid var(--accent);outline-offset:-1.5px;z-index:2}
.tr.dropt{box-shadow:inset 0 -2px 0 var(--accent)}
.td{height:100%;padding:0 6px;display:flex;align-items:center;border-inline-end:1px solid var(--line2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:none}
.td>span{overflow:hidden;text-overflow:ellipsis}
.td.r{justify-content:flex-end;font-variant-numeric:tabular-nums}
.td.ro{color:var(--muted)}
.td.cur{box-shadow:inset 0 0 0 2px var(--accent);background:var(--panel)}
.td.crit{color:var(--danger)}
.td.neg{color:var(--danger);font-weight:600}
.td input,.td select{width:100%;height:100%;border:0;outline:0;background:var(--panel);padding:0 4px;margin:0 -6px;width:calc(100% + 12px);box-shadow:inset 0 0 0 2px var(--accent)}
.tw{display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex:none;margin-inline-end:2px;border-radius:3px}
.tw:hover{background:var(--line)}
.ico{display:inline-block;width:10px;height:10px;margin-inline-end:6px;flex:none}
.ico.task{background:var(--bar);border-radius:2px}
.ico.crit{background:var(--bar-crit)}
.ico.done{background:var(--bar-act)}
.ico.mile{background:var(--mile);transform:rotate(45deg) scale(.8)}
.ico.wbs{background:var(--sum);height:6px;margin-top:2px}
.st-C{color:var(--ok)}
.st-IP{color:var(--accent)}
/* gantt */
#gHead{height:46px;background:var(--panel2);border-bottom:1px solid var(--line);overflow:hidden;position:relative;flex:none}
#gScroll{flex:1;overflow:auto;position:relative}
#gScroll svg.gc{position:sticky;top:0;left:0}
.gspacer{position:absolute;top:0;left:0;width:1px;height:1px;pointer-events:none}
.gsvg text{font:11px var(--font);fill:var(--text)}
.gsvg .lbl{fill:var(--text)}
.bar{cursor:pointer}
.bar-n{fill:var(--bar)} .bar-c{fill:var(--bar-crit)}
.bar-a{fill:var(--bar-act)} .bar-ac{fill:var(--bar-crit-act)}
.bar-base{fill:var(--bar-base);opacity:.85}
.lnk{fill:none;stroke:#8a97ab;stroke-width:1}
.lnk.crit{stroke:var(--bar-crit)}
.arrow{fill:#8a97ab}.arrow.crit{fill:var(--bar-crit)}
.gsvg .row-sel{fill:var(--sel2)}
.gsvg .row-sel2{fill:var(--sel);opacity:.6}
.gsvg .row-wbs{fill:var(--wbs);opacity:.55}
.gsvg .gl{stroke:var(--grid);stroke-width:1}
.gsvg .gl2{stroke:var(--line);stroke-width:1}
.gsvg .we{fill:var(--weekend)}
.gsvg .dd-line{stroke:var(--accent);stroke-width:1.6}
.gsvg .td-line{stroke:var(--danger);stroke-width:1;stroke-dasharray:4 3}
.gsvg .handle{fill:var(--accent);opacity:0}
.gsvg .bargrp:hover .handle{opacity:1}
.gsvg .fl{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 2}
.gsvg .ghost{fill:var(--accent);opacity:.35}
.gh text{fill:var(--muted);font-weight:600}
/* details */
#details{height:230px;flex:none;background:var(--panel);display:flex;flex-direction:column;min-height:34px}
#details.collapsed{height:34px!important}
.dtabs{display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);background:var(--panel2);height:34px;flex:none}
.dtab{border:0;background:none;padding:7px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
.dtab.on{color:var(--accent);border-color:var(--accent)}
.dtitle{margin-inline-start:auto;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:50%}
.dbody{flex:1;overflow:auto;padding:10px 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 18px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld>label{font-size:11px;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea,.inp{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px;outline:0;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld input[readonly]{background:var(--panel2);color:var(--muted)}
.fld.w2{grid-column:span 2}
.mini{width:100%;border-collapse:collapse}
.mini th{text-align:start;font-size:11px;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.mini td{padding:2px 4px;border-bottom:1px solid var(--line2)}
.mini input,.mini select{width:100%;border:1px solid transparent;background:none;border-radius:4px;padding:3px 5px}
.mini input:hover,.mini select:hover{border-color:var(--line)}
.mini input:focus,.mini select:focus{border-color:var(--accent);background:var(--panel);outline:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.empty{color:var(--muted);padding:20px;text-align:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 13px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.1);color:#fff}
.btn.dng{color:var(--danger)}
.btn.sm{padding:3px 9px;font-size:12px}
.badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.red{background:#fee2e2;color:#b91c1c}.badge.grn{background:#dcfce7;color:#15803d}
:root[data-theme=dark] .badge.red{background:#4b1d1d;color:#fca5a5}:root[data-theme=dark] .badge.grn{background:#143626;color:#86efac}
/* status */
#statusbar{display:flex;align-items:center;gap:16px;height:24px;padding:0 12px;background:var(--panel2);border-top:1px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
#statusbar b{color:var(--text);font-weight:600}
#statusbar .warn{color:var(--danger);font-weight:600}
/* overlays */
#tip{position:fixed;z-index:200;background:#101828;color:#fff;border-radius:8px;padding:8px 11px;font-size:12px;pointer-events:none;box-shadow:var(--shadow);max-width:340px;line-height:1.5}
#tip b{color:#fff}
#ctx{position:fixed;z-index:150;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:210px}
#ctx .it{display:flex;width:100%;padding:6px 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:start;gap:8px}
#ctx .it:hover{background:var(--accent-soft)}
#ctx hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}
#toasts{position:fixed;bottom:38px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#101828;color:#fff;padding:8px 14px;border-radius:9px;box-shadow:var(--shadow);animation:tin .2s;max-width:80vw}
.toast.err{background:#b91c1c}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#dropzone{position:fixed;inset:0;z-index:500;background:#2563eb55;display:flex;align-items:center;justify-content:center;font-size:90px;color:#fff;border:6px dashed #fff}
.modal-bg{position:fixed;inset:0;background:#0f172a66;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:92vh;max-width:96vw;min-width:min(440px,96vw);border:1px solid var(--line)}
.modal.wide{width:min(1080px,96vw)}
.modal.mid{width:min(720px,96vw)}
.mh{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700}
.mh .x{margin-inline-start:auto;border:0;background:none;cursor:pointer;font-size:20px;color:var(--muted);line-height:1}
.mb{padding:16px 18px;overflow:auto;flex:1;min-height:0}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel2);border-radius:0 0 14px 14px}
.hint{color:var(--muted);font-size:12px;margin:4px 0 10px}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel2)}
.pitem:hover{border-color:var(--accent)}
.pitem.cur{border-color:var(--accent);background:var(--accent-soft)}
.pitem .nm{font-weight:600}.pitem .sub{color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2)}
.kpi .v{font-size:20px;font-weight:700}.kpi .l{font-size:11px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:7px;padding:3px 0}
.dayrow{display:flex;gap:6px;flex-wrap:wrap}
.dayrow label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer}
.tbl-scroll{max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.tbl-scroll .mini td input{min-width:70px}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;color:var(--muted)}
.welcome{max-width:520px;margin:50px auto;text-align:center}
@media print{
  body{overflow:visible}#topbar,#toolbar,#details,#statusbar,#hsplit,#vsplit{display:none!important}
  #app{height:auto}#main{height:auto}
}
@media (max-width:820px){#tablePane{width:50vw!important}.brand b{display:none}}
[hidden]{display:none!important}
#main,#tablePane{direction:ltr}
#statusbar b,.kpi .v,.pitem .sub,.tag{unicode-bidi:isolate}
#statusbar b{direction:ltr;display:inline-block}
.mini td,.dbody input:not([dir]){unicode-bidi:plaintext}
#tip{direction:ltr;text-align:left}
#tip div:first-child{unicode-bidi:plaintext}
.kpi .v bdi{font-size:18px}
/* ===== Primavera P6 "classic" skin (default) ===== */
#titlebar,#layoutbar{display:none}
.gsvg .row-spot{fill:#fff3a0;opacity:.75}
.tr.spot{background:#fff8c4}
:root[data-theme=p6]{
  --bg:#dcdcdc;--panel:#fff;--panel2:#f0f0f0;--line:#9c9c9c;--line2:#dcdcdc;--text:#000;--muted:#3b3b3b;
  --accent:#0b4a96;--accent-soft:#d6e4f5;--sel:#b8d1ee;--sel2:#e1ecf9;--wbs:#e9e9e9;
  --bar:#1f55d4;--bar-act:#10308a;--bar-crit:#e00000;--bar-crit-act:#7f0000;--bar-base:#5aa05a;--sum:#000;--mile:#1b1b9a;
  --grid:#dadada;--weekend:#0000000d;--shadow:0 3px 12px rgba(0,0,0,.35);
  --font:Tahoma,"Segoe UI","Noto Sans Arabic",Arial,sans-serif;
}
:root[data-theme=p6] body{font-size:12px}
:root[data-theme=p6] #titlebar{display:flex;align-items:center;gap:10px;height:24px;padding:0 10px;color:#fff;font-weight:700;background:linear-gradient(#4f7fb9,#1e4a84);border-bottom:1px solid #0d2b52}
:root[data-theme=p6] #titlebar span{opacity:.85;font-weight:400}
:root[data-theme=p6] #topbar{height:26px;background:linear-gradient(#fafafa,#e6e6e6);border-bottom:1px solid var(--line)}
:root[data-theme=p6] .brand{display:none}
:root[data-theme=p6] .menu>button,:root[data-theme=p6] .tbtn{padding:3px 10px;border-radius:0}
:root[data-theme=p6] .menu>button:hover,:root[data-theme=p6] .menu.open>button{background:#316ac5;color:#fff}
:root[data-theme=p6] .dd{border-radius:0;border:1px solid #707070;padding:2px;box-shadow:3px 3px 6px #0004}
:root[data-theme=p6] .dd .it{border-radius:0;padding:4px 10px}
:root[data-theme=p6] .dd .it:hover{background:#316ac5;color:#fff}
:root[data-theme=p6] .dd .it:hover .k{color:#dde}
:root[data-theme=p6] .projname{border-radius:0;background:#fff;border-color:var(--line)}
:root[data-theme=p6] #toolbar{height:32px;background:linear-gradient(#fbfbfb,#e4e4e4);border-bottom:1px solid var(--line)}
:root[data-theme=p6] .ib{border-radius:2px}
:root[data-theme=p6] .ib:hover:not(:disabled){background:#fff;border-color:#316ac5}
:root[data-theme=p6] .ib.pri{background:linear-gradient(#5b8fd3,#2c5fa8);border-color:#1d4985}
:root[data-theme=p6] .ib svg{stroke-width:1.6}
:root[data-theme=p6] .sbox,:root[data-theme=p6] .sel,:root[data-theme=p6] .fld input,:root[data-theme=p6] .fld select,:root[data-theme=p6] .fld textarea,:root[data-theme=p6] .btn,:root[data-theme=p6] .inp{border-radius:0}
:root[data-theme=p6] #layoutbar{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;background:linear-gradient(#f4f4f4,#dedede);border-bottom:1px solid var(--line);white-space:nowrap;overflow-x:auto;overflow-y:visible}
:root[data-theme=p6] #layoutbar label{font-weight:700;color:#222;margin-inline-start:6px}
:root[data-theme=p6] #layoutbar .sel{height:22px;min-width:130px}
:root[data-theme=p6] #layoutbar .lb{height:22px;border:1px solid var(--line);background:linear-gradient(#fff,#e8e8e8);padding:0 9px;cursor:pointer}
:root[data-theme=p6] #layoutbar .lb:hover{border-color:#316ac5}
:root[data-theme=p6] #tHead,:root[data-theme=p6] #gHead{background:linear-gradient(#fdfdfd,#d7d7d7);border-bottom:1px solid var(--line)}
:root[data-theme=p6] .th{color:#000;font-weight:700;border-inline-end:1px solid #b5b5b5}
:root[data-theme=p6] .gh text{fill:#000;font-weight:600}
:root[data-theme=p6] #tablePane{border-right:1px solid var(--line)}
:root[data-theme=p6] .tr{border-bottom:1px solid #e3e3e3}
:root[data-theme=p6] .td{border-inline-end:1px solid #ececec}
:root[data-theme=p6] .tr.wbs{background:#e6e6e6}

<script>
/* P6 Web – core: dates, calendars, model helpers and the CPM scheduling engine.
   Works in the browser (window.P6) and in Node (require) for tests. */
(function (g) {
  'use strict';
  const P6 = (g.P6 = g.P6 || {});
  const MS = 86400000;
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // ---------- dates (all dates are integer day numbers since 1970-01-01) ----------
  const toDay = (iso) => {
    if (!iso) return null;
    const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(iso));
    return m ? Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / MS) : null;
  };
  const fromDay = (d) => (d == null ? '' : new Date(d * MS).toISOString().slice(0, 10));
  const dow = (d) => (((d + 4) % 7) + 7) % 7; // 0 = Sunday
  const ymd = (d) => {
    const x = new Date(d * MS);
    return { y: x.getUTCFullYear(), m: x.getUTCMonth(), d: x.getUTCDate() };
  };
  const mkDay = (y, m, d) => Math.round(Date.UTC(y, m, d) / MS);
  const fmtDate = (d) => {
    if (d == null || !isFinite(d)) return '';
    const x = ymd(d);
    return String(x.d).padStart(2, '0') + '-' + MON[x.m] + '-' + String(x.y).slice(2);
  };
  function parseDate(s) {
    if (s == null) return null;
    s = String(s).replace(/[\u200e\u200f\u2066-\u2069]/g, '').trim();
    if (!s) return null;
    let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
    if (m) return mkDay(+m[1], +m[2] - 1, +m[3]);

    const W = new Map();
    const calc = (id) => {
      const m = blank();
      for (const tid of tby.get(id) || []) {
        const x = T.get(tid); BASE.forEach((k) => { m[k] += x[k]; });
      }
      for (const k of kids.get(id) || []) { const x = calc(k); BASE.forEach((q) => { m[q] += x[q]; }); }

    };

  P6.floatPaths = function (p, maxPaths) {

    guide_html: [
      '<h3>Quick start</h3><ol><li><b>Open</b> a P6 file: File → Open (XER, PMXML) or just drag it onto the page.</li><li><b>Edit</b> any cell by double-click / F2 / typing. Predecessors accept <code>A100, A110SS+2, A120FF-1</code>.</li><li>Drag a bar to move it, drag its right edge to change duration, drag the little dot at its end onto another bar to link.</li><li><b>Baseline:</b> Project → Baselines → Save current schedule.</li><li><b>Update:</b> Project → Update progress (set Data Date, actual start / % / finish) → Apply &amp; Schedule. Or import the updated XER with <i>Import update – keep my baseline</i>.</li><li><b>Export</b> XER to open it back in Primavera P6.</li></ol><p>Everything saves automatically in your browser. No data leaves your device.</p>',
      '<h3>بداية سريعة</h3><ol><li><b>افتح</b> ملف P6: ملف ← فتح ملف (XER أو PMXML) أو اسحب الملف وأفلته على الصفحة.</li><li><b>عدّل</b> أي خلية بالنقر المزدوج / F2 / الكتابة مباشرة. السوابق تقبل الصيغة <code>A100, A110SS+2, A120FF-1</code>.</li><li>اسحب الشريط لتحريكه، اسحب طرفه الأيمن لتغيير المدة، واسحب النقطة الصغيرة في نهايته إلى شريط آخر لعمل علاقة.</li><li><b>البيزلاين:</b> المشروع ← البيزلاين ← حفظ الجدول الحالي.</li><li><b>التحديث:</b> المشروع ← تحديث التقدّم (حدد Data Date والبداية الفعلية والنسبة والنهاية) ← تطبيق وجدولة. أو استورد ملف XER المحدّث بخيار <i>استيراد تحديث مع الاحتفاظ بالبيزلاين</i>.</li><li><b>التصدير:</b> صدّر XER لفتحه مجدداً في Primavera P6.</li></ol><p>كل شيء يُحفظ تلقائياً في متصفحك. لا تغادر بياناتك جهازك.</p>'
    ],

    collapsed: new Set(), undo: [], redo: [], dirty: false, minDay: 0, maxDay: 0, tab: 'general',
    cfg: {

  // ================= commands =================

    del() {

      const desc = (id) => { const out = [id]; for (const w of S.p.wbs) if (w.parent === id) out.push(...desc(w.id)); return out; };
      const wids = new Set(wsx.flatMap((w) => desc(w.id)));

    link(type) {

      else if (mod && e.key.toLowerCase() === 'f') { e.preventDefault(); API.dialogs.find(); }
      else if (e.key === 'F3') { e.preventDefault(); API.findNext(e.shiftKey); }
      else if (mod && e.key.toLowerCase() === 'r') { e.preventDefault(); API.dialogs.replace(); }
      else if (mod && e.key.toLowerCase() === 'e') { e.preventDefault(); API.fillDown(); }
      else if (e.key === 'F7') { e.preventDefault(); API.toggleSpell(); }
      else if (e.altKey && e.key === 'F1') { e.preventDefault(); S.cfg.hint = S.cfg.hint === false; saveCfg(); API.applyHint(); buildMenus(); }

    try { const last = localStorage.getItem(API.lastKey()); if (last) p = await loadProject(last); } catch (e) { p = null; }
    if (!p) { p = P6.sampleProject(); p.name = t('sample_name'); }
    P6.ensureBaselines(p); S.p = p; refresh({ details: true });

  };

  Object.assign(API, { rawValue, zoom, zoomFit, setRowH(h) { RH = h; document.documentElement.style.setProperty('--rowh', h + 'px'); }, getRH: () => RH, selectKeys(k) { return API.setSel(k); }, goDate, setView, applyView, DEF_TABS, ensureVisible, getCtx: () => S.ctx, mutate, refresh, toast, listProjects, loadProject, deleteProject, saveNow, selectRow, selTasks, selWbs, focusTask, taskById, wbsById, calOf, fmtD, fmtN, setStatus, setPct, setPct, applyField, handleFile, buildMenus, buildToolbar, goDate, scheduleSave, json, ALL_COLS, DEF_COLS, renderHead, renderRows, ZOOMS, restoreFrom: restore, download, matchesFilter });

<script>
/* P6 Web – dialogs: projects, settings, calendars, columns, progress update, baselines, reports, imports, help. */
(function (g) {
  'use strict';
  const P6 = g.P6, App = g.App, D = (App.dialogs = {});
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = P6.esc, t = (k, ...a) => P6.t(k, ...a);
  const fmtD = P6.fmtDate;
  const bd = (v) => '<bdi dir="ltr">' + fmtD(v) + '</bdi>';
  

  function modal(o) {
    const bg = document.createElement('div');
    bg.className = 'modal-bg'; bg.dir = P6.dir();
    bg.innerHTML = `<div class="modal ${o.cls || ''}" role="dialog"><div class="mh"><span>${esc(String(o.title).replace(/…$/, ''))}</span><button class="x" aria-label="close">×</button></div><div class="mb"></div><div class="mf"></div></div>`;
    const mb = $('.mb', bg), mf = $('.mf', bg);
    if (typeof o.body === 'string') mb.innerHTML = o.body; else mb.appendChild(o.body);
    const close = () => { bg.remove(); document.removeEventListener('keydown', onKey, true); if (o.onClose) o.onClose(); };
    const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
    document.addEventListener('keydown', onKey, true);
    $('.x', bg).onclick = close;
    bg.addEventListener('mousedown', (e) => { if (e.target === bg && !o.sticky) close(); });
    const btns = o.buttons || [{ label: t('close'), fn: () => {} }];
    btns.forEach((b) => {
      const el = document.createElement('button');
      el.className = 'btn ' + (b.cls || ''); el.textContent = b.label;
      el.onclick = () => { if (b.fn(close, bg) !== false) close(); };
      mf.appendChild(el);
    });
    if (!btns.length) mf.remove();
    document.body.appendChild(bg);
    if (o.onOpen) o.onOpen(bg, close);
    const first = bg.querySelector('input:not([type=checkbox]),select,textarea');
    if (first && !o.noFocus) first.focus();
    return { el: bg, close };
  }
  D.modal = modal;
  const toast = (m, e) => App.toast(m, e);
  const dateIn = (id, v) => `<input id="${id}" value="${esc(fmtD(v))}" placeholder="dd-Mon-yy" dir="ltr">`;
  const row = (label, inner, cls) => `<div class="fld ${cls || ''}"><label>${esc(label)}</label>${inner}</div>`;

  // ---------- projects ----------
  D.projects = async function () {
    let list = (await App.listProjects()).sort((a, b) => b.updated - a.updated);
    const pf = App.cfg.portfolio && (App.cfg.portfolios || {})[App.cfg.portfolio];
    if (pf) list = list.filter((x) => pf.includes(x.id));
    const cur = App.p && App.p.id;
    const body = document.createElement('div');
    body.innerHTML = `<div class="hint">${esc(t('projects_hint'))}</div><div class="plist">${list.map((p) => `<div class="pitem${p.id === cur ? ' cur' : ''}" data-id="${esc(p.id)}"><div style="flex:1"><div class="nm" dir="auto">${esc(p.name)}</div><div class="sub">${esc(t('activities'))}: ${p.tasks} · ${p.start != null ? bd(p.start) + ' → ' + bd(p.finish) : ''} · ${new Date(p.updated).toLocaleString()}</div></div><button class="btn sm dng" data-del="${esc(p.id)}">${esc(t('delete'))}</button></div>`).join('') || `<div class="empty">${esc(t('no_projects'))}</div>`}</div>`;
    const m = modal({
      title: t('projects'), cls: 'mid', body,
      buttons: [
        { label: t('new_project'), fn: () => { D.newProject(); } },
        { label: t('open_file'), cls: 'pri', fn: () => { App.openFile(); } },
        { label: t('load_sample'), fn: () => { App.loadSample(); } }
      ]
    });
    body.addEventListener('click', async (e) => {
      const del = e.target.closest('[data-del]');
      if (del) {
        e.stopPropagation();
        if (!confirm(t('confirm_delete_project'))) return;
        await App.deleteProject(del.dataset.del);
        del.closest('.pitem').remove();
        return;
      }
      const it = e.target.closest('.pitem'); if (!it) return;
      if (it.dataset.id === cur) return m.close();
      const p = await App.loadProject(it.dataset.id);
      if (p) { App.openProject(p); m.close(); }
    });
  };

  D.newProject = function () {
    const body = `<div class="grid2">${row(t('project_name'), `<input id="np_name" value="${esc(t('new_project_name'))}" dir="auto">`, 'w2')}${row(t('plan_start'), dateIn('np_start', P6.todayDay()))}
      ${row(t('workweek'), `<select id="np_week"><option value="sunThu">${esc(t('wk_sunThu'))}</option><option value="monFri">${esc(t('wk_monFri'))}</option><option value="satThu">${esc(t('wk_satThu'))}</option><option value="all7">${esc(t('wk_all7'))}</option></select>`)}</div>`;
    modal({
      title: t('new_project'), body, buttons: [{ label: t('cancel'), fn: () => {} }, {
        label: t('create'), cls: 'pri', fn: (c, el) => {
          const name = $('#np_name', el).value.trim() || 'Project';
          const st = P6.parseDate($('#np_start', el).value);
          if (st == null) { toast(t('err_date'), true); return false; }
          const p = P6.newProject(name, { planStart: st, week: P6.WEEKS[$('#np_week', el).value] });
          const tk = P6.newTask(p, 1, { name: t('new_activity'), dur: 5, rem: 5 }); p.tasks.push(tk);
          P6.schedule(p);
          App.openProject(p);
        }
      }]
    });
  };

  // ---------- settings ----------
  D.settings = function () {
    const p = App.p;
    const body = `<div class="grid2">${row(t('project_name'), `<input id="s_name" value="${esc(p.name)}" dir="auto">`, 'w2')}${row(t('project_desc'), `<input id="s_desc" value="${esc(p.desc || '')}" dir="auto">`, 'w2')}
      ${row(t('plan_start'), dateIn('s_ps', p.planStart))}${row(t('data_date'), dateIn('s_dd', p.dataDate))}${row(t('must_finish'), dateIn('s_mf', p.mustFinish))}
      ${row(t('def_calendar'), `<select id="s_cal">${p.cals.map((c) => `<option value="${c.id}"${c.id === p.defCal ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`)}
      ${row(t('crit_float'), `<input id="s_cf" value="${p.critFloat || 0}">`)}
      ${row(t('progress_logic'), `<select id="s_ret"><option value="1"${p.retained ? ' selected' : ''}>${esc(t('retained'))}</option><option value="0"${!p.retained ? ' selected' : ''}>${esc(t('override'))}</option></select>`)}</div>
      <p class="hint">${esc(t('settings_hint'))}</p>`;
    modal({
      title: t('project_settings'), cls: 'mid', body, buttons: [{ label: t('cancel'), fn: () => {} }, {
        label: t('save'), cls: 'pri', fn: (c, el) => {
          const ps = P6.parseDate($('#s_ps', el).value), dd = P6.parseDate($('#s_dd', el).value), mf = $('#s_mf', el).value.trim() ? P6.parseDate($('#s_mf', el).value) : null;
          if (ps == null || dd == null) { toast(t('err_date'), true); return false; }
          App.mutate(t('project_settings'), () => {
            p.name = $('#s_name', el).value.trim() || p.name; p.desc = $('#s_desc', el).value;
            p.planStart = ps; p.dataDate = dd; p.mustFinish = mf; p.defCal = +$('#s_cal', el).value;
            p.critFloat = parseFloat($('#s_cf', el).value) || 0; p.retained = $('#s_ret', el).value === '1';
            const root = p.wbs.find((w) => w.parent == null); if (root && !p.xer) root.name = p.name;
          });
        }
      }]
    });
  };

  // ---------- calendars ----------
  D.calendars = function () {
    const p = App.p;
    let cur = p.cals.find((c) => c.id === p.defCal) || p.cals[0];
    const body = document.createElement('div');
    const days = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    const draw = () => {
      body.innerHTML = `<div class="grid2">${row(t('calendar'), `<select id="c_sel">${p.cals.map((c) => `<option value="${c.id}"${c === cur ? ' selected' : ''}>${esc(c.name)}${c.id === p.defCal ? ' ★' : ''}</option>`).join('')}</select>`)}
        ${row(t('cal_name'), `<input id="c_name" value="${esc(cur.name)}" dir="auto">`)}${row(t('hours_day'), `<input id="c_hrs" value="${cur.hrs}">`)}</div>
        <div class="fld" style="margin-top:12px"><label>${esc(t('workweek'))}</label><div class="dayrow">${days.map((d, i) => `<label><input type="checkbox" data-d="${i}"${cur.work[i] ? ' checked' : ''}> ${esc(t('d_' + d))}</label>`).join('')}</div></div>
        <div class="fld" style="margin-top:12px"><label>${esc(t('exceptions'))}</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><input id="h_from" dir="ltr" placeholder="dd-Mon-yy" style="width:120px" class="inp"><span>→</span><input id="h_to" dir="ltr" placeholder="dd-Mon-yy" style="width:120px" class="inp"><select id="h_kind" class="inp"><option value="0">${esc(t('holiday'))}</option><option value="1">${esc(t('workday'))}</option></select><button class="btn sm" id="h_add">${esc(t('add'))}</button></div>
        <div id="h_list" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;max-height:150px;overflow:auto"></div></div>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="c_new">${esc(t('new_calendar'))}</button><button class="btn sm" id="c_def">${esc(t('set_default'))}</button><button class="btn sm dng" id="c_del">${esc(t('delete_calendar'))}</button></div>`;
      const hl = $('#h_list', body);
      const keys = Object.keys(cur.exc).map(Number).sort((a, b) => a - b);
      hl.innerHTML = keys.map((k) => `<span class="tag" style="${cur.exc[k] ? 'color:var(--ok)' : ''}"><bdi dir="ltr">${fmtD(k)}</bdi> ${cur.exc[k] ? '✚' : ''} <a href="#" data-rm="${k}" style="color:var(--danger);text-decoration:none">×</a></span>`).join('') || `<span class="hint">${esc(t('no_exceptions'))}</span>`;
    };
    draw();
    modal({
      title: t('calendars'), cls: 'mid', body, buttons: [{ label: t('close'), cls: 'pri', fn: () => {} }],
      onClose: () => { App.refresh({ details: true }); }
    });
    const commit = (label, fn) => App.mutate(label, () => { fn(); cur.mod = true; P6.touchCal(cur); });
    body.addEventListener('change', (e) => {
      const x = e.target;
      if (x.id === 'c_sel') { cur = p.cals.find((c) => c.id === (isNaN(+x.value) ? x.value : +x.value)); draw(); }
      else if (x.id === 'c_name') commit(t('calendars'), () => { cur.name = x.value; });
      else if (x.id === 'c_hrs') commit(t('calendars'), () => { cur.hrs = parseFloat(x.value) || 8; });
      else if (x.dataset.d) commit(t('calendars'), () => { cur.work[+x.dataset.d] = x.checked; });
    });
    body.addEventListener('click', (e) => {
      e.preventDefault && 0;
      const rm = e.target.closest('[data-rm]');
      if (rm) { e.preventDefault(); commit(t('calendars'), () => { delete cur.exc[rm.dataset.rm]; }); draw(); return; }
      const id = e.target.id;
      if (id === 'h_add') {
        const a = P6.parseDate($('#h_from', body).value); let b = P6.parseDate($('#h_to', body).value);
        if (a == null) return toast(t('err_date'), true);
        if (b == null || b < a) b = a;
        if (b - a > 800) return toast(t('err_range'), true);
        const kind = $('#h_kind', body).value === '1';
        commit(t('calendars'), () => { for (let d = a; d <= b; d++) cur.exc[d] = kind; }); draw();
      } else if (id === 'c_new') {
        const n = prompt(t('cal_name'), t('new_calendar')); if (!n) return;
        let nc;
        App.mutate(t('calendars'), () => { nc = P6.newCal(P6.nextId(p), n, cur.work); nc.hrs = cur.hrs; nc.exc = Object.assign({}, cur.exc); nc.mod = true; p.cals.push(nc); });
        cur = nc; draw();
      } else if (id === 'c_def') { App.mutate(t('calendars'), () => { p.defCal = cur.id; }); draw(); }
      else if (id === 'c_del') {
        if (p.cals.length < 2) return toast(t('err_last_cal'), true);
        if (p.tasks.some((x) => x.cal === cur.id) || cur.id === p.defCal) return toast(t('err_cal_used'), true);
        App.mutate(t('calendars'), () => { p.cals = p.cals.filter((c) => c !== cur); }); cur = p.cals[0]; draw();
      }
    });
  };

  // ---------- custom filter ----------
  D.filter = function () {
    const F = App.cfg.filter;
    const conds = (F.custom && F.custom.conds && F.custom.conds.length ? F.custom.conds : [{ f: 'name', op: 'has', v: '' }]).map((c) => ({ ...c }));
    let join = (F.custom && F.custom.join) || 'and';
    const fields = ['code', 'name', 'status', 'dur', 'rem', 'pct', 'es', 'ef', 'tf', 'ff', 'wbs'], ops = ['has', 'eq', 'ne', 'gt', 'lt', 'ge', 'le'];
    const body = document.createElement('div');
    const draw = () => {
      body.innerHTML = `<div class="fld" style="max-width:260px;margin-bottom:10px"><label>${esc(t('cf_match'))}</label><select id="cf_join"><option value="and"${join === 'and' ? ' selected' : ''}>${esc(t('cf_all'))}</option><option value="or"${join === 'or' ? ' selected' : ''}>${esc(t('cf_any'))}</option></select></div>
        <table class="mini"><tbody>${conds.map((c, i) => `<tr data-i="${i}"><td><select data-k="f">${fields.map((f) => `<option value="${f}"${c.f === f ? ' selected' : ''}>${esc(t('col_' + f))}</option>`).join('')}</select></td><td><select data-k="op">${ops.map((o) => `<option value="${o}"${c.op === o ? ' selected' : ''}>${esc(t('op_' + o))}</option>`).join('')}</select></td><td><input data-k="v" dir="auto" value="${esc(c.v)}" placeholder="${c.f === 'status' ? 'NS / IP / C' : ''}"></td><td><button class="ib" data-rm="${i}">×</button></td></tr>`).join('')}</tbody></table>
        <div style="margin-top:8px"><button class="btn sm" id="cf_add">+ ${esc(t('add'))}</button></div>`;
    };
    draw();
    modal({
      title: t('cf_title'), cls: 'mid', body, buttons: [
        { label: t('cf_clear'), fn: () => { F.mode = 'all'; F.custom = null; App.refresh(); App.buildLayoutBar && App.buildLayoutBar(); } },
        { label: t('cf_apply'), cls: 'pri', fn: () => { F.custom = { conds: conds.filter((c) => String(c.v).trim() !== ''), join }; F.mode = F.custom.conds.length ? 'custom' : 'all'; try { localStorage.setItem('p6web.cfg', JSON.stringify(App.cfg)); } catch (e) { /* */ } App.refresh(); } }
      ]
    });
    body.addEventListener('change', (e) => { const x = e.target; if (x.id === 'cf_join') join = x.value; else if (x.dataset.k) { conds[+x.closest('tr').dataset.i][x.dataset.k] = x.value; } });
    body.addEventListener('click', (e) => {
      if (e.target.id === 'cf_add') { conds.push({ f: 'name', op: 'has', v: '' }); draw(); }
      const r = e.target.closest('[data-rm]'); if (r && conds.length > 1) { conds.splice(+r.dataset.rm, 1); draw(); }
    });
  };

  // ---------- columns ----------
  D.columns = function () {
    const S0 = App;
    const cfg = S0.cfg;
    let cols = cfg.cols.map((c) => ({ ...c }));
    const all = Object.keys(App.ALL_COLS);
    const body = document.createElement('div');
    const draw = () => {
      const shown = new Set(cols.map((c) => c.k));
      body.innerHTML = `<div class="two"><div><b>${esc(t('visible_cols'))}</b><div id="cl_vis" style="margin-top:6px">${cols.map((c, i) => `<div class="pitem" style="padding:5px 10px"><span style="flex:1">${esc(t('col_' + c.k))}</span><button class="ib" data-up="${i}">↑</button><button class="ib" data-dn="${i}">↓</button><button class="ib" data-rm="${i}">×</button></div>`).join('')}</div></div>
        <div><b>${esc(t('available_cols'))}</b><div style="margin-top:6px">${all.filter((k) => !shown.has(k)).map((k) => `<div class="pitem" style="padding:5px 10px" data-add="${k}"><span style="flex:1">${esc(t('col_' + k))}</span><span>＋</span></div>`).join('')}</div></div></div>`;
    };
    draw();
    modal({
      title: t('columns'), cls: 'mid', body, buttons: [
        { label: t('reset'), fn: () => { cfg.cols = App.DEF_COLS.map((k) => ({ k, w: App.ALL_COLS[k].w })); App.refresh(); } },
        { label: t('save'), cls: 'pri', fn: () => { cfg.cols = cols; try { localStorage.setItem('p6web.cfg', JSON.stringify(cfg)); } catch (e) { /* */ } App.refresh(); } }]
    });
    body.addEventListener('click', (e) => {
      const b = e.target.closest('[data-up],[data-dn],[data-rm],[data-add]'); if (!b) return;
      if (b.dataset.up) { const i = +b.dataset.up; if (i > 0) [cols[i - 1], cols[i]] = [cols[i], cols[i - 1]]; }
      else if (b.dataset.dn) { const i = +b.dataset.dn; if (i < cols.length - 1) [cols[i + 1], cols[i]] = [cols[i], cols[i + 1]]; }
      else if (b.dataset.rm) { if (cols.length > 1) cols.splice(+b.dataset.rm, 1); }
      else if (b.dataset.add) cols.push({ k: b.dataset.add, w: App.ALL_COLS[b.dataset.add].w });
      draw();
    });
  };

  // ---------- WBS & resources ----------
  D.wbs = function () {
    const p = App.p;

  // ---------- update progress ----------
  D.updateProgress = function () {
    const p = App.p;
    const edits = new Map(); // id -> {as, af, pct}
    const init = (tk) => ({ as: tk.as, af: tk.af, pct: tk.pct });
    p.tasks.forEach((tk) => edits.set(tk.id, init(tk)));
    let filter = 'due', dd = p.dataDate;
    const body = document.createElement('div');
    const cal = (tk) => App.calOf(tk);
    const autoOne = (tk) => {
      const e = edits.get(tk.id);
      const s = tk.es, f = tk.ef; if (s == null) return;
      if (f <= dd && tk.status !== 'C') { e.as = tk.as != null ? tk.as : s; e.af = tk.status === 'C' ? tk.af : f; e.pct = 100; }
      else if (s <= dd && !P6.isMile(tk) && tk.status !== 'C') {
        const tot = Math.max(1, P6.durBetween(cal(tk), s, f)), done = P6.durBetween(cal(tk), s, Math.min(dd, f));
        e.as = tk.as != null ? tk.as : s; e.af = null; e.pct = Math.min(99, Math.max(tk.pct, Math.round((100 * done) / tot)));
      }
    };
    const visible = () => p.tasks.filter((tk) => {
      if (P6.isHammock(tk)) return false;
      if (filter === 'all') return true;
      if (filter === 'open') return tk.status !== 'C';
      if (filter === 'ip') return tk.status === 'IP';
      return tk.status !== 'C' && tk.es != null && tk.es <= dd + 14; // due: starts by data date (+2 weeks look ahead)
    }).sort((a, b) => (a.es || 0) - (b.es || 0) || a.code.localeCompare(b.code, undefined, { numeric: true }));
    const draw = () => {
      const list = visible(), shown = list.slice(0, 600);
      body.innerHTML = `<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px">
        <div class="fld"><label>${esc(t('data_date'))}</label><input id="u_dd" class="inp" dir="ltr" value="${esc(fmtD(dd))}" style="width:130px"></div>
        <div class="fld"><label>${esc(t('show'))}</label><select id="u_f" class="inp"><option value="due"${filter === 'due' ? ' selected' : ''}>${esc(t('u_due'))}</option><option value="ip"${filter === 'ip' ? ' selected' : ''}>${esc(t('f_IP'))}</option><option value="open"${filter === 'open' ? ' selected' : ''}>${esc(t('u_open'))}</option><option value="all"${filter === 'all' ? ' selected' : ''}>${esc(t('f_all'))}</option></select></div>
        <button class="btn" id="u_auto">⚡ ${esc(t('u_auto'))}</button><button class="btn sm" id="u_reset">${esc(t('reset'))}</button></div>
        <div class="hint">${esc(t('u_hint'))}</div>
        <div class="tbl-scroll"><table class="mini"><thead><tr><th>${esc(t('col_code'))}</th><th style="min-width:200px">${esc(t('col_name'))}</th><th>${esc(t('col_es'))}</th><th>${esc(t('col_ef'))}</th><th>${esc(t('col_as'))}</th><th style="width:80px">${esc(t('col_pct'))}</th><th>${esc(t('col_af'))}</th></tr></thead><tbody>${shown.map((tk) => {
          const e = edits.get(tk.id), late = tk.status !== 'C' && tk.es != null && tk.es < dd && !e.as;
          return `<tr data-id="${tk.id}"><td>${esc(tk.code)}</td><td dir="auto"${late ? ' style="color:var(--danger)"' : ''}>${esc(tk.name)}</td><td>${bd(tk.es)}</td><td>${bd(tk.ef)}</td><td><input dir="ltr" data-f="as" value="${esc(fmtD(e.as))}"></td><td><input dir="ltr" data-f="pct" value="${e.pct}"></td><td><input dir="ltr" data-f="af" value="${esc(fmtD(e.af))}"></td></tr>`;
        }).join('')}</tbody></table></div>${list.length > shown.length ? `<div class="hint">${esc(t('u_more', list.length - shown.length))}</div>` : ''}`;
    };
    draw();
    modal({
      title: t('update_progress'), cls: 'wide', body, sticky: true, buttons: [{ label: t('cancel'), fn: () => {} }, {
        label: t('apply_schedule'), cls: 'pri', fn: () => {
          const ndd = dd;
          App.mutate(t('update_progress'), () => {
            p.dataDate = ndd;
            if (p.planStart > ndd) p.planStart = ndd;
            let n = 0;
            for (const tk of p.tasks) {
              const e = edits.get(tk.id), o = init(tk);
              if (e.as === o.as && e.af === o.af && e.pct === o.pct) continue;
              n++;
              const pct = Math.max(0, Math.min(100, +e.pct || 0));
              if (e.af != null || pct >= 100) { tk.as = e.as != null ? e.as : (tk.as != null ? tk.as : Math.min(ndd, tk.es)); tk.af = e.af != null ? e.af : ndd; if (tk.af < tk.as) tk.af = tk.as; tk.status = 'C'; tk.rem = 0; tk.pct = 100; }
              else if (e.as != null || pct > 0) {
                tk.status = 'IP'; tk.as = e.as != null ? e.as : Math.min(ndd, tk.es); tk.af = null; tk.pct = pct;
                if (tk.pctType === 'dur') tk.rem = Math.round(tk.dur * (1 - pct / 100) * 100) / 100;
              } else { tk.status = 'NS'; tk.as = null; tk.af = null; tk.rem = tk.dur; tk.pct = 0; }
            }
            toast(t('u_done', n));
          });
        }
      }]
    });
    body.addEventListener('change', (e) => {
      const x = e.target;
      if (x.id === 'u_dd') { const d = P6.parseDate(x.value); if (d == null) return toast(t('err_date'), true); dd = d; draw(); }
      else if (x.id === 'u_f') { filter = x.value; draw(); }
      else if (x.dataset.f) {
        const id = +x.closest('tr').dataset.id, ed = edits.get(id);
        if (x.dataset.f === 'pct') { ed.pct = Math.max(0, Math.min(100, parseFloat(x.value) || 0)); if (ed.pct > 0 && ed.as == null) { const tk = App.taskById(id); ed.as = Math.min(dd, tk.es); } if (ed.pct >= 100 && ed.af == null) ed.af = dd; if (ed.pct < 100) ed.af = null; }
        else { const d = P6.parseDate(x.value); ed[x.dataset.f] = x.value.trim() ? d : null; if (x.dataset.f === 'af' && d != null) ed.pct = 100; }
        draw();
      }
    });
    body.addEventListener('click', (e) => {
      if (e.target.id === 'u_auto') { p.tasks.forEach(autoOne); draw(); }
      else if (e.target.id === 'u_reset') { p.tasks.forEach((tk) => edits.set(tk.id, init(tk))); draw(); }
    });
  };

  // ---------- reports ----------
  D.reports = function () {
    const p = App.p;
    const tasks = p.tasks.filter((x) => !P6.isHammock(x));
    const ru = P6.rollup(p), root = ru.get((p.wbs.find((w) => w.parent == null) || {}).id) || {};
    const cnt = (s) => tasks.filter((x) => x.status === s).length;
    const crit = tasks.filter((x) => x.crit).length, neg = tasks.filter((x) => x.tf != null && x.tf < 0).length;
    const blF = root.bf, slip = blF != null && root.ef != null ? root.ef - blF : null;
    const frac = (s, e, d) => (s == null || e == null ? 0 : d < s ? 0 : d > e ? 1 : (d - s + 1) / (e - s + 1));
    const tot = tasks.reduce((a, x) => a + (x.dur || 0), 0) || 1;
    let a0 = Infinity, a1 = -Infinity;
    for (const x of tasks) for (const d of [x.bs, x.es, x.as]) if (d != null) a0 = Math.min(a0, d); for (const x of tasks) for (const d of [x.bf, x.ef, x.af]) if (d != null) a1 = Math.max(a1, d);
    const pts = [];
    if (isFinite(a0) && a1 > a0) {
      const step = Math.max(1, Math.ceil((a1 - a0) / 70));
      for (let d = a0; d <= a1 + step; d += step) {
        let b = 0, pl = 0, ac = 0;
        for (const x of tasks) {
          const w = x.dur || 0; if (!w) continue;
          if (x.bs != null) b += w * frac(x.bs, x.bf, d);
          pl += w * frac(x.as != null ? x.as : x.es, x.status === 'C' ? x.af : x.ef, d);
          if (d <= p.dataDate + 1) ac += w * (x.status === 'C' ? frac(x.as, x.af, d) : x.status === 'IP' ? (x.pct / 100) * frac(x.as, p.dataDate, d) : 0);
        }
        pts.push({ d, b: (100 * b) / tot, pl: (100 * pl) / tot, ac: d <= p.dataDate + step ? (100 * ac) / tot : null });
      }
    }
    const W = 760, H = 250, L = 38, B = 24, T = 10, R = 10;
    const xs = (d) => L + ((d - a0) / (a1 + 1 - a0)) * (W - L - R), ys = (v) => T + (1 - v / 100) * (H - T - B);
    const line = (k, col, dash) => { const q = pts.filter((x) => x[k] != null); return q.length ? `<polyline fill="none" stroke="${col}" stroke-width="2.2" ${dash ? 'stroke-dasharray="6 4"' : ''} points="${q.map((x) => xs(x.d).toFixed(1) + ',' + ys(x[k]).toFixed(1)).join(' ')}"/>` : ''; };
    const grid = [0, 25, 50, 75, 100].map((v) => `<line x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${ys(v) + 4}" text-anchor="end" style="font-size:10px;fill:var(--muted)">${v}%</text>`).join('');
    const xl = []; if (pts.length) for (let i = 0; i < 7; i++) { const d = a0 + ((a1 - a0) * i) / 6; xl.push(`<text x="${xs(d)}" y="${H - 6}" text-anchor="middle" style="font-size:10px;fill:var(--muted)">${fmtD(Math.round(d))}</text>`); }
    const ddx = xs(p.dataDate + 1);
    const slips = tasks.filter((x) => x.status !== 'C' && x.bf != null && x.ef != null && x.ef > x.bf).sort((a, b) => (b.ef - b.bf) - (a.ef - a.bf)).slice(0, 10);
    const kpi = (v, l, c) => `<div class="kpi"><div class="v"${c ? ` style="color:${c}"` : ''}>${v}</div><div class="l">${esc(l)}</div></div>`;
    const body = `<div class="kpis">${kpi(tasks.length, t('activities'))}${kpi((root.pct || 0) + '%', t('progress'), 'var(--accent)')}${kpi(cnt('C'), t('st_C'), 'var(--ok)')}${kpi(cnt('IP'), t('st_IP'))}${kpi(cnt('NS'), t('st_NS'))}${kpi(crit, t('critical'), 'var(--danger)')}${kpi(neg, t('neg_float'), neg ? 'var(--danger)' : '')}${kpi(bd(p.finish), t('finish'))}${slip != null ? kpi((slip > 0 ? '+' : '') + slip + 'd', t('finish_var'), slip > 0 ? 'var(--danger)' : 'var(--ok)') : ''}</div>
      <b>${esc(t('scurve'))}</b>
      <svg viewBox="0 0 ${W} ${H}" direction="ltr" style="width:100%;height:auto;margin:6px 0 4px;direction:ltr">${grid}${xl.join('')}${pts.length ? `<line x1="${ddx}" x2="${ddx}" y1="${T}" y2="${H - B}" stroke="var(--accent)" stroke-dasharray="3 3"/>` : ''}${line('b', 'var(--bar-base)', 1)}${line('pl', 'var(--bar)')}${line('ac', 'var(--ok)')}</svg>
      <div style="display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:14px"><span><b style="color:var(--bar-base)">- - -</b> ${esc(t('baseline'))}</span><span><b style="color:var(--bar)">━━</b> ${esc(t('current_plan'))}</span><span><b style="color:var(--ok)">━━</b> ${esc(t('actual'))}</span></div>
      <b>${esc(t('top_slips'))}</b>
      ${slips.length ? `<table class="mini"><thead><tr><th>${esc(t('col_code'))}</th><th>${esc(t('col_name'))}</th><th>${esc(t('col_bf'))}</th><th>${esc(t('col_ef'))}</th><th>${esc(t('col_vf'))}</th></tr></thead><tbody>${slips.map((x) => `<tr><td>${esc(x.code)}</td><td dir="auto">${esc(x.name)}</td><td>${bd(x.bf)}</td><td>${bd(x.ef)}</td><td style="color:var(--danger);font-weight:600">+${x.ef - x.bf}d</td></tr>`).join('')}</tbody></table>` : `<div class="hint">${esc(t('no_slips'))}</div>`}`;
    modal({ title: t('reports'), cls: 'wide', body, buttons: [{ label: t('export_csv'), fn: () => { App.exportCSV(); return false; } }, { label: t('close'), cls: 'pri', fn: () => {} }] });
  };

    m.el.addEventListener('click', (e) => { const it = e.target.closest('.pitem'); if (it) { picked = it.dataset.id; m.close(); } });
  });

  // ---------- help ----------
  D.help = function () {
    modal({ title: t('guide'), cls: 'mid', body: `<div style="line-height:1.8">${t('guide_html')}</div>`, buttons: [{ label: t('close'), cls: 'pri', fn: () => {} }] });
  };
  D.shortcuts = function () {
    const rows = [['F9', 'schedule'], ['Insert', 'add_activity'], ['Delete', 'delete'], ['F2 / Enter', 'sc_edit'], ['Tab / ← →', 'sc_nav'], ['Ctrl+Z / Ctrl+Y', 'undo'], ['Ctrl+D', 'duplicate'], ['Ctrl+F', 'search'], ['Ctrl+S', 'export_xer'], ['Ctrl + wheel', 'zoom_in'], ['Shift / Ctrl + click', 'sc_multi']];
    modal({ title: t('shortcuts'), body: `<table class="mini"><tbody>${rows.map((r) => `<tr><td><span class="tag">${esc(r[0])}</span></td><td>${esc(t(r[1]))}</td></tr>`).join('')}</tbody></table>`, buttons: [{ label: t('close'), cls: 'pri', fn: () => {} }] });
  };
  D.about = function () {
    modal({ title: t('about'), body: `<div style="line-height:1.8">${t('about_html')}<hr><b>${esc(P6.versionName())}</b><br><small>${esc(P6.BUILD_DATE)}</small></div>`, buttons: [{ label: t('close'), cls: 'pri', fn: () => {} }] });
  };
})(window);
